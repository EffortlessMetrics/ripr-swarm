# Keep report storage workspace-relative, independent of scratch Cargo outputs.
# rust-gates.yml retains only this profile's current XML and run identity.
[store]
dir = "target/nextest"

[profile.ci]
retries = 0
failure-output = "immediate-final"
# #12092/#9272/#14906: a test that hangs printed nothing for 30 minutes and then
# the job hit its cap (#11854, #12017). A SLOW row names it two minutes after it
# starts, and one that never finishes fails as a named TIMEOUT after 20 minutes
# (period 120s x terminate-after 10). The window is measured, not guessed: on run
# 43943282726 the slowest legitimate test was 210s
# (xtask::ripr_public_guide_contract::doctor_exit_code_guide_distinguishes_analysis_and_source_build),
# the longest shard build step was 774s and the longest test step 494s against the
# 40-minute shard step. 1200s + 774s = 1974s and 1200s + 494s = 1694s both stay
# under 2400s, so a hang is terminated and named before the step cap.
# `nextest_hang_window_fits_the_shard_step_budget` pins that arithmetic.
slow-timeout = { period = "120s", terminate-after = 10 }

# #9272: the sharded Windows advisory lane. A test that never finishes must show
# up as a named TIMEOUT row instead of cancelling the whole shard and losing its
# log (shard 3 of run 39800081622 was cancelled with no evidence).
[profile.windows-advisory]
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"

# Retain the real SDK identities and opposing-pin observation for #13123.
[[profile.ci.overrides]]
filter = 'package(=xtask) & binary(=rust_activation) & test(=installed_rustup_activation_keeps_the_exact_fixture_compiler)'
junit.store-success-output = true

# #2695: Fast iteration path for local development.
# Skip slow server-spawning tests with:
#   cargo nextest run --skip framed_lsp_ --skip editor_agent_loop_
# Or run only the fast lib tests:
#   cargo nextest run -p ripr --lib --skip framed_lsp_
# The slow tests (framed_lsp_*, editor_agent_loop_*) spawn real ripr lsp --stdio
# servers and take ~30s each. There are ~38 of them across the lib + integration tests.
