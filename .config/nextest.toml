# Keep report storage workspace-relative, independent of scratch Cargo outputs.
# rust-gates.yml retains only this profile's current XML and run identity.
[store]
dir = "target/nextest"

[profile.ci]
retries = 0
failure-output = "immediate-final"
# #12092/#9272: a test that hangs printed nothing for 30 minutes and then the job
# hit its cap (#11854, #12017). SLOW rows name it from 2 minutes in; terminate-after
# 10 (20 minutes) fails it as a named TIMEOUT row before the 40-minute cap, far
# above the slowest legitimate test, so no passing test changes outcome.
slow-timeout = { period = "120s", terminate-after = 10 }

# #9272: the sharded Windows advisory lane. A test that never finishes must show
# up as a named TIMEOUT row instead of cancelling the whole shard and losing its
# log (shard 3 of run 39800081622 was cancelled with no evidence).
[profile.windows-advisory]
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "120s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"

# #2695: Fast iteration path for local development.
# Skip slow server-spawning tests with:
#   cargo nextest run --skip framed_lsp_ --skip editor_agent_loop_
# Or run only the fast lib tests:
#   cargo nextest run -p ripr --lib --skip framed_lsp_
# The slow tests (framed_lsp_*, editor_agent_loop_*) spawn real ripr lsp --stdio
# servers and take ~30s each. There are ~38 of them across the lib + integration tests.
