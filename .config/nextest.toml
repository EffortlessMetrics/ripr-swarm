# Keep report storage workspace-relative, independent of scratch Cargo outputs.
# rust-gates.yml retains only this profile's current XML and run identity.
[store]
dir = "target/nextest"

[profile.ci]
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Retain the exact CLI subjects and all route outputs even when the repaired
# source-admission witness passes. Other tests keep their existing output policy.
[[profile.ci.overrides]]
filter = 'test(=python_source_admission::changed_python_symlink_source_is_incomplete_across_root_routes)'
success-output = "immediate"
junit.store-success-output = true

# #2695: Fast iteration path for local development.
# Skip slow server-spawning tests with:
#   cargo nextest run --skip framed_lsp_ --skip editor_agent_loop_
# Or run only the fast lib tests:
#   cargo nextest run -p ripr --lib --skip framed_lsp_
# The slow tests (framed_lsp_*, editor_agent_loop_*) spawn real ripr lsp --stdio
# servers and take ~30s each. There are ~38 of them across the lib + integration tests.
