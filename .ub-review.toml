# ub-review config generated by `ub-review enable`.
# Repo-specific proof, sensors, and lanes can be added here later; this
# minimal config is enough for MiniMax review + the deterministic gate.

profile = "gh-runner"

[repo]
kind = "rust"
ledger = ""
base = "origin/main"
head = "HEAD"

[gate]
required_check = "ub-review/gate"
# Retain publication for the original admitted passes. The workflow's
# full-ci label is an explicit operator request and selects the action's manual
# pass, which bypasses this list without relabeling the event as synchronize.
post_review_on = ["opened", "synchronize", "reopened"]

# Post actionable findings (severity medium+ or confidence medium-high+) to
# the PR; suppress pure lane-status boilerplate. Without this, the default
# `suppress` policy posts nothing, so findings are invisible and a human can
# never act on them. See ub-review #717 / #724.
[review_body]
summary_only_body = "post_substantive"
