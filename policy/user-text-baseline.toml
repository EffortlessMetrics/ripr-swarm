# Ceilings for banned plain-language terms in default human output (#10697).
# Each number is the count of output lines containing the term on `main`.
# `cargo xtask check-user-text` fails when a count rises above its ceiling.
# Lower a ceiling with `cargo xtask check-user-text --ratchet`; never raise one
# without a reviewed reason in the PR. A term with no row has a ceiling of 0.
# See docs/USER_TEXT_GLOSSARY.md.
schema_version = "1.0"

[[ceiling]]
surface = "agent-card-unknown-id"
term = "seam"
max_lines = 1

