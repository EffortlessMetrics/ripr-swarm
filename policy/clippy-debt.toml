schema_version = "1.0"
policy = "clippy-debt"
owner = "core/rust"
status = "active"

# Tracked Clippy debt: lint flips that are intentionally deferred with a
# named owner and a target date.
#
# `cargo xtask check-lint-policy` parses this file as TOML: unique ids,
# required nonblank fields, ISO `target` dates that are not in the past,
# unknown fields / duplicate keys / trailing garbage fail, and lints
# that are not already `[[active]]`, `[[planned]]`, or present in
# Cargo.toml. Presence here is a CI ratchet for ledger shape, not a
# claim that the debt has been paid.
#
# Each entry must record:
#   id         stable identifier referenced in PR descriptions
#   lint       full clippy lint name (e.g. clippy::let_underscore_must_use)
#   level      target level once the debt is paid (deny | warn)
#   owner      team/area responsible for clearing the debt
#   reason     why this lint is not enforced today
#   blocked_by call sites or refactors that must land first
#   target     date by which the debt must be cleared or re-justified
#
# Debt is reviewed at every release readiness check.
# `[[planned]]` lints in policy/clippy-lints.toml (indexing_slicing,
# string_slice, disallowed_fields, manual_pop_if) stay there — they are
# already dual-railed with Cargo.toml. Do not duplicate them here.

[[debt]]
id = "clippy-debt-0001"
lint = "clippy::let_underscore_must_use"
level = "deny"
owner = "core/rust"
reason = "Best-effort cleanup patterns like `let _ = fs::remove_dir_all(&dir)` are pervasive across the test suite. Flipping requires per-call review so ignored errors stay explicit."
blocked_by = "Audit and replace ~941 `let _ =` sites (top: crates/ripr/src/analysis/seam_cache.rs has 107) with explicit ignored-error helpers or keep reasoned `let _ =` receipts. Do not flip in the same PR as this ledger row."
target = "2027-03-31"
