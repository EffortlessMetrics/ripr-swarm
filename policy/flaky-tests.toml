[[flake]]
id = "managed-sigint-exporter-failure-misclassified"
test = "ripr::chaos_interrupted_runs managed_producer::interruption::managed_sigint_reaps_partial_and_repeats"
lane = "Test Analytics (cargo nextest run --workspace --all-features)"
class = "ordering-race"
status = "fixed"
first_seen = "2026-11-03"
evidence = ["run 41655332710", "run 41700144757", "run 41733219808", "run 41755758372 (managed_sigint_names_retained_directory)", "run 41769026807"]
symptom = "An interrupted check reports `Perl facts exporter exited with status signal: 2 (SIGINT) (non-zero)` and `other languages continue` instead of a cancellation; 5 of 9 main runs failed (#12935)."
root_cause = "A group-delivered SIGINT reaps the managed exporter before the CLI has run its own handler, so the exit was classified before the CLI interrupt flag was set. The exit is now decided from the flag, awaited for a bounded grace when the producer died by SIGINT under a flag-owning token."
guard = "producer_sigint_death_is_cancellation_once_the_cli_flag_arrives"

