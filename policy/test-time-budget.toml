# Per-test time budget for the nextest `ci` profile (#12905, slice 1).
#
# `cargo xtask slow-test-report` reads target/nextest/ci/junit.xml (the
# `rust-junit` artifact of test-analytics.yml) and judges every test against
# `per_test_budget_seconds`. A test id is `<nextest binary-id> <test name>`.
#
# Decision (2026-11-04): the budget is ADVISORY. The suite is ~27k tests over 4
# shards in a ~35 minute required check; the slowest tests are xtask binary
# tests that run `cargo` themselves. Failing PRs on them before they are fixed
# would only teach people to ignore the check.
# Ratchet: the [[baseline]] allowlist below is every test that was over budget
# in test-analytics run 41867428230 (main, 2026-11-04). Switching `mode` to
# "enforced" fails only on an over-budget test that is NOT in the baseline, so it
# can be turned on without a flood of failures. Ratchet by deleting a baseline
# entry once its test is fixed (the report lists such entries under "Ratchet
# candidates") and by lowering the budget; never by adding entries to make a new
# slow test pass. Flip to "enforced" when the baseline holds fewer than 10 tests
# or one release cycle passes with no new over-budget test, whichever is first.

schema = "ripr_slow_test_budget.v1"

[decision]
mode = "advisory"
per_test_budget_seconds = 30.0
# A baselined test slower than regression_factor x its recorded_seconds is reported as
# `over_budget_regressed` and fails in enforced mode, so a baselined test cannot silently
# get much slower. Raise its recorded_seconds only with review, never to hide a regression.
regression_factor = 2.0
ratchet = "advisory; baseline allowlist shrinks by deletion; enforce (fail only on tests absent from the baseline) once the baseline holds fewer than 10 tests"

