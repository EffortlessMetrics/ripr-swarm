# Spec-example coverage ledger for the Rust verdict corpus (RIPR-SPEC-0219).
#
# Every spec with numbered `## Acceptance Examples` items is listed here as
# in or out of scope; `cargo xtask verdict-corpus validate` fails when one is
# missing, so a new spec cannot leave the denominator silently. In scope means
# the examples describe Rust analyzer verdict, oracle, probe or test-shape
# behavior that a corpus case (a Rust diff plus runtime mutant truth) can
# label. An in-scope example a case cannot label is waived with a reason;
# waived examples are accounted for, never covered.
#
# `floor` is the covered-example count `verdict-corpus check` protects. Raise
# it when coverage grows; lowering it is a reviewed edit with a reason.

schema_version = "ripr_verdict_corpus_spec_coverage.v1"
floor = 220


# Coverage axes beyond spec examples (`axes` on a case). Each axis names a
# side of the Rust language or test ecosystem the corpus is held to cover;
# `floor` is the fewest tagged cases `verdict-corpus validate` and `check`
# accept, so an axis cannot shrink silently. Raise it when coverage grows.
[[axis]]
id = "test_library_idiom"
description = "Test-library idioms: insta, proptest, quickcheck, rstest, test-case, tokio, mockall, assert_matches, claims, expect-test, trybuild, criterion and serial_test shapes."
floor = 59

[[axis]]
id = "language_shape"
description = "Language shapes: operator, conversion, iterator, Drop and Default impls; dyn dispatch, generics, const generics, impl Trait and associated consts; let-else, labeled break, slice patterns, casts and closures; async, threads and interior mutability."
floor = 33

[[axis]]
id = "std_test_form"
description = "Standard-library test forms without a test crate: should_panic(expected), Result-returning tests, catch_unwind, hand-rolled mocks and recorders, seeded property loops, table-driven loops, assertion helpers and macros, Display string pins, doctests, tests/ integration tests, out-of-line test modules and fixture builders."
floor = 21

[[axis]]
id = "hostile_input"
description = "Hostile source forms: assertions in comments and strings, raw and non-ASCII identifiers, very long and deeply nested lines, macro-generated owners, attribute stacks, cfg_attr tests, minified layout and owners reached as values."
floor = 12

# Oracle-accuracy gate. Cases with `expected_oracle` label the related-test
# oracle kind and strength a spec adopts; `verdict-corpus check` fails when
# matches fall below `match_floor` or overclaims (ripr reads the test
# stronger than the spec) rise above `overclaim_ceiling`. When ripr
# improves, `check` prints the new numbers: raise the floor and lower the
# ceiling to them. Loosening either is a reviewed edit with a reason.
[oracle]
match_floor = 44
overclaim_ceiling = 0

# Operator grid and false-credit traps (verdict_corpus_grid.rs). `cell_floor`
# is the count of covered operator-by-truth cells (7 operators x credited,
# gap, partial); `trap_floor` the count of trap cases the tests cannot
# discriminate; `false_credit_ceiling` how many of those ripr may credit.
# Raise the floors and lower the ceiling as coverage grows and credits are
# fixed; the opposite edit is a reviewed change with a reason.
[grid]
cell_floor = 21
trap_floor = 37
false_credit_ceiling = 0

# A case whose `behavior_family` names a different operator than its edit.
[grid.operators]
config-duplicate-key-case = "equality"
grid-bits-or-loose = "none"

