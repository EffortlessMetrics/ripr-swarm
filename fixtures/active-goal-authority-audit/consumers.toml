# Reviewed inventory rules for singleton active-goal consumers. More-specific
# selectors override broader directory selectors. Every discovered path still
# appears as its own row in the generated report.

[[consumer]]
id = "active-manifest"
selector = ".ripr/goals/active.toml"
classification = "live_selection_or_authorization_remove"
owner = "goals-control-plane"
dependent_issue = "#1701"
compatibility_period = "until campaign-record migration is independently demonstrated"
current_behavior = "stores campaign work-item status and ordering used by unqualified readers"
fields = "id,status,branch,lane,work_item.status,blocked_by,stackable"
authority = "can select and block work through singleton status"
target_behavior = "retain only as an explicitly non-authoritative compatibility pointer or remove"
positive_proof = "audit lists the manifest and every reader"
negative_proof = "hidden-singleton fixture remains blocked when active.toml is absent"

[[consumer]]
id = "goal-trackers"
selector = ".ripr/goals/**"
classification = "stable_campaign_definition"
owner = "goals-control-plane"
dependent_issue = "#1701"
compatibility_period = "durable campaign records remain readable"
current_behavior = "records campaign facts and historical work-item status"
fields = "campaign identity, work items, proof commands, dependencies"
authority = "must not grant current mutation or merge authority"
target_behavior = "preserve stable campaign context behind explicit campaign selection"
positive_proof = "explicit campaign drill-down fixture"
negative_proof = "legacy ready status does not make migration ready"

[[consumer]]
id = "xtask-readers"
selector = "xtask/**"
classification = "live_selection_or_authorization_remove"
owner = "xtask-goals"
dependent_issue = "#1701"
compatibility_period = "bounded compatibility reader through migration"
current_behavior = "parses, validates, reports, and generates PR context from the singleton manifest"
fields = "campaign and work-item fields"
authority = "unqualified commands can select, block, or project work"
target_behavior = "require explicit campaign or derived live portfolio input"
positive_proof = "focused parser, report, and command tests"
negative_proof = "unknown reader discovery blocks migration"

[[consumer]]
id = "historical-handoffs"
selector = "docs/handoffs/**"
classification = "historical_campaign_evidence"
owner = "documentation"
dependent_issue = "#1701"
compatibility_period = "indefinite historical readability"
current_behavior = "records prior campaign source paths and closeout state"
fields = "historical active-goal path and completed status"
authority = "read-only history; cannot select current work"
target_behavior = "retain source-linked historical explanation"
positive_proof = "historical-reference fixture is non-blocking"
negative_proof = "historical text never sets mutation authority"

[[consumer]]
id = "governing-docs"
selector = "docs/**"
classification = "stable_campaign_definition"
owner = "documentation"
dependent_issue = "#1701"
compatibility_period = "update atomically with consumer migration"
current_behavior = "documents singleton campaign selection and current-goal recovery"
fields = "active path, selection commands, status semantics"
authority = "guidance may cause agents to select or continue work"
target_behavior = "separate durable campaign context from live selection"
positive_proof = "doc index and active-goal authority report"
negative_proof = "unclassified documentation path blocks migration"

[[consumer]]
id = "plans"
selector = "plans/**"
classification = "stable_campaign_definition"
owner = "planning"
dependent_issue = "#1701"
compatibility_period = "durable plans remain source-linked"
current_behavior = "links implementation sequences to the singleton manifest"
fields = "campaign id, work-item ids, status, successor"
authority = "planning context only after migration"
target_behavior = "reference explicit campaign records without live authorization"
positive_proof = "migration plan maps every slice"
negative_proof = "plan status cannot authorize a writer"

[[consumer]]
id = "policy-and-metrics"
