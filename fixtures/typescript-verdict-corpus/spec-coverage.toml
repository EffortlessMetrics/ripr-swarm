# Spec-example coverage ledger for the TypeScript verdict corpus
# (RIPR-SPEC-0245, using the RIPR-SPEC-0219 ledger contract).
#
# Every spec with numbered `## Acceptance Examples` items is listed here as
# in or out of scope; `cargo xtask verdict-corpus validate --language
# typescript` fails when one is missing, so a new spec cannot leave the
# denominator silently. In scope means the examples describe TypeScript
# analyzer verdict, oracle, probe or test-shape behavior that a corpus case
# (a TypeScript diff plus runtime mutant truth from the subject's own tests)
# can label: RIPR-SPEC-0243, its amendments RIPR-SPEC-0246 to
# RIPR-SPEC-0252, RIPR-SPEC-0254, RIPR-SPEC-0256, RIPR-SPEC-0258 and RIPR-SPEC-0262. An in-scope example a case cannot label is waived with a
# reason; waived examples are accounted for, never covered. No example is
# waived today: every in-scope example has a case, and a new spec's
# uncovered examples stay visible as uncovered. Every RIPR-SPEC-0243 example has a case:
# `jest-spec0243-ex33-two-files-one-mocked` labels example 33 (#7099),
# `jest-spec0243-ex30-factory-db` example 30's non-literal `db`, and the
# `nodetest-spec0243-ex34-*` and `-ex35-*` cases change the message their
# payload pins (the older `nodetest-currency-throws-regex` and
# `nodetest-charge-rejects-message` keep it unchanged, so they cite neither).
# Case ids containing `spec0234` were named before the TypeScript rules were
# renumbered; they cite today's RIPR-SPEC-0243.
#
# `floor` is the covered-example count `verdict-corpus check` protects. Raise
# it when coverage grows; lowering it is a reviewed edit with a reason.

schema_version = "ripr_verdict_corpus_spec_coverage.v1"
