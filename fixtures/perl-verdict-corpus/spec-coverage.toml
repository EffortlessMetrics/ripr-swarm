# Spec-example coverage ledger for the Perl verdict corpus (RIPR-SPEC-0245,
# using the RIPR-SPEC-0219 ledger contract).
#
# Every spec with numbered `## Acceptance Examples` items is listed here as
# in or out of scope; `cargo xtask verdict-corpus validate --language perl`
# fails when one is missing, so a new spec cannot leave the denominator
# silently. In scope means the examples describe Perl fact-packet
# classification behavior that a corpus case (a Perl diff, the fact packet
# for it, and runtime mutant truth from the subject's own tests) can label.
# RIPR-SPEC-0235 is the only in-scope spec: its examples each name the packet
# facts that change, which the `perl-0235-*` cases edit from a producer packet
# (SPEC.md). RIPR-SPEC-0064 is prose without numbered examples.
#
# `floor` is the covered-example count `verdict-corpus check` protects. Raise
# it when coverage grows; lowering it is a reviewed edit with a reason.

schema_version = "ripr_verdict_corpus_spec_coverage.v1"
floor = 32

