reason = "Tests discriminate the change but ripr abstains for two independent reasons: the pinned producer writes zero-based lines (the packet's coordinate is one line above the changed line, #3221, #6586), and the test's `throws_ok` carries a class matcher the producer now grades strong_exact, which RIPR-SPEC-0235 rule 16 reads as static_unknown because a class pins that an error is raised, not which boundary raises it (test-file `eval {` blocks are no longer boundaries, perl-lsp-swarm#18498). Delete this entry only after the row actually credits; neither a line fix nor the relations alone is shown to be sufficient."

