# Spec-example coverage ledger for the Python verdict corpus (RIPR-SPEC-0245,
# using the RIPR-SPEC-0219 ledger contract).
#
# Every spec with numbered `## Acceptance Examples` items is listed here as
# in or out of scope; `cargo xtask verdict-corpus validate --language python`
# fails when one is missing, so a new spec cannot leave the denominator
# silently. In scope means the examples describe Python analyzer verdict,
# oracle, probe or test-shape behavior that a corpus case (a Python diff plus
# runtime mutant truth from the subject's own tests) can label. An in-scope
# example a case cannot label is waived with a reason; waived examples are
# accounted for, never covered. RIPR-SPEC-0238 example 10 is covered by
# `authored-py-pytest-numpy`, whose tests need numpy to run (SPEC.md).
#
# `floor` is the covered-example count `verdict-corpus check` protects. Raise
# it when coverage grows; lowering it is a reviewed edit with a reason.

schema_version = "ripr_verdict_corpus_spec_coverage.v1"
