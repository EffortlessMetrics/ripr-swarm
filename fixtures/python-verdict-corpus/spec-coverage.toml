# Spec-example coverage ledger for the Python verdict corpus (RIPR-SPEC-0245,
# using the RIPR-SPEC-0219 ledger contract).
#
# Every spec with numbered `## Acceptance Examples` items is listed here as
# in or out of scope; `cargo xtask verdict-corpus validate --language python`
# fails when one is missing, so a new spec cannot leave the denominator
# silently. In scope means the examples describe Python analyzer verdict,
# oracle, probe or test-shape behavior that a corpus case (a Python diff plus
# runtime mutant truth from the subject's own tests) can label. An in-scope
# example a case cannot label is waived with a reason; waived examples are
# accounted for, never covered. RIPR-SPEC-0238 example 10 is covered by
# `authored-py-pytest-numpy`, whose tests need numpy to run (SPEC.md).
#
# `spec-examples.lock` lists the covered examples `verdict-corpus check`
# protects, one per line in sorted order. A locked example that loses its case
# fails; covering a new one passes with a note naming the line to add.
# Dropping a line is a reviewed edit with a reason.
#
# A new spec's scope goes in `spec-scopes/<RIPR-SPEC-NNNN>.toml` (`id`, `scope`,
# `reason`, `[[waived]]`, or `unmeasured = true` with a `reason`) instead of a
# `[[spec]]` or `[[unmeasured]]` entry here, so two spec PRs never append to the
# same place. Entries below stay valid; both forms load into one list.

schema_version = "ripr_verdict_corpus_spec_coverage.v1"

# Most abstained rows whose tests do catch the change (missed credit). A
# regression fails `verdict-corpus check`; an improvement passes with a note
# to lower this number (not a failure, so concurrent fixes do not collide).
# Raising it is a reviewed edit with a reason.

# 31: `unnum-0028-ex3-decorator-indirection` abstains by design (RIPR-SPEC-0028
# example 3: a decorator that may wrap the call is not credited) although its
# test catches the change.
missed_credit_ceiling = 26

# Operator grid and false-credit traps (verdict_corpus_grid.rs). `cell_floor`
# is the count of covered operator-by-truth cells (7 operators x credited,
# gap, partial); `trap_floor` the count of trap cases the tests cannot
# discriminate; `false_credit_ceiling` how many of those ripr may credit.
# Raise the floors and lower the ceiling as coverage grows and credits are
# fixed; the opposite edit is a reviewed change with a reason.
[grid]
cell_floor = 21
trap_floor = 17
false_credit_ceiling = 0

