[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false
default-run = "xtask"
license.workspace = true
rust-version.workspace = true

[dependencies]
bigdecimal = { version = "0.4", optional = true }
home = { version = "=0.5.12", optional = true }
num-bigint = { version = "0.4", optional = true }
repo-policy = { path = "../tools/repo-policy", optional = true }
ripr = { path = "../crates/ripr", optional = true }
ra_ap_syntax = { version = "0.0.349", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["alloc"] }
sha2 = { version = "0.10", optional = true }
toml = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.21", optional = true }

[dev-dependencies]
proptest = "1"
# Maintained, safe-Rust YAML field extraction for guards and concurrency.
yaml-rust2 = { version = "=0.10.4", default-features = false }

[features]
# Ordinary xtask commands and workspace tests retain their complete graph.
# The UB receipt reporter can disable it without changing its source or tests.
default = ["automation"]
automation = [
    "dep:bigdecimal",
    "dep:home",
    "dep:num-bigint",
    "dep:repo-policy",
    "dep:ripr",
    "dep:ra_ap_syntax",
    "dep:rayon",
    "dep:serde",
    "formal-evidence-audit",
    "formal-claim-registry",
    "formal-claim-plan",
    "formal-source-inputs",
    "dep:sha2",
    "dep:toml",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "dep:roxmltree",
    "dep:rustix",
]
# Pure document admission can be tested without compiling the product library.
formal-evidence-audit = ["dep:serde", "dep:sha2"]
# Governed claim membership reuses the one document-admission authority.
formal-claim-registry = ["formal-evidence-audit"]
# Passive affected-claim planning consumes supplied facts and executes no provider.
formal-claim-plan = ["dep:serde", "dep:sha2"]
# Passive source prerequisites share the existing parser and native DTO helpers.
formal-source-inputs = ["formal-evidence-audit", "dep:ra_ap_syntax"]
# Producer-to-policy SARIF identity controls need the Perl adapter. They run in
# the dedicated Perl lane (`--features perl-identity`) so the shared workspace
# test graph keeps the shipped `ripr` feature set.
perl-identity = ["automation", "ripr/lang-perl"]

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["automation"]

[[bin]]
name = "formal-evidence-audit"
path = "src/bin/formal-evidence-audit.rs"
required-features = ["formal-evidence-audit"]

[[bin]]
name = "formal-claim-registry"
path = "src/bin/formal-claim-registry.rs"
required-features = ["formal-claim-registry"]

[[bin]]
name = "formal-claim-plan"
path = "src/bin/formal-claim-plan.rs"
required-features = ["formal-claim-plan"]

[[example]]
name = "contabo_product_proof"
required-features = ["automation"]

[[example]]
name = "mandatory_partitions"
required-features = ["automation"]

[target.'cfg(target_os = "linux")'.dependencies]
# Safe session, wait-without-reap and PID-handle operations for the isolated
# policy-facade test. Other capture callers keep their existing ownership.
rustix = { version = "1.1.5", features = ["process"], optional = true }

[lints]
workspace = true
