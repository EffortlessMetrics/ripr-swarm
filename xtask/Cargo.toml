[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false
default-run = "xtask"
license.workspace = true
rust-version.workspace = true

[dependencies]
bigdecimal = { version = "0.4", optional = true }
home = { version = "=0.5.12", optional = true }
num-bigint = { version = "0.4", optional = true }
repo-policy = { path = "../tools/repo-policy", optional = true }
ripr = { path = "../crates/ripr", optional = true }
ripr-contract = { path = "../crates/ripr-contract", default-features = false, optional = true }
ra_ap_syntax = { version = "0.0.349", optional = true }
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["alloc"] }
sha2 = { version = "0.10", optional = true }
toml = { version = "1", optional = true }
flate2 = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }
roxmltree = { version = "0.21", optional = true }

[dev-dependencies]
proptest = "1"

[features]
# Ordinary xtask commands and workspace tests retain their complete graph.
# The UB receipt reporter can disable it without changing its source or tests.
default = ["automation"]
automation = [
    "formal-runner",
    "dep:bigdecimal",
    "dep:home",
    "dep:num-bigint",
    "dep:repo-policy",
    "dep:ripr",
    "dep:ra_ap_syntax",
    "dep:rayon",
    "dep:serde",
    "formal-evidence-audit",
    "formal-assurance",
    "dep:sha2",
    "dep:toml",
    "dep:flate2",
    "dep:tar",
    "dep:zip",
    "dep:roxmltree",
    "dep:rustix",
]
# Shared document/parser laws have no product facade dependency.
formal-evidence-audit = ["dep:serde", "dep:sha2"]
formal-assurance = ["formal-evidence-audit", "dep:ra_ap_syntax"]
# Linux actual-module controls and the maintained focused Kani entry.
formal-runner = ["dep:ripr-contract", "dep:serde", "dep:rustix", "formal-assurance", "dep:home", "dep:ra_ap_syntax", "dep:toml"]

# Producer-to-policy SARIF identity controls need the Perl adapter. They run in
# the dedicated Perl lane (`--features perl-identity`) so the shared workspace
# test graph keeps the shipped `ripr` feature set.
perl-identity = ["automation", "ripr/lang-perl"]

[[bin]]
name = "xtask"
path = "src/main.rs"
required-features = ["automation"]

[[bin]]
name = "formal-evidence-audit"
path = "src/bin/formal-evidence-audit.rs"
required-features = ["formal-evidence-audit"]

[[bin]]
name = "formal-assurance"
path = "src/bin/formal-assurance.rs"
required-features = ["formal-assurance"]

[[example]]
name = "contabo_product_proof"
required-features = ["automation"]

[[example]]
name = "mandatory_partitions"
required-features = ["automation"]

[[test]]
name = "formal_runner"
path = "tests/formal_runner.rs"
required-features = ["formal-runner"]

[[test]]
name = "kani_version_probe"
path = "tests/kani_version_probe.rs"
required-features = ["automation"]

[[test]]
name = "kani_lane_process"
path = "tests/kani_lane_process.rs"
required-features = ["automation"]

[target.'cfg(target_os = "linux")'.dependencies]
# Safe session, wait-without-reap and PID-handle operations for the isolated
# policy-facade test. Other capture callers keep their existing ownership.
rustix = { version = "1.1.5", features = ["process"], optional = true }

[lints]
workspace = true

[[bin]]
name = "formal-kani"
path = "src/bin/formal-kani.rs"
required-features = ["formal-runner"]
