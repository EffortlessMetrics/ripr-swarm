[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
home = "=0.5.12"
num-bigint = "0.4"
repo-policy = { path = "../tools/repo-policy" }
ripr = { path = "../crates/ripr" }
ra_ap_syntax = "0.0.349"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"

[dev-dependencies]
# Producer-to-policy SARIF controls must exercise Perl ingestion in the normal
# workspace test gate; the product's default feature set remains unchanged.
ripr = { path = "../crates/ripr", features = ["lang-perl"] }

[lints]
workspace = true
