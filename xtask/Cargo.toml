[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
bigdecimal = "0.4"
home = "=0.5.12"
num-bigint = "0.4"
repo-policy = { path = "../tools/repo-policy" }
ripr = { path = "../crates/ripr" }
ra_ap_syntax = "0.0.349"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
flate2 = "1"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
roxmltree = "0.21"

[features]
# Producer-to-policy SARIF identity controls need the Perl adapter. They run in
# the dedicated Perl lane (`--features perl-identity`) so the shared workspace
# test graph keeps the shipped `ripr` feature set.
perl-identity = ["ripr/lang-perl"]

[target.'cfg(target_os = "linux")'.dependencies]
# Safe session, wait-without-reap and PID-handle operations for the isolated
# policy-facade test. Other capture callers keep their existing ownership.
rustix = { version = "1.1.5", features = ["process"] }

[lints]
workspace = true
