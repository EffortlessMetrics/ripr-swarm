[package]
name = "repo-policy"
version = "0.1.0"
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dev-dependencies]
# Match the existing workspace variant; retain PID custody until group cleanup.
rustix = { version = "1.1.5", features = ["process", "event", "fs"] }

[build-dependencies]
sha2 = "0.10"

[lints]
workspace = true
