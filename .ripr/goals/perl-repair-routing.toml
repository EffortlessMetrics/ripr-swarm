# --- Lane 2: consumer (ripr side) ---

[[work_item]]
id = "consumer/typed-runner-commands"
status = "ready"
stackable = false
branch = "consumer/perl-typed-runner-commands"
acceptance = "Replace the positional path-matching verify-command validation in crates/ripr/src/analysis/language/perl.rs:1665-1689 (is_verify_command) with a typed runner-command model that recognizes prove -l / prove -lv / prove -Ilib / carton exec prove -l / yath test / dzil test --test <path> shapes: flags and options are typed, only trailing positional args must be t/*.t paths. Adds regression fixtures proving 'prove -l t/app.t' now validates and 'prove t/app.t /etc/passwd' still rejects. NOTE on blast radius: is_verify_command is called only from strict_actionability_for_change (perl.rs:439), which is reachable only through the cfg(test)-gated module today (mod.rs:25-26). So this work item is cfg-test-only and has zero production exposure until pipeline/replace-stub wires the validator into the live pipeline — meaning typed-runner-commands must land before pipeline/replace-stub, but does NOT need to land before consumer/productionize (the module-gate flip alone exposes no production path). Preserve all existing safe-path rejections."
commands = [
  "cargo test -p ripr --lib",
  "cargo xtask check-pr",
]

[[work_item]]
id = "consumer/productionize"
status = "blocked"
stackable = false
branch = "consumer/perl-adapter-productionize"
acceptance = "BLOCKED on the campaign starting (no code dep on typed-runner-commands — see that item's note; the validator is not reachable until pipeline/replace-stub). Move the Perl adapter out of cfg(test): crates/ripr/src/analysis/language/mod.rs:25-26 from #[cfg(test)] mod perl; to #[cfg(feature = \"lang-perl\")] mod perl; with a pub(crate) use perl::PerlAdapter; re-export under the same feature. Add impl LanguageAdapter for PerlAdapter (adapter.rs:41 contract): accepts_path for .pm/.pl/.t/.psgi, analyze_diff and analyze_repo that consume a ripr-perl-facts-v1 packet (path supplied via a new option) and produce Vec<Finding> carrying the perl_*: evidence keys the renderer at output/perl_preview_card.rs:67-95 expects. BLAST RADIUS NOTE FOR REVIEWERS: flipping the module gate makes the ENTIRE perl.rs module (~1900 lines of previously-test-only code: strict-actionability validator at perl.rs:380-513, packet parser at perl.rs:19-31, gap-id FNV hashing at perl.rs:1856-1869, all helpers) production code under cfg(feature = \"lang-perl\") — NOT just the new trait impl. Review the whole module for production soundness. The pipeline stub at pipeline.rs:289-314 is replaced in pipeline/replace-stub; this work item is ONLY the trait impl + module gate + re-export, gated behind lang-perl (NOT added to default). lang-perl stays opt-in. Zero behavior change for default builds (feature off)."
