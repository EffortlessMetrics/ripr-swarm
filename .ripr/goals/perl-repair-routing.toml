[[work_item]]
id = "ingestion/integrity-checks"
status = "blocked"
stackable = false
branch = "ingestion/perl-packet-integrity"
acceptance = "BLOCKED on consumer/productionize. Add a production ingestion boundary to the packet consumer that the fixture-only parser (which today checks only schema_version at entry) currently lacks: packet_fingerprint correctness vs recomputed hash; producer identity/capability compatibility (reject producers that lack required fact_classes); root and diff coherence (root path matches request, base/head match diff); file digest freshness; uniqueness of IDs across all fact kinds; referential integrity (every owner_id/change_id/test_id/oracle_id referenced by a relation/verify_command/provenance exists); deterministic ordering of arrays; duplicate-fact detection; oversized-packet/resource limits. JSON-Schema validation against the checked-in ripr-perl-facts-v1.json (from exporter/schema-file, vendored as a ripr fixture) is INTENTIONALLY PRODUCER-SIDE: ripr's boundary is structural serde + the integrity checks above, not loading the JSON Schema (no jsonschema/schemars dep in the workspace, and adding one is out of scope). Each check fails closed to a named PerlActionabilityBlocker (perl.rs:1118) or a new ingestion-error variant; no silent acceptance of bad input. Fixture-driven: one bad-packet fixture per check that the gate rejects."
commands = [
  "cargo test -p ripr --features lang-perl",
  "cargo xtask check-fixture-contracts",
  "cargo xtask check-pr",
]

