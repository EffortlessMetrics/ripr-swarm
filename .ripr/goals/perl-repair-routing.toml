id = "perl-repair-routing-bridge"
title = "Perl Repair-Routing Production Bridge"
status = "tracker"
lane = 2

# Focused Perl production-bridge tracker.
# This is not the active Codex Goals manifest. `.ripr/goals/active.toml` remains
# the active execution manifest (currently `use-case-spec-spine`). Promotion into
# `active.toml` is a maintainer decision recorded here.
#
# Durable plan: docs/IMPLEMENTATION_CAMPAIGNS.md -> Campaign 31
# Spec: docs/specs/RIPR-SPEC-0064-perl-fact-packet-contract.md (proposed)
# Proposal: docs/proposals/RIPR-PROP-0018-perl-repair-routing-lane.md (proposed)
# ADR: docs/adr/0018-perl-lsp-fact-substrate.md (proposed)
# Producer repo: perl-lsp-swarm (published crate: perl-lsp-rs-core)
#
# Public tracker: https://github.com/EffortlessMetrics/ripr-swarm/issues/1379
#
# NOTE on status vocabulary: this tracker uses ready/blocked/done per
# .ripr/goals/README.md. "Deferred to next campaign" items are recorded as
# status = "blocked" with a note (there is no "deferred" status; using blocked
# keeps the manifest promotion-safe for check-goals).

objective = """
Close the two missing production bridges between perl-lsp and ripr so that one
real Perl repository can flow end-to-end: perl-lsp ripr-facts -> ripr finding
-> perl_preview_card.v1 on every output surface. Public repair/agent packets
stay disabled; the end-state is a preview/advisory loop, not a support-tier
promotion.
"""

non_goals = [
  "Support-tier promotion. Perl stays preview/advisory.",
  "Enabling public repair/agent packets or PR/CI/LSP projection of them.",
  "Real-repository dogfooding at scale, false-actionable recording, or before/after repair receipts (next campaign).",
  "A new Perl parser in ripr.",
  "Reconciling the FNV-1a gap-id scheme with ripr's SHA-256-based finding identity (blocked work item here, lands before IDs become public receipt keys).",
]

# The end state is an end-to-end preview loop, not a release claim.
end_state = [
  "perl-lsp ripr-facts --schema ripr-perl-facts-v1 produces a packet from a real Perl repo, validated by a JSON Schema file checked into perl-lsp.",
  "ripr consumes that packet through a production (non-cfg-test) PerlAdapter implementing LanguageAdapter.",
  "ripr routes .pm/.pl (and .t with test-role distinction) to Perl when lang-perl is enabled.",
  "ripr validates packet freshness/integrity before trusting it.",
  "One real mini-repo flows exporter -> ripr finding -> preview card on every output surface, demonstrated by an end-to-end integration test.",
  "public_repair_packet, agent_packet_ready, gate_candidate, badge_candidate, ripr_zero_candidate all remain false.",
  "All claim-control drift corrected; no doc advertises Perl as supported.",
]

