# Registers the #16381 commit-first pilot next steps under RIPR-SPEC-0318 (Rule
# 3): when the before phase's dirty-premise preflight names tracked production
# files, pilot's terminal and Markdown summary print the commit before the
# repair start, or check's advisory where no commit clears the premise; a
# committed change and a dirty test file print none.
[[extend]]
id = "RIPR-SPEC-0318"
tests = [
  "crates/ripr/tests/check_repair_agree.rs::pilot_names_the_commit_step_before_a_repair_start_that_would_refuse",
  "crates/ripr/tests/check_repair_agree.rs::pilot_commit_step_merges_the_dirty_inline_target",
  "crates/ripr/tests/check_repair_agree.rs::pilot_at_a_subdirectory_root_prints_no_commit_step_and_no_runnable_start",
  "crates/ripr/src/output/pilot/tests.rs::pilot_premise_probe_runs_only_when_a_repair_start_is_printed",
]
code = [
  "crates/ripr/src/app/repair_attempt/mod.rs",
  "crates/ripr/src/app/navigation.rs",
  "crates/ripr/src/output/pilot/render/complete.rs",
  "crates/ripr/src/cli/commands/pilot.rs",
  "crates/ripr/src/edit_cage/mod.rs",
]
