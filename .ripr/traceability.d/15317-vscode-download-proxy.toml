# #15317: the managed server download goes through VS Code's proxy support.
[[behavior]]
id = "RIPR-SPEC-0451"
name = "managed server download through a proxy"
spec = "docs/specs/RIPR-SPEC-0451-managed-download-proxy.md"
tests = [
  "editors/vscode/test/suite/download_proxy.test.ts::the managed download goes through http.proxy and the proxy refusal reaches it as HTTP 407",
  "editors/vscode/test/suite/download_proxy.test.ts::a host listed in http.noProxy bypasses the proxy",
  "editors/vscode/test/suite/download_proxy.test.ts::the transport-failure hint names the VS Code proxy settings",
]
code = [
  "editors/vscode/src/downloader.ts",
  "editors/vscode/src/serverResolver.ts",
]
metrics = ["unit_test_pass_rate"]
