  "crates/ripr/src/analysis/probes/repo.rs::repo_mode_verus_region_seeds_no_expression_probes",
  "crates/ripr/src/analysis/language/rust/mod.rs::repo_analysis_excludes_verus_region_and_keeps_sibling_fn",
]
code = [
  "crates/ripr/src/analysis/probes/macro_definition.rs",
  "crates/ripr/src/analysis/probes/diff.rs",
  "crates/ripr/src/analysis/probes/repo.rs",
  "crates/ripr/src/analysis/language/rust/probes.rs",
  "crates/ripr/src/analysis/language/rust/mod.rs",
  "crates/ripr/src/analysis/syntax/owner_pin.rs",
  "crates/ripr/src/analysis/facts/drop_in.rs",
  "crates/ripr/src/analysis/workspace/assertion_dependency/registry.rs",
]
