# Registers the Verus macro-region static limit and the assertion-free
# verification-prelude glob allowlist (#10747 floor, #10745 program).
[[behavior]]
id = "RIPR-SPEC-0369"
name = "verus macro region limit and verification prelude globs"
spec = "docs/specs/RIPR-SPEC-0369-verus-macro-region-and-verification-prelude-globs.md"
tests = [
  "crates/ripr/src/analysis/facts/drop_in.rs::spec_audited_version_table_matches_the_code_authority",
  "crates/ripr/src/analysis/facts/drop_in.rs::a_nested_workspace_is_judged_by_its_own_lockfile",
  "crates/ripr/src/analysis/probes/macro_definition.rs::verus_regions_cover_the_token_tree_and_ignore_lookalikes",
  "crates/ripr/src/analysis/probes/macro_definition.rs::a_verus_region_braces_in_comments_strings_and_chars_do_not_unbalance_it",
  "crates/ripr/src/analysis/probes/macro_definition.rs::an_unclosed_verus_region_runs_to_the_end_and_a_mixed_line_is_unowned",
  "crates/ripr/src/analysis/probes/diff.rs::verus_region_lines_seed_one_static_unknown_not_expression_probes",
  "crates/ripr/src/analysis/language/rust/probes.rs::verus_region_limit_names_the_region_and_changes_nothing_else",
  "crates/ripr/src/analysis/classify/owner_pin/tests.rs::verification_prelude_globs_keep_assertion_credit_only_for_plain_registry_crates",
