# Registers the mnemonic side-prefix controls (#15103) under RIPR-SPEC-0147:
# a patch file written under `diff.mnemonicPrefix` parses to the same changed
# files as the default-prefix patch, and look-alike prefix-free paths keep
# their reading.
[[extend]]
id = "RIPR-SPEC-0147"
tests = [
  "crates/ripr/src/analysis/diff/side_prefix.rs::tests::mnemonic_pairs_over_one_path_are_respelled",
  "crates/ripr/src/analysis/diff/side_prefix.rs::tests::other_headers_keep_their_reading",
  "crates/ripr/src/analysis/diff/side_prefix.rs::tests::only_this_sections_own_markers_are_respelled",
  "crates/ripr/tests/diff_file_mnemonic_prefixes.rs::mnemonic_side_prefixes_read_like_the_default_prefixes",
  "crates/ripr/tests/diff_file_mnemonic_prefixes.rs::prefix_free_paths_under_a_mnemonic_letter_stay_real_paths",
]
