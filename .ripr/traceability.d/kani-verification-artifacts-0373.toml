# Registers side-independent recognition of Kani verification artifacts:
# deleted/added harnesses, cfg(kani) modules and cfg_attr(kani, contract)
# attributes seed no probe and are disclosed as verification_only_change.
[[behavior]]
id = "RIPR-SPEC-0373"
name = "Kani proof harnesses, cfg(kani) modules and cfg_attr(kani) contracts are verification-only on either side of a diff"
spec = "docs/specs/RIPR-SPEC-0373-kani-verification-artifacts-are-verification-only.md"
