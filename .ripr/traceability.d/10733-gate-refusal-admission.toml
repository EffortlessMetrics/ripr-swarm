# Registers the gate/ledger refusal-admission slice (#10733) as a new
# behavior spec: a saved producer-refusal envelope is refused at gap-ledger
# admission (blocked + named warning) and at every gate evaluate input
# (config_error), so a refused run cannot flow through a saved ledger into
# an acknowledgeable gate pass.
[[behavior]]
id = "RIPR-SPEC-0362"
name = "gate and ledger refusal admission"
spec = "docs/specs/RIPR-SPEC-0362-gate-ledger-refusal-admission.md"
tests = [
  "crates/ripr/src/output/gate/tests.rs::gate_pr_guidance_refuses_producer_refusal_run",
  "crates/ripr/src/output/gate/tests.rs::gate_baseline_refuses_producer_refusal_envelope",
  "crates/ripr/src/output/gate/tests.rs::gate_gap_ledger_refuses_generic_non_consumable_record",
  "crates/ripr/src/output/gate/tests.rs::gate_refuses_saved_refusal_ledger_with_named_reason",
  "crates/ripr/src/output/gate/tests.rs::gate_refusal_admission_keeps_complete_and_advisory_controls",
  "crates/ripr/src/output/gate/tests.rs::producer_refusal_detection_covers_run_state_vocabulary",
  "crates/ripr/src/output/gate/tests.rs::non_consumable_record_detection_requires_explicit_false",
  "crates/ripr/src/output/gap_decision_ledger.rs::gap_decision_ledger_refuses_diff_scope_oversized_refusal_envelope",
  "crates/ripr/src/output/gap_decision_ledger.rs::gap_decision_ledger_refuses_repo_scope_oversized_refusal_envelope",
  "crates/ripr/src/output/gap_decision_ledger.rs::gap_decision_ledger_refusal_admission_keeps_healthy_controls",
]
code = [
  "crates/ripr/src/output/gate.rs",
  "crates/ripr/src/output/gate/input.rs",
  "crates/ripr/src/output/gap_decision_ledger.rs",
]
outputs = [
  "docs/OUTPUT_SCHEMA.md",
]
metrics = [
  "unit_test_pass_rate",
]
