  "crates/ripr/src/analysis/language/typescript/tests/playwright_fixture_tests.rs::a_fixture_that_does_more_than_construct_binds_nothing",
  "crates/ripr/src/analysis/language/typescript/tests/playwright_fixture_tests.rs::a_file_that_overrides_or_merges_fixtures_binds_nothing",
  "crates/ripr/src/analysis/language/typescript/tests/playwright_fixture_tests.rs::a_registration_that_is_not_the_extended_test_binds_nothing",
  "crates/ripr/src/analysis/language/typescript/tests/playwright_fixture_tests.rs::a_test_not_imported_from_playwright_binds_nothing",
  "crates/ripr/src/analysis/language/typescript/tests/playwright_fixture_tests.rs::a_class_rebound_in_the_file_binds_nothing",
