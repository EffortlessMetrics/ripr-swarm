  "crates/ripr/src/output/missed_txt.rs::tests::exposed_only_and_empty_runs_print_nothing",
  "crates/ripr/src/output/missed_txt.rs::tests::suppressed_and_non_current_findings_are_not_listed",
  "crates/ripr/src/output/missed_txt.rs::tests::output_carries_no_runtime_mutation_claims",
  "crates/ripr/src/output/missed_txt.rs::tests::refusal_is_one_comment_line_never_a_gap",
