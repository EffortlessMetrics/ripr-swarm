  "crates/ripr/src/output/missed_txt.rs::tests::severity_off_findings_are_not_listed",
  "crates/ripr/src/output/missed_txt.rs::tests::comment_like_expression_stays_on_a_gap_line",
  "crates/ripr/src/cli/commands/check_argv_refusal_tests.rs::suppression_policy_is_not_refused_on_missed_txt",
