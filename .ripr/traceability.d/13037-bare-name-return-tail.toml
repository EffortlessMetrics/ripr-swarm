# Registers the return sink of a bare parameter or local returned as the
# changed tail, and its token refusal (#13037), under RIPR-SPEC-0443.
[[extend]]
id = "RIPR-SPEC-0443"
tests = [
  "crates/ripr/tests/computed_return_tail/bare_name_tail.rs::an_exact_pin_of_the_branch_returning_a_bare_parameter_is_exposed",
  "crates/ripr/tests/computed_return_tail/bare_name_tail.rs::a_bare_local_tail_reached_by_the_pin_is_exposed",
  "crates/ripr/tests/computed_return_tail/bare_name_tail.rs::a_pin_of_the_other_branch_or_a_far_input_is_not_credited",
  "crates/ripr/tests/computed_return_tail/bare_name_tail.rs::a_test_binding_named_like_the_tail_does_not_confirm_it",
  "crates/ripr/tests/computed_return_tail/bare_name_tail.rs::a_bare_name_whose_value_is_not_returned_gets_no_return_sink",
]
fixtures = [
  "fixtures/rust_bare_name_return_tail_reached",
  "fixtures/rust_bare_name_return_tail_other_branch",
  "fixtures/rust_bare_name_return_tail_test_local_same_name",
  "fixtures/evidence-promotion-honesty-corpus/cases/rust_bare_name_return_tail_reached_promoted.json",
  "fixtures/evidence-promotion-honesty-corpus/cases/rust_bare_name_return_tail_other_branch_not_promoted.json",
  "fixtures/evidence-promotion-honesty-corpus/cases/rust_bare_name_return_tail_test_local_same_name_not_promoted.json",
]
