# attempt starts only at the exact Git top-level, and the before phase refuses
# a root below it before writing anything under that root.
[[extend]]
id = "RIPR-SPEC-0011"
tests = [
  "crates/ripr/tests/subdirectory_root_repair_route.rs::check_at_the_git_top_level_still_offers_the_repair_start",
  "crates/ripr/tests/subdirectory_root_repair_route.rs::agent_repair_refuses_a_subdirectory_root_before_writing_anything",
]
