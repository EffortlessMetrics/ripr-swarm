# Registers the #15363 subdirectory-root refusal under RIPR-SPEC-0011: a repair
# attempt starts only at the exact Git top-level, and the before phase refuses
# a root below it before writing anything under that root.
[[extend]]
id = "RIPR-SPEC-0011"
tests = [
  "crates/ripr/tests/subdirectory_root_repair_route.rs::check_at_the_git_top_level_still_offers_the_repair_start",
  "crates/ripr/tests/subdirectory_root_repair_route.rs::agent_repair_refuses_a_subdirectory_root_before_writing_anything",
  "crates/ripr/tests/check_repair_agree.rs::subdir_check_withholds_the_seam_start_and_names_the_top_level",
  "crates/ripr/tests/subdirectory_root_repair_route.rs::check_at_a_subdirectory_root_offers_no_repair_start_and_names_the_top_level",
  "crates/ripr/tests/subdirectory_root_repair_route.rs::bare_repair_at_a_subdirectory_root_refuses_before_deciding_a_start",
  "crates/ripr/tests/subdirectory_root_repair_route.rs::bare_repair_json_at_a_subdirectory_root_prints_the_typed_refusal",
  "crates/ripr/src/edit_cage/mod.rs::tests::a_workspace_member_root_is_still_a_subdirectory_but_an_unclaimed_project_is_not",
  "crates/ripr/src/edit_cage/mod.rs::tests::member_patterns_decide_literals_and_trailing_globs",
]
