generation = 1

source_issue = "issue:13162"
design_reference = "RIPR-SPEC-0423"
change_class = "spec_or_contract_change"

claim_boundary = """
Expose the staged-evidence row form on the machine surfaces only: check
--format json gains the additive `evidence_stages` array (five rows — stage,
state, confidence, stage-named confidence_basis entries where applicable;
no test or assertion references — producer-backed stage attribution is
#13453), and the agent formats gain one compact `stages=` line per finding
record. The human rendering stays prose. Additive within check schema 0.2.
"""

non_goals = [
  "human-rendering or Evidence-block changes",
  "per-stage test or assertion attribution on any row (#13453)",
  "schema_version bump or field removals",
  "context-packet, evidence-record, repo-exposure or SARIF shape changes",
  "classification, ranking, gate or route changes",
  "new stage states or confidence-cap codes",
]

return_conditions = [
  "Return to root if a row claims a cap the finding does not carry or any test reference.",
  "Return to root if the human digest or Evidence block bytes change.",
  "Return to root if rows re-derive classifier decisions (establishes-reach).",
]

