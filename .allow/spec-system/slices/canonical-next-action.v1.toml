  "seam:ripr:contract:repair-card-v1",
  "seam:ripr:contract:agent-attempt-status",
  "seam:ripr:output:check-triage",
  "seam:ripr:contract:output-enums",
]

forbidden_seams = [
  "seam:ripr:agent:command-runner",
  "seam:ripr:agent:receipt-issuer",
  "seam:ripr:repair:lifecycle",
]

