schema_version = "2.0"
id = "ripr.slice.returned-type-drop-plain.v1"
generation = 1
source_issue = "issue:8480"
design_reference = "RIPR-SPEC-0197"
change_class = "behavior_change"
claim_boundary = """An owner return pin (including the whole-value field pin) cannot be credited when a record type the owner's return expression constructs has a Drop impl in the workspace whose body is non-empty: dropping the returned value while unwinding from a failed assertion may exit the process before the failure is reported, so the finding stays weakly_exposed. Empty or comment-only Drop bodies keep the pin exposed. The return_value finding on the same line is demoted at the final semantic owner on the same evidence, because the generic oracle path credits its whole-object equality assertion without consulting the pin. Only records constructed in exit positions count toward that demotion: a record built only in a local, non-returned position drops inside the owner and does not demote, while records in branch or match-arm tails feeding the result, records a returned binding names, and records wrapped in a call, tuple, array, or parenthesized wrapper in exit position still demote, and any shape that cannot be placed confidently in a non-exit position still demotes. This gate judges the returned value Drop; a local value whose Drop body itself may exit is an owner-side exit question outside this gate, with the same posture as other owner-side exits for return_value."""
non_goals = ["field types with Drop impls", "owner-side exit expressions in the return value", "new classification vocabulary or probe families", "runtime execution"]
return_conditions = ["Return to root if a plain (empty) Drop loses exposed because of this rule."]
owned_seams = ["seam:ripr:analysis:classify:owner-pin"]
shared_seams = []
forbidden_seams = ["seam:ripr:domain:classification-vocabulary", "seam:ripr:output:schema"]
[[requirement_delta]]
requirement_id = "RIPR-SPEC-0197"
requirement_generation = 1
