claim_boundary = """
The retained ItsDangerous native receipt binds explicit per-subject skip reasons
to its independently authored control variant and selected pytest JUnit case.
Skip-method/class controls report pytest.skip and execute zero bodies; broken
xfail reports pytest.xfail and executes its suppressed failure; active subjects
report explicit null. Coherently swapped JSON/JUnit reasons are rejected.
Historical source, native observations and analyzer metric exclusion remain
unchanged. The checker binds known pytest serialization, not general XML.
"""
