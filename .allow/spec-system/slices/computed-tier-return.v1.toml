change_class = "behavior_change"

claim_boundary = """
Credits a changed decimal u32 tier literal when the selected tier reaches
the function return through exactly `binding * <u32 literal>` in either
if/else tail branch, the exact pin equals the current or previous tier times
that same literal with both products representable as u32, and the existing
whole-test distinguishing replay passes. Slug, invoice and same-line
multi-call flows are explicitly out of scope; they need separate probe or
pairing authorities.
"""

