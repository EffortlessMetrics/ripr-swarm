# --------------------------------------------------------------- ranking --
# Pilot's top picks judged against the checked-in mutation answer key in
# benchmarks/pilot_ranking/ (`cargo xtask pilot-ranking score`). Pooled over
# the five pinned crates; per-crate detail stays in the receipt. Pins, labels
# and pilot are deterministic, so there is no run-to-run noise to allow for:
# each rate floor sits just under one pick even when every pick is judged
# (top-5 precision moves at least 0.04 per pick, top-10 precision 0.02, the
# top-10 shares 0.02), and the confirmed and refuted counts allow no change in
# the worse direction, because an unscored pick turning refuted moves precision by less than one
# pick's step. The refuted counts alone may also rise by the picks the run
# admitted beyond the baseline's (pick_growth_allowance, #7167): a larger
# judged set adds picks of every verdict, and an absolute count would turn red
# on growth that raises precision. At a flat or smaller pick count the margin
# is zero, so a flipped pick still fails, and the precision and share rows
# still judge the mix of the added picks. An intended trade-off
# refreshes the baseline in the same pull request. Each row's repository is
# the corpus version, so a baseline from another answer key is reported
# uncompared rather than compared.
#
# A pick is judged by mutants of its own expression, else of its line, else
# whole-body mutants of its function; the evidence shows the tier mix.

