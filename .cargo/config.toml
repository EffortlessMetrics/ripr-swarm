[alias]
build-lld = [
    "--config",
    "target.x86_64-unknown-linux-gnu.linker='clang'",
    "--config",
    "target.x86_64-unknown-linux-gnu.rustflags=['-C','link-arg=-fuse-ld=lld']",
    "build",
]
xtask = "run -p xtask --"
policy = "run --locked -p repo-policy --"

[build]
# Agent worktrees are short-lived. Retaining a separate incremental object graph
# in every checkout costs more disk than it usually saves; a long-lived checkout
# can opt in deliberately with CARGO_INCREMENTAL=1.
incremental = false

[env]
TEMP = { value = "target", relative = true, force = true }
TMP = { value = "target", relative = true, force = true }
TMPDIR = { value = "target", relative = true, force = true }
