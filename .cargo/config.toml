[alias]
build-lld = [
    "--config",
    "target.x86_64-unknown-linux-gnu.linker='clang'",
    "--config",
    "target.x86_64-unknown-linux-gnu.rustflags=['-C','link-arg=-fuse-ld=lld']",
    "build",
]
xtask = "run -p xtask --"
policy = "run --locked -p repo-policy --"

# Windows MSVC dev/test links use the toolchain-bundled LLD: MSVC link.exe
# plus PDB generation is the slow tail on ~100-400 MB debug artifacts.
# rust-lld ships with rustup toolchains, so no extra install is needed on
# dev machines or windows-latest runners. Other targets are unaffected.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

# Test scratch lives in one deletable subtree so fixture dirs from
# interrupted runs stay out of the target/ root that caches scan and save.
[env]
TEMP = { value = "target/test-tmp", relative = true, force = true }
TMP = { value = "target/test-tmp", relative = true, force = true }
TMPDIR = { value = "target/test-tmp", relative = true, force = true }
