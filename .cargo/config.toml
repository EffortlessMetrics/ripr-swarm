[alias]
build-lld = [
    "--config",
    "target.x86_64-unknown-linux-gnu.linker='clang'",
    "--config",
    "target.x86_64-unknown-linux-gnu.rustflags=['-C','link-arg=-fuse-ld=lld']",
    "build",
]
xtask = "run -p xtask --"
policy = "run --locked -p repo-policy --"

[env]
# A job or agent owns its prepared temp directory. Do not override it with a
# second scratch tree in the checkout. Raw Cargo uses this local fallback only
# when the variable is absent; see docs/TESTING.md for the managed build setup.
TEMP = { value = "target", relative = true, force = false }
TMP = { value = "target", relative = true, force = false }
TMPDIR = { value = "target", relative = true, force = false }

