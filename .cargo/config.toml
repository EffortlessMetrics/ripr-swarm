[alias]
build-lld = [
    "--config",
    "target.x86_64-unknown-linux-gnu.linker='clang'",
    "--config",
    "target.x86_64-unknown-linux-gnu.rustflags=['-C','link-arg=-fuse-ld=lld']",
    "build",
]
xtask = "run -p xtask --"
policy = "run --locked -p repo-policy --"

[build]
# Keep final binaries and reports at the established target/ paths. This path
# is relative to the repository config, so nested fixture workspaces still use
# one same-volume pool; the hash keeps every manifest's mutable state private.
build-dir = "../.ripr-swarm-build/{workspace-path-hash}"

[env]
TEMP = { value = "target", relative = true, force = true }
TMP = { value = "target", relative = true, force = true }
TMPDIR = { value = "target", relative = true, force = true }
