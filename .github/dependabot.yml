version: 2

updates:
  # Rust workspace dependencies.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # unicode-ident and unicode-properties must carry the same Unicode
      # version: ra-ap-rustc_lexer (via ra_ap_syntax) const-asserts that the
      # pair match, so a bump of EITHER side alone fails `cargo check` with
      # E0080 and breaks the default build and the `cargo install` path
      # (#11817, #4420). #3787 pinned both in crates/ripr/Cargo.toml (1.0.24
      # with 0.1.4) so `cargo install` without --locked still resolves. Both
      # are ignored here for that reason: ignoring one lets the other float
      # away from its partner. When a matching pair ships, move both and
      # remove both pins and both ignores in one deliberate PR.
      - dependency-name: "unicode-ident"
      - dependency-name: "unicode-properties"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # VS Code extension package.
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Toronto
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    labels:
      - dependencies
      - vscode
      - npm
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # @types/vscode is the compile-time contract for engines.vscode and must
      # move deliberately, in lockstep with the advertised support floor — never
      # via auto-bump. Pinned to ~1.90 in package.json so the floor is enforced
      # (#1033). Ignore all of its updates here.
      - dependency-name: "@types/vscode"
    groups:
      vscode-runtime:
        patterns:
          - "vscode-languageclient"
        update-types:
          - minor
          - patch
      vscode-dev-tools:
        dependency-type: development
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # GitHub Actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Toronto
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
      - ci
    commit-message:
      prefix: deps
      include: scope
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
