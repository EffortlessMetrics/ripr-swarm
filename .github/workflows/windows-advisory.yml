                      "producer_aliases": [str(p) for p in aliases], "admitted_payload_allocations": 1, "transfer_payload_allocations": 1,
                      "accounting_scope": "selected artifact after producer exit through staging cleanup; compiler intermediates excluded"}

          def remove_aliases(ownership):
              allocation = ownership.get("allocation")
              if allocation is None:
