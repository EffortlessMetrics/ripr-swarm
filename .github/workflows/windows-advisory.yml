name: Windows Advisory

on:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# Advisory Windows test lane (#2393).
#
# The repo is developed on Windows and Linux but was only ever validated on
# Linux, so platform-specific breakage shipped and stayed green on `main`
# indefinitely. Four separate classes were found by hand once someone ran the
# suite on Windows: #2390 (path interpolated into JSON), #2391 (host separator
# compared against server output), #2409 (fixture swallowed git failures),
# #2429 (host separator in a portable output contract).
#
# This lane exists so that class of defect has a standing signal instead of
# depending on a manual investigation.
#
# It is **advisory and never fails.** It is not a required check, and it must
# not be promoted to required until #2419 (two `framed_lsp_*` parallel-load
# flakes) and #2430 (`compat_journey` refresh timeout) are resolved and the
# lane demonstrates stability across repeated runs. A required lane that fails
# intermittently would erode trust in CI rather than add to it — the same
# false-confidence failure mode this lane exists to prevent.
#
# Triggers:
#   - schedule: a daily standing signal independent of PR traffic.
#   - pull_request with the `windows-ci` or `full-ci` label: opt-in for authors
#     touching path handling, fixtures, or process/IO code.
#   - workflow_dispatch: manual run.
#
# The suite runs **twice** on purpose. A single run cannot separate a
# deterministic platform failure from a parallel-load flake, and conflating the
# two is exactly the mistake that mis-filed a deterministic failure as
# intermittent in #2419. Two runs at default parallelism make the distinction
# visible in the summary: failing in both is deterministic, failing in one is
# not.
#
# Note on interpreting the logs: `cargo test` stops after the first failing
# test target, so a failure in an early target hides every later one. The
# summary reports which targets actually ran for that reason.

jobs:
  windows-advisory:
    name: windows-advisory
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'windows-ci') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-windows-advisory-1.95-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record environment
        shell: bash
        run: mkdir -p target && { rustc -Vv; cargo -V; echo "checkout_root=$PWD"; echo "cores=$(nproc 2>/dev/null || echo unknown)"; echo "parallel_mode=default"; } 2>&1 | tee target/windows-env.log

      - name: Run workspace tests (advisory, run 1)
        shell: bash
        run: mkdir -p target && cargo test --workspace 2>&1 | tee target/windows-run1.log || true

      - name: Run workspace tests (advisory, run 2)
        shell: bash
        run: mkdir -p target && cargo test --workspace 2>&1 | tee target/windows-run2.log || true

      - name: Summarize environment
        shell: bash
        run: printf '## Windows advisory lane\n\nAdvisory only — this lane never fails and is not a required check. See #2393.\n\n### Environment\n\n```\n%s\n```\n' "$(cat target/windows-env.log 2>/dev/null || echo unavailable)" >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize failures and repeated-run stability
        shell: bash
        run: cargo xtask windows-advisory-summary --run1 target/windows-run1.log --run2 target/windows-run2.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload advisory logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-windows-advisory
          path: |
            target/windows-env.log
            target/windows-run1.log
            target/windows-run2.log
          if-no-files-found: ignore
