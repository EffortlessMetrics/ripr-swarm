          def admit(actual_source, expected_source, actual_digest, expected_digest, actual_path, expected_path):
              require(actual_source == expected_source, "stale source receipt")
              require(actual_digest == expected_digest, "wrong executable digest")
              require(Path(actual_path).resolve() == Path(expected_path).resolve(), "wrong stock executable resolution")

          def packet(raw, selected_file, expected_id=None):
              data = json.loads(raw)
              findings = data.get("findings")
              require(isinstance(findings, list) and findings, "listing has no findings")
              selected_file = Path(selected_file).resolve()
              selected = [f for f in findings if f.get("language") == "rust" and f.get("probe", {}).get("family") == "predicate"
                          and f["probe"].get("line") == 2 and Path(f["probe"].get("file", "")).is_absolute()
                          and Path(f["probe"]["file"]).resolve() == selected_file
                          and f["probe"].get("expression") == "amount >= threshold"]
