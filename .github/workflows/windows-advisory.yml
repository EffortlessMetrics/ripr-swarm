          def payload_allocation(binary, target):
              require(binary.is_relative_to(target) and not binary.is_symlink(), "compiler artifact escaped owned target")
              info = binary.stat()
              aliases = [p for p in target.rglob("*") if p.is_file() and p.samefile(binary)]
              require(len(aliases) == info.st_nlink and all(not p.is_symlink() for p in aliases), "unowned executable alias")
              expected = digest(binary)
              require(all(p.samefile(binary) or p.stat().st_size != info.st_size or digest(p) != expected
                          for p in target.rglob("ripr*.exe")), "separate producer executable allocation")
