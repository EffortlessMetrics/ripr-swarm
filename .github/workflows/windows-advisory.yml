              except RuntimeError as error:
                  require(len(receipt["cases"]) == before, "negative admission launched a process")
                  receipt["controls"].append({"name": name, "rejected": True, "reason": str(error), "processes_launched": 0})
              else:
                  raise RuntimeError(name + ": wrong input admitted")

          try:
              require(os.name == "nt", "native Windows required")
              git, cargo, shell = [shutil.which(name) for name in ("git", "cargo", "pwsh")]
              require(all((git, cargo, shell)), "stock git/cargo/PowerShell unavailable")
              def git_value(*args):
                  status, stdout, _ = run("git-" + args[0] + "-" + str(len(receipt["cases"])), [git, *args], root)
                  require(status == 0, "source identity unavailable")
                  return stdout.decode().strip()
              actual_head = git_value("rev-parse", "HEAD")
              source_tree = git_value("rev-parse", "HEAD^{tree}")
              expected_head = os.environ["SELECTOR_EXPECTED_HEAD"]
              require(re.fullmatch("[0-9a-f]{40}", expected_head), "invalid expected head")
              require(actual_head == expected_head, "checkout is not the immutable selected head")
              require(not git_value("status", "--porcelain", "--untracked-files=no"), "tracked producer source is dirty")
              receipt["source"] = {"head": actual_head, "tree": source_tree, "lock_sha256": digest(root / "Cargo.lock"),
                                   "workflow_checkout": os.environ["SELECTOR_EXPECTED_HEAD"]}
              status, stdout, _ = run("cargo-version", [cargo, "-Vv"], root)
              require(status == 0, "Cargo identity unavailable")
              receipt["cargo"] = stdout.decode()
              rustc = shutil.which("rustc")
              require(rustc, "stock rustc unavailable")
              status, stdout, _ = run("rustc-version", [rustc, "-Vv"], root)
              require(status == 0 and stdout.startswith(b"rustc 1.95.0 ") and "host: x86_64-pc-windows-msvc" in stdout.decode(), "Windows toolchain mismatch")
              receipt["rustc"] = stdout.decode()
              stock_bin = Path(cargo).resolve().parent
              require(str(stock_bin).lower() in [p.rstrip("\\/").lower() for p in os.environ["PATH"].split(os.pathsep)], "Cargo bin is not a stock PATH slot")
              staged = stock_bin / "ripr.exe"
              require(not staged.exists() and not staged.is_symlink() and shutil.which("ripr") is None, "unexpected existing stock ripr occupant")
              owner_path = Path(os.environ["SELECTOR_TARGET_OWNER"])
              owner = json.loads(owner_path.read_text(encoding="utf-8"))
              target = Path(os.environ["CARGO_TARGET_DIR"])
              require(target == stock_bin / "selector-subset-cache" / "target" and target.is_dir()
                      and not target.is_symlink() and not target.is_junction(), "unowned shared Cargo target")
              require(owner_path == target.parent / "owner.json" and owner ==
                      {"head": actual_head, "root": str(root), "target": str(target),
                       "alias": str(root / "target" / "selector-cargo-cache")}, "shared target owner mismatch")
              alias = Path(owner["alias"])
              require(alias.is_junction() and alias.resolve() == target, "cache target mapping drift")
              ownership["target"] = True
              receipt["owned_producer_target"] = {"path": str(target), "state": "RETAINED_FOR_CACHE", "owner_sha256": digest(owner_path)}
              status, stdout, _ = run("build", [cargo, "build", "-p", "ripr", "--bin", "ripr", "--locked", "-j", "2", "--target-dir", str(target), "--message-format=json"],
                                      root, seconds=600, memory=8 * 1024**3, output_cap=16 * 1024**2, active=0)
              require(status == 0, "exact-head CLI build failed")
              require(git_value("rev-parse", "HEAD") == actual_head and git_value("rev-parse", "HEAD^{tree}") == source_tree, "producer source moved")
              require(not git_value("status", "--porcelain", "--untracked-files=no"), "producer changed tracked source")
              artifacts = [json.loads(line) for line in stdout.splitlines() if line.startswith(b"{")]
              binaries = [a for a in artifacts if a.get("reason") == "compiler-artifact" and a.get("target", {}).get("name") == "ripr"
                          and a["target"].get("kind") == ["bin"] and a.get("executable")]
              require(len(binaries) == 1, "one real CLI compiler artifact required")
              artifact = binaries[0]
              require(set(artifact["features"]) == {"default", "lang-rust", "lang-typescript", "lang-python"}, "default feature mismatch")
              require(Path(artifact["manifest_path"]).resolve() == root / "crates" / "ripr" / "Cargo.toml", "wrong producer manifest")
              binary = Path(artifact["executable"]).resolve()
              binary_digest = digest(binary)
              receipt["producer"] = {"artifact": artifact, "bytes": binary.stat().st_size, "sha256": binary_digest}
              # Until real aliases are verified, retain the conservative two-payload charge.
              payload_charge = 2 * binary.stat().st_size
              allocation = payload_allocation(binary, target)
              payload_charge = allocation["charged_bytes"]
              receipt["payload_allocation"] = stage_single_allocation(binary, staged, target, binary_digest, out, ownership)
              immutable_handle = k.CreateFileW(str(staged), 0x80000000, 1, None, 3, 0x80, None)
              require(immutable_handle not in (None, c.c_void_p(-1).value), "immutable executable handle failed")
              require((staged.stat().st_dev, staged.stat().st_ino) == (allocation["device"], allocation["file_id"]), "locked allocation identity changed")
              require(staged.stat().st_nlink == 1 and digest(staged) == binary_digest, "locked executable drift")
              try:
                  with staged.open("r+b"):
                      pass
              except PermissionError:
                  receipt["immutable_executable"] = {"write_open_refused": True, "share_mode": "read_only"}
              else:
                  raise RuntimeError("immutable executable permits a writer")
              resolved = shutil.which("ripr")
              require(resolved, "staged candidate does not resolve")
              rejected("wrong-digest-before-launch", lambda: admit(actual_head, expected_head, digest(resolved), "0" * 64, resolved, staged))
              rejected("stale-source-receipt-before-launch", lambda: admit(actual_head, "0" * 40, digest(resolved), binary_digest, resolved, staged))
              admit(actual_head, expected_head, digest(resolved), binary_digest, resolved, staged)
              receipt["producer"].update(stock_resolution=resolved, staging_before_journey_admission=True)
              fixture = Path(os.environ["RUNNER_TEMP"]) / ("selector literal " + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"])
              require(not fixture.exists(), "fixture collision")
              (fixture / "src").mkdir(parents=True)
              foreign = fixture / "foreign"
              foreign.mkdir()
              (fixture / "Cargo.toml").write_text('[package]\nname = "selector-literal"\nversion = "0.1.0"\nedition = "2021"\n')
              source = fixture / "src" / "lib.rs"
              source.write_text("pub fn price(amount: i32, threshold: i32) -> i32 {\n    if amount >= threshold { amount - 100 } else { amount }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    #[test]\n    fn positive_price() { assert!(price(500, 300) > 0); }\n}\n")
              diff = fixture / "fixture change.diff"
              diff.write_text("diff --git a/src/lib.rs b/src/lib.rs\n--- a/src/lib.rs\n+++ b/src/lib.rs\n@@ -1,3 +1,3 @@\n pub fn price(amount: i32, threshold: i32) -> i32 {\n-    if amount > threshold { amount - 100 } else { amount }\n+    if amount >= threshold { amount - 100 } else { amount }\n }\n")
              frozen_env = dict(os.environ)
              frozen = {str(p): digest(p) for p in (fixture / "Cargo.toml", source, diff, staged, owner_path)}
              shell_digest = digest(shell)
              status, shell_path, _ = run("shell-resolution", [shell, "-NoProfile", "-NonInteractive", "-Command", "(Get-Command ripr).Source"], foreign)
              require(status == 0 and Path(shell_path.decode().strip()).resolve() == staged.resolve(), "actual PowerShell resolution mismatch")
              status, shell_version, _ = run("shell-version", [shell, "-NoProfile", "-NonInteractive", "-Command", "$PSVersionTable.PSVersion.ToString()"], foreign)
              require(status == 0 and shell_version.strip(), "shell version unavailable")
              receipt["admission"] = {"safe_environment": {n: os.environ.get(n) for n in ("PATHEXT", "ComSpec", "LANG", "LC_ALL", "RUSTUP_TOOLCHAIN")},
                                      "PATH_sha256": hashlib.sha256(os.environ["PATH"].encode()).hexdigest(),
                                      "PYTHONPATH_present": "PYTHONPATH" in os.environ,
                                      "environment_scope": "full inherited environment compared in memory; safe whitelist retained",
                                      "shell_version": shell_version.decode().strip(), "cwd": str(foreign), "fixture_hashes": frozen, "shell": shell, "shell_sha256": shell_digest,
                                      "environment_changes": [], "PowerShell_resolved_ripr": shell_path.decode().strip(), "stale_control": "mutated source receipt; no historical binary built"}
              def frozen_inputs():
                  require(dict(os.environ) == frozen_env, "environment changed after admission")
                  require(all(digest(p) == value for p, value in frozen.items()), "admitted input changed")
                  require(digest(shell) == shell_digest and shutil.which("ripr") == resolved, "shell/resolution changed")
              def invoke(label, args):
                  frozen_inputs()
                  result = run(label, [resolved, *args], foreign)
                  frozen_inputs()
                  return result
              status, stdout, _ = invoke("version", ["--version"])
              require(status == 0 and stdout.decode().strip().endswith("(" + actual_head + ")"), "candidate version/source identity mismatch")
              receipt["producer"]["version"] = stdout.decode().strip()
              check_args = ["check", "--root", str(fixture), "--diff", str(diff), "--json"]
              status, stdout, _ = invoke("initial-list", check_args)
              require(status == 0, "fixture listing failed")
              actual_id = packet(stdout, source)
              require(all(f.get("id") != "repo-probe:src_lib.rs:error_path:3bf8c64c" for f in json.loads(stdout)["findings"]), "opaque negative ID is present in fixture")
              rejected("wrong-listing-identity", lambda: packet(stdout, source, "probe:wrong-control"))
              for name, field, value in (("wrong-fixture-file-identity", "file", str(foreign / "src" / "lib.rs")),
                                         ("wrong-predicate-condition", "expression", "amount > threshold")):
                  wrong = json.loads(stdout)
                  for finding in wrong["findings"]:
                      if finding.get("id") == actual_id:
                          finding["probe"][field] = value
                  rejected(name, lambda: packet(json.dumps(wrong).encode(), source, actual_id))
              commands = []
              for sibling, selector in (("explain", "src/lib.rs:abc"), ("context", ":::")):
                  args = [sibling, "--root", str(fixture), "--diff", str(diff)] + (["--at"] if sibling == "context" else []) + [selector]
                  status, stdout, stderr = invoke(sibling + "-malformed", args)
                  require(status == 2 and not stdout and b"file:line with a nonempty path" in stderr, "malformed miss contract changed")
                  matches = re.findall(chr(96) + r"(ripr check [^\x60]+)" + chr(96), stderr.decode())
                  require(len(matches) == 1, "one printed recovery command required")
                  command = matches[0]
                  require(command == f"ripr check --root '{fixture}' --diff '{diff}' --json", "printed command lost frozen root/diff/JSON scope")
                  commands.append(command)
                  (out / (sibling + "-literal-command.txt")).write_text(command, encoding="utf-8")
                  frozen_inputs()
                  status, stdout, _ = run(sibling + "-literal-replay", [shell, "-NoProfile", "-NonInteractive", "-Command", command], foreign)
                  frozen_inputs()
                  require(status == 0, "literal PowerShell recovery failed")
                  require(packet(stdout, source, actual_id) == actual_id, "literal replay selected another fixture")
                  receipt["cases"][-1]["command_exactly_as_printed"] = command
                  status, stdout, _ = invoke(sibling + "-actual-id", [sibling, "--root", str(fixture), "--diff", str(diff)]
                                            + (["--at"] if sibling == "context" else []) + [actual_id])
                  require(status == 0, "actual listed ID retry failed")
                  if sibling == "context":
                      selected = json.loads(stdout)
                      require(selected.get("probe", {}).get("id") == actual_id, "context selected another listed ID")
                  else:
                      require(actual_id in stdout.decode(), "explain omitted actual selected ID")
                  status, stdout, stderr = invoke(sibling + "-opaque-negative", [sibling, "--root", str(fixture), "--diff", str(diff)]
                                                  + (["--at"] if sibling == "context" else []) + ["repo-probe:src_lib.rs:error_path:3bf8c64c"])
                  require(status == 2 and not stdout and b"file:line with a nonempty path" not in stderr, "opaque ID miss got syntax guidance")
              require(commands[0] == commands[1], "siblings advertised different recovery scope")
              frozen_inputs()
              status, stdout, _ = run("literal-repeat", [shell, "-NoProfile", "-NonInteractive", "-Command", commands[0]], foreign)
              frozen_inputs()
              require(status == 0 and packet(stdout, source, actual_id) == actual_id, "literal repeat changed selected fixture")
              receipt.update(state="PASS", actual_listed_id=actual_id, literal_replays=3, siblings_retried=["explain", "context"])
          except Exception as error:
              record_failure(receipt, type(error).__name__, str(error))
          finally:
              try:
                  receipt["producer_cleanup"] = remove_aliases(ownership)
              except Exception as cleanup_error:
                  receipt["producer_cleanup"] = {"state": "FAILED", "error": str(cleanup_error)}
                  record_failure(receipt, "ProducerCleanup", str(cleanup_error))
              try:
                  if immutable_handle not in (None, c.c_void_p(-1).value):
                      require(k.CloseHandle(immutable_handle), "immutable handle close failed")
                  receipt["staging_cleanup"] = remove_staged(globals().get("staged"), ownership["staged"])
              except Exception as cleanup_error:
                  receipt["staging_cleanup"] = {"state": "FAILED", "error": str(cleanup_error)}
                  record_failure(receipt, "StagingCleanup", str(cleanup_error))
              finalize_evidence(receipt, out, globals().get("fixture"), payload_charge)
              (out / "receipt.json").write_bytes(json.dumps(receipt, indent=2).encode())
              print(json.dumps(receipt), flush=True)
          sys.exit(0 if receipt["state"] == "PASS" else 1)
          '@
          $consumer | python - 2>&1 | Tee-Object -FilePath target/subset-selector-literal.log
          $nativeExit = $LASTEXITCODE
          Set-Content -LiteralPath target/subset-selector-literal.status -Value $nativeExit
          # Preserve the advisory verdict; missing receipt/log/status remains a hard failure.
          exit 0

      # Verdicts go to the job log, the step summary, and
      # target/windows-subset-verdict.md -- the same three copies the full
      # suite above keeps -- because none of them is gated, so a reader who
      # can see the run must be able to see the verdict. This step never
      # fails on a FAIL verdict; the next step owns the non-advisory evidence
      # contract.
      - name: Summarize subset verdicts
        shell: bash
        run: |
          {
            printf '## Windows advisory subset (#4938)\n\n'
            printf 'Advisory only: not a required check and does not gate merges. Test/lint verdicts:\n\n'
            for label in subset-gap-artifacts subset-cache-warning subset-clippy subset-selector-literal; do
            if [ "$label" = subset-selector-literal ] && [ "$SELECTOR_CONSUMER_ENABLED" != true ]; then continue; fi
              status_file="target/${label}.status"
              if [ ! -f "$status_file" ]; then
                echo "- ${label}: not_run (no status file)"
              elif [ "$(cat "$status_file")" = "0" ]; then
                echo "- ${label}: PASS"
              else
                echo "- ${label}: FAIL (exit $(cat "$status_file"))"
              fi
            done
          } | tee target/windows-subset-verdict.md >> "$GITHUB_STEP_SUMMARY"

      # Evidence generation is not advisory (lane contract above): a command
      # that never wrote its status file or its log fails the job instead of
      # passing silently, and so does a cargo run that exited 0 without
      # executing a single test (a zero-match name filter is silent green,
      # #4938). The explicit `exit 1` matters: a loop whose body is a bare
      # `test` would otherwise report only the last label's status.
      - name: Fail on missing or empty subset evidence
        shell: bash
        run: |
          for label in subset-gap-artifacts subset-cache-warning subset-clippy; do
            test -f "target/${label}.status" || exit 1
            test -f "target/${label}.log" || exit 1
          done
          for label in subset-gap-artifacts subset-cache-warning; do
            if [ "$(cat "target/${label}.status")" = "0" ]; then
              executed="$(awk '/^test result:/{for (i = 1; i <= NF; i++) if ($i == "passed;" || $i == "failed;" || $i == "measured;") executed += $(i - 1)} END {print executed + 0}' "target/${label}.log")"
              if [ "$executed" -eq 0 ]; then
                echo "${label}: cargo exited 0 but no test executed; the name filter no longer matches any test" >&2
                exit 1
              fi
            fi
          done

      - name: Require selector consumer receipt, log and native status
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("target/subset-selector-literal.log"), Path("target/subset-selector-literal.status"), Path("target/selector-literal/receipt.json")]
          if not all(p.is_file() and p.stat().st_size for p in paths):
              raise SystemExit("selector consumer evidence missing or empty")
          status = int(paths[1].read_text(encoding="utf-8-sig").strip())
          receipt = json.loads(paths[2].read_text(encoding="utf-8-sig"))
          logged = json.loads(paths[0].read_text(encoding="utf-8-sig").splitlines()[-1])
          if logged != receipt or receipt.get("schema_version") != 1 or receipt.get("state") not in ("PASS", "FAIL"):
              raise SystemExit("selector receipt/log malformed or inconsistent")
          if status != (0 if receipt["state"] == "PASS" else 1):
              raise SystemExit("selector native status disagrees with retained receipt")
          cleanup = receipt.get("staging_cleanup", {}).get("state")
          producer_cleanup = receipt.get("producer_cleanup", {}).get("state")
          if producer_cleanup not in ("NOT_CREATED", "REMOVED") or (receipt["state"] == "PASS" and producer_cleanup != "REMOVED"):
              raise SystemExit("selector selected producer alias cleanup missing or failed")
          if cleanup not in ("NOT_CREATED", "REMOVED") or (receipt["state"] == "PASS" and cleanup != "REMOVED"):
              raise SystemExit("selector staged executable cleanup missing or failed")
          if receipt["state"] == "FAIL":
              if not receipt.get("error"):
                  raise SystemExit("selector FAIL has no retained failure")
          else:
              if receipt.get("owned_producer_target", {}).get("state") != "RETAINED_FOR_CACHE":
                  raise SystemExit("selector PASS lacks retained shared dependency cache")
              if receipt.get("payload_allocation", {}).get("admitted_payload_allocations") != 1 or not receipt.get("immutable_executable", {}).get("write_open_refused"):
                  raise SystemExit("selector PASS lacks single immutable allocation")
              cases = {c["label"]: c for c in receipt.get("cases", [])}
              literal = ("explain-literal-replay", "context-literal-replay", "literal-repeat")
              retries = ("explain-actual-id", "context-actual-id")
              if receipt.get("literal_replays") != 3 or receipt.get("siblings_retried") != ["explain", "context"] or not receipt.get("actual_listed_id"):
                  raise SystemExit("selector PASS lacks actual listing/retry subjects")
              if not all(n in cases and cases[n].get("exit") == 0 and not cases[n].get("stop") for n in literal + retries):
                  raise SystemExit("selector PASS lacks successful native replay/retry")
              controls = receipt.get("controls", [])
              if {c.get("name") for c in controls} != {"wrong-digest-before-launch", "stale-source-receipt-before-launch", "wrong-listing-identity", "wrong-fixture-file-identity", "wrong-predicate-condition"} or len(controls) != 5 or not all(c.get("rejected") and c.get("processes_launched") == 0 for c in controls):
                  raise SystemExit("selector PASS lacks five rejected controls")
          print("Selector consumer evidence retained: " + receipt["state"])
          PY

      - name: Upload subset evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-windows-advisory-subset
          path: |
            target/subset-gap-artifacts.log
            target/subset-gap-artifacts.status
            target/subset-cache-warning.log
            target/subset-cache-warning.status
            target/subset-clippy.log
            target/subset-clippy.status
            target/windows-subset-verdict.md
            target/subset-selector-literal.log
            target/subset-selector-literal.status
            target/selector-literal/
          if-no-files-found: ignore
