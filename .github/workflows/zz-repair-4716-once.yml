name: Repair npm launcher review findings once

on:
  push:
    branches:
      - feat/4710-npm-launcher-core

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4710-npm-launcher-core
          fetch-depth: 0

      - name: Set up pinned Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Repair reviewed launcher surfaces
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              file.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "packaging/npm/launcher/lib/launcher.cjs",
              'const path = require("node:path");\n',
              'const path = require("node:path");\nconst { constants: osConstants } = require("node:os");\n',
          )
          replace_once(
              "packaging/npm/launcher/lib/launcher.cjs",
              '  if (result.signal) {\n    process.kill(process.pid, result.signal);\n    return;\n  }',
              '  if (result.signal) {\n    const signalNumber = osConstants.signals[result.signal];\n    process.exitCode = typeof signalNumber === "number" ? 128 + signalNumber : 1;\n    process.kill(process.pid, result.signal);\n    return;\n  }',
          )

          replace_once(
              "packaging/npm/launcher/test/launcher.test.cjs",
              '  const result = spawnSync("npm", ["pack", "--dry-run", "--json", "--ignore-scripts"], {\n    cwd: root,\n    encoding: "utf8",\n  });',
              '  const npmCli = process.env.npm_execpath;\n  const command = npmCli ? process.execPath : "npm";\n  const prefix = npmCli ? [npmCli] : [];\n  const result = spawnSync(command, [...prefix, "pack", "--dry-run", "--json", "--ignore-scripts"], {\n    cwd: root,\n    encoding: "utf8",\n  });',
          )

          anchor = '''test("runs a real synthetic executable and preserves argv, cwd, env, stdout, stderr, and exit status", () => {'''
          signal_test = '''test("launch preserves a nonzero exit code when a child signal is consumed", async () => {
            const fixture = nativeFixture();
            const child = new EventEmitter();
            child.killed = false;
            child.kill = () => true;
            const spawnImpl = () => {
              queueMicrotask(() => child.emit("exit", null, "SIGTERM"));
              return child;
            };
            const resolver = createRequire(path.join(fixture.launcherRoot, "package.json"));
            const originalKill = process.kill;
            const originalExitCode = process.exitCode;
            const forwarded = [];
            process.kill = (pid, signal) => {
              forwarded.push({ pid, signal, exitCode: process.exitCode });
              return true;
            };
            process.exitCode = undefined;
            try {
              await launcher.launch({
                launcherRoot: fixture.launcherRoot,
                selectedPlatform: fixture.selected,
                resolver,
                spawnImpl,
                forwardSignals: false,
              });
              assert.equal(process.exitCode, 143);
              assert.deepEqual(forwarded, [{ pid: process.pid, signal: "SIGTERM", exitCode: 143 }]);
            } finally {
              process.kill = originalKill;
              process.exitCode = originalExitCode;
              cleanup(fixture.root);
            }
          });

          '''
          replace_once(
              "packaging/npm/launcher/test/launcher.test.cjs",
              anchor,
              signal_test + anchor,
          )

          replace_once(
              "xtask/src/policy/distribution/npm_launcher.rs",
              '''    for forbidden in ["curl ", "wget ", "https.get", "execSync(", "shell: true"] {
                  if bin_text.contains(forbidden) || library_text.contains(forbidden) {
                      violations.push(format!(
                          "{library_path}: launcher cannot download, shell out, or enable shell interpolation; found `{forbidden}`"
                      ));
                  }
              }
          ''',
              '''    for forbidden in ["curl ", "wget ", "https.get", "execSync(", "shell: true"] {
                  for (path, text) in [(bin_path, bin_text), (library_path, library_text)] {
                      if text.contains(forbidden) {
                          violations.push(format!(
                              "{path}: launcher cannot download, shell out, or enable shell interpolation; found `{forbidden}`"
                          ));
                      }
                  }
              }
          ''',
          )

          replace_once(
              ".github/workflows/npm-launcher.yml",
              "      - uses: actions/checkout@v6\n",
              "      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6\n",
          )

      - name: Install pinned Rust formatter and test toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format and test repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          npm --prefix packaging/npm/launcher test
          (cd packaging/npm/launcher && npm pack --dry-run --json --ignore-scripts >/tmp/npm-pack.json)
          cargo +1.95.0 test -p xtask npm_launcher

      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/zz-repair-4716-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/npm/launcher/lib/launcher.cjs \
            packaging/npm/launcher/test/launcher.test.cjs \
            xtask/src/policy/distribution/npm_launcher.rs \
            .github/workflows/npm-launcher.yml
          git commit -m "fix(npm): repair launcher review findings"
          git push origin HEAD:feat/4710-npm-launcher-core
