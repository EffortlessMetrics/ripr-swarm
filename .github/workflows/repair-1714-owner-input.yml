name: repair-1714-owner-input

on:
  push:
    branches:
      - fix/1714-match-arm-pattern-identity

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore repair stage 1714 owner input'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/1714-match-arm-pattern-identity
          fetch-depth: 0

      - name: Install fixed Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Retain exact red witness
        shell: bash
        run: |
          set -euo pipefail
          expected=13b3bc7ef5abf28cba9eeee290ede0ed397a9c0f
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected"

          red="$RUNNER_TEMP/ripr-1714-red"
          git worktree add "$red" "$expected"
          set +e
          cargo test \
            --manifest-path "$red/Cargo.toml" \
            -p ripr \
            --test match_arm_pattern_identity \
            --locked \
            -- --nocapture >"$RUNNER_TEMP/ripr-1714-red.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/ripr-1714-red.log"
          test "$status" -ne 0
          grep -F "shared_result_literal_does_not_observe_a_sibling_arm" "$RUNNER_TEMP/ripr-1714-red.log"
          grep -F "diagnostic_literal_does_not_select_the_changed_arm" "$RUNNER_TEMP/ripr-1714-red.log"
          grep -E "test result: FAILED\. 3 passed; 2 failed" "$RUNNER_TEMP/ripr-1714-red.log"

      - name: Bind arm identity to the owner call input
        shell: bash
        env:
          PATCH_SCRIPT_B64: ""
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_SCRIPT_B64" | base64 --decode > "$RUNNER_TEMP/patch_reveal.py"
          python "$RUNNER_TEMP/patch_reveal.py"

      - name: Qualify repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ripr --test match_arm_pattern_identity --locked
          cargo test -p ripr --lib match_arm --locked
          cargo clippy -p ripr --all-targets --locked -- -D warnings
          git diff --check

      - name: Remove repair workflow and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-1714-owner-input.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/ripr/src/analysis/classify/reveal.rs \
                  .github/workflows/repair-1714-owner-input.yml
          git diff --cached --check
          git commit -m "fix(rust): bind match-arm identity to owner input" \
            -m "Retain the exact red witness at 13b3bc7, then require arm-specific variants and literals to occur in the sole direct argument of a bare changed-owner call within an exact equality. Expected values, diagnostics, multi-argument calls, qualified calls, and ambiguous same-name bindings fail closed. Targeted integration, unit, formatting, and strict Clippy qualification passed in hosted run $GITHUB_RUN_ID. Related: EffortlessMetrics/ripr#1714; ub-review#1306."
          git push origin HEAD:fix/1714-match-arm-pattern-identity
