name: Linux Nextest Shards

# Manual trial of building the workspace test binaries once and running the four
# nextest partitions from that archive (#10507 follow-up). The hosted required
# route (`rust-test-shards.yml`) makes every shard rebuild the same ripr and xtask
# test binaries: of a ~14 minute shard, ~5.7 minutes is test execution and the rest
# is that build, which rust-cache cannot remove because it never caches workspace
# crates. This trial builds once with `cargo nextest archive`, then runs
# `--partition count:N/4` from the archive on four runners and reports each phase's
# seconds, so the wall-clock and runner minutes of the shared-build form can be
# compared with the required route's before it replaces anything. It is advisory
# evidence only: it does not replace the required gates, is not wired to
# pull_request events, and never saves a cache over the required run's.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The first trial archived debug-info test binaries: 4.5 GB, a 48 to 144 second
# download and a runner out of disk while extracting. Test binaries need no debug
# info in CI, and the same setting on the shards keeps the tests' own nested cargo
# builds on the same profile as the archive.
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  archive:
    name: archive
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history, like the required test step: base-resolving tests refuse on
      # a shallow clone (#10344).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install CI tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-swarm-rust-shards-${{ runner.os }}
          save-if: false

      - name: Build the test archive
        run: |
          t0=$(date +%s)
          cargo nextest archive --workspace --profile ci --archive-file nextest-archive.tar.zst
          t1=$(date +%s)
          size=$(stat -c %s nextest-archive.tar.zst)
          { echo "### Archive"; echo "build seconds: $((t1 - t0)); archive bytes: $size"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  linux-shard:
    name: linux-shard-${{ matrix.shard }}
    needs: archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install CI tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      # Restore only: the policy tests spawn cargo themselves and want the
      # registry and dependency builds; the workspace binaries come from the archive.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-swarm-rust-shards-${{ runner.os }}
          save-if: false

      # The archive extracts a second copy of every test binary next to the
      # restored cache and checkout, and the second trial ran the runner out of disk
      # with debug info already off. Preinstalled SDKs this job never uses are the
      # cheapest space to give back.
      - name: Free runner disk
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: nextest-archive

      # No separate warm step: the policy tests that spawn `cargo test --no-run -p
      # xtask` pay that build inside their own test time, which is the cost this
      # trial exists to measure. The whole step's seconds are reported.
      - name: Run workspace tests from the archive (shard ${{ matrix.shard }} of 4)
        timeout-minutes: 40
        run: |
          mkdir -p target/nextest/ci
          archive=(--archive-file nextest-archive.tar.zst --workspace-remap "$PWD" --profile ci)
          cargo nextest list "${archive[@]}" --partition count:${{ matrix.shard }}/4 --color never --message-format oneline 2> /dev/null | sort > target/nextest/ci/list-${{ matrix.shard }}.txt
          [ "${{ matrix.shard }}" = 1 ] && cargo nextest list "${archive[@]}" --color never --message-format oneline 2> /dev/null | sort > target/nextest/ci/list-all.txt
          t0=$(date +%s)
          set +e
          cargo nextest run "${archive[@]}" --no-fail-fast --partition count:${{ matrix.shard }}/4
          status=$?
          set -e
          t1=$(date +%s)
          tests=$(grep -Eo '<testsuites [^>]*tests="[0-9]+"' target/nextest/ci/junit.xml | grep -Eo 'tests="[0-9]+"' | grep -Eo '[0-9]+' || echo 0)
          printf '%s\n' "$status" > target/nextest/ci/shard-${{ matrix.shard }}.status
          { echo "### Shard ${{ matrix.shard }} of 4"; echo "nextest exit status: $status"; echo "tests in junit: $tests"; echo "run seconds: $((t1 - t0))"; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-shard-${{ matrix.shard }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci/shard-${{ matrix.shard }}.status
            target/nextest/ci/list-*.txt
          if-no-files-found: warn
          retention-days: 7

  partition-check:
    name: partition-check
    needs: linux-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: linux-shard-*
          path: shards

      # The four partition lists must be pairwise disjoint and their union must be
      # the full workspace list: equal-sized omissions and duplicates would pass a
      # summed JUnit count.
      - name: Check the shards are a disjoint cover
        run: |
          cat shards/linux-shard-*/list-[1-4].txt | sort > union.txt
          dup=$(uniq -d union.txt | wc -l)
          uniq union.txt > union-unique.txt
          missing=$(comm -13 union-unique.txt shards/linux-shard-1/list-all.txt | wc -l)
          extra=$(comm -23 union-unique.txt shards/linux-shard-1/list-all.txt | wc -l)
          total=$(wc -l < shards/linux-shard-1/list-all.txt)
          { echo "### Partition cover"; echo "workspace tests listed: $total"; echo "duplicated across shards: $dup"; echo "missing from shards: $missing"; echo "not in workspace list: $extra"; } >> "$GITHUB_STEP_SUMMARY"
          [ "$dup" -eq 0 ] && [ "$missing" -eq 0 ] && [ "$extra" -eq 0 ]
