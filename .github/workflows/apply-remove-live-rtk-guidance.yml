name: Apply live RTK guidance cleanup

on:
  push:
    branches:
      - agent/remove-live-rtk-guidance
    paths:
      - .github/workflows/apply-remove-live-rtk-guidance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/remove-live-rtk-guidance
          fetch-depth: 0

      - name: Remove RTK from live command guidance
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          paths = [
              Path("docs/RIPR_SWARM_HUMAN_WORKFLOW.md"),
              Path("docs/IMPLEMENTATION_CAMPAIGNS.md"),
              Path("docs/lanes/LANE_1_RIPR_PLUS_BURNDOWN.md"),
              Path("docs/lanes/LANE_4_PR_CI_REVIEW.md"),
              Path("docs/swarm-development.md"),
              Path("plans/adoption-integration-cleanup/README.md"),
              Path("plans/adoption-integration-cleanup/implementation-plan.md"),
              Path("plans/campaign-27/lane3-editor-preview-routing.md"),
              Path("plans/lane4-pr-ci-review-cockpit/implementation-plan.md"),
              Path("plans/rust-usable-gap-projection/agent-context-route.md"),
              Path("plans/rust-usable-gap-projection/implementation-plan.md"),
          ]

          changed = []
          for path in paths:
              raw = subprocess.check_output(
                  ["git", "show", f"origin/main:{path.as_posix()}"]
              )
              count = raw.count(b"rtk ")
              if count == 0:
                  raise SystemExit(f"expected at least one RTK command in {path}")
              path.write_bytes(raw.replace(b"rtk ", b""))
              changed.append((str(path), count))

          for path, count in changed:
              print(f"{path}: removed {count} RTK prefix(es)")
          PY

          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add \
            docs/RIPR_SWARM_HUMAN_WORKFLOW.md \
            docs/IMPLEMENTATION_CAMPAIGNS.md \
            docs/lanes/LANE_1_RIPR_PLUS_BURNDOWN.md \
            docs/lanes/LANE_4_PR_CI_REVIEW.md \
            docs/swarm-development.md \
            plans/adoption-integration-cleanup/README.md \
            plans/adoption-integration-cleanup/implementation-plan.md \
            plans/campaign-27/lane3-editor-preview-routing.md \
            plans/lane4-pr-ci-review-cockpit/implementation-plan.md \
            plans/rust-usable-gap-projection/agent-context-route.md \
            plans/rust-usable-gap-projection/implementation-plan.md
          git commit -m "docs: preserve source formatting in RTK cleanup"
          git push origin HEAD:agent/remove-live-rtk-guidance
