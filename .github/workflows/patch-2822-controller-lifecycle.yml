name: Patch 2822 controller lifecycle

on:
  push:
    branches:
      - codex/vscode-controller-start-stop-totality-2822a

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/vscode-controller-start-stop-totality-2822a
          fetch-depth: 0

      - name: Apply controller lifecycle patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('editors/vscode/src/client.ts')
          text = path.read_text(encoding='utf-8')

          marker = "const RIPR_CONFIG_RELATIVE_PATH = 'ripr.toml';\n"
          addition = """const RIPR_CONFIG_RELATIVE_PATH = 'ripr.toml';
          const RIPR_CLIENT_START_SETTLE_BUDGET_MS = 30_000;

          export class RiprClientLifecycleTimeoutError extends Error {
            constructor(description: string, budgetMs: number) {
              super(`${description} did not settle within ${budgetMs}ms.`);
              this.name = 'RiprClientLifecycleTimeoutError';
            }
          }

          export type RiprClientLifecycleWait = (
            operation: Promise<void>,
            budgetMs: number,
            description: string
          ) => Promise<void>;
          """
          if text.count(marker) != 1:
              raise SystemExit(f'expected one config marker, found {text.count(marker)}')
          text = text.replace(marker, addition, 1)

          runtime_marker = """  showErrorMessage(message: string, ...items: string[]): Thenable<string | undefined>;
          }
          """
          runtime_replacement = """  showErrorMessage(message: string, ...items: string[]): Thenable<string | undefined>;
            waitForLifecycle?: RiprClientLifecycleWait;
          }
          """
          if text.count(runtime_marker) != 1:
              raise SystemExit(f'expected one runtime marker, found {text.count(runtime_marker)}')
          text = text.replace(runtime_marker, runtime_replacement, 1)

          class_marker = """export class RiprClientController {
          """
          helper = """async function waitForClientLifecycle(
            operation: Promise<void>,
            budgetMs: number,
            description: string
          ): Promise<void> {
            let timeout: ReturnType<typeof setTimeout> | undefined;
            try {
              await Promise.race([
                operation,
                new Promise<void>((_resolve, reject) => {
                  timeout = setTimeout(() => {
                    reject(new RiprClientLifecycleTimeoutError(description, budgetMs));
                  }, budgetMs);
                })
              ]);
            } finally {
              if (timeout !== undefined) {
                clearTimeout(timeout);
              }
            }
          }

          export class RiprClientController {
          """
          if text.count(class_marker) != 1:
              raise SystemExit(f'expected one controller marker, found {text.count(class_marker)}')
          text = text.replace(class_marker, helper, 1)

          old_stop = """  async stop(): Promise<void> {
            const client = this.client;
            this.client = undefined;
            // Clear any in-flight start dedup so the next start() can proceed fresh.
            // If a start() is mid-flight when stop() is called, that start's finally
            // block will see startingPromise !== its own promise and leave the field
            // cleared.
            this.startingPromise = undefined;
            // Bump the generation so any in-flight startOnce() detects that stop()
            // ran during its async setup window and aborts before assigning
            // this.client. This prevents the late assignment from overwriting the
            // fresh client that the caller's subsequent start() installed after
            // stop(). (#2123)
            this.startGeneration++;
            this.server = undefined;
            this.receivedTypedAnalysisStatus = false;
            this.typedAnalysisStatusState = undefined;
            this.firstUsefulAction = undefined;
            this.dirtyRiprDocuments.clear();
            while (this.notificationDisposables.length > 0) {
              this.notificationDisposables.pop()?.dispose();
            }
            if (client) {
              await client.stop();
            }
            this.updateStatus({
              kind: 'stopped',
              summary: 'ripr server has stopped.',
              detail: 'Run ripr: Restart Server to start analysis again.',
              nextStep: 'Run ripr: Restart Server.'
            });
          }
          """
          new_stop = """  async stop(): Promise<void> {
            const client = this.client;
            const startingPromise = this.startingPromise;

            // Invalidate the active generation before waiting. A start that is still
            // resolving or handshaking may finish, but it cannot publish current
            // status after stop intent begins. Keep client/start ownership intact
            // until the wait has a finite result so a timeout cannot open a window
            // for a replacement beside a possibly still-running session. (#2822)
            this.startGeneration += 1;

            let startupRejected = false;
            if (startingPromise) {
              const waitForLifecycle = this.runtime.waitForLifecycle ?? waitForClientLifecycle;
              try {
                await waitForLifecycle(
                  startingPromise,
                  RIPR_CLIENT_START_SETTLE_BUDGET_MS,
                  'ripr client startup before stop'
                );
              } catch (error) {
                if (error instanceof RiprClientLifecycleTimeoutError) {
                  const message = error.message;
                  this.output.appendLine(`ripr server stop failed: ${message}`);
                  this.updateStatus({
                    kind: 'analysisFailed',
                    summary: 'ripr server stop timed out while startup was still pending.',
                    detail: message,
                    nextStep: 'Run ripr: Restart Server after the pending startup settles.'
                  });
                  throw error;
                }
                startupRejected = true;
                const message = error instanceof Error ? error.message : String(error);
                this.output.appendLine(`ripr client startup settled with failure during stop: ${message}`);
              }
            }

            if (this.startingPromise === startingPromise) {
              this.startingPromise = undefined;
            }
            if (this.client === client) {
              this.client = undefined;
            }
            this.server = undefined;
            this.receivedTypedAnalysisStatus = false;
            this.typedAnalysisStatusState = undefined;
            this.firstUsefulAction = undefined;
            this.dirtyRiprDocuments.clear();
            while (this.notificationDisposables.length > 0) {
              this.notificationDisposables.pop()?.dispose();
            }
            // startOnce owns cleanup after a rejected startup. For a successful
            // startup, stop only after the promise has settled into a supported
            // client transition. A timeout returns above without clearing state.
            if (client && !startupRejected) {
              await client.stop();
            }
            this.updateStatus({
              kind: 'stopped',
              summary: 'ripr server has stopped.',
              detail: 'Run ripr: Restart Server to start analysis again.',
              nextStep: 'Run ripr: Restart Server.'
            });
          }
          """
          if text.count(old_stop) != 1:
              raise SystemExit(f'expected one stop implementation, found {text.count(old_stop)}')
          text = text.replace(old_stop, new_stop, 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/patch-2822-controller-lifecycle.yml
          cd editors/vscode
          npm ci
          npm run compile

      - name: Commit clean candidate
        shell: bash
        run: |
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git config commit.gpgsign false
          git add editors/vscode/src/client.ts editors/vscode/test/suite/workspace_trust_transition.test.ts .github/workflows/patch-2822-controller-lifecycle.yml
          git commit -m "fix(vscode): wait for startup before controller stop"
          git push origin HEAD:codex/vscode-controller-start-stop-totality-2822a
