name: Export PR 4716 workspace

on:
  push:
    branches:
      - feat/4710-npm-launcher-core
    paths:
      - .github/workflows/export-4716-workspace.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4710-npm-launcher-core
          persist-credentials: false

      - name: Archive workspace
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "${RUNNER_TEMP}/ripr-swarm-4716.tgz" .

      - name: Upload workspace
        uses: actions/upload-artifact@v7
        with:
          name: ripr-swarm-4716-${{ github.sha }}
          path: ${{ runner.temp }}/ripr-swarm-4716.tgz
          if-no-files-found: error
          retention-days: 1
