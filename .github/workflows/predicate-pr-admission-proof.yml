name: Predicate PR focused admission (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/predicate-pr-admission-proof.yml]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: ripr-11358-pr-admission
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBJECT: 8d0371fc731646ee79cf7c75dab8fb3fc57087d5
      BASIS: 9896777133d6e1beb6ac1ca28b5e772f7a150463
      DESTINATION: codex/11358-complete-stub-inventory-reuse
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: build
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 8d0371fc731646ee79cf7c75dab8fb3fc57087d5
          path: build
          fetch-depth: 0
          persist-credentials: false
      - name: Bind Draft and compose the material prerequisite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/predicate-composition"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test -z "$(git status --porcelain)"
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr-before.json"
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); pr=json.loads((e/'pr-before.json').read_text())
          assert pr['head']['sha']==os.environ['SUBJECT'] and pr['state']=='open' and pr['draft']
          assert 'merge-ready' not in [x['name'] for x in pr['labels']]
          (e/'pr-body.json').write_text(json.dumps({'body':pr['body']})+'\n')
          assert shutil.disk_usage('.').free>=18*1024**3, 'owned target and reserve unavailable'
          PY
          git fetch --no-tags origin "$BASIS"
          test "$(git rev-parse "$BASIS^{commit}")" = "$BASIS"
          git config user.name 'Steven Zimmerman'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          set +e
          git -c commit.gpgsign=false merge --no-ff --no-commit "$BASIS" > "$EVIDENCE/merge.stdout" 2> "$EVIDENCE/merge.stderr"
          code=$?
          set -e
          echo "merge exit=$code" >> "$EVIDENCE/status.txt"
          git status --porcelain > "$EVIDENCE/merge-status.txt"
          if [ "$code" != 0 ]; then git diff > "$EVIDENCE/conflict.diff"; cat "$EVIDENCE/merge.stderr"; exit "$code"; fi
          git -c commit.gpgsign=false commit -m 'merge: compose guidance reuse with main build recovery (#11358)'
          git diff --name-only "$BASIS" HEAD > "$EVIDENCE/candidate-paths.txt"
          python3 - <<'PY'
          import os, subprocess, json
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          expected={'changelog.d/11358-complete-stub-inventory-reuse.md','crates/ripr/src/analysis/file_guidance_inventory_tests.rs','crates/ripr/src/analysis/mod.rs','crates/ripr/src/analysis/seam_inventory.rs','crates/ripr/src/app/test_stub.rs','crates/ripr/src/app/test_stub_inventory_tests.rs'}
          assert set((e/'candidate-paths.txt').read_text().splitlines())==expected
          git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          parents=git('show','-s','--format=%P','HEAD').split()
          assert parents==[os.environ['SUBJECT'],os.environ['BASIS']]
          stub=Path('crates/ripr/src/app/test_stub.rs').read_text()
          assert 'rust_test_stub(&seam, None, source, Some(root))' in stub
          assert 'analysis::inventory_file_guidance_at_with_config(root, config, &relative)' in stub
          inv=Path('crates/ripr/src/analysis/seam_inventory.rs').read_text()
          assert 'file-guidance-v2-native' in inv and 'prepare_diff_scoped_classified_workspace_from_state' in inv
          (e/'identity.json').write_text(json.dumps({'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parents':parents,'controller':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(e/'candidate-source.tar.gz'),'HEAD',*sorted(expected)],check=True)
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(e/'basis-source.tar.gz'),os.environ['BASIS'],*[p for p in sorted(expected) if p not in {'changelog.d/11358-complete-stub-inventory-reuse.md','crates/ripr/src/analysis/file_guidance_inventory_tests.rs'}]],check=True)
          PY
          git cat-file commit HEAD > "$EVIDENCE/candidate.commit"
          git diff --binary "$BASIS" HEAD > "$EVIDENCE/candidate.patch"
          git diff --check "$BASIS" HEAD
          git status --porcelain > "$EVIDENCE/source-status.txt"
          test ! -s "$EVIDENCE/source-status.txt"
          cat > "$EVIDENCE/run.sh" <<'SH'
          run() {
            local name="$1"; shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"; printf '\n' >> "$EVIDENCE/$name.command"
            local code=0
            timeout --signal=TERM --kill-after=30s 1200s "$@" > "$EVIDENCE/$name.stdout" 2> "$EVIDENCE/$name.stderr" || code=$?
            echo "$name exit=$code" | tee -a "$EVIDENCE/status.txt"
            tail -n 20 "$EVIDENCE/$name.stdout"
            if [ "$code" != 0 ]; then tail -n 100 "$EVIDENCE/$name.stderr"; return "$code"; fi
          }
          SH
      - name: Retain the exact composed source before compilation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-composition-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/predicate-composition/
          if-no-files-found: error
          retention-days: 14
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'false'
      - name: Exercise composed guidance and existing consumers
        run: |
          set -euo pipefail
          source "$EVIDENCE/run.sh"
          rustc +1.95.0 -Vv > "$EVIDENCE/rustc.txt"
          run format cargo +1.95.0 fmt --all -- --check
          run guidance cargo +1.95.0 test --locked -p ripr --lib file_guidance_inventory_tests -- --nocapture --test-threads=8
          run stub cargo +1.95.0 test --locked -p ripr --lib app::test_stub -- --nocapture --test-threads=8
          run bound cargo +1.95.0 test --locked -p ripr --lib bound_seams -- --nocapture --test-threads=8
          run persisted cargo +1.95.0 test --locked -p ripr --lib seam_cache::scoped_inventory -- --nocapture --test-threads=8
          python3 - <<'PY'
          import os,re
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          for name,minimum in [('guidance',9),('stub',32),('bound',10),('persisted',6)]:
              text=(e/(name+'.stdout')).read_text()
              m=re.search(r'test result: ok\. (\d+) passed; 0 failed; 0 ignored;',text)
              assert m and int(m[1])>=minimum, (name,'missing or empty intended subjects')
          PY
          git diff --exit-code
      - name: Check actual body and applicable integration policy
        run: |
          set -euo pipefail
          source "$EVIDENCE/run.sh"
          run body cargo +1.95.0 run --locked -p xtask -- check-pr-shape --body-file "$EVIDENCE/pr-body.json"
          run precommit cargo +1.95.0 run --locked -p xtask -- precommit
          run clippy cargo +1.95.0 clippy --locked -p ripr --all-targets --all-features -- -D warnings
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Normally advance only the unchanged existing Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr-before-push.json"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); pr=json.loads((e/'pr-before-push.json').read_text()); identity=json.loads((e/'identity.json').read_text())
          assert pr['head']['sha']==os.environ['SUBJECT'] and pr['state']=='open' and pr['draft']
          assert 'merge-ready' not in [x['name'] for x in pr['labels']]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==identity['head']
          PY
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$DESTINATION" > "$EVIDENCE/push.stdout" 2> "$EVIDENCE/push.stderr"
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr-after.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); pr=json.loads((e/'pr-after.json').read_text()); identity=json.loads((e/'identity.json').read_text())
          assert pr['head']['sha']==identity['head'] and pr['state']=='open' and pr['draft']
          PY
          echo 'publish exit=0' >> "$EVIDENCE/status.txt"
      - name: Retain terminal proof without binaries or caches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-composition-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/predicate-composition/
            build/target/ripr/reports/
          if-no-files-found: error
          retention-days: 14
