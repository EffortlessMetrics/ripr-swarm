name: Predicate PR focused admission (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/predicate-pr-admission-proof.yml]
permissions:
  contents: write
  pull-requests: read
concurrency:
  group: ripr-11358-pr-admission
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUBJECT: df24c42a4e9fb8dedc5eb6268dc954468aa9a5f2
      INPUT: a7431a52d9a00e6a256be5ee2038ed1b5519f588
      REPAIR_BLOB: 3d9ef29167d7f20bccf092d0f259eb1a010c9293
      DESTINATION: codex/11358-complete-stub-inventory-reuse
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: build
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: df24c42a4e9fb8dedc5eb6268dc954468aa9a5f2
          path: build
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a7431a52d9a00e6a256be5ee2038ed1b5519f588
          path: subject
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'false'
      - name: Bind the existing Draft and exact repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/predicate-identity-proof"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test "$(git -C ../subject rev-parse HEAD)" = "$INPUT"
          test -z "$(git status --porcelain)"
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr.json"
          gh api repos/$GITHUB_REPOSITORY/git/blobs/$REPAIR_BLOB > "$EVIDENCE/repair-blob.json"
          python3 - <<'PY'
          import base64, json, os, shutil
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); pr=json.loads((e/'pr.json').read_text())
          assert pr['head']['sha']==os.environ['SUBJECT'] and pr['state']=='open' and pr['draft']
          assert pr['head']['ref']==os.environ['DESTINATION']
          blob=json.loads((e/'repair-blob.json').read_text())
          assert blob['sha']==os.environ['REPAIR_BLOB'] and blob['encoding']=='base64'
          (e/'repair.py').write_bytes(base64.b64decode(blob['content']))
          assert shutil.disk_usage('.').free>=18*1024**3, 'owned build capacity unavailable'
          PY
          test "$(git hash-object "$EVIDENCE/repair.py")" = "$REPAIR_BLOB"
          python3 -m py_compile "$EVIDENCE/repair.py"
          {
            printf 'subject=%s\ninput=%s\ncontroller=%s\nrun=%s\nattempt=%s\n' "$SUBJECT" "$INPUT" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD^{tree}
            rustc +1.95.0 -Vv
            nproc
            free -h
            df -h .
            printf 'Owner: this job; one target and separate subject. 13 GiB build allowance plus 5 GiB reserve. No unrelated cleanup. Evidence excludes binaries/caches; runner products are ephemeral.\n'
          } > "$EVIDENCE/identity.txt"
          cat > "$EVIDENCE/run.sh" <<'SH'
          run() {
            local name="$1"; shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"
            set +e
            timeout --signal=TERM --kill-after=30s 1200s "$@" > "$EVIDENCE/$name.stdout" 2> "$EVIDENCE/$name.stderr"
            local code=$?
            set -e
            echo "$name exit=$code" | tee -a "$EVIDENCE/status.txt"
            tail -n 20 "$EVIDENCE/$name.stdout"
            if [ "$code" != 0 ]; then tail -n 80 "$EVIDENCE/$name.stderr"; return "$code"; fi
          }
          SH
      - name: Prove the native-path alias on the unchanged key
        run: |
          set -euo pipefail
          python3 "$EVIDENCE/repair.py" tests
          cargo +1.95.0 fmt --all
          git diff --binary > "$EVIDENCE/red-stimulus.patch"
          printf '%s\n' 'cargo +1.95.0 test --locked -p ripr --lib complete_guidance_native_spellings_do_not_alias -- --nocapture' > "$EVIDENCE/red.command"
          set +e
          timeout --signal=TERM --kill-after=30s 1200s cargo +1.95.0 test --locked -p ripr --lib complete_guidance_native_spellings_do_not_alias -- --nocapture > "$EVIDENCE/red.stdout" 2> "$EVIDENCE/red.stderr"
          code=$?
          set -e
          echo "red exit=$code" | tee -a "$EVIDENCE/status.txt"
          test "$code" = 101
          grep -F 'distinct native path spellings must not alias' "$EVIDENCE/red.stderr"
          grep -F 'test result: FAILED. 0 passed; 1 failed; 0 ignored;' "$EVIDENCE/red.stdout"
      - name: Repair only the new identity and commit the exact candidate
        run: |
          set -euo pipefail
          python3 "$EVIDENCE/repair.py" fix
          cargo +1.95.0 fmt --all
          git diff --check
          git diff --name-only | sort > "$EVIDENCE/repair-paths.txt"
          printf '%s\n' crates/ripr/src/analysis/file_guidance_inventory_tests.rs crates/ripr/src/analysis/seam_inventory.rs > "$EVIDENCE/expected-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/repair-paths.txt"
          git diff --binary > "$EVIDENCE/repair.patch"
          git add crates/ripr/src/analysis/file_guidance_inventory_tests.rs crates/ripr/src/analysis/seam_inventory.rs
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(cache): preserve native path identity for file guidance (#11358)'
          git rev-parse HEAD > "$EVIDENCE/candidate.sha"
          git rev-parse HEAD^{tree} > "$EVIDENCE/candidate.tree"
          git cat-file commit HEAD > "$EVIDENCE/candidate.commit"
          test "$(git rev-parse HEAD^)" = "$SUBJECT"
      - name: Verify cache and consumer behavior with strict compilation
        run: |
          set -euo pipefail
          source "$EVIDENCE/run.sh"
          run format cargo +1.95.0 fmt --all -- --check
          run guidance cargo +1.95.0 test --locked -p ripr --lib file_guidance_inventory_tests -- --nocapture --test-threads=8
          grep -F 'test result: ok. 9 passed; 0 failed; 0 ignored;' "$EVIDENCE/guidance.stdout"
          run stub cargo +1.95.0 test --locked -p ripr --lib app::test_stub -- --nocapture --test-threads=8
          grep -F 'test result: ok. 32 passed; 0 failed; 0 ignored;' "$EVIDENCE/stub.stdout"
          run clippy cargo +1.95.0 clippy --locked -p ripr --all-targets --all-features -- -D warnings
          run build cargo +1.95.0 build --locked -p ripr --bin ripr
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Complete actual root-human cold-cache and new-process repeat
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, signal, subprocess, time
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); binary=Path('target/debug/ripr').resolve()
          subject=Path('../subject').resolve(); cache=Path(os.environ['RUNNER_TEMP'])/'predicate-identity-cache'
          assert not cache.exists()
          cache.mkdir()
          argv=[str(binary),'check','--root',str(subject),'--diff',str(subject/'crates/ripr/examples/sample/example.diff'),'--format','human','--legend']
          digest=hashlib.sha256(binary.read_bytes()).hexdigest(); rows=[]
          for repeat in range(2):
              start=time.perf_counter(); stopped=False
              out=e/f'human-{repeat}.stdout'; err=e/f'human-{repeat}.stderr'
              with out.open('wb') as stdout,err.open('wb') as stderr:
                  child=subprocess.Popen(argv,cwd=subject,env=dict(os.environ,RIPR_CACHE_DIR=str(cache),RIPR_REPO_EXPOSURE_LATENCY_TRACE='1'),stdout=stdout,stderr=stderr,start_new_session=True)
                  try: code=child.wait(timeout=240)
                  except subprocess.TimeoutExpired:
                      stopped=True; os.killpg(child.pid,signal.SIGTERM)
                      try: code=child.wait(timeout=3)
                      except subprocess.TimeoutExpired:
                          os.killpg(child.pid,signal.SIGKILL); code=child.wait()
              data=out.read_bytes(); trace=err.read_text(errors='replace')
              row=dict(repeat=repeat,seconds=time.perf_counter()-start,exit=code,external_stop=stopped,argv=argv,binary_sha256=digest,stdout_sha256=hashlib.sha256(data).hexdigest(),stdout_bytes=len(data),cache_condition='empty RIPR cache' if repeat==0 else 'repeat in new process',os_page_cache='uncontrolled')
              rows.append(row); (e/'measurements.json').write_text(json.dumps(rows,indent=2)+'\n');print(json.dumps(row),flush=True)
              assert code==0 and not stopped and len(data)==4792
              assert row['stdout_sha256']=='474b81093274b067dc498acef47b1f1036fb59c100686e310c095213f61210d4', 'inspect output drift; never rebless silently'
              if repeat==0: assert 'start_review_scope_files_' in trace
              else:
                  assert 'persisted_result_reused' in trace
                  assert 'start_review_scope_files_' not in trace
          PY
          git -C ../subject diff --exit-code
          git diff --exit-code
      - name: Normally advance only the existing Draft branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$DESTINATION --jq .object.sha)" = "$SUBJECT"
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/12008 --jq '.draft')" = true
          test -z "$(git status --porcelain)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$DESTINATION"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$DESTINATION --jq .object.sha)" = "$(git rev-parse HEAD)"
          echo 'published=true; normal required qualification and final review remain' | tee -a "$EVIDENCE/status.txt"
      - name: Retain bounded native source and proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-identity-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/predicate-identity-proof/*.txt
            ${{ runner.temp }}/predicate-identity-proof/*.json
            ${{ runner.temp }}/predicate-identity-proof/*.py
            ${{ runner.temp }}/predicate-identity-proof/*.sh
            ${{ runner.temp }}/predicate-identity-proof/*.sha
            ${{ runner.temp }}/predicate-identity-proof/*.tree
            ${{ runner.temp }}/predicate-identity-proof/*.commit
            ${{ runner.temp }}/predicate-identity-proof/*.patch
            ${{ runner.temp }}/predicate-identity-proof/*.command
            ${{ runner.temp }}/predicate-identity-proof/*.stdout
            ${{ runner.temp }}/predicate-identity-proof/*.stderr
          if-no-files-found: error
          retention-days: 14
