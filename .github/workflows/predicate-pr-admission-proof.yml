name: Predicate PR focused admission (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/predicate-pr-admission-proof.yml]
permissions:
  contents: write
  pull-requests: read
  actions: read
concurrency:
  group: ripr-11358-pr-admission
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUBJECT: b9f496383803b7010801a274e3b4e8cecf90bd47
      NATIVE: 10f040075b22f6d82268cc4b6f58781ce4091232
      BASIS: 9896777133d6e1beb6ac1ca28b5e772f7a150463
      DESTINATION: codex/11358-complete-stub-inventory-reuse
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: build
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: b9f496383803b7010801a274e3b4e8cecf90bd47
          path: build
          fetch-depth: 0
          persist-credentials: false
      - name: Recover the exact native-tested repair and fix only fixture spelling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/predicate-corpus-policy"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test -z "$(git status --porcelain)"
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr-before.json"
          gh api repos/$GITHUB_REPOSITORY/actions/artifacts/13140912841/zip > "$EVIDENCE/native-proof.zip"
          python3 - <<'PY'
          import json,os,hashlib,zipfile,shutil
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); pr=json.loads((e/'pr-before.json').read_text())
          assert pr['head']['sha']==os.environ['SUBJECT'] and pr['state']=='open' and pr['draft']
          assert pr['auto_merge'] is None and 'merge-ready' not in [x['name'] for x in pr['labels']]
          (e/'pr-body.json').write_text(json.dumps({'body':pr['body']})+'\n')
          data=(e/'native-proof.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='29476077643af1912ad701757a44df3d1745d9bc880886f9e25c652494dedbc4'
          with zipfile.ZipFile(e/'native-proof.zip') as z:
              for name in ['actual-repair.patch','candidate.commit','identity.json','run.sh']:
                  (e/('native-'+name)).write_bytes(z.read('_temp/predicate-corpus-repair/'+name))
          raw=(e/'native-candidate.commit').read_bytes()
          assert hashlib.sha1(b'commit '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==os.environ['NATIVE']
          assert shutil.disk_usage('.').free>=18*1024**3
          PY
          git apply --check "$EVIDENCE/native-actual-repair.patch"
          git apply "$EVIDENCE/native-actual-repair.patch"
          git add crates/ripr/src/analysis/seam_inventory.rs crates/ripr/src/analysis/file_guidance_inventory_tests.rs changelog.d/11358-complete-stub-inventory-reuse.md
          test "$(git write-tree)" = df0b6156f253cd97ac07d36d5915dbb4eb92770a
          test "$(git hash-object -t commit -w --stdin < "$EVIDENCE/native-candidate.commit")" = "$NATIVE"
          git reset --soft "$NATIVE"
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ripr/src/analysis/file_guidance_inventory_tests.rs'); s=p.read_text()
          old='Path::new(r"C:\\repo")'
          assert s.count(old)==1
          p.write_text(s.replace(old,'Path::new("fixture-root")'))
          PY
          git diff --check
          git diff > "$EVIDENCE/policy-fixture-repair.patch"
          git config user.name 'Steven Zimmerman'
          git config user.email '15812269+EffortlessSteven@users.noreply.github.com'
          git add crates/ripr/src/analysis/file_guidance_inventory_tests.rs
          git -c commit.gpgsign=false commit -m 'test(stub): use portable fixture root in corpus admission control (#11358)'
          git cat-file commit HEAD > "$EVIDENCE/candidate.commit"
          git diff --binary "$SUBJECT" HEAD > "$EVIDENCE/repair.patch"
          git diff --binary "$BASIS" HEAD > "$EVIDENCE/complete-candidate.patch"
          python3 - <<'PY'
          import os,json,subprocess
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); git=lambda *a: subprocess.check_output(['git',*a],text=True).strip()
          assert git('diff','--name-only',os.environ['NATIVE'],'HEAD')=='crates/ripr/src/analysis/file_guidance_inventory_tests.rs'
          assert git('show','-s','--format=%P','HEAD')==os.environ['NATIVE']
          paths=git('diff','--name-only',os.environ['BASIS'],'HEAD').splitlines()
          expected={'changelog.d/11358-complete-stub-inventory-reuse.md','crates/ripr/src/analysis/file_guidance_inventory_tests.rs','crates/ripr/src/analysis/mod.rs','crates/ripr/src/analysis/seam_inventory.rs','crates/ripr/src/app/test_stub.rs','crates/ripr/src/app/test_stub_inventory_tests.rs'}
          assert set(paths)==expected
          (e/'identity.json').write_text(json.dumps({'head':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'parent':os.environ['NATIVE'],'published_parent':os.environ['SUBJECT'],'basis':os.environ['BASIS'],'controller':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          subprocess.run(['git','archive','--format=tar.gz','--output='+str(e/'candidate-source.tar.gz'),'HEAD',*sorted(expected)],check=True)
          PY
          test -z "$(git status --porcelain)"
      - name: Retain the prepared source before policy execution
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-corpus-policy-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/predicate-corpus-policy/
          if-no-files-found: error
          retention-days: 14
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'false'
      - name: Prove the policy repair and complete the outstanding strict checks
        run: |
          set -euo pipefail
          source "$EVIDENCE/native-run.sh"
          rustc +1.95.0 -Vv > "$EVIDENCE/rustc.txt"
          run format cargo +1.95.0 fmt --all -- --check
          run local-context cargo +1.95.0 run --locked -p xtask -- check-local-context
          run body cargo +1.95.0 run --locked -p xtask -- check-pr-shape --body-file "$EVIDENCE/pr-body.json"
          run precommit cargo +1.95.0 run --locked -p xtask -- precommit
          run clippy cargo +1.95.0 clippy --locked -p ripr --all-targets --all-features -- -D warnings
          test -z "$(git status --porcelain)"
      - name: Normally publish only this unchanged existing Draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr-before-push.json"
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); pr=json.loads((e/'pr-before-push.json').read_text()); identity=json.loads((e/'identity.json').read_text())
          assert pr['head']['sha']==os.environ['SUBJECT'] and pr['state']=='open' and pr['draft']
          assert pr['auto_merge'] is None and 'merge-ready' not in [x['name'] for x in pr['labels']]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==identity['head']
          PY
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$DESTINATION" > "$EVIDENCE/push.stdout" 2> "$EVIDENCE/push.stderr"
          echo 'push exit=0' >> "$EVIDENCE/status.txt"
          gh api repos/$GITHUB_REPOSITORY/git/ref/heads/$DESTINATION > "$EVIDENCE/branch-after.json"
          gh api repos/$GITHUB_REPOSITORY/pulls/12008 > "$EVIDENCE/pr-after.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); identity=json.loads((e/'identity.json').read_text()); branch=json.loads((e/'branch-after.json').read_text()); pr=json.loads((e/'pr-after.json').read_text())
          with (e/'status.txt').open('a') as f: f.write(f'publication_observation expected={identity["head"]} branch={branch["object"]["sha"]} pr={pr["head"]["sha"]}\n')
          assert branch['object']['sha']==identity['head'], 'successful push requires readback reconciliation, never a blind repeat'
          assert pr['state']=='open' and pr['draft']
          PY
      - name: Retain complete source and terminal observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-corpus-policy-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/predicate-corpus-policy/
            build/target/ripr/reports/
          if-no-files-found: error
          retention-days: 14
