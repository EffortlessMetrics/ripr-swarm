name: One-shot format analysis outcome contract

on:
  push:
    branches:
      - codex/analysis-outcome-contract-2827

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/analysis-outcome-contract-2827
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: stable
          components: rustfmt

      - name: Format source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm .github/workflows/one-shot-format-analysis-outcome.yml
          git add crates/ripr/src/analysis_outcome.rs crates/ripr/src/lib.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(fmt): normalize analysis outcome contract'
          git push origin HEAD:codex/analysis-outcome-contract-2827
