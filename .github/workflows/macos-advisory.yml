name: macOS Advisory

on:
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only a `merge-ready` labeled request shares this group, so a re-applied label
# supersedes the older run for the same PR. Every other pull_request event
# (opened, synchronize, reopened, other labels) gets a unique group: its jobs
# are skipped and it can neither cancel nor replace a pending merge-ready run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'merge-ready')) && github.run_id || 'run' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready') }}

# Advisory native macOS lane (#8391).
#
# CI had no macOS cargo clippy or test lane. The only macOS jobs built and
# archived the server or pasted printed commands, so `cfg(target_os = "linux")`
# gating (dead code or unexercised branches on macOS, #8055/#8060), `/var` ->
# `/private/var` temp directories, and APFS case/normalization behavior had a
# standing signal only when a maintainer ran a native macOS build by hand.
#
# Contract, mirroring `windows-advisory.yml`:
#
#   - **Clippy and test outcomes are advisory.** A lint or test failure is shown
#     in the job summary and does not fail the job or gate merges.
#   - **Evidence generation is not advisory.** A missing log or exit status, or a
#     test run that executed zero tests, fails the job. A lane that reports
#     success while proving nothing is a false-confidence surface.
#
# Not a required check. Do not promote it to required until the first runs show
# which macOS-only failures are real and the lane is stable.
#
# Triggers:
#   - schedule: a daily standing signal independent of PR traffic.
#   - workflow_dispatch: manual run.
#   - pull_request: only when the `merge-ready` label is applied (the per-head
#     request from the merge-ready label flow, #4984/#8327; a later push does not
#     rerun it, re-apply the label) AND the PR carries `macos-ci` or `full-ci`.
#     Add `macos-ci` first, then `merge-ready` last. The guard below uses the
#     same shape as the other gated lanes so the two compose.
#
# What runs, one check per job so each has the whole job budget:
#   - `cargo clippy -p ripr -p xtask --all-targets -- -D warnings`
#   - `cargo test -p ripr --lib`
# As steps of one job they did not fit it: on 2026-11-21 (run 44873192116)
# clippy finished after 24 minutes and the library test build was still
# compiling when the 40-minute limit cancelled the job, as on every night
# from 2026-11-12. A cancelled job also skips its cache save, so no later
# night started any warmer. The limit is unchanged; each job now carries
# part of the work. Clippy fits (25 to 30 minutes cold). The library tests
# did not fit as one job either: the `ripr` test build alone takes about 30
# minutes and the tests about 14, and a dependency cache saves one minute of
# that. So the build and the run are separate jobs: `lib-build` compiles the
# test executable and hands it over as an artifact, `macos-advisory-lib-tests`
# runs that executable. Both hosted jobs check out to the same path, so the
# paths compiled into the executable hold in the second job.
# The integration suites (cli_smoke, portable_consumer*, mcp_stdio) are not run
# here; the TMPDIR-symlink experiment from #8391 is separate follow-up.

jobs:
  macos-advisory:
    name: macos-advisory-${{ matrix.check }}
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos-ci') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, lib-build]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95
        with:
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Per check: a clippy build and a test build share few artifacts,
          # and two jobs saving one key would keep whichever saved first.
          shared-key: ripr-macos-advisory-1.95-${{ matrix.check }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Record host
        shell: bash
        run: |
          uname -a
          sw_vers
          rustc --version
          cargo --version

      # 34 minutes, under the 40-minute job limit: a step that hits its own
      # deadline fails the job as missing evidence and still uploads its log.
      - name: Clippy (advisory outcome)
        if: matrix.check == 'clippy'
        timeout-minutes: 34
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-advisory"
          set +e
          cargo clippy -p ripr -p xtask --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/macos-advisory/clippy.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/macos-advisory/clippy.status"
          exit 0

      # This job only builds, so the step may use the job's 40 minutes less
      # setup and upload. The one `rustc` needs about 14 GB on a 7 GB runner;
      # observed builds took 28 to over 34 minutes.
      - name: Build the library test executable (advisory outcome)
        if: matrix.check == 'lib-build'
        timeout-minutes: 37
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-advisory" "$RUNNER_TEMP/macos-lib-binary"
          set +e
          cargo test -p ripr --lib --no-run 2>&1 | tee "$RUNNER_TEMP/macos-advisory/lib-build.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/macos-advisory/lib-build.status"
          # Cargo names the one executable it built for `--lib`:
          # `Executable unittests src/lib.rs (target/debug/deps/ripr-<hash>)`.
          # The hosted log colors the word `Executable`, so the pattern does
          # not anchor on the start of the line.
          exe=$(sed -n 's/^.*Executable.* unittests src\/lib\.rs (\(.*\))$/\1/p' "$RUNNER_TEMP/macos-advisory/lib-build.log" | tail -n 1)
          if [ -n "$exe" ] && [ -f "$exe" ]; then
            cp "$exe" "$RUNNER_TEMP/macos-lib-binary/ripr-lib-tests"
          fi
          exit 0

      - name: Summarize and enforce clippy evidence
        if: matrix.check == 'clippy'
        shell: bash
        run: |
          d="$RUNNER_TEMP/macos-advisory"
          missing=0
          for f in clippy.log clippy.status; do
            if [ ! -s "$d/$f" ]; then
              echo "::error::missing evidence file $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          {
            echo "## macOS advisory"
            echo
            echo "| Check | Exit status | Detail |"
            echo "| --- | --- | --- |"
            echo "| clippy -p ripr -p xtask --all-targets | $(cat "$d/clippy.status") | advisory |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize and enforce library build evidence
        if: matrix.check == 'lib-build'
        shell: bash
        run: |
          d="$RUNNER_TEMP/macos-advisory"
          missing=0
          for f in lib-build.log lib-build.status; do
            if [ ! -s "$d/$f" ]; then
              echo "::error::missing evidence file $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          {
            echo "## macOS advisory"
            echo
            echo "| Check | Exit status | Detail |"
            echo "| --- | --- | --- |"
            echo "| test -p ripr --lib --no-run | $(cat "$d/lib-build.status") | builds the executable the library test job runs |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ ! -s "$RUNNER_TEMP/macos-lib-binary/ripr-lib-tests" ]; then
            echo "::error::the library test executable was not built; the library test job has nothing to run"
            exit 1
          fi

      - name: Hand over the library test executable
        if: matrix.check == 'lib-build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-advisory-lib-test-binary
          path: ${{ runner.temp }}/macos-lib-binary/ripr-lib-tests
          if-no-files-found: error
          retention-days: 1

      - name: Upload macOS advisory logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-advisory-logs-${{ matrix.check }}
          path: ${{ runner.temp }}/macos-advisory/
          if-no-files-found: ignore
          retention-days: 14

  # The library tests, run from the executable `lib-build` compiled. This is
  # the same test binary `cargo test -p ripr --lib` would run, started the way
  # Cargo starts it: from the package directory with `CARGO_MANIFEST_DIR` set.
  macos-advisory-lib-tests:
    name: macos-advisory-lib-tests
    needs: macos-advisory
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'macos-ci') || contains(github.event.pull_request.labels.*.name, 'full-ci')) }}
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Tests start `cargo` and `rustc` on fixture workspaces.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95

      - name: Record host
        shell: bash
        run: |
          uname -a
          sw_vers
          rustc --version
          cargo --version

      # This job compiles nothing, so its Cargo home starts empty; tests that
      # resolve the workspace's own locked versions offline need them fetched.
      - name: Prepare locked workspace dependencies
        run: cargo fetch --locked

      - name: Prepare locked fallible-literal owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml

      - name: Prepare locked JSON owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml

      - name: Prepare locked proptest profile dependencies
        run: cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      # No `continue-on-error`: without the executable there is no evidence,
      # and the job says so by failing here.
      - name: Fetch the library test executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-advisory-lib-test-binary
          path: ${{ runner.temp }}/macos-lib-binary

      - name: Library tests (advisory outcome)
        timeout-minutes: 34
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/macos-advisory"
          chmod +x "$RUNNER_TEMP/macos-lib-binary/ripr-lib-tests"
          export CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/crates/ripr"
          export CARGO="$(command -v cargo)"
          # `.cargo/config.toml` `[env]` points the temp directory at `target`.
          mkdir -p "$GITHUB_WORKSPACE/target"
          export TEMP="$GITHUB_WORKSPACE/target" TMP="$GITHUB_WORKSPACE/target" TMPDIR="$GITHUB_WORKSPACE/target"
          cd "$CARGO_MANIFEST_DIR"
          set +e
          "$RUNNER_TEMP/macos-lib-binary/ripr-lib-tests" 2>&1 | tee "$RUNNER_TEMP/macos-advisory/lib-tests.log"
          echo "${PIPESTATUS[0]}" > "$RUNNER_TEMP/macos-advisory/lib-tests.status"
          exit 0

      - name: Summarize and enforce library test evidence
        shell: bash
        run: |
          d="$RUNNER_TEMP/macos-advisory"
          missing=0
          for f in lib-tests.log lib-tests.status; do
            if [ ! -s "$d/$f" ]; then
              echo "::error::missing evidence file $f"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          tests=$(cat "$d/lib-tests.status")
          # Tests print nested lines; the suite owns the first `running` and the last result.
          expected=$(sed -n 's/^running \([0-9]*\) tests\{0,1\}$/\1/p' "$d/lib-tests.log" | head -n 1)
          result=$(grep -E '^test result:' "$d/lib-tests.log" | tail -n 1 || true)
          counts=$(printf '%s' "$result" | sed -n 's/^test result: [a-zA-Z]*\. \([0-9]*\) passed; \([0-9]*\) failed; \([0-9]*\) ignored; .*/\1 \2 \3/p')
          read -r passed failed ignored <<< "${counts:-0 0 0}"
          {
            echo "## macOS advisory"
            echo
            echo "| Check | Exit status | Detail |"
            echo "| --- | --- | --- |"
            echo "| ripr library test executable | $tests | ${result:-no test result line} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$expected" ] || [ "$passed" -eq 0 ] || [ "$((passed + failed + ignored))" -ne "$expected" ]; then
            echo "::error::macOS library test run did not finish the ${expected:-unknown} tests it started (last result: ${result:-none}); evidence is not established"
            exit 1
          fi

      - name: Upload macOS advisory logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-advisory-logs-lib-tests
          path: ${{ runner.temp }}/macos-advisory/
          if-no-files-found: ignore
          retention-days: 14
