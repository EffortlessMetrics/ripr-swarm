name: Zed extension

# Checks format and Clippy for the Zed extension (editors/zed, #4460), builds
# it to the WebAssembly target Zed compiles it with, and runs its unit tests.
# Only changes to the extension or this workflow trigger it: the extension has
# its own Cargo workspace, lockfile, and toolchain pin.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "editors/zed/**"
      - ".github/workflows/zed-extension.yml"
  push:
    branches: [main, master]
    paths:
      - "editors/zed/**"
      - ".github/workflows/zed-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

# Only a `merge-ready` labeled request shares this group, so a re-applied label
# supersedes the older run for the same PR. Every other pull_request event
# (opened, synchronize, reopened, other labels) gets a unique group: its jobs
# are skipped and it can neither cancel nor replace a pending merge-ready run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'merge-ready')) && github.run_id || 'run' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready') }}

jobs:
  zed-extension:
    name: Build Zed extension
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: editors/zed
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --target wasm32-wasip2 --all-targets -- -D warnings
      - run: cargo build --locked --release --target wasm32-wasip2
      - run: cargo test --locked
