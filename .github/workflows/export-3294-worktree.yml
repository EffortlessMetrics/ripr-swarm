name: Export exact main worktree for issue 3294

on:
  push:
    branches:
      - control/3294-export-main

permissions:
  contents: read

concurrency:
  group: export-3294-worktree
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 6a15d4125bf12e16c7fe58d7e8e448805ce88f6e
          fetch-depth: 1
          persist-credentials: false
          path: repo

      - name: Archive exact worktree
        shell: bash
        run: tar --exclude=.git -C repo -czf ripr-swarm-6a15d412.tar.gz .

      - name: Upload exact worktree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-swarm-main-6a15d412
          path: ripr-swarm-6a15d412.tar.gz
          if-no-files-found: error
          retention-days: 1
