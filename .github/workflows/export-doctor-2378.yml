name: Export #2378 doctor source

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/doctor-timeout-atomic-shim-2378'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the claimed branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Upload doctor source without mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-2378-source
          path: crates/ripr/src/output/doctor.rs
          if-no-files-found: error
          retention-days: 1
