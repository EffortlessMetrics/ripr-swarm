name: Apply #2378 atomic doctor fixture patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-2378-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/doctor-timeout-atomic-shim-2378'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exclusively claimed implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/doctor-timeout-atomic-shim-2378
          fetch-depth: 0
          persist-credentials: true
      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Verify the exclusive writer revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "84cddd8e3b3c20093a95de10f6974cfe64f1e798"
          test "$(git branch --show-current)" = "fix/doctor-timeout-atomic-shim-2378"
      - name: Apply and format the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/2378.patch
          git apply .github/patches/2378.patch
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/ripr/src/output/doctor.rs"
      - name: Prove immediate execution after atomic publication
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ripr --lib \
            output::doctor::tests::doctor_test_tool_is_closed_before_its_executable_path_is_published \
            -- --exact --test-threads=1
      - name: Repeat the 100-attempt timeout witness
        shell: bash
        run: |
          set -euo pipefail
          for pass in 1 2 3
          do
            echo "stress pass ${pass}"
            cargo test -p ripr --lib \
              output::doctor::tests::doctor_tool_check_times_out_a_hanging_tool_100_times \
              -- --exact --test-threads=8
          done
      - name: Run doctor tests under normal parallelism
        id: doctor_parallel
        shell: bash
        run: |
          set -o pipefail
          cargo test -p ripr --lib output::doctor::tests -- --test-threads=8 \
            2>&1 | tee doctor-parallel.log
      - name: Upload doctor parallel transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doctor-parallel-${{ github.run_id }}
          path: doctor-parallel.log
          if-no-files-found: warn
          retention-days: 1
      - name: Commit only the doctor test-harness correction
        if: steps.doctor_parallel.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git add crates/ripr/src/output/doctor.rs
          git rm .github/workflows/export-doctor-2378.yml .github/patches/2378.patch
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/src/output/doctor.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/export-doctor-2378.yml
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/patches/2378.patch
          git diff --cached --check
          git -c user.name='RIPR release operator' \
              -c user.email='release-operator@example.invalid' \
              -c commit.gpgSign=false \
              commit -m 'test(doctor): publish timeout shims atomically (#2378)'
          git push origin HEAD:refs/heads/fix/doctor-timeout-atomic-shim-2378
