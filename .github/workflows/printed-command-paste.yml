name: Printed Command Paste

on:
  workflow_call:
    inputs:
      proof_profile:
        type: string
        required: true
      request_id:
        type: string
        required: true
      head_sha:
        type: string
        required: true
      base_sha:
        type: string
        required: true
      subject_sha:
        type: string
        required: true
      subject_tree:
        type: string
        required: true
      workflow_generation:
        type: string
        required: true
  schedule:
    - cron: "43 5 * * *"
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "crates/ripr/src/**"
      - "crates/ripr/tests/printed_command_paste.rs"
      - "crates/ripr/tests/common/paste_shell.rs"
      - "crates/ripr/tests/common/fixture_git.rs"
      - ".github/workflows/printed-command-paste.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

# Only a `merge-ready` labeled request shares this group, so a re-applied label
# supersedes the older run for the same PR. Every other pull_request event
# (opened, synchronize, reopened, other labels) gets a unique group: its jobs
# are skipped and it can neither cancel nor replace a pending merge-ready run.
concurrency:
  group: printed-command-paste-${{ inputs.request_id || github.event.pull_request.number || github.ref }}-${{ inputs.subject_sha || ((github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'merge-ready')) && github.run_id || 'run') }}
  cancel-in-progress: ${{ !contains(toJSON(inputs), '"subject_sha"') && (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready') }}

# Every command ripr prints, pasted into every shell a user has (#5188, #5232,
# #5247, #5269 each fixed one surface by hand).
#
# `printed_command_paste` runs the main ripr flows against a repository whose
# root and source file names hold spaces, apostrophes, typographic quotes,
# backticks, `$` and `;` payloads and non-ASCII text, lifts every command out
# of the output (text, Markdown, JSON and the artifacts ripr writes), and pastes
# each into the shells below from a foreign working directory. The `ripr` and
# `git` the shell finds are argv recorders, so a split, a mis-parse, a second
# command or a wrong `--root` fails the job without running an analysis per
# command.
#
#   ubuntu-latest   bash, sh (dash), zsh, PowerShell 7
#   macos-latest    bash 3.2, sh, zsh, PowerShell 7
#   windows-latest  Git Bash, PowerShell 7, Windows PowerShell 5.1
#
# A shell named in the matrix `shells` that is missing fails the job, because
# a lane that silently drops a shell proves nothing about it. Elsewhere (the
# required Rust lane runs this test too) a missing shell is reported and
# skipped. Known gaps are listed, with the surface and the reason, in
# KNOWN_GAPS in the test; a listed gap that stops reproducing fails the job
# until its row is deleted.
#
# Triggers: a nightly standing signal, pull requests that touch the code that
# prints commands or the harness itself, and manual dispatch. The cost is one
# test target per platform, built from the shared dependency cache.
# The callable route is staged for #4987: keep the PR trigger until the parent
# integrates an admitted caller and fail-closed result aggregation. Inputs bind
# the source; the trusted caller alone owns review/admission authorization.

jobs:
  paste:
    name: paste-${{ matrix.os }}
    if: contains(toJSON(inputs), '"subject_sha"') || github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shells: bash,sh,zsh,pwsh
          - os: macos-latest
            shells: bash,sh,zsh,pwsh
          - os: windows-latest
            shells: bash,pwsh,powershell

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.subject_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source before product execution
        shell: bash
        env:
          CALLED: ${{ contains(toJSON(inputs), '"subject_sha"') }}
          PROFILE: ${{ inputs.proof_profile }}
          REQUEST: ${{ inputs.request_id }}
          HEAD_SHA: ${{ inputs.head_sha }}
          BASE_SHA: ${{ inputs.base_sha }}
          SUBJECT: ${{ inputs.subject_sha || github.sha }}
          TREE: ${{ inputs.subject_tree }}
          GENERATION: ${{ inputs.workflow_generation }}
        run: |
          set -euo pipefail
          fail() { echo "$1" >&2; exit 1; }
          [[ "$SUBJECT" =~ ^[0-9a-f]{40}$ ]] || fail 'Malformed source identity'
          actual=$(git rev-parse HEAD)
          [[ "$actual" == "$SUBJECT" ]] || fail 'Wrong source checkout'
          if [[ "$CALLED" == true ]]; then
            [[ "$PROFILE" == qualification ]] || fail 'Unknown admitted profile'
            [[ "$REQUEST" =~ ^[0-9]+-[0-9]+$ ]] || fail 'Malformed request identity'
            for value in "$HEAD_SHA" "$BASE_SHA" "$TREE" "$GENERATION"; do
              [[ "$value" =~ ^[0-9a-f]{40}$ ]] || fail 'Malformed admission identity'
            done
            [[ "$GITHUB_WORKFLOW_SHA" == "$GENERATION" ]] || fail 'Wrong workflow generation'
            actual_tree=$(git rev-parse 'HEAD^{tree}')
            [[ "$actual_tree" == "$TREE" ]] || fail 'Wrong integration tree'
            parents=$(git show -s --format=%P HEAD)
            [[ "$parents" == "$BASE_SHA $HEAD_SHA" ]] || fail 'Wrong integration parents'
          else
            case "$GITHUB_EVENT_NAME" in
              pull_request|schedule|workflow_dispatch) ;;
              *) fail 'Unsupported standalone event' ;;
            esac
          fi

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-printed-command-paste-1.95-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Ubuntu runner image ships bash, dash and PowerShell 7 but not zsh.
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get install -y zsh

      - name: Record shells
        shell: bash
        run: bash --version | head -n 1

      - name: Paste every printed command into every shell
        shell: bash
        env:
          RIPR_PASTE_REQUIRE: ${{ matrix.shells }}
          RIPR_PASTE_REPORT: ${{ runner.temp }}/printed-commands.jsonl
        run: cargo test -p ripr --test printed_command_paste -- --nocapture

      - name: Upload printed-command report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: printed-commands-${{ matrix.os }}
          path: ${{ runner.temp }}/printed-commands.jsonl
          if-no-files-found: ignore
