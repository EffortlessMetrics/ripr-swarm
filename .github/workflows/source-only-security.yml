# SOURCE-ONLY WORKFLOW (policy/source-only-workflows.toml).
# Origin: EffortlessMetrics/ripr `.github/workflows/security.yml` at 4bfb2ea14d.
# Produces public ripr's required contexts `cargo-deny` and
# `dependency-review`. Every job is guarded to EffortlessMetrics/ripr; swarm's
# own dependency scan stays in `security.yml` (schedule/dispatch).
# Dispatching with rehearse_in_swarm: true runs the source jobs on swarm's
# tree as a pre-promotion rehearsal.
# Phase 1 (this file): dispatch-only. Phase 2, after the workflow is disabled
# in ripr-swarm, restores the source triggers recorded in the ledger:
#   pull_request, push to main/master.
name: Source-only Security

on:
  workflow_dispatch:
    inputs:
      rehearse_in_swarm:
        description: "Run the source jobs on this repository's dispatched ref as a pre-promotion rehearsal (source-only workflow; see policy/source-only-workflows.toml)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  cargo-deny:
    if: (github.repository == 'EffortlessMetrics/ripr' || (github.event_name == 'workflow_dispatch' && inputs.rehearse_in_swarm))
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # cargo-deny
        with:
          tool: cargo-deny

      - run: cargo-deny check advisories licenses bans sources

  dependency-review:
    name: dependency-review
    if: (github.repository == 'EffortlessMetrics/ripr' || (github.event_name == 'workflow_dispatch' && inputs.rehearse_in_swarm)) && (github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # TODO: upgrade when GitHub publishes a Node-24-backed Dependency Review
      # release. v4 remains the official hard security gate for dependency diffs.
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0
