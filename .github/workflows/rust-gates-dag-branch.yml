# Generated by cargo xtask product-gate-dag project; do not edit.
# Inactive projection; no development/dispatch trigger and no active caller.
name: Staged Rust DAG branch
on:
  workflow_call:
    inputs:
      proof-profile:
        type: string
        required: false
        default: legacy
      head-sha:
        type: string
        required: false
        default: ""
      base-sha:
        type: string
        required: false
        default: ""
      subject-sha:
        type: string
        required: false
        default: ""
      subject-tree:
        type: string
        required: false
        default: ""
      workflow-generation:
        type: string
        required: false
        default: ""
      subject-json:
        type: string
        required: false
        default: ""
      subject-identity:
        type: string
        required: false
        default: ""
      constituent-pr-number:
        description: Caller-supplied trusted PR number of the single admitted constituent (qualification profile only).
        type: string
        required: false
        default: ""
      constituent-pr-node-id:
        description: Caller-supplied trusted PR node id of the single admitted constituent (qualification profile only).
        type: string
        required: false
        default: ""
      constituent-head-sha:
        description: Caller-supplied trusted exact head H of the admitted constituent; must equal head-sha.
        type: string
        required: false
        default: ""
      runner-config:
        description: JSON string or object accepted by jobs.<job_id>.runs-on.
        required: true
        type: string
      cargo-build-jobs:
        description: Parallel Cargo build jobs for the selected runner.
        required: false
        default: "8"
        type: string
      disk-guard-threshold:
        description: Minimum free GiB required on self-hosted scratch.
        required: false
        default: 35
        type: number
      use-scratch:
        description: Configure self-hosted scratch and sccache.
        required: false
        default: true
        type: boolean
      artifact-name:
        description: Name for the optional RIPR evidence artifact.
        required: true
        type: string
      job-timeout-minutes:
        description: Hard deadline for the implementation job.
        required: false
        default: 60
        type: number
      run-advisory-reports:
        description: Generate broad advisory report families after required proof passes.
        required: false
        default: false
        type: boolean
      upload-success-artifacts:
        description: Upload report artifacts after a successful run.
        required: false
        default: false
        type: boolean
      pr-labels:
        description: Comma-separated labels of the queued PR (merge_group events carry none).
        required: false
        default: ''
        type: string
      test-shards:
        description: >-
          1 runs the required nextest step in this job. 4 leaves it to
          rust-test-shards.yml, which the caller must run after this job passes (#10507).
        required: false
        default: 1
        type: number
      admission-reason:
        description: >-
          The candidate admission reason. Only `history_sync_admitted` on a
          pull_request whose head equals admission-head changes anything: the
          diff-scoped PR evidence is then recorded not_applicable (#12437).
        required: false
        default: ''
        type: string
      admission-head:
        description: The exact PR head the admission bound.
        required: false
        default: ''
        type: string
      history-sync-source:
        description: Validated history-sync source as owner/repo@sha (#12437).
        required: false
        default: ''
        type: string
      history-sync-base:
        description: Validated history-sync destination base sha (#12437).
        required: false
        default: ''
        type: string
      branch:
        type: string
        required: true
      request-id:
        type: string
        required: true

permissions:
  contents: read
jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_TERM_COLOR: always
      RIPR_DAG_SUBJECT: ${{ inputs.subject-json }}
    steps:
      - name: Start branch clock
        id: clock
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.subject-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.base-sha }}
          path: controller
          persist-credentials: false
      - name: Verify native caller subject using trusted base action
        id: admitted
        uses: ./controller/.github/actions/verify-merge-group-subject
        with:
          head-sha: ${{ inputs.head-sha }}
          base-sha: ${{ inputs.base-sha }}
          subject-sha: ${{ inputs.subject-sha }}
          subject-tree: ${{ inputs.subject-tree }}
          workflow-generation: ${{ inputs.workflow-generation }}
          request-id: ${{ inputs.request-id }}
          expected-subject-json: ${{ inputs.subject-json }}
          expected-subject-identity: ${{ inputs.subject-identity }}
          require-caller-receipt: 'true'
          constituent-pr-number: ${{ inputs.constituent-pr-number }}
          constituent-pr-node-id: ${{ inputs.constituent-pr-node-id }}
          constituent-head-sha: ${{ inputs.head-sha }}
      - name: Refuse unaccepted controller and configuration transitions
        env:
          BASE: ${{ inputs.base-sha }}
          SCRATCH: ${{ inputs.use-scratch }}
          SHARDS: ${{ inputs.test-shards }}
          ADMISSION_REASON: ${{ inputs.admission-reason }}
        run: |
          set -euo pipefail
          test "$SCRATCH" = false && test "$SHARDS" = 1 && test -z "$ADMISSION_REASON"
          git diff --exit-code "$BASE" HEAD -- xtask tools/repo-policy .github .cargo .config policy Cargo.toml Cargo.lock rust-toolchain.toml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: rust-dag-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dag
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Compile trusted base controller in private state
        working-directory: controller
        run: |
          mkdir -p target
          cargo build --locked -p repo-policy --bin repo-policy --target-dir "$RUNNER_TEMP/rust-dag-controller-target"
      - name: Verify immutable plan before allocating producer commands
        id: verify_plan
        run: '"$RUNNER_TEMP/rust-dag-controller-target/debug/repo-policy" product-gate-dag verify .dag/plan.json'
      - name: Install CI tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ${{ inputs.use-scratch && 'sccache,nextest' || 'nextest' }}

      - name: Restore hosted Rust cache
        if: ${{ !inputs.use-scratch }}
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ripr-swarm-rust-small-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      - name: Prepare independent user-text base
        if: ${{ inputs.branch == 'base_matcher' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        # Prepares the exact first-parent base before running its policy matcher.
        # These two short steps preserve the check-workflows per-block line bound.
        run: |
          set -euo pipefail
          base_sha="$(git rev-parse HEAD^1)"
          base_tree="$RUNNER_TEMP/user-text-base"
          git worktree add --detach "$base_tree" "$base_sha"

      - name: Recover pinned base compiler arity if needed
        if: ${{ inputs.branch == 'base_matcher' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        run: |
          set -euo pipefail
          base_tree="$RUNNER_TEMP/user-text-base"
          base_sha="$(git -C "$base_tree" rev-parse HEAD)"
          old_stub_blob="$(git -C "$base_tree" rev-parse "HEAD:crates/ripr/src/app/test_stub.rs")"
          if test "$old_stub_blob" = "41ce81981802365b31e5182b7a7a51540ff8d7be"; then
            python3 - "$base_tree/crates/ripr/src/app/test_stub.rs" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          source = path.read_text(encoding="utf-8")
          replacements = [
              ("fn return_value_direct_at_probe_line(\n", "fn return_value_direct_at_probe_line(\n    root: &Path,\n"),
              ("rust_test_stub(&seam, None, source);", "rust_test_stub(&seam, None, source, Some(root));"),
              ("return_value_direct_at_probe_line(&in_file, file, line, &source)", "return_value_direct_at_probe_line(root, &in_file, file, line, &source)"),
          ]
          for before, after in replacements:
              if source.count(before) != 1:
                  raise SystemExit("pinned base compiler recovery has an unexpected source shape")
              source = source.replace(before, after, 1)
          path.write_text(source, encoding="utf-8")
          PY
            fixed_stub_blob="$(git -C "$base_tree" hash-object crates/ripr/src/app/test_stub.rs)"
            test "$fixed_stub_blob" = "e934320980555de2d431b2aa8482a6059e9cf7f7"
            test "$(git -C "$base_tree" diff --name-only)" = "crates/ripr/src/app/test_stub.rs"
            echo "::notice::base $base_sha recovered only the exact #12466 compiler-arity blob ($old_stub_blob -> $fixed_stub_blob); original user-text matcher remains authoritative"
          fi

      - name: User-text goldens judged by the merge-base matcher
        if: ${{ inputs.branch == 'base_matcher' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        id: base_user_text
        # The PR's goldens are judged by the original matcher at the merge base,
        # so the PR cannot qualify a weakened version of its own gate (#11385).
        run: |
          set -euo pipefail
          base_tree="$RUNNER_TEMP/user-text-base"
          base_sha="$(git -C "$base_tree" rev-parse HEAD)"
          if ! grep -q -- '"--tree"' "$base_tree/xtask/src/policy/user_text.rs"; then
            echo "::notice::merge-base $base_sha cannot judge another tree yet; matcher pin only"
            exit 0
          fi
          cd "$base_tree"
          cargo xtask check-user-text --tree "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"

      - name: Prepare default workspace before native policy inventory
        if: ${{ inputs.branch == 'tests' && (success()) }}
        id: workspace_preparation
        run: cargo test --no-run --locked --workspace
      - name: Repository policy preflight
        if: ${{ inputs.branch == 'tests' && (success()) }}
        id: precommit
        env:
          RIPR_POLICY_PREFLIGHT_RECEIPT: target/ripr/reports/policy-preflight.json
        run: cargo xtask ci-policy

      - name: Evidence promotion honesty
        if: ${{ inputs.branch == 'corpus' && (success()) }}
        id: promotion_honesty
        run: cargo xtask check-evidence-promotion-honesty

      - name: Dependency policy
        if: ${{ inputs.branch == 'policy' && (success()) }}
        id: dependencies
        run: cargo xtask check-dependencies

      - name: Process policy
        if: ${{ inputs.branch == 'policy' && (success()) }}
        id: process_policy
        run: cargo xtask check-process-policy

      - name: Network policy
        if: ${{ inputs.branch == 'policy' && (success()) }}
        id: network_policy
        run: cargo xtask check-network-policy

      # Feature-gated test modules (lang-perl and other previews) compile only
      # under their features; without this step two green PRs can break main
      # together (#6854, #6879).
      - name: All-features ripr target check
        if: ${{ inputs.branch == 'all_features' && (success()) }}
        id: all_features_check
        run: cargo check -p ripr --all-targets --all-features

      - name: Strict workspace Clippy
        if: ${{ inputs.branch == 'clippy' && (success()) }}
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The gates below need only the `ripr` build, not the test run. They run before
      # the ~18-minute nextest step so a main-side drift (goldens, fixtures, capability
      # inventory, verdict corpora) fails the required run within minutes instead of
      # after the tests (#10341). A run that fails here reports no test results; the
      # next run does.
      - name: Golden output contracts
        if: ${{ inputs.branch == 'corpus' && (success()) }}
        id: goldens
        run: cargo xtask goldens check

      # Retain bounded wildcard and affected matcher/guard calibration subjects:
      # drift report contains counts and first differences, not full stdout.
      # This uses the actual canonical producer outputs; it does not rerun,
      # normalize, bless, or weaken the golden comparison.
      - name: Retain wildcard calibration producer outputs
        if: ${{ inputs.branch == 'corpus' && (always() && (steps.goldens.outcome == 'success' || steps.goldens.outcome == 'failure')) }}
        id: wildcard_retention
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-wildcard-calibration-${{ github.run_attempt }}
          path: |
            target/ripr/fixtures/wildcard_oracle_*/check.json
            target/ripr/fixtures/wildcard_oracle_*/human.txt
            target/ripr/fixtures/wildcard_oracle_*/human-full.txt
            target/ripr/fixtures/error_variant_boxed_wrapper_downcast_witness/check.json
            target/ripr/fixtures/error_variant_boxed_wrapper_downcast_witness/human*.txt
            target/ripr/fixtures/error_variant_boxed_wrapper_fail_closed/check.json
            target/ripr/fixtures/error_variant_boxed_wrapper_fail_closed/human*.txt
            target/ripr/fixtures/error_variant_wrapper_callee_only_pin/check.json
            target/ripr/fixtures/error_variant_wrapper_callee_only_pin/human*.txt
            target/ripr/fixtures/error_variant_wrapper_foreign_pin/check.json
            target/ripr/fixtures/error_variant_wrapper_foreign_pin/human*.txt
            target/ripr/fixtures/error_variant_wrapper_wrong_receiver_pin/check.json
            target/ripr/fixtures/error_variant_wrapper_wrong_receiver_pin/human*.txt
            target/ripr/fixtures/guarded_result_match_owner_observation/check.json
            target/ripr/fixtures/guarded_result_match_owner_observation/human*.txt
          if-no-files-found: error
          retention-days: 5

      - name: Fixture contracts
        if: ${{ inputs.branch == 'corpus' && (success()) }}
        id: fixtures
        run: cargo xtask fixtures

      # Hosted wiring for #5531. Both commands build/run `ripr` (the fixture step
      # above just built it, so this reuses the artifacts) and compare the
      # binary-resident capability registry with repository inventory and with
      # the generated block in docs/status/SUPPORT_TIERS.md. Unconditional and
      # read-only; no new trigger, permission or secret.
      - name: Capability producer inventory
        if: ${{ inputs.branch == 'corpus' && (success()) }}
        id: capability_producers
        run: cargo xtask check-capability-producers

      - name: Capability registry docs block
        if: ${{ inputs.branch == 'corpus' && (success()) }}
        id: capability_docs
        run: cargo xtask capability-docs --check

      # Scores ripr's verdicts on every labeled verdict corpus
      # (fixtures/<language>-verdict-corpus) against their stored
      # runtime-mutant labels (RIPR-SPEC-0219). Its `cargo build` of ripr
      # finds the fixture step's artifacts current, so it compiles nothing
      # new; it runs cases in parallel and runs no mutation testing. Required runs happen on the merge-ready request and on main
      # pushes, so a verdict move is caught on the PR that makes it.
      - name: Verdict corpora
        if: ${{ inputs.branch == 'corpus' && (success()) }}
        id: verdict_corpus
        run: cargo xtask verdict-corpus check-all

      # `actions/checkout` tests GitHub's merge ref as it stood when the run was
      # admitted. If the base has since moved and now conflicts with the PR head,
      # the ~18-minute test run below cannot produce a mergeable result, so fail
      # here with the reason instead of finishing it (#10341). Needs the full
      # history the checkout above fetches; `merge-tree` writes nothing to the tree.
      - name: Required Rust tests
        if: ${{ inputs.branch == 'tests' && (inputs.test-shards == 1) }}
        id: rust-tests
        run: |
          mkdir -p target/nextest/ci
          rm -f target/nextest/ci/junit.xml target/nextest/ci/run-context.txt
          checkout_sha="$(git rev-parse HEAD)"
          {
            printf 'repository=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_REPOSITORY" "$checkout_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'profile=ci\ncommand=cargo nextest run --workspace --profile ci\n'
            cargo nextest --version
            rustc --version
            cargo --version
            printf 'input_blobs (Cargo.lock, nextest.toml, rust-gates.yml):\n'
            git hash-object Cargo.lock .config/nextest.toml .github/workflows/rust-gates.yml
          } > target/nextest/ci/run-context.txt
          set +e
          cargo nextest run --workspace --profile ci
          test_exit=$?
          set -e
          printf 'nextest_exit=%s\n' "$test_exit" >> target/nextest/ci/run-context.txt
          if [ "$test_exit" -eq 0 ] && ! grep -Eq '<testsuites [^>]*tests="[1-9][0-9]*"' target/nextest/ci/junit.xml; then
            echo "::error::nextest succeeded without a fresh JUnit report naming at least one test"
            exit 1
          fi
          exit "$test_exit"

      # Retain the required run's small diagnostic packet, not another test run.
      # A failed/aborted runner may have context only; it must not inherit XML.
      - name: Upload required Rust test results
        if: ${{ inputs.branch == 'tests' && (always() && steps.rust-tests.outcome != 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-nextest-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci/run-context.txt
            target/ripr/reports/discarded-matcher-cli-5713/
            target/nextest/ci/python-symlink-source-admission-cli-${{ github.run_id }}-${{ github.run_attempt }}.txt
            target/ripr/reports/repair-card-usability.json
            target/ripr/reports/repair-card-usability.md
            target/ripr/reports/blind-journey-execute.json
            target/ripr/reports/blind-journey-execute.md
          if-no-files-found: warn
          retention-days: 5

      # Nextest does not execute Rust doctests; Cargo/rustdoc owns them (#3825).
      - name: Required Rust doctests
        if: ${{ inputs.branch == 'doctests' && (success()) }}
        id: doctests
        run: cargo test --workspace --doc

      - name: PR evidence
        if: ${{ inputs.branch == 'pr_schema' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') }}
        id: pr_evidence
        env:
          BASE_SHA: ${{ steps.admitted.outputs.base || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ steps.admitted.outputs.head || github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          GITHUB_PR_LABELS: ${{ inputs.pr-labels || join(github.event.pull_request.labels.*.name, ',') }}
          RIPR_REVIEW_COMMENTS_TIMEOUT_SECS: "60"
          # Raised from the 2000 default as the PR #3592 decision artifact, then
          # to 3500 for #3532 (3,060-line capability diff), then to 4500 for
          # #3674 (#3555 PR C, 4,321-line review-hardened capability diff),
          # then to 5500, 6500 and 7500 for #3709/#3569 (the guarded-match
          # oracle + driver-binding diff reached ~7,300 changed Rust lines
          # across six adversarial bot-review rounds of falsifier pins),
          # and to 10000 for #4390/#4968 (the eval_sweep_report.rs
          # decomposition is one atomic 9,016-changed-Rust-line move across
          # six files; the issue forbids splitting it further and the moved
          # lines are behavior-preserving, measured locally: full
          # diff-scoped analysis completes in ~73s with
          # analysis_complete=true, far under the 3,600s producer ceiling;
          # further growth splits per docs/CONFIGURATION.md);
          # the variable is documented in docs/CONFIGURATION.md.
          RIPR_MAX_DIFF_CHANGED_RUST_LINES: "10000"
          # Match the raised max limit: the partial-budget clamp bounds against
          # the effective limit, so without this a PR above the default passes
          # the hard guard but still lands in gate-ineligible
          # limited_partial_scope.
          RIPR_PARTIAL_DIFF_LINE_BUDGET: "10000"
          # Large analyzer PRs need more than the 120s default for the
          # evidence producer's ripr check subprocess; #3709's 5,104-line
          # diff measured ~3,100s locally and exceeded 1,800s on CI, so
          # the ceiling is 3,600s (measured locally per the raise rule;
          # a hung producer wastes at most one hour — the scope guard
          # still caps memory).
          RIPR_PR_EVIDENCE_TIMEOUT_SECS: "3600"
          # Align ripr check's own 600s budget (#5369) with the step ceiling.
          RIPR_CHECK_TIMEOUT: "3600"
          EVENT_NAME: ${{ github.event_name }}
          ADMISSION_REASON: ${{ inputs.admission-reason }}
          ADMISSION_HEAD: ${{ inputs.admission-head }}
          SYNC_SOURCE: ${{ inputs.history-sync-source }}
          SYNC_BASE: ${{ inputs.history-sync-base }}
        run: |
          # #12437: the diff-scoped producers below do not apply to a history-sync
          # merge. The record binds tested G (this checkout) to admitted H and
          # declared S/B: G's parents are (base tip, H), B is in the base tip, S is
          # in H but not the base tip. The Result accepts it only for that H.
          if [ "$ADMISSION_REASON" = history_sync_admitted ]; then
            bind() { echo "::error::history-sync binding refused: $1"; exit 1; }
            s="${SYNC_SOURCE##*@}" g="$(git rev-parse HEAD)" rc=0
            [ "$EVENT_NAME" = pull_request ] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$s" =~ ^[0-9a-f]{40}$ && "$SYNC_BASE" =~ ^[0-9a-f]{40}$ ]] && [ "$ADMISSION_HEAD" = "$HEAD_SHA" ] || bind "admitted head '$ADMISSION_HEAD' / S '$s' / B '$SYNC_BASE' do not bind this $EVENT_NAME head '$HEAD_SHA'"
            [ "$(git rev-parse --verify -q "$g^2")" = "$HEAD_SHA" ] && [ -z "$(git rev-parse -q --verify "$g^3")" ] || bind "tested commit $g is not the base tip merged with H $HEAD_SHA"
            git merge-base --is-ancestor "$SYNC_BASE" "$g^1" && git merge-base --is-ancestor "$s" "$HEAD_SHA" || bind "B $SYNC_BASE is not in the tested base tip or S $s is not in H"
            git merge-base --is-ancestor "$s" "$g^1" || rc=$?
            [ "$rc" -eq 1 ] || bind "S $s is already in the tested base tip (or ancestry is unreadable)"
            mkdir -p target/ripr/pr
            jq -n --arg head "$HEAD_SHA" --arg g "$g" --arg s "$SYNC_SOURCE" --arg b "$SYNC_BASE" '{status: "not_applicable", reason: "history_sync", issue: 12437, head: $head, tested_commit: $g, source: $s, destination_base: $b, skipped: ["ripr-pr", "ripr-pr --check", "ripr-review-comments", "impacted-evidence", "ripr-pr-summary", "ripr-annotations", "schema sweep pr-evidence/review-comments rows"]}' > target/ripr/pr/not-applicable.json
            echo "::notice title=PR evidence not_applicable: history_sync::diff-scoped PR evidence is not applicable to history-sync head $HEAD_SHA (tested $g); every other gate ran (#12437)"
            { echo "### PR evidence"; echo ""; echo "- status: \`not_applicable\`"; echo "- reason: \`history_sync\`"; echo "- head: \`$HEAD_SHA\`; tested: \`$g\`; source: \`$SYNC_SOURCE\`; destination base: \`$SYNC_BASE\`"; } >> "$GITHUB_STEP_SUMMARY"
            echo "evidence=not_applicable:history_sync:$HEAD_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA"
          cargo xtask ripr-pr --base "$BASE_SHA" --head "$HEAD_SHA" --check
          cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check-output target/ripr/pr/check.json
          cargo xtask ripr-review-comments --base "$BASE_SHA" --head "$HEAD_SHA" --check --check-output target/ripr/pr/check.json
          cargo xtask impacted-evidence
          cargo xtask impacted-evidence --check
          cargo xtask ripr-pr-summary
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations
          cargo xtask ripr-annotations --check
          echo "evidence=produced" >> "$GITHUB_OUTPUT"

      # Published schema vs real producer bytes on the candidate (#9505, #3920).
      # Corpus rows read committed bytes via `git archive HEAD`; the runtime-only
      # rows are fed this run's own producer output: doctor from the freshly
      # built binary, plus (pull requests and merge groups) the pr-evidence and review-comments
      # bytes the PR evidence step just wrote. A missing artifact file fails the
      # step, so a producer that stops writing cannot silently turn a row into
      # `not_run`. Producer-only rows (repair-attempt, execution_result) carry a
      # reviewed narrower authority instead (#9561); see docs/verification/schema-producer-audit.md.
      - name: Schema producer sweep
        if: ${{ inputs.branch == 'pr_schema' && (success()) }}
        id: schema_producer_sweep
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_EVIDENCE: ${{ steps.pr_evidence.outputs.evidence }}
        run: |
          mkdir -p target/ripr/sweep
          cargo run --quiet -p ripr -- doctor --json > target/ripr/sweep/doctor.json
          artifacts=(--artifact schemas/ripr/doctor.schema.json=target/ripr/sweep/doctor.json)
          # Only the typed history-sync record (#12437) withholds the PR rows.
          if { [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; } && [[ "$PR_EVIDENCE" != not_applicable:history_sync:* ]]; then
            artifacts+=(
              --artifact schemas/ripr/pr-evidence.schema.json=target/ripr/pr/repo-exposure.json
              --artifact schemas/ripr/review-comments.schema.json=target/ripr/review/comments.json
            )
          fi
          cargo xtask schema-producer-sweep "${artifacts[@]}"


      - name: Record native outcomes against expected rows
        if: always() && steps.verify_plan.outcome == 'success'
        env:
          RIPR_DAG_STEPS: ${{ toJSON(steps) }}
          BRANCH: ${{ inputs.branch }}
          START: ${{ steps.clock.outputs.start }}
        run: '"$RUNNER_TEMP/rust-dag-controller-target/debug/repo-policy" product-gate-dag record .dag/plan.json "$BRANCH" "result-$BRANCH.json" "$START"'
      - name: Retain branch receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-dag-result-${{ inputs.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: result-${{ inputs.branch }}.json
          if-no-files-found: error
          retention-days: 5
