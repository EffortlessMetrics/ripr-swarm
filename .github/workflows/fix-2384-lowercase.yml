name: Fix #2384 expected SHA normalization

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: fix-2384-lowercase
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/validated-cli-fixture-head-2383'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exclusively claimed branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/validated-cli-fixture-head-2383
          fetch-depth: 0
          persist-credentials: true
      - name: Verify the branch revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "fix/validated-cli-fixture-head-2383"
      - name: Apply the one reviewed source correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ripr/tests/cli_smoke.rs')
          text = path.read_text(encoding='utf-8')
          old = 'let expected = String::from_utf8(expected.stdout)?.trim().to_string();'
          new = '''let expected = String::from_utf8(expected.stdout)?
              .trim()
              .to_ascii_lowercase();'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one normalization site, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rustfmt crates/ripr/tests/cli_smoke.rs
          git diff --check
      - name: Commit the correction and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git add crates/ripr/tests/cli_smoke.rs
          git rm .github/workflows/fix-2384-lowercase.yml
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/tests/cli_smoke.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/fix-2384-lowercase.yml
          git diff --cached --check
          git -c user.name='RIPR release operator' \
              -c user.email='release-operator@example.invalid' \
              -c commit.gpgSign=false \
              commit -m 'test(cli): normalize expected fixture commit IDs (#2383)'
          git push origin HEAD:refs/heads/fix/validated-cli-fixture-head-2383
