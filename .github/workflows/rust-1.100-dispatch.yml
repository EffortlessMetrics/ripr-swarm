name: Dispatch Rust 1.100 exact-head qualification

on:
  push:
    branches:
      - build/rust-1.100-upgrade
    paths:
      - .github/workflows/rust-1.100-dispatch.yml

permissions: {}

concurrency:
  group: rust-1.100-exact-head-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait for clean final head, then dispatch existing qualification workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: build/rust-1.100-upgrade
          STAGING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          final_sha=
          for attempt in $(seq 1 90); do
            current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)"
            if [ "$current" != "$STAGING_SHA" ]; then
              final_sha="$current"
              break
            fi
            sleep 2
          done
          test -n "$final_sha"
          printf 'Dispatching qualification for %s at %s\n' "$BRANCH" "$final_sha"

          dispatch() {
            local workflow="$1"
            local payload="$2"
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches" \
              --input - <<<"$payload"
          }

          plain="$(jq -nc --arg ref "$BRANCH" '{ref:$ref}')"
          candidate="$(jq -nc --arg ref "$BRANCH" --arg sha "$final_sha" '{ref:$ref,inputs:{candidate_sha:$sha,mcp_evidence_pair:"false"}}')"
          release="$(jq -nc --arg ref "$BRANCH" '{ref:$ref,inputs:{version:"0.11.0",candidate_ref:""}}')"

          for workflow in \
            routed-rust.yml \
            ci.yml \
            workflow-lint.yml \
            coverage.yml \
            zed-extension.yml \
            completions-smoke.yml \
            windows-gate.yml \
            npm-launcher.yml \
            macos-advisory.yml \
            windows-advisory.yml \
            kani.yml
          do
            dispatch "$workflow" "$plain"
          done
          dispatch python-wheel-qualification.yml "$candidate"
          dispatch release-server-binaries.yml "$release"
