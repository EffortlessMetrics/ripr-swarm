name: First-run archive install

# Verifies the documented prebuilt-archive install snippets in
# docs/QUICKSTART.md on hosted Linux, macOS and Windows runners, records how
# long each takes, then walks the first-run path with the same released
# archive (`cargo xtask first-run --install-archive`). Runs weekly and on
# demand, never on a pull request. Scheduled runs (and dispatches with no
# version) install the version the QUICKSTART snippets pin, so the weekly run
# checks the install instructions exactly as a reader would follow them.
# Read-only: it downloads a public release and publishes nothing (#5311). The walk step may fail on a platform bug without hiding the
# snippet result; the report says which step failed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published ripr version whose archive is installed, for example 0.11.0; empty uses the version pinned in the QUICKSTART snippets (an unpublished version fails the download)
        required: false
        default: ""
        type: string
  schedule:
    - cron: "37 6 * * 2"

permissions:
  contents: read

concurrency:
  group: first-run-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: archive (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Extract the documented snippets
        shell: bash
        run: |
          awk '/prebuilt-snippet:/{m=$0;next} m&&/^```/{n++;if(n%2==0){m=""};next} m{print > (m ~ /unix/ ? "snippet.sh" : "snippet.ps1")}' docs/QUICKSTART.md

      - name: Resolve the version to install
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          pin=$(sed -nE 's/^v=([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' snippet.sh | head -n1)
          winpin=$(sed -nE "s/^\\\$v='([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" snippet.ps1 | head -n1)
          [ -n "$pin" ] && [ "$pin" = "$winpin" ] || { echo "QUICKSTART snippets pin different versions: unix=$pin windows=$winpin"; exit 1; }
          echo "version=${INPUT_VERSION:-$pin}" >> "$GITHUB_OUTPUT"

      - name: Install with the documented snippet (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION"; exit 1; }
          mkdir bin-test && cd bin-test
          sed -E "s/^v=[0-9]+\.[0-9]+\.[0-9]+/v=$VERSION/" ../snippet.sh > snippet-version.sh
          grep -q "^v=$VERSION" snippet-version.sh || { echo "snippet does not pin a version"; exit 1; }
          time bash -c "$(cat snippet-version.sh)"$'\n'"ripr --version"

      - name: Install with the documented snippet (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "bad version: $env:VERSION" }
          New-Item -ItemType Directory bin-test | Out-Null; Set-Location bin-test
          $n = (Get-Content ../snippet.ps1 -Raw) -replace '\$v=''\d+\.\d+\.\d+''', ('$$v=''' + $env:VERSION + ''''); if (-not $n.Contains('$v=''' + $env:VERSION + '''')) { throw 'snippet does not pin a version' }
          $t = Measure-Command { Invoke-Expression $n; ripr --version | Write-Host }
          Write-Host "TotalSeconds: $($t.TotalSeconds)"; if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Walk the first-run path with the released archive
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: cargo xtask first-run --install-archive "$VERSION"

      - name: Upload first-run reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: first-run-archive-${{ matrix.os }}
          path: |
            target/ripr/first-run/first-run.*
            target/ripr/first-run/first-run-rows.jsonl
            target/ripr/first-run/install_archive.stderr.log
          if-no-files-found: warn
