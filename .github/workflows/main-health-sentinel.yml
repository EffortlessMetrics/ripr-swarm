name: Main health sentinel

# Read the native qualification of exact landed M (#14500, #7827). This timer
# executes no product build/test and creates no qualification. G=M is supported;
# a different G identity, unsupported generation, incomplete/superseded attempt,
# or unavailable native evidence is UNKNOWN, never an older success or recovery.
# The existing required Result remains the proof/applicability authority.
on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-health-sentinel-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sentinel:
    name: Observe landed qualification
    if: github.repository == 'EffortlessMetrics/ripr-swarm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: tools/ci
          persist-credentials: false

      - name: Observe exact landed native qualification
        id: observe
        timeout-minutes: 3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I tools/ci/main-qualification.py \
            --repository "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/main-health-sentinel/qualification.json"

      - name: Judge native observation
        id: judge
        if: always()
        run: |
          verdict="$(jq -er --arg sha "$GITHUB_SHA" 'select(.sha == $sha) | .verdict | select(. == "green" or . == "red" or . == "unknown")' "$RUNNER_TEMP/main-health-sentinel/qualification.json" 2>/dev/null)" || verdict=unknown
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          if [ "$verdict" != green ]; then
            echo "::error title=Landed qualification not established::native observation is $verdict; no product proof was run"
            exit 1
          fi

      - name: Reconcile the main-red tracker
        if: always() && steps.judge.outputs.verdict != ''
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERDICT: ${{ steps.judge.outputs.verdict }}
        run: |
          set -euo pipefail
          # Missing correspondence is not a diagnosis and cannot heal a tracker.
          [ "$VERDICT" != unknown ] || exit 0
          observation="$RUNNER_TEMP/main-health-sentinel/qualification.json"
          read -r native_run attempt < <(jq -er '[.run_id, .run_attempt] | @tsv' "$observation")
          [[ "$native_run:$attempt" =~ ^[1-9][0-9]*:[1-9][0-9]*$ ]]
          still_current() {
            local recheck="$RUNNER_TEMP/main-health-sentinel/recheck.json" native_exit=0
            rm -f "$recheck"
            timeout 130 python3 -I tools/ci/main-qualification.py --repository "$REPOSITORY" --sha "$GITHUB_SHA" --out "$recheck" >/dev/null || native_exit=$?
            jq -e --arg sha "$GITHUB_SHA" --arg verdict "$VERDICT" --argjson id "$native_run" --argjson attempt "$attempt" --argjson status "$native_exit" '.sha == $sha and .verdict == $verdict and .run_id == $id and .run_attempt == $attempt and ($status == (if $verdict == "green" then 0 else 1 end))' "$recheck" >/dev/null
          }
          title="main-red: scheduled main-health sentinel found a broken main"
          marker="<!-- main-health-sentinel-tracker -->"
          number="$(timeout 15 gh api -X GET search/issues -f q="repo:$REPOSITORY is:issue is:open in:title main-red" --jq "[.items[] | select(.title == \"$title\") | .number][0] // empty")"
          run_url="${{ github.server_url }}/$REPOSITORY/actions/runs/${{ github.run_id }}"
          native_url="${{ github.server_url }}/$REPOSITORY/actions/runs/$native_run"
          if [ "$VERDICT" = red ]; then
            fingerprint="fingerprint: native=$GITHUB_SHA:$native_run:$attempt:red"
            body="$marker
          Native qualification of landed main \`$GITHUB_SHA\` failed.

          - native run: $native_url (attempt $attempt)
          - observation: $run_url

          This records failed qualification, including possible infrastructure
          failure; it does not diagnose a product defect. The sentinel runs no
          build/test, dispatches no CI and changes no merge authority (#14500).

          $fingerprint"
            if [ -z "$number" ]; then
              still_current || { echo '::error::native observation changed before tracker creation'; exit 1; }
              timeout 15 gh api "repos/$REPOSITORY/issues" -f title="$title" -f body="$body" > /dev/null
            else
              seen="$( { timeout 15 gh api "repos/$REPOSITORY/issues/$number" --jq '.body // ""'; timeout 30 gh api --paginate "repos/$REPOSITORY/issues/$number/comments?per_page=100" --jq '.[].body'; } )"
              if ! printf '%s\n' "$seen" | grep -qxF "$fingerprint"; then
                still_current || { echo '::error::native observation changed before tracker comment'; exit 1; }
                timeout 15 gh api "repos/$REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
              fi
            fi
          elif [ "$VERDICT" = green ] && [ -n "$number" ]; then
            still_current || { echo '::error::native observation changed before tracker recovery'; exit 1; }
            timeout 15 gh api "repos/$REPOSITORY/issues/$number/comments" -f body="Native qualification observed for exact landed main \`$GITHUB_SHA\`: $native_url (attempt $attempt). Observation: $run_url. No new product proof was run." > /dev/null
            still_current || { echo '::error::native observation changed before tracker closure'; exit 1; }
            timeout 15 gh api -X PATCH "repos/$REPOSITORY/issues/$number" -f state=closed > /dev/null
          fi
