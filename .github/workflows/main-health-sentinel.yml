name: Main health incident probe

# Explicit incident proof under #4984/#4842. Ordinary merges and elapsed time
# do not request another build. The owning session supplies the incident and
# question, then inspects the bounded check/smoke evidence for this exact main.
# This does not qualify a queued candidate or authorize a merge. Keep the
# existing main-red tracker identity and evidence from the retired scheduled
# sentinel. Only the investigator can reconcile it after appropriate full proof;
# this bounded probe never closes an incident or declares full-main recovery.
on:
  workflow_dispatch:
    inputs:
      incident:
        description: "Existing incident or evidence requiring this main-health probe"
        type: string
        required: true
      question:
        description: "Concrete question this bounded compile/smoke proof must answer"
        type: string
        required: true

permissions:
  contents: read

# Serialize overlapping fires. Do not cancel: an in-progress probe must finish
# writing its summary and red evidence before the next fire reads it.
concurrency:
  group: main-health-sentinel-${{ github.repository }}
  cancel-in-progress: false

jobs:
  sentinel:
    name: Probe main health
    # A dispatch from another ref must not judge that ref as main health or
    # touch the repository-wide tracker.
    if: github.repository == 'EffortlessMetrics/ripr-swarm' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write scopes live on this job only: the one write is the main-red
    # tracking issue. No workflow/dispatch authority of any kind.
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Record explicit incident scope
        env:
          INCIDENT: ${{ inputs.incident }}
          QUESTION: ${{ inputs.question }}
        run: |
          set -euo pipefail
          [[ "$INCIDENT" =~ [^[:space:]] && "$QUESTION" =~ [^[:space:]] ]] || { echo "::error::incident and question must contain non-whitespace text"; exit 1; }
          python3 - <<'PY'
          import html
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Explicit main-health proof\n\n")
              for label, key in [("Incident", "INCIDENT"), ("Question", "QUESTION"), ("Subject", "GITHUB_SHA")]:
                  summary.write(f"{label}:\n\n<pre>{html.escape(os.environ[key])}</pre>\n\n")
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the toolchain; the action resolves it from
      # the file, matching macos-advisory.yml.
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ripr-main-health-sentinel-1.95
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Record native exit statuses next to the logs; the judge step decides.
      # A probe failure must reach the judge as evidence, not vanish in a pipe.
      # When the judge executes after a probe timeout, missing status files
      # read as 124. Cancellation or a whole-job timeout can skip the judge.
      - name: Probe main build and one focused binary smoke test
        timeout-minutes: 20
        continue-on-error: true
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/main-health-sentinel"
          mkdir -p "$d"
          { rustc --version; cargo --version; } | tee "$d/host.log"
          set +e
          cargo check --locked -p ripr 2>&1 | tee "$d/check.log"
          echo "${PIPESTATUS[0]}" > "$d/check.status"
          cargo test --locked -p ripr --test cli_smoke version_is_exact_and_precedes_help_or_output_flags -- --exact 2>&1 | tee "$d/smoke.log"
          echo "${PIPESTATUS[0]}" > "$d/smoke.status"
          exit 0

      # Test-level breaks can pass this bounded probe. Retain the latest
      # completed push-gate observations as historical evidence after push
      # retirement. Only a failure at this invocation's full GITHUB_SHA may
      # affect its current verdict; main may move while the probe runs. Missing,
      # malformed or unreadable results are unknown, never full-health proof.
      # Reads are bounded and cannot prevent the probe judge from running.
      - name: Read the latest completed main push gates
        timeout-minutes: 5
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          d="$RUNNER_TEMP/main-health-sentinel"
          mkdir -p "$d"
          : > "$d/gates.tsv"
          for wf in routed-rust.yml ci.yml; do
            run="$(timeout 60 gh api -X GET "repos/$REPOSITORY/actions/workflows/$wf/runs" -f branch=main -f event=push -f status=completed -f per_page=100 --jq '[.workflow_runs[] | select(.conclusion != "cancelled" and .conclusion != "skipped")][0] // empty | [.id, .conclusion, .head_sha, .html_url] | @tsv' 2>/dev/null)"
            rc=$?
            # A failed call prints its error body to stdout: read it as unknown.
            IFS=$'\t' read -r id conclusion sha url <<<"$run"
            case "$rc:$conclusion" in
              0:success|0:failure|0:timed_out|0:action_required|0:startup_failure) ;;
              *) printf '%s\tunknown\t-\t-\t-\t-\n' "$wf" >> "$d/gates.tsv"; continue ;;
            esac
            if ! [[ "$id" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ && "$url" == "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$id" ]]; then
              printf '%s\tunknown\t-\t-\t-\t-\n' "$wf" >> "$d/gates.tsv"; continue
            fi
            failed="-"
            if [ "$conclusion" != success ]; then
              failed="$(timeout 60 gh api "repos/$REPOSITORY/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | .name] | join(", ")' 2>/dev/null)" || failed=unreadable
            fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$wf" "$conclusion" "$sha" "$id" "$url" "${failed:-unreadable}" >> "$d/gates.tsv"
          done
          exit 0

      # Turn the gate readings into the summary rows, the red flag the judge
      # reads, the tracker lines, and the evidence fingerprint that keeps the
      # tracker to one comment per new piece of evidence.
      - name: Summarize the main push gates
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/main-health-sentinel"
          [ -f "$d/gates.tsv" ] || : > "$d/gates.tsv"
          echo 0 > "$d/gates.red"
          echo 0 > "$d/gates.unknown"
          # Fewer than two rows means a read hung or failed mid-way.
          [ "$(grep -c . "$d/gates.tsv" || true)" -ge 2 ] || echo 1 > "$d/gates.unknown"
          : > "$d/gates.md"
          : > "$d/gates.fp"
          { echo "### Latest completed main push gates (not full current qualification)"; echo; echo "Selected probe commit: $GITHUB_SHA"; echo; echo "| Gate | Scope | Conclusion | Run and failed jobs |"; echo "| --- | --- | --- | --- |"; } >> "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r wf conclusion sha id url failed; do
            [ -n "$wf" ] || continue
            scope=unknown
            if [[ "$sha" =~ ^[0-9a-f]{40}$ && "$id" =~ ^[0-9]+$ && "$url" == "$GITHUB_SERVER_URL/$REPOSITORY/actions/runs/$id" && "$conclusion" =~ ^(success|failure|timed_out|action_required|startup_failure)$ ]]; then
              scope=historical
              [ "$sha" != "$GITHUB_SHA" ] || scope=selected-commit
            else
              conclusion=unknown
            fi
            echo "| $wf | $scope | $conclusion | $sha $url failed jobs: $failed |" >> "$GITHUB_STEP_SUMMARY"
            [ "$scope" = selected-commit ] || echo 1 > "$d/gates.unknown"
            case "$conclusion" in
              success) ;;
              unknown) echo 1 > "$d/gates.unknown" ;;
              *)
                if [ "$scope" = selected-commit ]; then echo 1 > "$d/gates.red"; fi
                printf -- '- %s completed main push `%s`: %s at `%s` (%s); failed jobs: %s\n' "$scope" "$wf" "$conclusion" "$sha" "$url" "$failed" >> "$d/gates.md"
                printf '%s:%s,' "$wf" "$id" >> "$d/gates.fp"
                ;;
            esac
          done < "$d/gates.tsv"

      # When this judge executes, a missing status reads as 124 and makes the
      # probe red. A probe-step timeout can leave that missing evidence. A
      # preceding setup failure, cancellation or whole-job timeout may prevent
      # judging or tracker recording; the run is visible but does not establish
      # a probe verdict or durable tracker update.
      - name: Judge probe evidence
        id: judge
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/main-health-sentinel"
          missing=0
          for f in host.log check.log check.status smoke.log smoke.status; do
            [ -s "$d/$f" ] || { echo "::error::missing probe evidence $f"; missing=1; }
          done
          check_status="$(cat "$d/check.status" 2>/dev/null || echo 124)"
          smoke_status="$(cat "$d/smoke.status" 2>/dev/null || echo 124)"
          result_line="$(grep -E '^test result:' "$d/smoke.log" 2>/dev/null | tail -n 1 || true)"
          passed="$(printf '%s' "$result_line" | sed -n 's/^test result: [a-zA-Z]*\. \([0-9]*\) passed.*/\1/p')"
          {
            echo "## Selected-commit bounded main-health probe"
            echo "A passing probe is not full qualification or incident recovery; existing tracker obligations remain open."
            echo
            echo "| Probe | Exit | Detail |"
            echo "| --- | --- | --- |"
            echo "| cargo check --locked -p ripr | $check_status | bounded probe, not the push gate; 124 = timed out |"
            echo "| smoke: cli_smoke version_is_exact_and_precedes_help_or_output_flags | $smoke_status | ${result_line:-no test result line} |"
          } >> "$GITHUB_STEP_SUMMARY"
          gates_red="$(cat "$d/gates.red" 2>/dev/null || echo 0)"
          passed="${passed:-0}"
          if [ "$smoke_status" -eq 0 ] && [ "$passed" -eq 0 ]; then
            echo "::error::the smoke selector executed zero tests; a probe that runs nothing proves nothing"
          fi
          verdict=green
          if [ "$missing" -ne 0 ] || [ "$check_status" -ne 0 ] || [ "$smoke_status" -ne 0 ] || [ "$passed" -eq 0 ]; then
            verdict=red
            echo "::error title=Selected-commit probe failed::the explicit bounded probe failed on $GITHUB_SHA; see the step summary and the main-red tracker"
          fi
          if [ "$gates_red" -ne 0 ]; then
            verdict=red
            echo "::error title=Selected-commit main-push gate failed::a completed main push gate failed at $GITHUB_SHA; see its commit and run in the step summary and the main-red tracker"
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          [ "$verdict" = green ] || exit 1

      # Red evidence opens or updates the existing tracker, deduplicated by
      # probe and gate identity. A passing bounded probe never comments recovery
      # or closes the tracker, even when observed push gates succeeded. The
      # investigator reconciles full-gate obligations using appropriate current
      # full qualification. Missing probe statuses still read as 124. A failure
      # before the judge remains a visible failed job without a probe verdict.
      - name: Reconcile the main-red tracker
        if: always() && steps.judge.outputs.verdict != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERDICT: ${{ steps.judge.outputs.verdict }}
        run: |
          set -euo pipefail
          title="main-red: scheduled main-health sentinel found a broken main"
          marker="<!-- main-health-sentinel-tracker -->"
          number="$(gh api -X GET search/issues -f q="repo:$REPOSITORY is:issue is:open in:title main-red" --jq "[.items[] | select(.title == \"$title\") | .number][0] // empty")"
          run_url="${{ github.server_url }}/$REPOSITORY/actions/runs/${{ github.run_id }}"
          if [ "$VERDICT" = red ]; then
            check_status="$(cat "$RUNNER_TEMP/main-health-sentinel/check.status" 2>/dev/null || echo 124)"
            smoke_status="$(cat "$RUNNER_TEMP/main-health-sentinel/smoke.status" 2>/dev/null || echo 124)"
            gates="$(cat "$RUNNER_TEMP/main-health-sentinel/gates.md" 2>/dev/null || true)"
            # One comment per new piece of evidence, not one per fire.
            probe_fp="$GITHUB_SHA:$check_status:$smoke_status"
            [ "$check_status" != 0 ] || [ "$smoke_status" != 0 ] || ! grep -Eq '^test result: [a-z]+\. [1-9]' "$RUNNER_TEMP/main-health-sentinel/smoke.log" 2>/dev/null || probe_fp="$GITHUB_SHA:green"
            fingerprint="fingerprint: probe=$probe_fp gates=$(cat "$RUNNER_TEMP/main-health-sentinel/gates.fp" 2>/dev/null || true)"
            body="$marker
          The explicitly requested main-health probe at \`$GITHUB_SHA\` observed red evidence for the selected commit. Bounded probe statuses and scope-labelled main-push gate observations follow.

          - probe run: $run_url
          - \`cargo check --locked -p ripr\` exit $check_status; focused smoke exit $smoke_status
          $gates

          Recorded automatically by the incident probe (#4984/#4842). The
          investigator must reconcile this tracker with appropriate current full
          qualification; a passing bounded probe never closes it. The repair
          travels through the protected PR path, not this issue.

          $fingerprint"
            if [ -z "$number" ]; then
              gh api "repos/$REPOSITORY/issues" -f title="$title" -f body="$body" > /dev/null
            else
              # Every page: a tracker can outgrow one page of comments.
              seen="$( { gh api "repos/$REPOSITORY/issues/$number" --jq '.body // ""'; gh api --paginate "repos/$REPOSITORY/issues/$number/comments?per_page=100" --jq '.[].body'; } 2>/dev/null || true)"
              if ! printf '%s\n' "$seen" | grep -qxF "$fingerprint"; then
                gh api "repos/$REPOSITORY/issues/$number/comments" -f body="$body" > /dev/null
              fi
            fi
          fi
