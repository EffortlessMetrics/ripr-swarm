          """

          class ReadbackFailure(Exception):
              pass

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          OPENER = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())

          def require(condition, reason):
              if not condition:
                  raise ReadbackFailure(reason)

          def deadline(signum, frame):
              raise ReadbackFailure("overall_deadline")

          def read_bounded(response, limit):
              data = response.read(limit + 1)
              require(len(data) <= limit, "http_body_budget")
              return data

          def api_request(path):
              require(path.startswith("/") and not path.startswith("//"), "api_path")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}",
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ripr-fixed-artifact-readback",
                  },
                  method="GET",
              )
              return OPENER.open(request, timeout=15)

          def api_json(path, limit=1024 * 1024):
              with api_request(path) as response:
                  require(response.status == 200, "api_status")
                  return json.loads(read_bounded(response, limit).decode("utf-8", errors="strict"))

          def artifact_bytes():
              try:
                  with api_request(f"/actions/artifacts/{ARTIFACT}/zip"):
                      raise ReadbackFailure("artifact_redirect_missing")
              except urllib.error.HTTPError as error:
                  try:
                      require(error.code == 302, "artifact_redirect_status")
                      location = error.headers.get("Location", "")
                  finally:
                      error.close()
              require(0 < len(location) <= 16384, "artifact_location_budget")
              parsed = urllib.parse.urlsplit(location)
              require(
                  parsed.scheme == "https"
                  and re.fullmatch(r"productionresultssa[0-9]+\.blob\.core\.windows\.net", parsed.hostname or "")
                  and parsed.port in (None, 443)
                  and parsed.username is None
                  and parsed.password is None
                  and not parsed.fragment,
                  "artifact_host",
              )
              request = urllib.request.Request(
                  location, headers={"User-Agent": "ripr-fixed-artifact-readback"}, method="GET"
              )
              with OPENER.open(request, timeout=15) as response:
                  require(response.status == 200, "artifact_download_status")
                  data = read_bounded(response, 64 * 1024 * 1024)
              require(len(data) == ZIP_BYTES, "artifact_size")
              require(hashlib.sha256(data).hexdigest() == ZIP_SHA, "artifact_digest")
              return data

          def source_bytes(path, blob, sha, size):
              payload = api_json(f"/contents/{path}?ref={MERGE}", 32 * 1024)
              require(
                  payload.get("type") == "file"
                  and payload.get("path") == path
                  and payload.get("sha") == blob
                  and payload.get("encoding") == "base64",
                  "source_metadata",
              )
              data = base64.b64decode("".join(payload["content"].split()), validate=True)
              require(len(data) == size and hashlib.sha256(data).hexdigest() == sha, "source_bytes")
              actual_blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              require(actual_blob == blob, "source_git_blob")
              return data

          def run():
              global STAGE, TOKEN
              require(bool(TOKEN), "missing_read_token")
              STAGE = "fixed_git_objects"
              commits = {sha: api_json(f"/git/commits/{sha}") for sha in (MERGE, HEAD, BASE)}
              require(all(value.get("sha") == key for key, value in commits.items()), "git_identity")
              require(commits[MERGE].get("tree", {}).get("sha") == TREE, "merge_tree")
              require([p.get("sha") for p in commits[MERGE].get("parents", [])] == [BASE, HEAD], "merge_parents")
              STAGE = "fixed_run_attempt"
              run_meta = api_json(f"/actions/runs/{RUN}/attempts/{ATTEMPT}")
              require(
                  run_meta.get("id") == RUN and run_meta.get("run_attempt") == ATTEMPT
                  and run_meta.get("head_sha") == HEAD
                  and run_meta.get("status") == "completed" and run_meta.get("conclusion") == "success",
                  "run_binding",
              )
              STAGE = "fixed_job"
              job_meta = api_json(f"/actions/jobs/{JOB}")
              require(
                  job_meta.get("id") == JOB and job_meta.get("run_id") == RUN
                  and job_meta.get("run_attempt") == ATTEMPT and job_meta.get("head_sha") == HEAD
                  and job_meta.get("status") == "completed" and job_meta.get("conclusion") == "success",
                  "job_binding",
              )
              STAGE = "fixed_artifact"
              artifact_meta = api_json(f"/actions/artifacts/{ARTIFACT}")
              require(
                  artifact_meta.get("id") == ARTIFACT and artifact_meta.get("name") == "rust-lcov"
                  and artifact_meta.get("size_in_bytes") == ZIP_BYTES
                  and artifact_meta.get("digest") == "sha256:" + ZIP_SHA
                  and artifact_meta.get("expired") is False
                  and artifact_meta.get("workflow_run", {}).get("id") == RUN
                  and artifact_meta.get("workflow_run", {}).get("head_sha") == HEAD,
                  "artifact_binding",
              )
              STAGE = "exact_sources"
              specs = [
                  {
                      "repository_path": "crates/ripr/src/testing/compiler_environment.rs",
                      "git_blob": "8f1fc2faa95ce23e7909976be46d2e512c6c56b6",
                      "sha256": "74f223e54b43b3020e4d13efb709efe1528fb33148153e1d163691ca6e2df4af",
                      "bytes": 8980,
                      "probes": [
                          {"line": 50, "statement": "assertions()?;", "expected_state": "covered"},
                          {"line": 111, "statement": 'command.env("RUSTC_WRAPPER", UNTRUSTED_WRAPPER);', "expected_state": "covered"},
                      ],
                  },
                  {
                      "repository_path": "crates/ripr/tests/quickcheck_generator_rendered.rs",
                      "git_blob": "5627bfee22e7c40aff2624de04d633deda9e6130",
                      "sha256": "cb37bc30713b939dbd7a9d737b461b73c80c857f4db5e3a737162f96a4dbf38b",
                      "bytes": 5011,
                      "probes": [
                          {"line": 67, "statement": "assert!(output.findings.iter().all(|f| f.class == expected));", "expected_state": "not_mapped"},
                          {"line": 131, "statement": "|| rendered(SOURCE, false),", "expected_state": "not_mapped"},
                      ],
                  },
              ]
              contents = [source_bytes(s["repository_path"], s["git_blob"], s["sha256"], s["bytes"]) for s in specs]
              STAGE = "fixed_artifact_download"
              archive = artifact_bytes()
              TOKEN = ""
              STAGE = "reader_identity"
              reader = base64.b64decode("".join(READER_B64.split()), validate=True)
              require(len(reader) == 15448 and hashlib.sha256(reader).hexdigest() == READER_SHA, "reader_digest")
              binding = {
                  "head": HEAD, "checkout": MERGE, "base": BASE, "checkout_tree": TREE,
                  "archive_sha256": ZIP_SHA, "native_source_root": NATIVE_ROOT,
                  "repository": REPO, "run_id": RUN, "attempt": ATTEMPT, "job_id": JOB, "artifact_id": ARTIFACT,
                  "scope": "Fixed existing artifact readback; not a build, test rerun, new qualification or source attestation.",
              }
              print("RIPR_FIXED_LCOV_BINDING_BEGIN_v1", flush=True)
              print(json.dumps({"binding": binding, "archive_bytes": len(archive), "reader_sha256": READER_SHA,
                                "source_receipts": [{k: v for k, v in s.items() if k != "probes"} for s in specs]}, sort_keys=True), flush=True)
              print("RIPR_FIXED_LCOV_BINDING_END_v1", flush=True)
              STAGE = "bound_reader"
              with tempfile.TemporaryDirectory(prefix="ripr-fixed-artifact-") as temporary:
                  root = Path(temporary)
                  archive_path, inventory_path, reader_path = root / "artifact.zip", root / "inventory.json", root / "reader.py"
                  archive_path.write_bytes(archive)
                  reader_path.write_bytes(reader)
                  for index, (spec, content) in enumerate(zip(specs, contents)):
                      local = root / f"source-{index}.rs"
                      local.write_bytes(content)
                      spec["local_path"] = str(local)
                  inventory_path.write_text(json.dumps({"schema": "ripr.bound_lcov_inventory.v1", "binding": binding, "sources": specs}), encoding="utf-8")
                  namespace = {"__name__": "fixed_artifact_reader", "__file__": str(reader_path)}
                  exec(compile(reader, str(reader_path), "exec"), namespace)
                  print("RIPR_FIXED_LCOV_INSPECTION_BEGIN_v1", flush=True)
                  code = namespace["main"]([
                      str(archive_path), "--inventory", str(inventory_path),
                      "--expect-head", HEAD, "--expect-checkout", MERGE, "--expect-base", BASE,
                      "--expect-archive-sha256", ZIP_SHA,
                  ])
                  print("RIPR_FIXED_LCOV_INSPECTION_END_v1", flush=True)
                  require(type(code) is int and code in (0, 1, 2), "reader_exit")
                  return code

          signal.signal(signal.SIGALRM, deadline)
          signal.alarm(180)
          try:
              exit_code = run()
          except Exception as error:
              if isinstance(error, urllib.error.HTTPError):
                  error.close()
              reason = str(error) if isinstance(error, ReadbackFailure) else "input_or_transport_error"
              print("RIPR_FIXED_LCOV_ERROR_BEGIN_v1", flush=True)
              print(json.dumps({"status": "rejected", "stage": STAGE, "reason": reason,
                                "error_type": type(error).__name__}, sort_keys=True), flush=True)
              print("RIPR_FIXED_LCOV_ERROR_END_v1", flush=True)
              exit_code = 2
          finally:
              signal.alarm(0)
          print(f"RIPR_FIXED_LCOV_EXIT={exit_code}", flush=True)
          sys.exit(exit_code)
          PY
