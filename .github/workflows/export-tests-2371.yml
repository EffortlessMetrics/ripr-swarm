name: Apply #2371 completion patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-2371-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/boundary-gap-fixtures-complete-2371'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exclusively claimed implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/boundary-gap-fixtures-complete-2371
          fetch-depth: 0
          persist-credentials: true
      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Verify the exclusive writer revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git rev-parse HEAD^)" = "8381f87aecfb8473c59581b31ba4bd6858e8b23d"
          test "$(git branch --show-current)" = "fix/boundary-gap-fixtures-complete-2371"
      - name: Apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/2371.patch
          git apply .github/patches/2371.patch
      - name: Format and enforce the one-file implementation cage
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/ripr/src/lsp/tests.rs"
      - name: Prove the shared fixture under hostile inherited signing
        shell: bash
        env:
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: commit.gpgSign
          GIT_CONFIG_VALUE_0: "true"
          GIT_CONFIG_KEY_1: user.signingKey
          GIT_CONFIG_VALUE_1: ripr-nonexistent-signing-key
        run: |
          set -euo pipefail
          cargo test -p ripr --lib boundary_gap_ -- --test-threads=1
          for test_name in \
            framed_lsp_protocol_smoke_logs_successful_refresh_completion \
            framed_lsp_deferred_configuration_pull_runs_after_root_transition_guard_release \
            framed_lsp_root_switch_repulls_scoped_to_new_root \
            framed_lsp_direct_root_switch_repulls_on_reselection \
            framed_lsp_saved_workspace_session_serves_saved_state_across_dirty_save \
            framed_lsp_component_degradation_is_typed_logged_and_recovers
          do
            cargo test -p ripr --lib "lsp::tests::$test_name" -- --exact --test-threads=1
          done
      - name: Commit only the acceptance-complete test repair
        shell: bash
        run: |
          set -euo pipefail
          git add crates/ripr/src/lsp/tests.rs
          git rm .github/workflows/export-tests-2371.yml .github/patches/2371.patch
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/src/lsp/tests.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/export-tests-2371.yml
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/patches/2371.patch
          git diff --cached --check
          git -c user.name='RIPR release operator' \
              -c user.email='release-operator@example.invalid' \
              -c commit.gpgSign=false \
              commit -m 'test(lsp): complete isolated boundary-gap fixture coverage (#2371)'
          git push origin HEAD:refs/heads/fix/boundary-gap-fixtures-complete-2371
