name: Export #2371 source

on:
  push:
    branches:
      - fix/boundary-gap-fixtures-complete-2371

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the claimed branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - name: Upload the source module without mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: boundary-gap-tests-source
          path: crates/ripr/src/lsp/tests.rs
          if-no-files-found: error
          retention-days: 1
