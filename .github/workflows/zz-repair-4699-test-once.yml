name: Repair final-payload archive test once

on:
  push:
    branches:
      - feat/4521-final-native-payload

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4521-final-native-payload
          fetch-depth: 0

      - name: Reject invalid formats before repository-bound staging
        shell: python
        run: |
          import re
          from pathlib import Path

          release = Path("xtask/src/reports/release_server.rs")
          text = release.read_text(encoding="utf-8")
          old = '''    let archive = required_release_arg(args, "archive", "ARCHIVE")?;
              let version = normalize_release_version(&version);
          '''
          new = '''    let archive = required_release_arg(args, "archive", "ARCHIVE")?;
              if !matches!(archive.as_str(), "zip" | "tar.gz") {
                  return Err(format!(
                      "unsupported release server archive format `{archive}`"
                  ));
              }
              let version = normalize_release_version(&version);
          '''
          if text.count(old) != 1:
              raise SystemExit(f"release_server.rs: expected one insertion anchor, found {text.count(old)}")
          release.write_text(text.replace(old, new, 1), encoding="utf-8")

          tests = Path("xtask/src/tests.rs")
          text = tests.read_text(encoding="utf-8")
          pattern = re.compile(
              r'''#\[test\]\nfn release_server_archive_prepares_package_before_format_validation\(\) -> Result<\(\), String> \{.*?\n\}\n\n#\[test\]\nfn create_zip_archive_writes_flat_package_contents''',
              re.DOTALL,
          )
          replacement = '''#[test]
          fn release_server_archive_rejects_format_before_repository_bound_staging() -> Result<(), String> {
              with_temp_cwd("release-server-archive-invalid-format", |_root| {
                  let executable = if cfg!(windows) { "ripr.exe" } else { "ripr" };
                  let args = vec![
                      "--version".to_string(),
                      "v1.2.3".to_string(),
                      "--target".to_string(),
                      "x86_64-unknown-linux-gnu".to_string(),
                      "--executable".to_string(),
                      executable.to_string(),
                      "--archive".to_string(),
                      "bad-format".to_string(),
                  ];

                  let Err(err) = super::release_server_archive(&args) else {
                      return Err("unsupported archive format should fail".to_string());
                  };
                  assert!(err.contains("unsupported release server archive format"));
                  Ok(())
              })
          }

          #[test]
          fn create_zip_archive_writes_flat_package_contents'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"tests.rs: expected one obsolete archive test, found {count}")
          tests.write_text(text, encoding="utf-8")

      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format and prove focused repair
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 test -p xtask release_server_archive_rejects_format_before_repository_bound_staging -- --nocapture

      - name: Commit non-workflow repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtask/src/reports/release_server.rs xtask/src/tests.rs
          git commit -m "fix(distribution): validate archive format before staging"
          git push origin HEAD:feat/4521-final-native-payload
