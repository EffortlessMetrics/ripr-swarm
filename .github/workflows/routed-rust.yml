name: Routed Rust Small
run-name: ${{ github.event.label.name == 'merge-ready' && format('Merge-ready {0}/{1}/{2}', github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.sha) || format('Label metadata {0}', github.run_id) }}

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) || (github.event.label.name == 'merge-ready' && format('qualification-{0}-{1}', github.repository, github.event.pull_request.number) || format('metadata-{0}', github.run_id)) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Partial #8157 mitigation: interpret current attestations, not narrative tokens.
  # This does not authenticate a publisher or establish referenced proof custody.
  REVIEW_DISPOSITION_JQ: |
    def review_html_blocks:
      "(?i:address|article|aside|base|basefont|blockquote|body|caption|center|col|colgroup|dd|details|dialog|dir|div|dl|dt|fieldset|figcaption|figure|footer|form|frame|frameset|h[1-6]|head|header|hr|html|iframe|legend|li|link|main|menu|menuitem|nav|noframes|ol|optgroup|option|p|param|section|source|summary|table|tbody|td|tfoot|th|thead|title|tr|track|ul)";
    # GFM/CommonMark 0.29 block kinds 1-6 interrupt paragraphs; kind 7
    # (a complete standalone tag) does not. Declaration/CDATA case is exact.
    def review_html_interrupt:
      "(?:!--|!\\[CDATA\\[|\\?|![A-Z]|(?i:pre|script|style)(?=[\\s>]|$)|/?" + review_html_blocks + "(?=[\\s>]|/>|$))";
    # Backtick-fence info cannot contain backticks. Tilde info may contain them.
    # Reuse this rule for interruption and the remaining line-level fallback.
    def review_fence_open:
      "(?:`{3,}(?!`)[^`\n]*|~{3,}[^\n]*)";
    # Retain the CommonMark target's ASCII whitespace class for item content.
    # Unicode whitespace is literal content; marker separators remain space/tab.
    # The same class governs item recognition and inline paragraph interruption.
    def review_list_content:
      "[^ \t\r\n\u000b\u000c]";
    # Block indicators precede inline parsing. A code span can cross a soft
    # line break, never a blank line or an interrupting heading/fence/block.
    def review_inline_end:
      "[ \t]*(?:\n|\\z)| {0,3}(?:#{1,6}(?:[ \t]|$)|" + review_fence_open + "$|(?:=+|-+)[ \t]*$|(?:(?:-[ \t]*){3,}|(?:_[ \t]*){3,}|(?:\\*[ \t]*){3,})$|>|(?:[-+*]|1[.)])[ \t]+" + review_list_content + "|<" + review_html_interrupt + ")";
    # Complete tags require valid names, separated attributes and a value after
    # '='. Quoted values may contain angle brackets; unquoted values may not.
    # Closing tags have no attributes or self-closing slash.
    def review_html_open($name; $space; $single; $double):
      ("(?:[^\\s\"'=<>`]+|'" + $single + "*'|\"" + $double + "*\")") as $value |
      "<" + $name + "(?:" + $space + "+[A-Za-z_:][A-Za-z0-9_.:-]*(?:" + $space + "*=" + $space + "*" + $value + ")?)*" + $space + "*/?>";
    def review_html_tag($space; $single; $double):
      "[A-Za-z][A-Za-z0-9-]*" as $name |
      "(?:" + review_html_open($name; $space; $single; $double) + "|</" + $name + $space + "*>)";
    def review_html_standalone:
      review_html_tag("[ \t\u000b\u000c]"; "[^'\n]"; "[^\"\n]");
    def review_html_inline:
      ("(?:[ \t\u000b\u000c]|\n(?!" + review_inline_end + "))") as $space |
      review_html_tag($space; "(?:[^'\n]|\n(?!" + review_inline_end + "))"; "(?:[^\"\n]|\n(?!" + review_inline_end + "))");
    def review_html_context($line; $standalone):
      if ($line | test("^ {0,3}<(?i:pre|script|style)(?=[\\s>]|$)")) then {kind:"html",end:"(?i:</(?:pre|script|style)>)"}
      elif ($line | test("^ {0,3}<!--")) then {kind:"html",end:"-->"}
      elif ($line | test("^ {0,3}<\\?")) then {kind:"html",end:"\\?>"}
      elif ($line | test("^ {0,3}<![A-Z]")) then {kind:"html",end:">"}
      elif ($line | test("^ {0,3}<!\\[CDATA\\[")) then {kind:"html",end:"\\]\\]>"}
      elif ($line | test("^ {0,3}</?" + review_html_blocks + "(?=[\\s>]|/>|$)")) then {kind:"blank"}
      elif $standalone and ($line | test("^ {0,3}" + review_html_standalone + "[ \t]*$")) and
        ($line | test("^ {0,3}<(?i:code|textarea|xmp|noembed|noframes)(?=[\\s>]|/>)")) then
        ($line | capture("^ {0,3}<(?<name>code|textarea|xmp|noembed|noframes)"; "i")) as $tag |
        {kind:"html",end:("(?i:</" + $tag.name + "[ \t]*>)")}
      else null end;
    # List starts depend on the LAST MATCHED container. Only literal '1' and a
    # nonempty item interrupt a paragraph; every valid marker can start an item
    # after a quote/item prefix fails. Keep that lexical decision shared.
    def review_list_marker($paragraph):
      if test("^ {0,3}(?:(?:-[ \t]*){3,}|(?:_[ \t]*){3,}|(?:\\*[ \t]*){3,})$") then null
      elif test("^ {0,3}(?:[-+*]|[0-9]{1,9}[.)])(?:[ \t]+|$)") then
        capture("^(?<offset> {0,3})(?<marker>[-+*]|[0-9]{1,9}[.)])(?=[ \t]|$)(?<space>[ \t]*)(?<rest>.*)$") as $m |
        if $paragraph and (($m.marker | test("^(?:[-+*]|1[.)])$") | not) or ($m.rest | test(review_list_content) | not)) then null
        else
          (($m.offset|length) + ($m.marker|length)) as $width |
          (if ($m.space|length) == 0 or ($m.space|length) > 4 then 1 else ($m.space|length) end) as $padding |
          {marker:$m.marker,indent:($width+$padding),text: .[($width+$padding):]}
        end
      else null end;
    def review_container_start($paragraph):
      . as $line |
      test("^ {0,3}(?:#{1,6}(?:[ \t]|$)|" + review_fence_open + "$|(?:(?:-[ \t]*){3,}|(?:_[ \t]*){3,}|(?:\\*[ \t]*){3,})$|>)") or
      (review_list_marker($paragraph) != null) or
      (review_html_context($line; ($paragraph|not)) != null) or
      (($paragraph|not) and test("^ {0,3}" + review_html_standalone + "[ \t]*$"));
    def review_expand_tabs:
      reduce (explode[]) as $c ({column:0,text:""};
        if $c == 9 then (4 - (.column % 4)) as $n | .text += (" " * $n) | .column += $n
        else .text += ([$c]|implode) | .column += 1 end) | .text;
    def review_container_prefixes:
      .paragraph as $paragraph | (.text | review_list_marker($paragraph)) as $item |
      if (.text | test("^ {0,3}>")) then
        .text |= sub("^ {0,3}>[ \t]?"; "") |
        .containers += [{kind:"quote"}] | .paragraph = false | review_container_prefixes
      elif $item != null then
        .text = $item.text | .containers += [{kind:"list",indent:$item.indent,marker:$item.marker}] |
        .paragraph = false | review_container_prefixes
      else . end;
    def hide_review_containers:
      reduce (split("\n")[]) as $source
        ({containers:[],paragraph:false,block:null,lines:[]};
         .opaque = false | .tagmask = false |
         # Continue only prefixes owned by the current container stack. A partial
         # dedent closes the inner containers, not the still-indented outer ones.
         (reduce .containers[] as $c
           ({text:($source|review_expand_tabs),containers:[],failed:false};
            if .failed then .
            elif $c.kind == "quote" and (.text | test("^ {0,3}>")) then
              .text |= sub("^ {0,3}>[ \t]?"; "") | .containers += [$c]
            elif $c.kind == "list" and (.text | test("^ {" + ($c.indent|tostring) + "}")) then
              .text = .text[$c.indent:] | .containers += [$c]
            elif $c.kind == "list" and (.text | test("^[ \t]*$")) then .containers += [$c]
            else .failed = true end)) as $continued |
         # Match prefixes first, then recognize block starts in that context.
         # The still-open old paragraph is eligible for lazy text only AFTER
         # a new block failed to start at the last matching container.
         ($continued.text | review_container_start(false)) as $new_block |
         ($continued.failed and .paragraph and ($new_block|not) and
           ($continued.text | test("^[ \t]*$") | not)) as $lazy |
         if $lazy then
           .lines += [(if any(.containers[]; .kind == "quote") then ($source | gsub("."; "\u0003")) else $source end)]
         else
           .containers = $continued.containers |
           if $continued.failed then .block = null | .paragraph = false else . end |
           $continued.text as $content |
           # Opaque blocks consume literal markers rather than opening containers.
           if .block != null and
              (.block.kind != "indent" or ($content | test("^(?: {4}|\t)|^[ \t]*$"))) then
             .opaque = true | .block as $b |
             .tagmask = ($b.kind == "tag" and ($content | test("^[ \t]*$") | not)) |
             if (($b.kind == "blank" or $b.kind == "tag") and ($content | test("^[ \t]*$"))) or
                ($b.kind == "html" and ($content | test($b.end))) or
                ($b.kind == "fence" and ($content | test("^ {0,3}" + $b.char + "{" + ($b.size|tostring) + ",}[ \t]*$")))
             then .block = null else . end |
             .paragraph = false
           else
             .block = null |
             ({text:$content,containers:.containers,paragraph:.paragraph} | review_container_prefixes) as $opened |
             if ($opened.containers|length) > (.containers|length) then .paragraph = false else . end |
             .containers = $opened.containers |
             $opened.text as $line |
             review_html_context($line; (.paragraph|not)) as $html |
             if ($line | test("^[ \t]*$")) then .paragraph = false
             elif ($line | test("^ {0,3}" + review_fence_open + "$")) then
               ($line | capture("^ {0,3}(?<fence>`{3,}|~{3,})")) as $f |
               .block = {kind:"fence",char:$f.fence[0:1],size:($f.fence|length)} | .paragraph = false
             elif $html != null then
               .opaque = true | .block = $html | .paragraph = false |
               if $html.kind == "html" and ($line | test($html.end)) then .block = null else . end
             elif ($line | test("^ {0,3}#{1,6}(?:[ \t]|$)|^ {0,3}(?:(?:-[ \t]*){3,}|(?:_[ \t]*){3,}|(?:\\*[ \t]*){3,})$")) then .paragraph = false
             elif .paragraph and ($line | test("^ {0,3}(?:=+|-+)[ \t]*$")) then .paragraph = false
             elif (.paragraph|not) and ($line | test("^(?: {4}|\t)")) then .block = {kind:"indent"}
             elif (.paragraph|not) and ($line | test("^ {0,3}" + review_html_standalone + "[ \t]*$")) then
               .tagmask = true | .block = {kind:"tag"} | .paragraph = false
             else .paragraph = true end
           end |
           .lines += [(if .tagmask or any(.containers[]; .kind == "quote") or
           ((.containers|length) > 0 and (.opaque or .block != null))
           then ($source | gsub("."; "\u0003")) else $source end)]
         end) | .lines | join("\n");
    # Match opaque regions together, in source order: syntax inside an earlier
    # code/HTML region cannot open a different region outside it. Keep newlines
    # and a nonblank sentinel so masking never invents a first-line declaration.
    def hide_review_examples:
      hide_review_containers | gsub("(?ms)(?<hidden>" +
        "^ {0,3}(?<bt>`{3,})(?!`)[^`\n]*\n.*?(?:(?<bt_end>^ {0,3}\\k<bt>`*[ \t]*)(?=\n|\\z)|\\z)" +
        "|^ {0,3}(?<tilde>~{3,})(?!~)[^\n]*\n.*?(?:(?<tilde_end>^ {0,3}\\k<tilde>~*[ \t]*)(?=\n|\\z)|\\z)" +
        "|^(?: {4}|\t)[^\n]*(?:\n(?:(?: {4}|\t)[^\n]*|[ \t]*(?=\n)))*" +
        "|^ {0,3}#{1,6}(?:[ \t]+[^\n]*|(?=\n|\\z))" +
        "|(?<![\\\\`])(?:\\\\\\\\)*(?<ticks>`+)(?!`)(?:[^\n]|\n(?!" + review_inline_end + "))*?(?<!`)\\k<ticks>(?!`)" +
        "|(?<!\\\\)(?:\\\\\\\\)*(?:<!--.*?(?:-->|\\z)|<!\\[CDATA\\[.*?(?:\\]\\]>|\\z)|<\\?.*?(?:\\?>|\\z))" +
        "|(?<!\\\\)(?:\\\\\\\\)*<![A-Z].*?(?:>|\\z)" +
        "|(?<!\\\\)(?:\\\\\\\\)*<(?i:pre|script|style)(?=[\\s>]|$).*?(?:(?i:</(?:pre|script|style)>)|\\z)" +
        "|(?<!\\\\)(?:\\\\\\\\)*" + review_html_open("(?i:(?<tag>code|textarea|xmp|iframe|noembed|noframes))"; "[ \t\u000b\u000c]"; "[^'\n]"; "[^\"\n]") + ".*?(?:(?i:</\\k<tag>[ \t]*>)|\\z)" +
        "|^ {0,3}</?(?:" + review_html_blocks + ")(?=[\\s>]|/>|$).*?(?=\n[ \t]*\n|\\z)" +
        "|(?<!\\\\)(?:\\\\\\\\)*" + review_html_inline +
        ")";
        if (.bt != null and .bt_end == null) or (.tilde != null and .tilde_end == null)
        then "\u0002" else (.hidden | gsub("[^\n]"; "\u0001")) end);
    def current_comment_ready:
      if type != "string" then error("review body must be a string") else
        (gsub("\r\n"; "\n") | hide_review_examples) as $visible |
        reduce ($visible | split("\n")[]) as $line
          ({first:true, fence:null, dispositions:[]};
           if .fence != null then
             .fence as $fence |
             if ($line | test("^ {0,3}" + $fence.char + "{" + ($fence.size|tostring) + ",}[ \t]*$"))
             then .fence = null else . end
           elif ($line | test("^[ \t]*$")) then .
           elif ($line | test("^ {0,3}" + review_fence_open + "$")) then
             ($line | capture("^ {0,3}(?<fence>`{3,}|~{3,})")) as $match |
             .first = false | .fence = {char:$match.fence[0:1], size:($match.fence|length)}
           elif ($line | test("^( {4}|\t)")) then .first = false
           else
             (if .first and ($line | test("^ {0,3}(SOURCE_REVIEW_READY|REVIEW_READY)([^A-Za-z0-9_]|$)"))
              then .dispositions += ["positive"] else . end) |
             (if ($line | test("^disposition:[ \t]*")) then
                .dispositions += [(if ($line | test("^disposition:[ \t]*(SOURCE_REVIEW_READY|REVIEW_READY)[ \t]*$"))
                                    then "positive" else "refuse" end)]
              else . end) | .first = false
           end) |
        ($visible | contains("\u0002") | not) and
        .fence == null and (.dispositions | length > 0 and all(. == "positive"))
      end;

jobs:
  admission:
    if: github.event_name == 'pull_request'
    name: Live merge-ready preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.preflight.outputs.execute }}
      prior_result: ${{ steps.preflight.outputs.prior_result }}
      tree: ${{ steps.preflight.outputs.tree }}
    steps:
      - name: Reconcile native request and current readiness
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBJECT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          if [ "$ACTION" != labeled ] || [ "${LABEL,,}" != merge-ready ]; then
            printf 'execute=false\nprior_result=nonrequest\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REPOSITORY" = EffortlessMetrics/ripr-swarm && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          for sha in "$HEAD_SHA" "$BASE_SHA" "$SUBJECT_SHA"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          permission=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo 'Untrusted request actor' >&2; exit 1;; esac
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repo "$REPOSITORY" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg subject "$SUBJECT_SHA" '
            .state == "open" and .draft == false and .head.repo.full_name == $repo and
            .head.sha == $head and .base.sha == $base and .base.ref == "main" and
            .mergeable == true and .merge_commit_sha == $subject and
            any(.labels[]; (.name | ascii_downcase) == "merge-ready")' <<< "$pr" >/dev/null
          reviews=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          author=$(jq -r .user.login <<< "$pr")
          jq -s -e --arg head "$HEAD_SHA" --arg author "$author" "$REVIEW_DISPOSITION_JQ"'
            [ .[][] ] as $reviews |
            ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
              group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
            all($dispositions[]; .state != "CHANGES_REQUESTED") and
            (any($dispositions[]; .commit_id == $head and .state == "APPROVED") or
             any($reviews | group_by(.user.login) | map(max_by(.submitted_at))[];
               .commit_id == $head and .state == "COMMENTED" and
               (.body | current_comment_ready)))' <<< "$reviews" >/dev/null
          cursor=null
          while :; do
            threads=$(gh api graphql -f query='query($number:Int!,$cursor:String){repository(owner:"EffortlessMetrics",name:"ripr-swarm"){pullRequest(number:$number){reviewThreads(first:100,after:$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}' -F number="$PR_NUMBER" -F cursor="$cursor")
            jq -e '.errors == null and (.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true))' <<< "$threads" >/dev/null
            more=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | tostring' <<< "$threads")
            [ "$more" = true ] || break
            cursor=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(length > 0)' <<< "$threads")
          done
          commit=$(gh api "repos/$REPOSITORY/git/commits/$SUBJECT_SHA")
          jq -e --arg head "$HEAD_SHA" --arg base "$BASE_SHA" '.parents | map(.sha) == [$base, $head]' <<< "$commit" >/dev/null
          tree=$(jq -er '.tree.sha | select(test("^[0-9a-f]{40}$"))' <<< "$commit")
          key="Merge-ready $HEAD_SHA/$BASE_SHA/$SUBJECT_SHA"
          workflow_file=${GITHUB_WORKFLOW_REF#*/.github/workflows/}
          workflow_file=${workflow_file%%@*}
          workflow_id=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" --jq .id)
          runs=$(gh api --paginate "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")
          prior=$(jq -sr --arg key "$key" --arg head "$HEAD_SHA" --argjson workflow "$workflow_id" --argjson number "$GITHUB_RUN_NUMBER" '
            [ .[].workflow_runs[] | select(.workflow_id == $workflow and .head_sha == $head and
              .display_title == $key and .run_number < $number) ] | sort_by(.run_number) | last // empty' <<< "$runs")
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
          if [ -n "$prior" ]; then
            [ "$(jq -r .status <<< "$prior")" = completed ] || { echo 'Prior request still pending/running; no relaunch' >&2; exit 1; }
            prior_id=$(jq -er .id <<< "$prior")
            jobs=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$prior_id/jobs?per_page=100")
            result=$(jq -sr '[.[].jobs[] | select(.name == "Ripr Rust Small Result" and .status == "completed")] |
              if length == 1 then .[0].conclusion else "missing" end' <<< "$jobs")
            case "$result" in success|failure) ;; *) echo 'Missing/incomplete prior required result' >&2; exit 1;; esac
            printf 'execute=false\nprior_result=%s\n' "$result" >> "$GITHUB_OUTPUT"
          else
            printf 'execute=true\nprior_result=none\n' >> "$GITHUB_OUTPUT"
          fi

  route:
    needs: [admission]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        needs.admission.result == 'success' &&
        needs.admission.outputs.execute == 'true'))
    name: Route Ripr Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      router_target: ${{ steps.route.outputs.router_target }}
      router_reason: ${{ steps.route.outputs.router_reason }}
      repo: ${{ steps.route.outputs.repo }}
      workflow: ${{ steps.route.outputs.workflow }}
      run_id: ${{ steps.route.outputs.run_id }}
      runner_query: ${{ steps.route.outputs.runner_query }}
      runner_total: ${{ steps.route.outputs.runner_total }}
      cx43_online: ${{ steps.route.outputs.cx43_online }}
      cx43_idle_ready: ${{ steps.route.outputs.cx43_idle_ready }}
      cpx42_online: ${{ steps.route.outputs.cpx42_online }}
      cpx42_idle_ready: ${{ steps.route.outputs.cpx42_idle_ready }}
      cx53_online: ${{ steps.route.outputs.cx53_online }}
      cx53_idle_ready: ${{ steps.route.outputs.cx53_idle_ready }}
    steps:
      - name: Select runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          target=github reason=runner_api_failed runner_query=not_attempted runner_total=not_available
          cx43_online=not_available cx43_idle_ready=not_available cpx42_online=not_available cpx42_idle_ready=not_available cx53_online=not_available cx53_idle_ready=not_available
          count() { printf '%s' "$runners" | jq -s "$1"; }
          idle() { printf '%s' "$runners" | jq -s -e --arg model "$1" --arg cap "$2" '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index($model) and index($cap)))] | length > 0' >/dev/null; }
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            reason=fork_or_untrusted_pr runner_query=skipped_untrusted_pr
          elif runners="$(gh api --paginate 'orgs/EffortlessMetrics/actions/runners?per_page=100' 2>/tmp/runners.err)"; then
            runner_query=ok
            runner_total="$(count '[.[].runners[]?] | length')"
            cx43_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43")))] | length')"
            cx43_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43") and index("rust-medium")))] | length')"
            cpx42_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42")))] | length')"
            cpx42_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42") and index("rust-16gb")))] | length')"
            cx53_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53")))] | length')"
            cx53_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53") and index("rust-large")))] | length')"
            if idle cx43 rust-medium; then target=cx43 reason=cx43_idle
            elif idle cpx42 rust-16gb; then target=cpx42 reason=cpx42_idle
            elif idle cx53 rust-large; then target=cx53 reason=cx53_idle
            elif [ "$cx43_online$cx43_idle_ready$cpx42_online$cpx42_idle_ready$cx53_online$cx53_idle_ready" != "000000" ]; then reason=runner_capacity_unavailable
            else reason=no_idle_runner
            fi
          else
            runner_query=failed reason=runner_api_failed
          fi
          { echo "router_target=$target"; echo "router_reason=$reason"; repo=$REPOSITORY workflow=routed-rust run_id=$RUN_ID; for name in repo workflow run_id runner_query runner_total cx43_online cx43_idle_ready cpx42_online cpx42_idle_ready cx53_online cx53_idle_ready; do echo "$name=${!name}"; done; } >> "$GITHUB_OUTPUT"
          { echo "### Ripr Rust Small Router"; echo ""; echo "- repo: \`$REPOSITORY\`"; echo "- workflow: \`routed-rust\`"; echo "- run: \`$RUN_ID\`"; echo "- target: \`$target\`"; echo "- reason: \`$reason\`"; for row in "runner query:$runner_query" "visible runners:$runner_total" "cx43 online:$cx43_online" "cx43 idle ready:$cx43_idle_ready" "cpx42 online:$cpx42_online" "cpx42 idle ready:$cpx42_idle_ready" "cx53 online:$cx53_online" "cx53 idle ready:$cx53_idle_ready"; do echo "- ${row%%:*}: \`${row#*:}\`"; done; } >> "$GITHUB_STEP_SUMMARY"

  detect-docs-only:
    needs: [admission]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        needs.admission.result == 'success' &&
        needs.admission.outputs.execute == 'true'))
    name: Detect Docs-Only Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check whether every changed file is docs/spec/markdown
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false reason=not_pull_request
          classify() {
            [ "$EVENT_NAME" = "pull_request" ] || return 0
            reason=missing_identity
            [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || return 0
            reason=invalid_identity
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || return 0
            # Checkout stays on the integration commit. Full history is requested
            # above; recover missing event objects with their ancestry, not depth 1.
            reason=unavailable_history
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || return 0
            fi
            [ "$(git rev-parse --is-shallow-repository)" = "false" ] || return 0
            [ "$(git cat-file -t "$BASE_SHA" 2>/dev/null)" = "commit" ] && [ "$(git cat-file -t "$HEAD_SHA" 2>/dev/null)" = "commit" ] || return 0
            reason=unavailable_merge_base
            merge_bases="$(git merge-base --all "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)" || return 0
            [ -n "$merge_bases" ] || return 0
            reason=ambiguous_merge_base
            [[ "$merge_bases" != *$'\n'* ]] || return 0
            changed="$(mktemp)"
            trap 'rm -f "$changed"' EXIT
            reason=diff_failed
            # No rename collapsing: both the removed and added path must qualify.
            # Read only successful output; a failing diff may have written paths.
            git diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" > "$changed" 2>/dev/null || return 0
            reason=empty_diff
            [ -s "$changed" ] || return 0
            reason=non_docs
            while IFS= read -r -d '' path; do
              case "$path" in
                CHANGELOG.md|Cargo.toml|Cargo.lock|crates/ripr/Cargo.toml|docs/OUTPUT_SCHEMA.md) reason=release_surface; return 0 ;;
                docs/specs/*|docs/handoffs/*|*.md) ;;
                *) return 0 ;;
              esac
            done < "$changed"
            docs_only=true reason=docs_only
          }
          classify
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          { echo "### Docs-Only Surface Detection"; echo ""; echo "- docs_only: \`$docs_only\`"; echo "- reason: \`$reason\`"; } >> "$GITHUB_STEP_SUMMARY"

  rust-cx43:
    name: Ripr Rust Small on CX43
    needs: [route, detect-docs-only]
    if: >-
      !cancelled() &&
      needs.route.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.route.outputs.router_target == 'cx43' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx43","rust-medium","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 35
      use-scratch: true
      artifact-name: ripr-rust-small-cx43
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  rust-cpx42:
    name: Ripr Rust Small on CPX42
    needs: [route, detect-docs-only]
    if: >-
      !cancelled() &&
      needs.route.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.route.outputs.router_target == 'cpx42' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cpx42","rust-medium","rust-16gb","trusted-pr"]}'
      cargo-build-jobs: "8"
      disk-guard-threshold: 35
      use-scratch: true
      artifact-name: ripr-rust-small-cpx42
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  rust-cx53:
    name: Ripr Rust Small on CX53
    needs: [route, detect-docs-only]
    if: >-
      !cancelled() &&
      needs.route.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.route.outputs.router_target == 'cx53' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx53","rust-large","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 50
      use-scratch: true
      artifact-name: ripr-rust-small-cx53
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  rust-github:
    name: Ripr Rust Small on GitHub Hosted
    needs: [route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53]
    # Use the not-cancelled status check here, never the unconditional one:
    # both still run after a skipped or tempfailed self-hosted job, but an
    # unconditional job also survives cancellation, so a second Ready
    # transition left the obsolete head's full gate running and queued the
    # new head's run behind it (#6729).
    if: >-
      !cancelled() &&
      needs.route.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.detect-docs-only.outputs.docs_only != 'true' &&
      (needs.route.outputs.router_target == 'github' ||
      (needs.route.outputs.router_target == 'cx43' && needs.rust-cx43.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cpx42' && needs.rust-cpx42.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cx53' && needs.rust-cx53.outputs.scratch_status == 'tempfail'))
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '"ubuntu-latest"'
      cargo-build-jobs: "8"
      disk-guard-threshold: 0
      use-scratch: false
      artifact-name: ripr-rust-small-github
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

  docs-gate:
    name: Ripr Docs Gate
    needs: [detect-docs-only]
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.detect-docs-only.result == 'success' &&
      needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-docs-gate
      - name: Doc/spec gates (full precommit table)
        env:
          RIPR_POLICY_PREFLIGHT_RECEIPT: target/ripr/reports/policy-preflight.json
        run: |
          cargo policy preflight
          cargo xtask precommit
      - name: Upload docs-gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-docs-gate
          path: target/ripr/reports/
          if-no-files-found: ignore
          retention-days: 5

  windows-subset:
    needs: [admission]
    if: needs.admission.outputs.execute == 'true'
    uses: ./.github/workflows/windows-subset-qualification.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      subject_sha: ${{ github.sha }}
      subject_tree: ${{ needs.admission.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

  python-wheel:
    needs: [admission]
    if: needs.admission.outputs.execute == 'true'
    uses: ./.github/workflows/python-wheel-qualification.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      subject_sha: ${{ github.sha }}
      subject_tree: ${{ needs.admission.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

  ci-feature:
    needs: [admission]
    if: needs.admission.outputs.execute == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      subject_sha: ${{ github.sha }}
      subject_tree: ${{ needs.admission.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

      # Conservative frozen intent: applicability is not narrowed in this source stage.
      run_rust_only: true
      run_release_proof: true
      run_msrv: true
      run_vscode: true

  printed-command:
    needs: [admission]
    if: needs.admission.outputs.execute == 'true'
    uses: ./.github/workflows/printed-command-paste.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      subject_sha: ${{ github.sha }}
      subject_tree: ${{ needs.admission.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

  result:
    name: ${{ ((github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready')) && 'Ripr Rust Small Result' || 'Merge-ready Nonrequest' }}
    needs: [admission, route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53, rust-github, docs-gate, windows-subset, python-wheel, ci-feature, printed-command]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recheck current head and base before result publication
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBJECT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          readiness_refused() { # Advisory diagnostics preserve the original status.
            local status=$? diagnostic='{"payload":"not-read"}'
            trap - ERR
            set +e
            printf 'readiness_refusal phase=%s status=%s\n' "$readiness_phase" "$status" >&2
            case "$readiness_phase" in
              pull-request-check)
                diagnostic=$(jq -cs --arg repo "$REPOSITORY" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg subject "$SUBJECT_SHA" '
                  def check(f): try f catch "unreadable";
                  def sha: if type == "string" and test("^[0-9a-f]{40}$") then . else null end;
                  .[0] as $pr | {payload:(if length == 0 then "missing" else ($pr | type) end),
                   expected:{head:$head,base:$base,subject:$subject}, checks:($pr | {
                     open: check(.state == "open"), non_draft: check(.draft == false),
                     same_repository: check(.head.repo.full_name == $repo), main_base: check(.base.ref == "main"),
                     mergeable: check(.mergeable == true), exact_head: check(.head.sha == $head),
                     exact_base: check(.base.sha == $base), exact_subject: check(.merge_commit_sha == $subject),
                     merge_ready: check(any(.labels[]; (.name | ascii_downcase) == "merge-ready"))}),
                   observed:($pr | {head:check(.head.sha | sha),base:check(.base.sha | sha),subject:check(.merge_commit_sha | sha)})}' <<< "${pr-}" 2>/dev/null) || diagnostic='{"payload":"invalid-json-or-shape"}'
                ;;
              reviews-check)
                diagnostic=$(jq -cs --arg head "$HEAD_SHA" "$REVIEW_DISPOSITION_JQ"'
                  [ .[][] ] as $reviews |
                  ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
                    group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
                  ($reviews | group_by(.user.login) | map(max_by(.submitted_at))) as $latest |
                  {payload:"review-pages", pages:length, latest_count:($latest | length),
                   latest_ids:($latest | map(.id | if type == "number" then . else null end) | .[:20]),
                   checks:{no_changes_requested:all($dispositions[]; .state != "CHANGES_REQUESTED"),
                     current_head_approved:any($dispositions[]; .commit_id == $head and .state == "APPROVED"),
                     current_head_marker:any($latest[];
                       .commit_id == $head and .state == "COMMENTED" and
                       (.body | current_comment_ready))}}' <<< "${reviews-}" 2>/dev/null) || diagnostic='{"payload":"invalid-json-or-shape"}'
                ;;
              threads-check|threads-page-parse|threads-cursor-parse)
                diagnostic=$(jq -cs '
                  def check(f): try f catch "unreadable";
                  .[0] as $page | {payload:(if length == 0 then "missing" else ($page | type) end),
                   checks:($page | {no_graphql_errors:check(.errors == null),
                     all_resolved:check(.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true)),
                     next_page_boolean:check(.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type == "boolean"),
                     cursor_nonempty:check(.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | type == "string" and length > 0)}),
                   unresolved_count:($page | check([.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved != true)] | length))}' <<< "${threads-}" 2>/dev/null) || diagnostic='{"payload":"invalid-json-or-shape"}'
                ;;
            esac
            printf 'readiness_detail=%s\n' "$diagnostic" >&2
            exit "$status"
          }
          trap readiness_refused ERR
          [ "${LABEL,,}" = merge-ready ] || exit 0
          readiness_phase=pull-request-fetch
          pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER")
          readiness_phase=pull-request-check
          jq -e --arg repo "$REPOSITORY" --arg head "$HEAD_SHA" --arg base "$BASE_SHA" --arg subject "$SUBJECT_SHA" '
            .state == "open" and .draft == false and .head.repo.full_name == $repo and .base.ref == "main" and
            .mergeable == true and .head.sha == $head and .base.sha == $base and
            .merge_commit_sha == $subject and any(.labels[]; (.name | ascii_downcase) == "merge-ready")' <<< "$pr" >/dev/null
          readiness_phase=reviews-fetch
          reviews=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          readiness_phase=author-parse
          author=$(jq -r .user.login <<< "$pr")
          readiness_phase=reviews-check
          jq -s -e --arg head "$HEAD_SHA" --arg author "$author" "$REVIEW_DISPOSITION_JQ"'
            [ .[][] ] as $reviews |
            ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
              group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
            all($dispositions[]; .state != "CHANGES_REQUESTED") and
            (any($dispositions[]; .commit_id == $head and .state == "APPROVED") or
             any($reviews | group_by(.user.login) | map(max_by(.submitted_at))[];
               .commit_id == $head and .state == "COMMENTED" and
               (.body | current_comment_ready)))' <<< "$reviews" >/dev/null
          cursor=null
          while :; do
            readiness_phase=threads-fetch
            threads=$(gh api graphql -f query='query($number:Int!,$cursor:String){repository(owner:"EffortlessMetrics",name:"ripr-swarm"){pullRequest(number:$number){reviewThreads(first:100,after:$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}' -F number="$PR_NUMBER" -F cursor="$cursor")
            readiness_phase=threads-check
            jq -e '.errors == null and (.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true))' <<< "$threads" >/dev/null
            readiness_phase=threads-page-parse
            more=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | tostring' <<< "$threads")
            [ "$more" = true ] || break
            readiness_phase=threads-cursor-parse
            cursor=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(length > 0)' <<< "$threads")
          done
      - name: Summarize routed result
        env:
          REF: ${{ github.ref }}
          LABEL: ${{ github.event.label.name }}
          ADMISSION_RESULT: ${{ needs.admission.result }}
          EXECUTE: ${{ needs.admission.outputs.execute }}
          PRIOR_RESULT: ${{ needs.admission.outputs.prior_result }}
          WINDOWS_RESULT: ${{ needs.windows-subset.result }}
          PASTE_RESULT: ${{ needs.printed-command.result }}
          CI_RESULT: ${{ needs.ci-feature.result }}
          WHEEL_RESULT: ${{ needs.python-wheel.result }}
          TARGET: ${{ needs.route.outputs.router_target }}
          REASON: ${{ needs.route.outputs.router_reason }}
          ROUTE_RESULT: ${{ needs.route.result }}
          CX43_RESULT: ${{ needs.rust-cx43.result }}
          CPX42_RESULT: ${{ needs.rust-cpx42.result }}
          CX53_RESULT: ${{ needs.rust-cx53.result }}
          GITHUB_RESULT: ${{ needs.rust-github.result }}
          CX43_SCRATCH_STATUS: ${{ needs.rust-cx43.outputs.scratch_status }}
          CPX42_SCRATCH_STATUS: ${{ needs.rust-cpx42.outputs.scratch_status }}
          CX53_SCRATCH_STATUS: ${{ needs.rust-cx53.outputs.scratch_status }}
          CX43_SCRATCH_MESSAGE: ${{ needs.rust-cx43.outputs.scratch_message }}
          CPX42_SCRATCH_MESSAGE: ${{ needs.rust-cpx42.outputs.scratch_message }}
          CX53_SCRATCH_MESSAGE: ${{ needs.rust-cx53.outputs.scratch_message }}
          RUNNER_QUERY: ${{ needs.route.outputs.runner_query }}
          RUNNER_TOTAL: ${{ needs.route.outputs.runner_total }}
          CX43_ONLINE: ${{ needs.route.outputs.cx43_online }}
          CX43_IDLE_READY: ${{ needs.route.outputs.cx43_idle_ready }}
          CPX42_ONLINE: ${{ needs.route.outputs.cpx42_online }}
          CPX42_IDLE_READY: ${{ needs.route.outputs.cpx42_idle_ready }}
          CX53_ONLINE: ${{ needs.route.outputs.cx53_online }}
          CX53_IDLE_READY: ${{ needs.route.outputs.cx53_idle_ready }}
          EVENT_NAME: ${{ github.event_name }}
          DOCS_DETECT_RESULT: ${{ needs.detect-docs-only.result }}
          DOCS_ONLY: ${{ needs.detect-docs-only.outputs.docs_only }}
          DOCS_GATE_RESULT: ${{ needs.docs-gate.result }}
        run: |
          case "$EVENT_NAME:$REF" in
            push:refs/heads/main|push:refs/heads/master|workflow_dispatch:*)
              [ "$ADMISSION_RESULT" = skipped ] || { echo 'Legacy profile must skip PR admission' >&2; exit 1; }
              for result in "$WINDOWS_RESULT" "$PASTE_RESULT" "$CI_RESULT" "$WHEEL_RESULT"; do
                [ "$result" = skipped ] || { echo 'Legacy profile must skip PR-only leaves' >&2; exit 1; }
              done
              ;;
            pull_request:*)
              [ "${LABEL,,}" = merge-ready ] || exit 0
              [ "$ADMISSION_RESULT" = success ] || { echo 'Admission missing/failed' >&2; exit 1; }
              if [ "$EXECUTE" = false ]; then
                [ "$PRIOR_RESULT" = success ] || { echo 'Prior required result failed; no implicit retry' >&2; exit 1; }
                exit 0
              fi
              [ "$EXECUTE" = true ] || { echo 'Incomplete native request' >&2; exit 1; }
              [ "$WINDOWS_RESULT" = success ] || { echo 'Selected Windows evidence missing/failed' >&2; exit 1; }
              [ "$PASTE_RESULT" = success ] || { echo 'Selected printed-command evidence missing/failed' >&2; exit 1; }
              [ "$CI_RESULT" = success ] || { echo 'Selected CI evidence missing/failed' >&2; exit 1; }
              [ "$WHEEL_RESULT" = success ] || { echo 'Selected wheel evidence missing/failed' >&2; exit 1; }
              ;;
            *) echo 'Unsupported qualification event profile' >&2; exit 1 ;;
          esac
          status=pass
          message="selected implementation job succeeded"
          if [ "$DOCS_DETECT_RESULT" != "success" ]; then
            status=fail
            message="docs-surface detection result was $DOCS_DETECT_RESULT"
          elif [ "$DOCS_ONLY" = "true" ] && [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$DOCS_GATE_RESULT" = "success" ]; then
              message="docs-only surface; heavy lanes skipped; docs-gate passed"
            else
              status=fail
              message="docs-gate result was $DOCS_GATE_RESULT on a docs-only PR"
            fi
          elif [ "$ROUTE_RESULT" != "success" ]; then
            status=fail
            message="route job result was $ROUTE_RESULT"
          else
            case "$TARGET" in
              cx43)
                if [ "$CX43_RESULT" = "success" ]; then
                  message="CX43 job succeeded"
                elif [ "$CX43_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ]; then
                  message="CX43 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CX43 job result was $CX43_RESULT"
                fi
                ;;
              cpx42)
                if [ "$CPX42_RESULT" = "success" ]; then
                  message="CPX42 job succeeded"
                elif [ "$CPX42_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ]; then
                  message="CPX42 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CPX42 job result was $CPX42_RESULT"
                fi
                ;;
              cx53)
                if [ "$CX53_RESULT" = "success" ]; then
                  message="CX53 job succeeded"
                elif [ "$CX53_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ]; then
                  message="CX53 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CX53 job result was $CX53_RESULT"
                fi
                ;;
              github) [ "$GITHUB_RESULT" = "success" ] || { status=fail; message="GitHub-hosted job result was $GITHUB_RESULT"; } ;;
              *) status=fail; message="unknown routed target: $TARGET" ;;
            esac
          fi
          echo "### Ripr Rust Small Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for row in "target:$TARGET" "reason:$REASON" "docs_detect:$DOCS_DETECT_RESULT" "docs_only:$DOCS_ONLY" "docs_gate:$DOCS_GATE_RESULT" "status:$status" "message:$message" "route:$ROUTE_RESULT" "cx43:$CX43_RESULT" "cpx42:$CPX42_RESULT" "cx53:$CX53_RESULT" "github:$GITHUB_RESULT" "cx43 scratch:$CX43_SCRATCH_STATUS" "cpx42 scratch:$CPX42_SCRATCH_STATUS" "cx53 scratch:$CX53_SCRATCH_STATUS" "cx43 scratch message:$CX43_SCRATCH_MESSAGE" "cpx42 scratch message:$CPX42_SCRATCH_MESSAGE" "cx53 scratch message:$CX53_SCRATCH_MESSAGE" "runner query:$RUNNER_QUERY" "visible runners:$RUNNER_TOTAL" "cx43 online:$CX43_ONLINE" "cx43 idle ready:$CX43_IDLE_READY" "cpx42 online:$CPX42_ONLINE" "cpx42 idle ready:$CPX42_IDLE_READY" "cx53 online:$CX53_ONLINE" "cx53 idle ready:$CX53_IDLE_READY"; do
            echo "- ${row%%:*}: \`${row#*:}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$status" = "pass" ]
      # Re-evaluate cancellation after readiness and aggregation, including reuse.
      # The explicit status functions keep this rejection reachable after failure.
      - name: Reject workflow cancellation before final result
        if: always() && cancelled()
        run: |
          echo 'Workflow cancelled; required result cannot succeed' >&2
          exit 1
