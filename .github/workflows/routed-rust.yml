name: Routed Rust Small
run-name: ${{ github.event.label.name == 'merge-ready' && format('Merge-ready event provenance {0}/{1}/{2}', github.event.pull_request.head.sha, github.event.pull_request.base.sha, github.sha) || format('Label metadata {0}', github.run_id) }}

on:
  pull_request:
    types: [labeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name != 'pull_request' && format('{0}-{1}-{2}', github.workflow, github.ref, github.event_name) || (github.event.label.name == 'merge-ready' && format('qualification-{0}-{1}', github.repository, github.event.pull_request.number) || format('metadata-{0}', github.run_id)) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NATIVE_SUBJECT_QUERY: |
    query($number:Int!){repository(owner:"EffortlessMetrics",name:"ripr-swarm"){id nameWithOwner ref(qualifiedName:"refs/heads/main"){name prefix target{__typename oid}} pullRequest(number:$number){id number headRefOid headRepository{id} baseRefName baseRefOid baseRepository{id} baseRef{name prefix repository{id} target{__typename oid}} potentialMergeCommit{oid tree{oid} parents(first:3){nodes{oid}pageInfo{hasNextPage}}}}}}
  NATIVE_SUBJECT_JQ: |
    def oid: type == "string" and test("^[0-9a-f]{40}$");
    (.errors == null and (.data.repository != null)) as $ok |
    if $ok then .data.repository as $r | $r.pullRequest as $p |
      if ($r.id == $repo_id and $r.nameWithOwner == $repo and
          $p.id == $pr_id and $p.number == $number and $p.headRepository.id == $repo_id and
          $p.headRefOid == $head and $p.baseRepository.id == $repo_id and
          $p.baseRefName == "main" and $p.baseRef.name == "main" and
          $p.baseRef.prefix == "refs/heads/" and $p.baseRef.repository.id == $repo_id and
          $p.baseRef.target.__typename == "Commit" and ($p.baseRef.target.oid | oid) and
          $r.ref.name == "main" and $r.ref.prefix == "refs/heads/" and
          $r.ref.target.__typename == "Commit" and $r.ref.target.oid == $p.baseRef.target.oid and
          $p.potentialMergeCommit.oid == $merge and ($p.potentialMergeCommit.tree.oid | oid) and
          $p.potentialMergeCommit.parents.pageInfo.hasNextPage == false and
          ([$p.potentialMergeCommit.parents.nodes[].oid] == [$p.baseRef.target.oid,$head])) then
        {version:2,repository_id:$repo_id,repository:$repo,pr_id:$pr_id,pr_number:$number,
         destination_repository_id:$repo_id,destination_ref:"refs/heads/main",
         head:$head,base:$p.baseRef.target.oid,merge:$merge,tree:$p.potentialMergeCommit.tree.oid,
         parents:[$p.baseRef.target.oid,$head],workflow_generation:$generation}
      else error("incoherent live qualification subject") end
    else error("missing/error identity response") end
  # Partial #8157 mitigation: interpret current attestations, not narrative tokens.
  # This does not authenticate a publisher or establish referenced proof custody.
  REVIEW_DISPOSITION_JQ: |
    def current_comment_ready:
      if type != "string" then error("review body must be a string") else
        reduce (gsub("\r\n"; "\n") | split("\n")[]) as $line
          ({first:true, fence:null, quoted:false, dispositions:[]};
           if .fence != null then
             .fence as $fence |
             if ($line | test("^ {0,3}" + $fence.char + "{" + ($fence.size|tostring) + ",}[ \t]*$"))
             then .fence = null else . end
           elif ($line | test("^[ \t]*$")) then .quoted = false
           elif ($line | test("^ {0,3}>")) then .first = false | .quoted = true
           elif .quoted then .first = false
           elif ($line | test("^ {0,3}(`{3,}|~{3,})")) then
             ($line | capture("^ {0,3}(?<fence>`{3,}|~{3,})")) as $match |
             .first = false | .fence = {char:$match.fence[0:1], size:($match.fence|length)}
           elif ($line | test("^( {4}|\t)")) then .first = false
           else
             (if .first and ($line | test("^ {0,3}(SOURCE_REVIEW_READY|REVIEW_READY)([^A-Za-z0-9_]|$)"))
              then .dispositions += ["positive"] else . end) |
             (if ($line | test("^disposition:[ \t]*")) then
                .dispositions += [(if ($line | test("^disposition:[ \t]*(SOURCE_REVIEW_READY|REVIEW_READY)[ \t]*$"))
                                    then "positive" else "refuse" end)]
              else . end) | .first = false
           end) |
        .fence == null and (.dispositions | length > 0 and all(. == "positive"))
      end;

  NATIVE_REQUEST_JQ: |
    .node_id == $pr_id and .number == $number and .state == "open" and .draft == false and
    .head.repo.node_id == $repo_id and .head.repo.full_name == $repo and .head.sha == $head and
    .base.repo.node_id == $repo_id and .base.ref == "main" and
    any(.labels[]; (.name | ascii_downcase) == "merge-ready")
  NATIVE_COMMIT_JQ: |
    .sha == $merge and .tree.sha == $tree and (.parents | map(.sha) == [$base,$head])
  QUALIFICATION_SUBJECT_JQ: |
    def oid: type == "string" and test("^[0-9a-f]{40}$");
    . as $q | if (($q.base | oid) and ($q.tree | oid)) then
      {version:2,repository_id:$repo_id,repository:$repo,pr_id:$pr_id,pr_number:$number,
       destination_repository_id:$repo_id,destination_ref:"refs/heads/main",
       head:$head,base:$q.base,merge:$merge,tree:$q.tree,parents:[$q.base,$head],
       workflow_generation:$generation} as $expected |
      if $q == $expected then $q else error("substituted qualification subject") end
    else error("invalid qualification subject") end
  FINAL_CURRENTNESS_JQ: |
    def oid: type == "string" and test("^[0-9a-f]{40}$");
    .data.repository as $r | $r.pullRequest as $p |
    if (.errors == null and $r.id == $repo_id and $r.nameWithOwner == $repo and
        $p.id == $pr_id and $p.number == $number and $p.headRepository.id == $repo_id and
        $p.headRefOid == $head and $p.baseRepository.id == $repo_id and
        $p.baseRefName == "main" and $p.baseRef.name == "main" and
        $p.baseRef.prefix == "refs/heads/" and $p.baseRef.repository.id == $repo_id and
        $p.baseRef.target.__typename == "Commit" and ($p.baseRef.target.oid | oid) and
        $r.ref.name == "main" and $r.ref.prefix == "refs/heads/" and
        $r.ref.target.__typename == "Commit" and $r.ref.target.oid == $p.baseRef.target.oid)
    then $r.ref.target.oid else error("incoherent current repository observation") end
  NATIVE_REVIEWS_JQ: |
    [ .[][] ] as $reviews |
    ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
    group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
    all($dispositions[]; .state != "CHANGES_REQUESTED") and
    (any($dispositions[]; .commit_id == $head and .state == "APPROVED") or
    any($reviews | group_by(.user.login) | map(max_by(.submitted_at))[];
    .commit_id == $head and .state == "COMMENTED" and
    (.body | current_comment_ready)))
  NATIVE_PRIOR_REQUESTS_JQ: |
    [.[].workflow_runs[] | select(.workflow_id == $workflow and .head_sha == $head and
    .repository.node_id == $repo_id and .event == "pull_request" and .run_number < $current and
    (.display_title | startswith("Merge-ready ")) and
    any(.pull_requests[]; .id == $pr_database_id and .number == $number))] | sort_by(.run_number) | reverse
  NATIVE_PRIOR_JOBS_JQ: |
    [.[].jobs[]] as $jobs | ($jobs | length > 0) and
    all($jobs[]; .run_id == $run and .head_sha == $head) and
    ([$jobs[].id] | length == (unique | length))
  NATIVE_PRIOR_ADMISSION_JQ: |
    [.[].jobs[]] as $jobs |
    ([$jobs[] | select(.name == "Live merge-ready preflight")] | length == 1) and
    ([$jobs[].steps[]? | select(.name == $marker)] | length == 1) and
    any($jobs[]; .name == "Live merge-ready preflight" and .status == "completed" and .conclusion == "success" and
    any(.steps[]; .name == $marker and .status == "completed" and .conclusion == "success"))
  READINESS_SUBJECT_DIAGNOSTIC_JQ: |
    {payload:"qualification-subject", checks:{expected_present:($expected | length > 0),
    exact_subject:($observed == $expected and ($observed | length > 0))}}
  READINESS_PR_DIAGNOSTIC_JQ: |
    def check(f): try f catch "unreadable";
    def sha: if type == "string" and test("^[0-9a-f]{40}$") then . else null end;
    .[0] as $pr | {payload:(if length == 0 then "missing" else ($pr | type) end),
    expected:{head:$head,base:$base,subject:$subject}, checks:($pr | {
    open: check(.state == "open"), non_draft: check(.draft == false),
    same_repository: check(.head.repo.full_name == $repo), main_base: check(.base.ref == "main"),
    mergeable: check(.mergeable == true), exact_head: check(.head.sha == $head),
    stored_base_matches_event: check(.base.sha == $base), exact_subject: check(.merge_commit_sha == $subject),
    merge_ready: check(any(.labels[]; (.name | ascii_downcase) == "merge-ready"))}),
    observed:($pr | {head:check(.head.sha | sha),base:check(.base.sha | sha),subject:check(.merge_commit_sha | sha)})}
  READINESS_REVIEWS_DIAGNOSTIC_JQ: |
    [ .[][] ] as $reviews |
    ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
    group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
    ($reviews | group_by(.user.login) | map(max_by(.submitted_at))) as $latest |
    {payload:"review-pages", pages:length, latest_count:($latest | length),
    latest_ids:($latest | map(.id | if type == "number" then . else null end) | .[:20]),
    checks:{no_changes_requested:all($dispositions[]; .state != "CHANGES_REQUESTED"),
    current_head_approved:any($dispositions[]; .commit_id == $head and .state == "APPROVED"),
    current_head_marker:any($latest[];
    .commit_id == $head and .state == "COMMENTED" and
    (.body | current_comment_ready))}}
  READINESS_THREADS_DIAGNOSTIC_JQ: |
    def check(f): try f catch "unreadable";
    .[0] as $page | {payload:(if length == 0 then "missing" else ($page | type) end),
    checks:($page | {no_graphql_errors:check(.errors == null),
    all_resolved:check(.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true)),
    next_page_boolean:check(.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type == "boolean"),
    cursor_nonempty:check(.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | type == "string" and length > 0)}),
    unresolved_count:($page | check([.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved != true)] | length))}

jobs:
  admission:
    if: github.event_name == 'pull_request'
    name: Live merge-ready preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.preflight.outputs.execute }}
      prior_result: ${{ steps.preflight.outputs.prior_result }}
      tree: ${{ steps.preflight.outputs.tree }}
      head: ${{ steps.preflight.outputs.head }}
      base: ${{ steps.preflight.outputs.base }}
      merge: ${{ steps.preflight.outputs.merge }}
      generation: ${{ steps.preflight.outputs.generation }}
      subject: ${{ steps.preflight.outputs.subject }}
      identity: ${{ steps.preflight.outputs.identity }}
      request_id: ${{ steps.preflight.outputs.request_id }}
    steps:
      - name: Reconcile native request and current readiness
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STORED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBJECT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_DATABASE_ID: ${{ github.event.pull_request.id }}
          GENERATION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [ "$ACTION" != labeled ] || [ "${LABEL,,}" != merge-ready ]; then
            printf 'execute=false\nprior_result=nonrequest\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REPOSITORY" = EffortlessMetrics/ripr-swarm && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$REPOSITORY_ID" && -n "$PR_ID" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          for sha in "$HEAD_SHA" "$SUBJECT_SHA" "$GENERATION"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          permission=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo 'Untrusted request actor' >&2; exit 1;; esac
          settle_request() {
            local attempt state
            for attempt in 1 2 3; do
              pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER") || return
              jq -e --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" --arg merge "$SUBJECT_SHA" "${NATIVE_REQUEST_JQ:?}" <<< "$pr" >/dev/null || return
              state=$(jq -er 'if .mergeable == null then "pending" elif .mergeable == true then "ready" else "refused" end' <<< "$pr") || return
              case "$state" in
                ready) jq -e --arg merge "$SUBJECT_SHA" ' .merge_commit_sha == $merge ' <<< "$pr" >/dev/null || return; return 0 ;;
                refused) echo 'Mergeability refused' >&2; return 1 ;;
                pending) [ "$attempt" = 3 ] || sleep 2 ;;
              esac
            done
            echo 'Mergeability not established within bounded refresh' >&2
            return 1
          }
          read_subject() {
            local frame candidate base tree
            frame=$(gh api graphql -f query="$NATIVE_SUBJECT_QUERY" -F number="$PR_NUMBER") || return
            candidate=$(jq -ceS --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" --arg merge "$SUBJECT_SHA" --arg generation "$GENERATION" "$NATIVE_SUBJECT_JQ" <<< "$frame") || return
            base=$(jq -er .base <<< "$candidate") || return
            tree=$(jq -er .tree <<< "$candidate") || return
            commit=$(gh api "repos/$REPOSITORY/git/commits/$SUBJECT_SHA") || return
            jq -e --arg merge "$SUBJECT_SHA" --arg base "$base" --arg head "$HEAD_SHA" --arg tree "$tree" "${NATIVE_COMMIT_JQ:?}" <<< "$commit" >/dev/null || return
            printf '%s\n' "$candidate"
          }
          settle_request
          subject_before=$(read_subject)
          reviews=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          author=$(jq -r .user.login <<< "$pr")
          jq -s -e --arg head "$HEAD_SHA" --arg author "$author" "$REVIEW_DISPOSITION_JQ${NATIVE_REVIEWS_JQ:?}" <<< "$reviews" >/dev/null
          cursor=null
          while :; do
            threads=$(gh api graphql -f query="query(\$number:Int!,\$cursor:String){repository(owner:\"EffortlessMetrics\",name:\"ripr-swarm\"){pullRequest(number:\$number){reviewThreads(first:100,after:\$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}" -F number="$PR_NUMBER" -F cursor="$cursor")
            jq -e '.errors == null and (.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true))' <<< "$threads" >/dev/null
            more=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | if type == "boolean" then tostring else error("invalid pagination") end' <<< "$threads")
            [ "$more" = true ] || break
            cursor=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(length > 0)' <<< "$threads")
          done
          settle_request
          subject=$(read_subject)
          [[ "$subject" == "$subject_before" ]] || { echo 'Qualification subject changed during admission' >&2; exit 1; }
          BASE_SHA=$(jq -er .base <<< "$subject")
          tree=$(jq -er .tree <<< "$subject")
          identity=$(printf '%s' "$subject" | sha256sum | cut -d ' ' -f1)
          workflow_file=${GITHUB_WORKFLOW_REF#*/.github/workflows/}
          workflow_file=${workflow_file%%@*}
          workflow_id=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" --jq .id)
          runs=$(gh api --paginate "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")
          prior_runs=$(jq -cs --arg head "$HEAD_SHA" --arg repo_id "$REPOSITORY_ID" --argjson pr_database_id "$PR_DATABASE_ID" --argjson workflow "$workflow_id" --argjson number "$PR_NUMBER" --argjson current "$GITHUB_RUN_NUMBER" "${NATIVE_PRIOR_REQUESTS_JQ:?}" <<< "$runs")
          while IFS= read -r prior; do
            [ -n "$prior" ] || continue
            [[ "$(jq -er .status <<< "$prior")" = completed ]] || { echo 'Prior native request pending/running; no relaunch' >&2; exit 1; }
            prior_id=$(jq -er '.id | select(type == "number" and . > 0)' <<< "$prior")
            attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<< "$prior")
            jobs=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$prior_id/attempts/$attempt/jobs?per_page=100")
            marker="Admitted v2 $identity run $prior_id attempt $attempt"
            jq -s -e --arg head "$HEAD_SHA" --argjson run "$prior_id" "${NATIVE_PRIOR_JOBS_JQ:?}" <<< "$jobs" >/dev/null
            count=$(jq -sr --arg marker "$marker" '[.[].jobs[].steps[]? | select(.name == $marker)] | length' <<< "$jobs")
            [ "$count" != 0 ] || { echo 'origin-identity-unavailable: prior request lacks verified v2 identity; no replacement' >&2; exit 1; }
            jq -s -e --arg marker "$marker" "${NATIVE_PRIOR_ADMISSION_JQ:?}" <<< "$jobs" >/dev/null
            # Metadata identity discovery is not producer proof. No recursive reused-run
            # chain or aggregate-only pass; actual MSRV/VSCode receipts are not verified.
            echo 'origin-proof-unavailable: same-attempt native producer receipt identities are not qualified; no reuse or replacement' >&2
            exit 1
          done < <(jq -c '.[]' <<< "$prior_runs")
          {
            printf 'head=%s\nbase=%s\nmerge=%s\ntree=%s\ngeneration=%s\n' "$HEAD_SHA" "$BASE_SHA" "$SUBJECT_SHA" "$tree" "$GENERATION"
            printf 'subject=%s\nidentity=%s\nexecute=true\nprior_result=none\n' "$subject" "$identity"
            printf 'request_id=%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - name: Admitted v2 ${{ steps.preflight.outputs.identity }} run ${{ github.run_id }} attempt ${{ github.run_attempt }}
        if: steps.preflight.outputs.execute == 'true'
        run: ':'

  route:
    needs: [admission]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        needs.admission.result == 'success' &&
        needs.admission.outputs.execute == 'true'))
    name: Route Ripr Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      router_target: ${{ steps.route.outputs.router_target }}
      router_reason: ${{ steps.route.outputs.router_reason }}
      repo: ${{ steps.route.outputs.repo }}
      workflow: ${{ steps.route.outputs.workflow }}
      run_id: ${{ steps.route.outputs.run_id }}
      runner_query: ${{ steps.route.outputs.runner_query }}
      runner_total: ${{ steps.route.outputs.runner_total }}
      cx43_online: ${{ steps.route.outputs.cx43_online }}
      cx43_idle_ready: ${{ steps.route.outputs.cx43_idle_ready }}
      cpx42_online: ${{ steps.route.outputs.cpx42_online }}
      cpx42_idle_ready: ${{ steps.route.outputs.cpx42_idle_ready }}
      cx53_online: ${{ steps.route.outputs.cx53_online }}
      cx53_idle_ready: ${{ steps.route.outputs.cx53_idle_ready }}
    steps:
      - name: Select runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          target=github reason=runner_api_failed runner_query=not_attempted runner_total=not_available
          cx43_online=not_available cx43_idle_ready=not_available cpx42_online=not_available cpx42_idle_ready=not_available cx53_online=not_available cx53_idle_ready=not_available
          count() { printf '%s' "$runners" | jq -s "$1"; }
          idle() { printf '%s' "$runners" | jq -s -e --arg model "$1" --arg cap "$2" '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index($model) and index($cap)))] | length > 0' >/dev/null; }
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            reason=fork_or_untrusted_pr runner_query=skipped_untrusted_pr
          elif runners="$(gh api --paginate 'orgs/EffortlessMetrics/actions/runners?per_page=100' 2>/tmp/runners.err)"; then
            runner_query=ok
            runner_total="$(count '[.[].runners[]?] | length')"
            cx43_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43")))] | length')"
            cx43_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43") and index("rust-medium")))] | length')"
            cpx42_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42")))] | length')"
            cpx42_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42") and index("rust-16gb")))] | length')"
            cx53_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53")))] | length')"
            cx53_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53") and index("rust-large")))] | length')"
            if idle cx43 rust-medium; then target=cx43 reason=cx43_idle
            elif idle cpx42 rust-16gb; then target=cpx42 reason=cpx42_idle
            elif idle cx53 rust-large; then target=cx53 reason=cx53_idle
            elif [ "$cx43_online$cx43_idle_ready$cpx42_online$cpx42_idle_ready$cx53_online$cx53_idle_ready" != "000000" ]; then reason=runner_capacity_unavailable
            else reason=no_idle_runner
            fi
          else
            runner_query=failed reason=runner_api_failed
          fi
          { echo "router_target=$target"; echo "router_reason=$reason"; echo "repo=$REPOSITORY"; echo "workflow=routed-rust"; echo "run_id=$RUN_ID"; for name in runner_query runner_total cx43_online cx43_idle_ready cpx42_online cpx42_idle_ready cx53_online cx53_idle_ready; do echo "$name=${!name}"; done; } >> "$GITHUB_OUTPUT"
          { echo "### Ripr Rust Small Router"; echo ""; echo "- repo: \`$REPOSITORY\`"; echo "- workflow: \`routed-rust\`"; echo "- run: \`$RUN_ID\`"; echo "- target: \`$target\`"; echo "- reason: \`$reason\`"; for row in "runner query:$runner_query" "visible runners:$runner_total" "cx43 online:$cx43_online" "cx43 idle ready:$cx43_idle_ready" "cpx42 online:$cpx42_online" "cpx42 idle ready:$cpx42_idle_ready" "cx53 online:$cx53_online" "cx53 idle ready:$cx53_idle_ready"; do echo "- ${row%%:*}: \`${row#*:}\`"; done; } >> "$GITHUB_STEP_SUMMARY"

  detect-docs-only:
    needs: [admission]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        needs.admission.result == 'success' &&
        needs.admission.outputs.execute == 'true'))
    name: Detect Docs-Only Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.admission.outputs.merge || github.sha }}
      - name: Verify admitted integration before proof
        id: admitted
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
          SUBJECT_JSON: ${{ needs.admission.outputs.subject }}
          ADMITTED_HEAD: ${{ needs.admission.outputs.head }}
          ADMITTED_BASE: ${{ needs.admission.outputs.base }}
          ADMITTED_MERGE: ${{ needs.admission.outputs.merge }}
          ADMITTED_TREE: ${{ needs.admission.outputs.tree }}
          GENERATION: ${{ needs.admission.outputs.generation }}
          IDENTITY: ${{ needs.admission.outputs.identity }}
          LEGACY_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          LEGACY_BASE: ${{ github.event.pull_request.base.sha }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            legacy)
              for value in "$SUBJECT_JSON" "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" "$GENERATION" "$IDENTITY"; do
                [[ -z "$value" ]] || { echo 'Partial qualification cannot use legacy profile' >&2; exit 1; }
              done
              printf 'head=%s\nbase=%s\n' "$LEGACY_HEAD" "$LEGACY_BASE" >> "$GITHUB_OUTPUT"
              ;;
            qualification)
              for value in "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" "$GENERATION"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
              [[ "$IDENTITY" =~ ^[0-9a-f]{64}$ && "$GENERATION" == "$GITHUB_WORKFLOW_SHA" ]]
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$ADMITTED_HEAD" --arg base "$ADMITTED_BASE" --arg merge "$ADMITTED_MERGE" --arg tree "$ADMITTED_TREE" --arg generation "$GENERATION" '
                .version == 2 and .repository == $repo and .repository_id == $repo_id and .pr_id == $pr_id and .pr_number == $number and
                .destination_repository_id == $repo_id and .destination_ref == "refs/heads/main" and
                .head == $head and .base == $base and .merge == $merge and .tree == $tree and
                .parents == [$base,$head] and .workflow_generation == $generation' <<< "$SUBJECT_JSON" >/dev/null
              canonical=$(jq -cS . <<< "$SUBJECT_JSON")
              [[ "$(printf '%s' "$canonical" | sha256sum | cut -d ' ' -f1)" == "$IDENTITY" ]]
              [[ "$(git cat-file -t HEAD)" == commit && "$(git rev-parse HEAD)" == "$ADMITTED_MERGE" ]]
              [[ "$(git rev-parse 'HEAD^{tree}')" == "$ADMITTED_TREE" ]]
              [[ "$(git show -s --format=%P HEAD)" == "$ADMITTED_BASE $ADMITTED_HEAD" ]]
              printf 'head=%s\nbase=%s\nmerge=%s\ntree=%s\n' "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'Unknown source profile' >&2; exit 1 ;;
          esac
      - name: Check whether every changed file is docs/spec/markdown
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.admitted.outputs.base }}
          HEAD_SHA: ${{ steps.admitted.outputs.head }}
        run: |
          docs_only=false reason=not_pull_request
          classify() {
            [ "$EVENT_NAME" = "pull_request" ] || return 0
            reason=missing_identity
            [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || return 0
            reason=invalid_identity
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || return 0
            # Checkout stays on the integration commit. Full history is requested
            # above; recover missing event objects with their ancestry, not depth 1.
            reason=unavailable_history
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || return 0
            fi
            [ "$(git rev-parse --is-shallow-repository)" = "false" ] || return 0
            [ "$(git cat-file -t "$BASE_SHA" 2>/dev/null)" = "commit" ] && [ "$(git cat-file -t "$HEAD_SHA" 2>/dev/null)" = "commit" ] || return 0
            reason=unavailable_merge_base
            merge_bases="$(git merge-base --all "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)" || return 0
            [ -n "$merge_bases" ] || return 0
            reason=ambiguous_merge_base
            [[ "$merge_bases" != *$'\n'* ]] || return 0
            changed="$(mktemp)"
            trap 'rm -f "$changed"' EXIT
            reason=diff_failed
            # No rename collapsing: both the removed and added path must qualify.
            # Read only successful output; a failing diff may have written paths.
            git diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" > "$changed" 2>/dev/null || return 0
            reason=empty_diff
            [ -s "$changed" ] || return 0
            reason=non_docs
            while IFS= read -r -d '' path; do
              case "$path" in
                CHANGELOG.md|Cargo.toml|Cargo.lock|crates/ripr/Cargo.toml|docs/OUTPUT_SCHEMA.md) reason=release_surface; return 0 ;;
                docs/specs/*|docs/handoffs/*|*.md) ;;
                *) return 0 ;;
              esac
            done < "$changed"
            docs_only=true reason=docs_only
          }
          classify
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          { echo "### Docs-Only Surface Detection"; echo ""; echo "- docs_only: \`$docs_only\`"; echo "- reason: \`$reason\`"; } >> "$GITHUB_STEP_SUMMARY"

  rust-cx43:
    name: Ripr Rust Small on CX43
    needs: [admission, route, detect-docs-only]
    if: >-
      !cancelled() &&
      needs.route.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.route.outputs.router_target == 'cx43' &&
      needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      proof-profile: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
      head-sha: ${{ needs.admission.outputs.head }}
      base-sha: ${{ needs.admission.outputs.base }}
      subject-sha: ${{ needs.admission.outputs.merge }}
      subject-tree: ${{ needs.admission.outputs.tree }}
      workflow-generation: ${{ needs.admission.outputs.generation }}
      subject-json: ${{ needs.admission.outputs.subject }}
      subject-identity: ${{ needs.admission.outputs.identity }}
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx43","rust-medium","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 35
      use-scratch: true
      artifact-name: ripr-rust-small-cx43
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}
      upload-success-artifacts: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') }}

