name: Routed Rust Small
run-name: ${{ github.event_name == 'merge_group' && format('Merge queue {0}', github.event.merge_group.head_sha) || github.event_name == 'pull_request' && (github.event.label.name == 'merge-ready' && format('Merge-ready request {0}', github.event.pull_request.head.sha) || format('Label metadata {0}', github.run_id)) || format('{0} {1}', github.workflow, github.ref_name) }}

on:
  pull_request:
    # The protected PR qualification is requested only by an explicit
    # `merge-ready` label (#4986, #8082). Ready, push, synchronize and other
    # labels start no implementation work. Every other label event still runs
    # this workflow but the result job is then named `Merge-ready Nonrequest`,
    # never `Ripr Rust Small Result`: a skipped required job reports success,
    # so the required context must be earned by a merge-ready run or absent.
    types: [labeled]
  merge_group:
    # The merge queue requests the same qualification once per queue entry, on
    # the exact queued merge commit. Both requests coexist while the repository
    # cuts over to the queue; the label request is then retired.
    types: [checks_requested]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.event.label.name != 'merge-ready' && format('{0}-{1}-nonrequest-{2}', github.workflow, github.event.pull_request.number, github.run_id) || format('{0}-{1}-{2}', github.workflow, github.event.pull_request.number || github.ref, github.event_name) }}
  # A repeated merge-ready request means the prior admission transaction was
  # revoked. Nonrequest label events use a unique group so an ordinary label
  # can never cancel an in-flight qualification. Preserve independent
  # main/manual work.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  NATIVE_SUBJECT_QUERY: |
    query($number:Int!){repository(owner:"EffortlessMetrics",name:"ripr-swarm"){id nameWithOwner ref(qualifiedName:"refs/heads/main"){name prefix target{__typename oid}} pullRequest(number:$number){id number headRefOid headRepository{id} baseRefName baseRefOid baseRepository{id} baseRef{name prefix repository{id} target{__typename oid}} potentialMergeCommit{oid tree{oid} parents(first:3){nodes{oid}pageInfo{hasNextPage}}}}}}
  NATIVE_SUBJECT_JQ: |
    def oid: type == "string" and test("^[0-9a-f]{40}$");
    (.errors == null and (.data.repository != null)) as $ok |
    if $ok then .data.repository as $r | $r.pullRequest as $p |
      if ($r.id == $repo_id and $r.nameWithOwner == $repo and
          $p.id == $pr_id and $p.number == $number and $p.headRepository.id == $repo_id and
          $p.headRefOid == $head and $p.baseRepository.id == $repo_id and
          $p.baseRefName == "main" and $p.baseRef.name == "main" and
          $p.baseRef.prefix == "refs/heads/" and $p.baseRef.repository.id == $repo_id and
          $p.baseRef.target.__typename == "Commit" and ($p.baseRef.target.oid | oid) and
          $r.ref.name == "main" and $r.ref.prefix == "refs/heads/" and
          $r.ref.target.__typename == "Commit" and $r.ref.target.oid == $p.baseRef.target.oid and
          $p.potentialMergeCommit.oid == $merge and ($p.potentialMergeCommit.tree.oid | oid) and
          $p.potentialMergeCommit.parents.pageInfo.hasNextPage == false and
          ([$p.potentialMergeCommit.parents.nodes[].oid] == [$p.baseRef.target.oid,$head])) then
        {version:2,repository_id:$repo_id,repository:$repo,pr_id:$pr_id,pr_number:$number,
         destination_repository_id:$repo_id,destination_ref:"refs/heads/main",
         head:$head,base:$p.baseRef.target.oid,merge:$merge,tree:$p.potentialMergeCommit.tree.oid,
         parents:[$p.baseRef.target.oid,$head],workflow_generation:$generation}
      else error("incoherent live qualification subject") end
    else error("missing/error identity response") end
  # Partial #8157 mitigation: interpret current attestations, not narrative tokens.
  # This does not authenticate a publisher or establish referenced proof custody.
  REVIEW_DISPOSITION_JQ: |
    def current_comment_ready:
      if type != "string" then error("review body must be a string") else
        reduce (gsub("\r\n"; "\n") | split("\n")[]) as $line
          ({first:true, fence:null, quoted:false, dispositions:[]};
           if .fence != null then
             .fence as $fence |
             if ($line | test("^ {0,3}" + $fence.char + "{" + ($fence.size|tostring) + ",}[ \t]*$"))
             then .fence = null else . end
           elif ($line | test("^[ \t]*$")) then .quoted = false
           elif ($line | test("^ {0,3}>")) then .first = false | .quoted = true
           elif .quoted then .first = false
           elif ($line | test("^ {0,3}(`{3,}|~{3,})")) then
             ($line | capture("^ {0,3}(?<fence>`{3,}|~{3,})")) as $match |
             .first = false | .fence = {char:$match.fence[0:1], size:($match.fence|length)}
           elif ($line | test("^( {4}|\t)")) then .first = false
           else
             (if .first and ($line | test("^ {0,3}(SOURCE_REVIEW_READY|REVIEW_READY)([^A-Za-z0-9_]|$)"))
              then .dispositions += ["positive"] else . end) |
             (if ($line | test("^disposition:[ \t]*")) then
                .dispositions += [(if ($line | test("^disposition:[ \t]*(SOURCE_REVIEW_READY|REVIEW_READY)[ \t]*$"))
                                    then "positive" else "refuse" end)]
              else . end) | .first = false
           end) |
        .fence == null and (.dispositions | length > 0 and all(. == "positive"))
      end;

  NATIVE_REQUEST_JQ: |
    .node_id == $pr_id and .number == $number and .state == "open" and .draft == false and
    .head.repo.node_id == $repo_id and .head.repo.full_name == $repo and .head.sha == $head and
    .base.repo.node_id == $repo_id and .base.ref == "main" and
    any(.labels[]; .name == "merge-ready")
  NATIVE_COMMIT_JQ: |
    .sha == $merge and .tree.sha == $tree and (.parents | map(.sha) == [$base,$head])
  QUALIFICATION_SUBJECT_JQ: |
    def oid: type == "string" and test("^[0-9a-f]{40}$");
    . as $q | if (($q.base | oid) and ($q.tree | oid)) then
      {version:2,repository_id:$repo_id,repository:$repo,pr_id:$pr_id,pr_number:$number,
       destination_repository_id:$repo_id,destination_ref:"refs/heads/main",
       head:$head,base:$q.base,merge:$merge,tree:$q.tree,parents:[$q.base,$head],
       workflow_generation:$generation} as $expected |
      if $q == $expected then $q else error("substituted qualification subject") end
    else error("invalid qualification subject") end
  FINAL_CURRENTNESS_JQ: |
    def oid: type == "string" and test("^[0-9a-f]{40}$");
    .data.repository as $r | $r.pullRequest as $p |
    {graphql_ok:(.errors == null),
     repository_identity:($r.id == $repo_id and $r.nameWithOwner == $repo),
     pr_identity:($p.id == $pr_id and $p.number == $number),
     head_identity:($p.headRepository.id == $repo_id and $p.headRefOid == $head),
     destination_identity:($p.baseRepository.id == $repo_id and $p.baseRefName == "main" and
       $p.baseRef.name == "main" and $p.baseRef.prefix == "refs/heads/" and $p.baseRef.repository.id == $repo_id),
     live_base_shape:($p.baseRef.target.__typename == "Commit" and ($p.baseRef.target.oid | oid)),
     independent_destination:($r.ref.name == "main" and $r.ref.prefix == "refs/heads/" and $r.ref.target.__typename == "Commit"),
     live_base_agrees:($r.ref.target.oid == $p.baseRef.target.oid)} as $checks |
    if all($checks[]; . == true) then $r.ref.target.oid
    else error("incoherent current repository observation: " + ($checks | tojson)) end
  NATIVE_REVIEWS_JQ: |
    [ .[][] ] as $reviews |
    ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
    group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
    all($dispositions[]; .state != "CHANGES_REQUESTED") and
    (any($dispositions[]; .commit_id == $head and .state == "APPROVED") or
    any($reviews | group_by(.user.login) | map(max_by(.submitted_at))[];
    .commit_id == $head and .state == "COMMENTED" and
    (.body | current_comment_ready)))
  NATIVE_PRIOR_REQUESTS_JQ: |
    [.[].workflow_runs[] | select(.workflow_id == $workflow and .head_sha == $head and
    .repository.node_id == $repo_id and .event == "pull_request" and .run_number < $current and
    (.display_title | startswith("Merge-ready ")) and
    any(.pull_requests[]; .id == $pr_database_id and .number == $number))] | sort_by(.run_number) | reverse
  NATIVE_PRIOR_JOBS_JQ: |
    [.[].jobs[]] as $jobs | ($jobs | length > 0) and
    all($jobs[]; .run_id == $run and .head_sha == $head) and
    ([$jobs[].id] | length == (unique | length))
  NATIVE_PRIOR_ADMISSION_JQ: |
    [.[].jobs[]] as $jobs |
    ([$jobs[] | select(.name == "Live merge-ready preflight")] | length == 1) and
    ([$jobs[].steps[]? | select(.name == $marker)] | length == 1) and
    any($jobs[]; .name == "Live merge-ready preflight" and .status == "completed" and .conclusion == "success" and
    any(.steps[]; .name == $marker and .status == "completed" and .conclusion == "success"))
  READINESS_SUBJECT_DIAGNOSTIC_JQ: |
    {payload:"qualification-subject", checks:{expected_present:($expected | length > 0),
    exact_subject:($observed == $expected and ($observed | length > 0))}}
  READINESS_PR_DIAGNOSTIC_JQ: |
    def check(f): try f catch "unreadable";
    def sha: if type == "string" and test("^[0-9a-f]{40}$") then . else null end;
    .[0] as $pr | {payload:(if length == 0 then "missing" else ($pr | type) end),
    expected:{head:$head,base:$base,subject:$subject}, checks:($pr | {
    open: check(.state == "open"), non_draft: check(.draft == false),
    same_repository: check(.head.repo.full_name == $repo), main_base: check(.base.ref == "main"),
    mergeable: check(.mergeable == true), exact_head: check(.head.sha == $head),
    stored_base_matches_event: check(.base.sha == $base), exact_subject: check(.merge_commit_sha == $subject),
    merge_ready: check(any(.labels[]; .name == "merge-ready"))}),
    observed:($pr | {head:check(.head.sha | sha),base:check(.base.sha | sha),subject:check(.merge_commit_sha | sha)})}
  READINESS_REVIEWS_DIAGNOSTIC_JQ: |
    [ .[][] ] as $reviews |
    ($reviews | map(select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")) |
    group_by(.user.login) | map(max_by(.submitted_at))) as $dispositions |
    ($reviews | group_by(.user.login) | map(max_by(.submitted_at))) as $latest |
    {payload:"review-pages", pages:length, latest_count:($latest | length),
    latest_ids:($latest | map(.id | if type == "number" then . else null end) | .[:20]),
    checks:{no_changes_requested:all($dispositions[]; .state != "CHANGES_REQUESTED"),
    current_head_approved:any($dispositions[]; .commit_id == $head and .state == "APPROVED"),
    current_head_marker:any($latest[];
    .commit_id == $head and .state == "COMMENTED" and
    (.body | current_comment_ready))}}
  READINESS_THREADS_DIAGNOSTIC_JQ: |
    def check(f): try f catch "unreadable";
    .[0] as $page | {payload:(if length == 0 then "missing" else ($page | type) end),
    checks:($page | {no_graphql_errors:check(.errors == null),
    all_resolved:check(.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true)),
    next_page_boolean:check(.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | type == "boolean"),
    cursor_nonempty:check(.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | type == "string" and length > 0)}),
    unresolved_count:($page | check([.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved != true)] | length))}

jobs:
  qualification:
    if: github.event_name == 'pull_request'
    name: Live merge-ready preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      execute: ${{ steps.preflight.outputs.execute }}
      prior_result: ${{ steps.preflight.outputs.prior_result }}
      tree: ${{ steps.preflight.outputs.tree }}
      head: ${{ steps.preflight.outputs.head }}
      base: ${{ steps.preflight.outputs.base }}
      merge: ${{ steps.preflight.outputs.merge }}
      generation: ${{ steps.preflight.outputs.generation }}
      subject: ${{ steps.preflight.outputs.subject }}
      identity: ${{ steps.preflight.outputs.identity }}
      request_id: ${{ steps.preflight.outputs.request_id }}
    steps:
      - name: Reconcile native request and current readiness
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STORED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBJECT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_DATABASE_ID: ${{ github.event.pull_request.id }}
          GENERATION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          trap 'echo "PREFLIGHT-DIAG failed status=$? line=$LINENO" >&2' ERR
          set -x
          if [ "$ACTION" != labeled ] || [ "$LABEL" != merge-ready ]; then
            printf 'execute=false\nprior_result=nonrequest\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$REPOSITORY" = EffortlessMetrics/ripr-swarm && "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ -n "$REPOSITORY_ID" && -n "$PR_ID" ]]
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          for sha in "$HEAD_SHA" "$SUBJECT_SHA" "$GENERATION"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          permission=$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq .permission)
          case "$permission" in admin|maintain|write) ;; *) echo 'Untrusted request actor' >&2; exit 1;; esac
          settle_request() {
            local attempt state
            for attempt in 1 2 3; do
              pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER") || return
              jq -e --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" --arg merge "$SUBJECT_SHA" "${NATIVE_REQUEST_JQ:?}" <<< "$pr" >/dev/null || return
              state=$(jq -er 'if .mergeable == null then "pending" elif .mergeable == true then "ready" else "refused" end' <<< "$pr") || return
              case "$state" in
                ready) jq -e --arg merge "$SUBJECT_SHA" ' .merge_commit_sha == $merge ' <<< "$pr" >/dev/null || return; return 0 ;;
                refused) echo 'Mergeability refused' >&2; return 1 ;;
                pending) [ "$attempt" = 3 ] || sleep 2 ;;
              esac
            done
            echo 'Mergeability not established within bounded refresh' >&2
            return 1
          }
          read_subject() {
            # The REST merge ref and the GraphQL live view rebuild at different
            # times after a main push; a bounded refresh reads the pair the way
            # settle_request reads mergeability, without widening admission.
            local attempt frame candidate base tree
            for attempt in 1 2 3; do
              frame=$(gh api graphql -f query="$NATIVE_SUBJECT_QUERY" -F number="$PR_NUMBER") || { [ "$attempt" = 3 ] || sleep 2; continue; }
              candidate=$(jq -ceS --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" --arg merge "$SUBJECT_SHA" --arg generation "$GENERATION" "$NATIVE_SUBJECT_JQ" <<< "$frame") && break
              [ "$attempt" = 3 ] || sleep 2
            done
            [ -n "$candidate" ] || return 1
            base=$(jq -er .base <<< "$candidate") || return
            tree=$(jq -er .tree <<< "$candidate") || return
            commit=$(gh api "repos/$REPOSITORY/git/commits/$SUBJECT_SHA") || return
            jq -e --arg merge "$SUBJECT_SHA" --arg base "$base" --arg head "$HEAD_SHA" --arg tree "$tree" "${NATIVE_COMMIT_JQ:?}" <<< "$commit" >/dev/null || return
            printf '%s\n' "$candidate"
          }
          settle_request
          subject_before=$(read_subject)
          reviews=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          author=$(jq -r .user.login <<< "$pr")
          jq -s -e --arg head "$HEAD_SHA" --arg author "$author" "$REVIEW_DISPOSITION_JQ${NATIVE_REVIEWS_JQ:?}" <<< "$reviews" >/dev/null
          cursor=null
          while :; do
            threads=$(gh api graphql -f query="query(\$number:Int!,\$cursor:String){repository(owner:\"EffortlessMetrics\",name:\"ripr-swarm\"){pullRequest(number:\$number){reviewThreads(first:100,after:\$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}" -F number="$PR_NUMBER" -F cursor="$cursor")
            jq -e '.errors == null and (.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true))' <<< "$threads" >/dev/null
            more=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | if type == "boolean" then tostring else error("invalid pagination") end' <<< "$threads")
            [ "$more" = true ] || break
            cursor=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(length > 0)' <<< "$threads")
          done
          settle_request
          subject=$(read_subject)
          [[ "$subject" == "$subject_before" ]] || { echo 'Qualification subject changed during admission' >&2; exit 1; }
          BASE_SHA=$(jq -er .base <<< "$subject")
          tree=$(jq -er .tree <<< "$subject")
          identity=$(printf '%s' "$subject" | sha256sum | cut -d ' ' -f1)
          workflow_file=${GITHUB_WORKFLOW_REF#*/.github/workflows/}
          workflow_file=${workflow_file%%@*}
          workflow_id=$(gh api "repos/$REPOSITORY/actions/workflows/$workflow_file" --jq .id)
          runs=$(gh api --paginate "repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")
          prior_runs=$(jq -cs --arg head "$HEAD_SHA" --arg repo_id "$REPOSITORY_ID" --argjson pr_database_id "$PR_DATABASE_ID" --argjson workflow "$workflow_id" --argjson number "$PR_NUMBER" --argjson current "$GITHUB_RUN_NUMBER" "${NATIVE_PRIOR_REQUESTS_JQ:?}" <<< "$runs")
          while IFS= read -r prior; do
            [ -n "$prior" ] || continue
            [[ "$(jq -er .status <<< "$prior")" = completed ]] || { echo 'Prior native request pending/running; no relaunch' >&2; exit 1; }
            prior_id=$(jq -er '.id | select(type == "number" and . > 0)' <<< "$prior")
            attempt=$(jq -er '.run_attempt | select(type == "number" and . >= 1)' <<< "$prior")
            jobs=$(gh api --paginate "repos/$REPOSITORY/actions/runs/$prior_id/attempts/$attempt/jobs?per_page=100")
            marker="Admitted v2 $identity run $prior_id attempt $attempt"
            jq -s -e --arg head "$HEAD_SHA" --argjson run "$prior_id" "${NATIVE_PRIOR_JOBS_JQ:?}" <<< "$jobs" >/dev/null
            count=$(jq -sr --arg marker "$marker" '[.[].jobs[].steps[]? | select(.name == $marker)] | length' <<< "$jobs")
            [ "$count" != 0 ] || { echo 'origin-identity-unavailable: prior request lacks verified v2 identity; no replacement' >&2; exit 1; }
            jq -s -e --arg marker "$marker" "${NATIVE_PRIOR_ADMISSION_JQ:?}" <<< "$jobs" >/dev/null
            # Metadata identity discovery is not producer proof. No recursive reused-run
            # chain or aggregate-only pass; actual MSRV/VSCode receipts are not verified.
            echo 'origin-proof-unavailable: same-attempt native producer receipt identities are not qualified; no reuse or replacement' >&2
            exit 1
          done < <(jq -c '.[]' <<< "$prior_runs")
          {
            printf 'head=%s\nbase=%s\nmerge=%s\ntree=%s\ngeneration=%s\n' "$HEAD_SHA" "$BASE_SHA" "$SUBJECT_SHA" "$tree" "$GENERATION"
            printf 'subject=%s\nidentity=%s\nexecute=true\nprior_result=none\n' "$subject" "$identity"
            printf 'request_id=%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"
      - name: Admitted v2 ${{ steps.preflight.outputs.identity }} run ${{ github.run_id }} attempt ${{ github.run_attempt }}
        if: steps.preflight.outputs.execute == 'true'
        run: ':'

  route:
    if: github.event_name != 'pull_request' || github.event.label.name == 'merge-ready'
    name: Route Ripr Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      router_target: ${{ steps.route.outputs.router_target }}
      router_reason: ${{ steps.route.outputs.router_reason }}
      repo: ${{ steps.route.outputs.repo }}
      workflow: ${{ steps.route.outputs.workflow }}
      run_id: ${{ steps.route.outputs.run_id }}
      runner_query: ${{ steps.route.outputs.runner_query }}
      runner_query_exit_code: ${{ steps.route.outputs.runner_query_exit_code }}
      runner_total: ${{ steps.route.outputs.runner_total }}
      cx43_online: ${{ steps.route.outputs.cx43_online }}
      cx43_idle_ready: ${{ steps.route.outputs.cx43_idle_ready }}
      cpx42_online: ${{ steps.route.outputs.cpx42_online }}
      cpx42_idle_ready: ${{ steps.route.outputs.cpx42_idle_ready }}
      cx53_online: ${{ steps.route.outputs.cx53_online }}
      cx53_idle_ready: ${{ steps.route.outputs.cx53_idle_ready }}
    steps:
      - name: Select runner
        id: route
        env:
          GH_TOKEN: ${{ secrets.EM_RUNNER_READ_TOKEN || github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          target=github reason=runner_api_failed runner_query=not_attempted runner_query_exit_code=not_attempted runner_total=not_available
          cx43_online=not_available cx43_idle_ready=not_available cpx42_online=not_available cpx42_idle_ready=not_available cx53_online=not_available cx53_idle_ready=not_available
          count() { printf '%s' "$runners" | jq -s "$1"; }
          idle() { printf '%s' "$runners" | jq -s -e --arg model "$1" --arg cap "$2" '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index($model) and index($cap)))] | length > 0' >/dev/null; }
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # A queued PR is built from the base repository's queue branch, so a
            # fork-authored PR is only visible through the PR itself.
            [[ "$GROUP_HEAD_REF" =~ /pr-([0-9]+)-[0-9a-f]{40}$ ]] || HEAD_REPO="unresolved"
            [ "$HEAD_REPO" = "unresolved" ] || HEAD_REPO="$(gh api "repos/${REPOSITORY}/pulls/${BASH_REMATCH[1]}" --jq '.head.repo.full_name // "unresolved"' 2>/dev/null || echo unresolved)"
          fi
          if { [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; } && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            reason=fork_or_untrusted_pr runner_query=skipped_untrusted_pr
          elif runners="$(gh api --paginate 'orgs/EffortlessMetrics/actions/runners?per_page=100' 2>/tmp/runners.err)"; then
            runner_query_exit_code=0 runner_query=ok
            runner_total="$(count '[.[].runners[]?] | length')"
            cx43_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43")))] | length')"
            cx43_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx43") and index("rust-medium")))] | length')"
            cpx42_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42")))] | length')"
            cpx42_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cpx42") and index("rust-16gb")))] | length')"
            cx53_online="$(count '[.[].runners[]? | select(.status == "online" and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53")))] | length')"
            cx53_idle_ready="$(count '[.[].runners[]? | select(.status == "online" and (.busy | not) and ([.labels[].name | ascii_downcase] | index("em-ci") and index("cx53") and index("rust-large")))] | length')"
            if idle cx43 rust-medium; then target=cx43 reason=cx43_idle
            elif idle cpx42 rust-16gb; then target=cpx42 reason=cpx42_idle
            elif idle cx53 rust-large; then target=cx53 reason=cx53_idle
            elif [ "$cx43_online$cx43_idle_ready$cpx42_online$cpx42_idle_ready$cx53_online$cx53_idle_ready" != "000000" ]; then reason=runner_capacity_unavailable
            else reason=no_idle_runner
            fi
          else
            runner_query_exit_code=$?
            runner_query=failed reason=runner_api_failed
          fi
          { echo "router_target=$target"; echo "router_reason=$reason"; repo=$REPOSITORY workflow=routed-rust run_id=$RUN_ID; for name in repo workflow run_id runner_query runner_query_exit_code runner_total cx43_online cx43_idle_ready cpx42_online cpx42_idle_ready cx53_online cx53_idle_ready; do echo "$name=${!name}"; done; } >> "$GITHUB_OUTPUT"
          { echo "### Ripr Rust Small Router"; echo ""; echo "- repo: \`$REPOSITORY\`"; echo "- workflow: \`routed-rust\`"; echo "- run: \`$RUN_ID\`"; echo "- target: \`$target\`"; echo "- reason: \`$reason\`"; for row in "runner query:$runner_query" "runner command exit code:$runner_query_exit_code" "visible runners:$runner_total" "cx43 online:$cx43_online" "cx43 idle ready:$cx43_idle_ready" "cpx42 online:$cpx42_online" "cpx42 idle ready:$cpx42_idle_ready" "cx53 online:$cx53_online" "cx53 idle ready:$cx53_idle_ready"; do echo "- ${row%%:*}: \`${row#*:}\`"; done; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$runner_query" = "failed" ]; then
            { echo '- inventory operation: `gh api --paginate orgs/EffortlessMetrics/actions/runners?per_page=100`'; echo "- HTTP status and underlying cause is unknown; command exit code is not an HTTP status. Raw stderr is withheld."; } >> "$GITHUB_STEP_SUMMARY"
          fi

  detect-docs-only:
    needs: [qualification]
    if: >-
      !cancelled() &&
      ((github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'merge_group' ||
       (github.event_name == 'pull_request' &&
        needs.qualification.result == 'success' &&
        needs.qualification.outputs.execute == 'true'))
    name: Detect Docs-Only Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.qualification.outputs.merge || github.sha }}
      - name: Verify admitted integration before proof
        id: admitted
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
          SUBJECT_JSON: ${{ needs.qualification.outputs.subject }}
          ADMITTED_HEAD: ${{ needs.qualification.outputs.head }}
          ADMITTED_BASE: ${{ needs.qualification.outputs.base }}
          ADMITTED_MERGE: ${{ needs.qualification.outputs.merge }}
          ADMITTED_TREE: ${{ needs.qualification.outputs.tree }}
          GENERATION: ${{ needs.qualification.outputs.generation }}
          IDENTITY: ${{ needs.qualification.outputs.identity }}
          LEGACY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LEGACY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            legacy)
              for value in "$SUBJECT_JSON" "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" "$GENERATION" "$IDENTITY"; do
                [[ -z "$value" ]] || { echo 'Partial qualification cannot use legacy profile' >&2; exit 1; }
              done
              printf 'head=%s\nbase=%s\n' "$LEGACY_HEAD" "$LEGACY_BASE" >> "$GITHUB_OUTPUT"
              ;;
            qualification)
              for value in "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" "$GENERATION"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
              [[ "$IDENTITY" =~ ^[0-9a-f]{64}$ && "$GENERATION" == "$GITHUB_WORKFLOW_SHA" ]]
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$ADMITTED_HEAD" --arg base "$ADMITTED_BASE" --arg merge "$ADMITTED_MERGE" --arg tree "$ADMITTED_TREE" --arg generation "$GENERATION" '
                .version == 2 and .repository == $repo and .repository_id == $repo_id and .pr_id == $pr_id and .pr_number == $number and
                .destination_repository_id == $repo_id and .destination_ref == "refs/heads/main" and
                .head == $head and .base == $base and .merge == $merge and .tree == $tree and
                .parents == [$base,$head] and .workflow_generation == $generation' <<< "$SUBJECT_JSON" >/dev/null
              canonical=$(jq -cS . <<< "$SUBJECT_JSON")
              [[ "$(printf '%s' "$canonical" | sha256sum | cut -d ' ' -f1)" == "$IDENTITY" ]]
              [[ "$(git cat-file -t HEAD)" == commit && "$(git rev-parse HEAD)" == "$ADMITTED_MERGE" ]]
              [[ "$(git rev-parse 'HEAD^{tree}')" == "$ADMITTED_TREE" ]]
              [[ "$(git show -s --format=%P HEAD)" == "$ADMITTED_BASE $ADMITTED_HEAD" ]]
              printf 'head=%s\nbase=%s\nmerge=%s\ntree=%s\n' "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'Unknown source profile' >&2; exit 1 ;;
          esac
      - name: Check whether every changed file is docs/spec/markdown
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.admitted.outputs.base }}
          HEAD_SHA: ${{ steps.admitted.outputs.head }}
        run: |
          docs_only=false reason=not_pull_request
          classify() {
            [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ] || return 0
            reason=missing_identity
            [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ] || return 0
            reason=invalid_identity
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || return 0
            # Checkout stays on the integration commit. Full history is requested
            # above; recover missing event objects with their ancestry, not depth 1.
            reason=unavailable_history
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || ! git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || return 0
            fi
            [ "$(git rev-parse --is-shallow-repository)" = "false" ] || return 0
            [ "$(git cat-file -t "$BASE_SHA" 2>/dev/null)" = "commit" ] && [ "$(git cat-file -t "$HEAD_SHA" 2>/dev/null)" = "commit" ] || return 0
            reason=unavailable_merge_base
            merge_bases="$(git merge-base --all "$BASE_SHA" "$HEAD_SHA" 2>/dev/null)" || return 0
            [ -n "$merge_bases" ] || return 0
            reason=ambiguous_merge_base
            [[ "$merge_bases" != *$'\n'* ]] || return 0
            changed="$(mktemp)"
            trap 'rm -f "$changed"' EXIT
            reason=diff_failed
            # No rename collapsing: both the removed and added path must qualify.
            # Read only successful output; a failing diff may have written paths.
            git diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" > "$changed" 2>/dev/null || return 0
            reason=empty_diff
            [ -s "$changed" ] || return 0
            reason=non_docs
            while IFS= read -r -d '' path; do
              case "$path" in
                CHANGELOG.md|Cargo.toml|Cargo.lock|crates/ripr/Cargo.toml|docs/OUTPUT_SCHEMA.md) reason=release_surface; return 0 ;;
                docs/specs/*|docs/handoffs/*|*.md) ;;
                *) return 0 ;;
              esac
            done < "$changed"
            docs_only=true reason=docs_only
          }
          classify
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          { echo "### Docs-Only Surface Detection"; echo ""; echo "- docs_only: \`$docs_only\`"; echo "- reason: \`$reason\`"; } >> "$GITHUB_STEP_SUMMARY"

  admission:
    name: Admit PR Candidate
    needs: [detect-docs-only]
    if: always() && (github.event_name != 'pull_request' || github.event.label.name == 'merge-ready')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.candidate.outputs.status }}
      reason: ${{ steps.candidate.outputs.reason }}
      detail: ${{ steps.candidate.outputs.detail }}
      cut_status: ${{ steps.candidate.outputs.cut_status }}
      cut_reason: ${{ steps.candidate.outputs.cut_reason }}
      cut_detail: ${{ steps.candidate.outputs.cut_detail }}
      claim: ${{ steps.candidate.outputs.claim }}
      acceptance_delta: ${{ steps.candidate.outputs.acceptance_delta }}
      competing_prs: ${{ steps.candidate.outputs.competing_prs }}
      changed_files: ${{ steps.candidate.outputs.changed_files }}
      changed_lines: ${{ steps.candidate.outputs.changed_lines }}
      labels: ${{ steps.entry.outputs.labels }}
      pr: ${{ steps.entry.outputs.pr }}
      head: ${{ steps.entry.outputs.head }}
      queue_entry: ${{ steps.entry.outputs.queue_entry }}
      request: ${{ steps.entry.outputs.request }}
    steps:
      - uses: actions/checkout@v6
      - name: Select trusted admission source
        id: trusted
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request) sha="$PR_BASE_SHA" ;;
            merge_group) sha="$GROUP_BASE_SHA" ;;
            push|workflow_dispatch) sha="$EVENT_SHA" ;;
            *) echo "::error::trusted admission source is undefined for this event"; exit 1 ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::trusted admission source SHA is missing or invalid"; exit 1; }
          if [ -e "$GITHUB_WORKSPACE/.admission-trusted" ] || [ -L "$GITHUB_WORKSPACE/.admission-trusted" ]; then
            echo "::error::trusted admission destination is present in the candidate checkout"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out trusted admission bundle
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.trusted.outputs.sha }}
          path: .admission-trusted
          sparse-checkout: .github/actions/pr-candidate-admission
          persist-credentials: false
      - name: Verify trusted admission bundle
        shell: bash
        env:
          TRUSTED_ADMISSION_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          refuse() { echo "::error::trusted admission bundle is missing or differs from the immutable source"; exit 1; }
          trusted="$GITHUB_WORKSPACE/.admission-trusted"
          [[ "$TRUSTED_ADMISSION_SHA" =~ ^[0-9a-f]{40}$ ]] || refuse
          [ "$(git -C "$trusted" rev-parse HEAD)" = "$TRUSTED_ADMISSION_SHA" ] || refuse
          for name in action.yml candidate_admission.py release_cut_admission.py; do
            path=".github/actions/pr-candidate-admission/$name"
            [ -f "$trusted/$path" ] && [ ! -L "$trusted/$path" ] || refuse
            expected="$(git -C "$trusted" rev-parse "$TRUSTED_ADMISSION_SHA:$path")" || refuse
            actual="$(git hash-object --no-filters "$trusted/$path")" || refuse
            [ "$actual" = "$expected" ] || refuse
          done
      - name: Exercise admission discriminators
        uses: ./.admission-trusted/.github/actions/pr-candidate-admission
        with:
          mode: self-test
          max-changed-files: '160'
          max-changed-lines: '3000'
      - name: Resolve queued PR
        id: entry
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          pr="$PR_NUMBER" head="$PR_HEAD_SHA" labels="$PR_LABELS" queue_entry=""
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # The queue branch is named .../pr-<number>-<sha>. The PR comes from
            # the name; the exact head is the PR's live head, which must match
            # the name's sha when that sha is a PR head (a push after enqueue)
            # and may equal the group's base otherwise. Admission is per PR: the
            # queued commit must be one squash commit of that PR directly on the
            # group's base, so the workflow itself refuses a batch (fail closed)
            # even if the ruleset group size is misconfigured. Its tree must be
            # that head merged onto the base (checked below).
            [[ "$GROUP_HEAD_REF" =~ /pr-([0-9]+)-([0-9a-f]{40})$ ]] || { echo "::error::merge group ref names no queued PR: $GROUP_HEAD_REF"; exit 1; }
            pr="${BASH_REMATCH[1]}" ref_sha="${BASH_REMATCH[2]}"
            current="$(gh api "repos/${REPOSITORY}/pulls/${pr}")"
            head="$(jq -r '.head.sha' <<<"$current")"
            { [ "$ref_sha" = "$head" ] || [ "$ref_sha" = "$GROUP_BASE_SHA" ]; } || { echo "::error::queue ref sha $ref_sha is neither the live head $head of PR #${pr} (pushed after enqueue) nor the group base $GROUP_BASE_SHA"; exit 1; }
            commit="$(gh api "repos/${REPOSITORY}/commits/${GROUP_HEAD_SHA}")"
            parents="$(jq -r '.parents | length' <<<"$commit")"
            subject="$(jq -r '.commit.message | split("\n")[0]' <<<"$commit")"
            parent="$(jq -r '.parents[0].sha // empty' <<<"$commit")"
            # A group's base is the parent of its first commit, so a one-entry
            # group has base == the queued commit's parent; a batch does not.
            { [ "$parents" = "1" ] && [ "$parent" = "$GROUP_BASE_SHA" ] && [[ "$subject" == *"(#${pr})" ]]; } || { echo "::error::queued commit is not a single squash commit of PR #${pr} ($parents parents, parent $parent, base $GROUP_BASE_SHA: $subject); candidate admission requires exactly one queued PR per group"; exit 1; }
            # The ref sha and commit dates do not bind the live head to the queued
            # commit, so bind by content: the queued tree must be exactly the live
            # head merged onto the group base. The head comes from the PR's own
            # ref and must still be the head read above; no match, merge conflict
            # or missing history refuses (fail closed).
            { [ "$(git rev-parse --is-shallow-repository)" = false ] || git fetch --no-tags --unshallow origin; } || { echo "::error::cannot complete history to bind the queued commit to PR #${pr}"; exit 1; }
            fetched="$(git fetch --no-tags origin "refs/pull/${pr}/head" && git rev-parse FETCH_HEAD)" && [ "$fetched" = "$head" ] || { echo "::error::refs/pull/${pr}/head (${fetched:-unfetched}) is not the live head $head of PR #${pr}"; exit 1; }
            merged="$(git merge-tree --write-tree "$GROUP_BASE_SHA" "$head")" && [ "${merged%%$'\n'*}" = "$(git rev-parse "${GROUP_HEAD_SHA}^{tree}")" ] || { echo "::error::queued commit ${GROUP_HEAD_SHA} is not PR #${pr} head $head merged onto base $GROUP_BASE_SHA"; exit 1; }
            queue=$(gh api graphql -f query='query($number:Int!){repository(owner:"EffortlessMetrics",name:"ripr-swarm"){pullRequest(number:$number){headRefOid mergeQueueEntry{id}}}}' -F number="$pr")
            queue_entry=$(jq -er --arg head "$head" 'select(.errors == null) | .data.repository.pullRequest | select(.headRefOid == $head) | .mergeQueueEntry.id | select(type == "string" and length > 0)' <<<"$queue")
            labels="$(jq -r '[.labels[].name] | join(",")' <<<"$current")"
          fi
          { echo "pr=$pr"; echo "head=$head"; echo "labels=$labels"; echo "queue_entry=$queue_entry"; echo "request=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"; } >> "$GITHUB_OUTPUT"
      - name: Admit exact candidate
        id: candidate
        uses: ./.admission-trusted/.github/actions/pr-candidate-admission
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          pr-number: ${{ steps.entry.outputs.pr }}
          expected-head: ${{ steps.entry.outputs.head }}
          docs-only: ${{ needs.detect-docs-only.outputs.docs_only || 'false' }}
          max-changed-files: '160'
          max-changed-lines: '3000'

  rust-cx43:
    name: Ripr Rust Small on CX43
    needs: [admission, route, detect-docs-only]
    if: needs.route.outputs.router_target == 'cx43' && needs.admission.result == 'success' && needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      proof-profile: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
      head-sha: ${{ needs.qualification.outputs.head }}
      base-sha: ${{ needs.qualification.outputs.base }}
      subject-sha: ${{ needs.qualification.outputs.merge }}
      subject-tree: ${{ needs.qualification.outputs.tree }}
      workflow-generation: ${{ needs.qualification.outputs.generation }}
      subject-json: ${{ needs.qualification.outputs.subject }}
      subject-identity: ${{ needs.qualification.outputs.identity }}
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx43","rust-medium","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 35
      use-scratch: true
      pr-labels: ${{ needs.admission.outputs.labels }}
      artifact-name: ripr-rust-small-cx43
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}
      upload-success-artifacts: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}

  rust-cpx42:
    name: Ripr Rust Small on CPX42
    needs: [admission, route, detect-docs-only]
    if: needs.route.outputs.router_target == 'cpx42' && needs.admission.result == 'success' && needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      proof-profile: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
      head-sha: ${{ needs.qualification.outputs.head }}
      base-sha: ${{ needs.qualification.outputs.base }}
      subject-sha: ${{ needs.qualification.outputs.merge }}
      subject-tree: ${{ needs.qualification.outputs.tree }}
      workflow-generation: ${{ needs.qualification.outputs.generation }}
      subject-json: ${{ needs.qualification.outputs.subject }}
      subject-identity: ${{ needs.qualification.outputs.identity }}
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cpx42","rust-medium","rust-16gb","trusted-pr"]}'
      cargo-build-jobs: "8"
      disk-guard-threshold: 35
      use-scratch: true
      pr-labels: ${{ needs.admission.outputs.labels }}
      artifact-name: ripr-rust-small-cpx42
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}
      upload-success-artifacts: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}

  rust-cx53:
    name: Ripr Rust Small on CX53
    needs: [admission, route, detect-docs-only]
    if: needs.route.outputs.router_target == 'cx53' && needs.admission.result == 'success' && needs.detect-docs-only.outputs.docs_only != 'true'
    uses: ./.github/workflows/rust-gates.yml
    with:
      proof-profile: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
      head-sha: ${{ needs.qualification.outputs.head }}
      base-sha: ${{ needs.qualification.outputs.base }}
      subject-sha: ${{ needs.qualification.outputs.merge }}
      subject-tree: ${{ needs.qualification.outputs.tree }}
      workflow-generation: ${{ needs.qualification.outputs.generation }}
      subject-json: ${{ needs.qualification.outputs.subject }}
      subject-identity: ${{ needs.qualification.outputs.identity }}
      runner-config: '{"group":"em-ci-small","labels":["self-hosted","linux","x64","em-ci","cx53","rust-large","trusted-pr"]}'
      cargo-build-jobs: "12"
      disk-guard-threshold: 50
      use-scratch: true
      pr-labels: ${{ needs.admission.outputs.labels }}
      artifact-name: ripr-rust-small-cx53
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}
      upload-success-artifacts: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}

  rust-github:
    name: Ripr Rust Small on GitHub Hosted
    needs: [admission, route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53]
    # Use the not-cancelled status check here, never the unconditional one:
    # both still run after a skipped or tempfailed self-hosted job, but an
    # unconditional job also survives cancellation, so a repeated merge-ready
    # request left the obsolete head's full gate running and queued the
    # new head's run behind it (#6729).
    if: >-
      !cancelled() &&
      needs.admission.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.detect-docs-only.outputs.docs_only != 'true' &&
      (needs.route.outputs.router_target == 'github' ||
      (needs.route.outputs.router_target == 'cx43' && needs.rust-cx43.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cpx42' && needs.rust-cpx42.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cx53' && needs.rust-cx53.outputs.scratch_status == 'tempfail'))
    uses: ./.github/workflows/rust-gates.yml
    with:
      proof-profile: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
      head-sha: ${{ needs.qualification.outputs.head }}
      base-sha: ${{ needs.qualification.outputs.base }}
      subject-sha: ${{ needs.qualification.outputs.merge }}
      subject-tree: ${{ needs.qualification.outputs.tree }}
      workflow-generation: ${{ needs.qualification.outputs.generation }}
      subject-json: ${{ needs.qualification.outputs.subject }}
      subject-identity: ${{ needs.qualification.outputs.identity }}
      runner-config: '"ubuntu-latest"'
      cargo-build-jobs: "8"
      disk-guard-threshold: 0
      use-scratch: false
      # The hosted gates leave the nextest step to rust-github-tests (#10507).
      test-shards: 4
      pr-labels: ${{ needs.admission.outputs.labels }}
      artifact-name: ripr-rust-small-github
      # 120min hard deadline: the rust-gates PR-evidence producer itself
      # allows 3600s (#3731), so the job envelope must exceed it.
      job-timeout-minutes: 120
      run-advisory-reports: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}
      upload-success-artifacts: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || contains(format(',{0},', needs.admission.outputs.labels), ',full-ci,') }}

  # The hosted required test phase as four nextest partitions, after every
  # hosted gate passed (#10507). The self-hosted routes keep the one-command step
  # inside their own rust-gates job, so this runs only behind a succeeded
  # rust-github job; `result` fails the required context unless it passes too.
  rust-github-tests:
    name: Ripr Rust Small tests on GitHub Hosted
    needs: [rust-github]
    if: ${{ !cancelled() && needs.rust-github.result == 'success' }}
    uses: ./.github/workflows/rust-test-shards.yml
    with:
      artifact-name: ripr-rust-small-github

  docs-gate:
    name: Ripr Docs Gate
    needs: [admission, qualification, detect-docs-only]
    if: needs.admission.result == 'success' && (github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.detect-docs-only.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.qualification.outputs.merge || github.sha }}
      - name: Verify admitted docs producer before proof
        id: admitted
        env:
          PROFILE: ${{ github.event_name == 'pull_request' && 'qualification' || 'legacy' }}
          SUBJECT_JSON: ${{ needs.qualification.outputs.subject }}
          ADMITTED_HEAD: ${{ needs.qualification.outputs.head }}
          ADMITTED_BASE: ${{ needs.qualification.outputs.base }}
          ADMITTED_MERGE: ${{ needs.qualification.outputs.merge }}
          ADMITTED_TREE: ${{ needs.qualification.outputs.tree }}
          GENERATION: ${{ needs.qualification.outputs.generation }}
          IDENTITY: ${{ needs.qualification.outputs.identity }}
          LEGACY_HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          LEGACY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          case "$PROFILE" in
            legacy)
              for value in "$SUBJECT_JSON" "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" "$GENERATION" "$IDENTITY"; do
                [[ -z "$value" ]] || { echo 'Partial qualification cannot use legacy profile' >&2; exit 1; }
              done
              printf 'head=%s\nbase=%s\n' "$LEGACY_HEAD" "$LEGACY_BASE" >> "$GITHUB_OUTPUT"
              ;;
            qualification)
              for value in "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" "$GENERATION"; do [[ "$value" =~ ^[0-9a-f]{40}$ ]]; done
              [[ "$IDENTITY" =~ ^[0-9a-f]{64}$ && "$GENERATION" == "$GITHUB_WORKFLOW_SHA" ]]
              jq -e --arg repo "$GITHUB_REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$ADMITTED_HEAD" --arg base "$ADMITTED_BASE" --arg merge "$ADMITTED_MERGE" --arg tree "$ADMITTED_TREE" --arg generation "$GENERATION" '
                .version == 2 and .repository == $repo and .repository_id == $repo_id and .pr_id == $pr_id and .pr_number == $number and
                .destination_repository_id == $repo_id and .destination_ref == "refs/heads/main" and
                .head == $head and .base == $base and .merge == $merge and .tree == $tree and
                .parents == [$base,$head] and .workflow_generation == $generation' <<< "$SUBJECT_JSON" >/dev/null
              canonical=$(jq -cS . <<< "$SUBJECT_JSON")
              [[ "$(printf '%s' "$canonical" | sha256sum | cut -d ' ' -f1)" == "$IDENTITY" ]]
              [[ "$(git cat-file -t HEAD)" == commit && "$(git rev-parse HEAD)" == "$ADMITTED_MERGE" ]]
              [[ "$(git rev-parse 'HEAD^{tree}')" == "$ADMITTED_TREE" ]]
              [[ "$(git show -s --format=%P HEAD)" == "$ADMITTED_BASE $ADMITTED_HEAD" ]]
              printf 'head=%s\nbase=%s\nmerge=%s\ntree=%s\n' "$ADMITTED_HEAD" "$ADMITTED_BASE" "$ADMITTED_MERGE" "$ADMITTED_TREE" >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'Unknown source profile' >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ripr-docs-gate
      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml
      - name: Doc/spec gates (full precommit table)
        env:
          RIPR_POLICY_PREFLIGHT_RECEIPT: target/ripr/reports/policy-preflight.json
        run: |
          cargo policy preflight
          cargo xtask precommit
      # #5531: a Markdown-only PR can hand-edit the generated registry block in
      # docs/status/SUPPORT_TIERS.md or docs/LANGUAGE_ADAPTER_PREVIEW.md, or rename a spec a registry cell cites. Both
      # checks need a `ripr` build, so they run only when such a file changed;
      # other docs-only PRs build nothing extra. Same runner, token and trust
      # boundary as the precommit step above.
      - name: Capability registry checks (SUPPORT_TIERS.md, preview guide or spec change)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          # NUL records preserve paths Git C-quotes even with quotePath=false.
          git -c core.quotePath=false diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" > "$changed"
          selected=false
          while IFS= read -r -d '' path; do
            case "$path" in
              docs/status/SUPPORT_TIERS.md|docs/LANGUAGE_ADAPTER_PREVIEW.md|docs/specs/*) selected=true; break ;;
            esac
          done < "$changed"
          if [ "$selected" = true ]; then
            cargo xtask capability-docs --check
            cargo xtask check-capability-producers
          else
            echo "No SUPPORT_TIERS.md, LANGUAGE_ADAPTER_PREVIEW.md or docs/specs change; capability registry checks not needed."
          fi
      - name: Upload docs-gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-docs-gate
          path: target/ripr/reports/
          if-no-files-found: ignore
          retention-days: 5

  windows-subset:
    needs: [qualification]
    if: needs.qualification.outputs.execute == 'true'
    uses: ./.github/workflows/windows-subset-qualification.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ needs.qualification.outputs.head }}
      base_sha: ${{ needs.qualification.outputs.base }}
      subject_sha: ${{ needs.qualification.outputs.merge }}
      subject_tree: ${{ needs.qualification.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

  python-wheel:
    needs: [qualification]
    if: needs.qualification.outputs.execute == 'true'
    uses: ./.github/workflows/python-wheel-qualification.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ needs.qualification.outputs.head }}
      base_sha: ${{ needs.qualification.outputs.base }}
      subject_sha: ${{ needs.qualification.outputs.merge }}
      subject_tree: ${{ needs.qualification.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

  ci-feature:
    needs: [qualification]
    if: needs.qualification.outputs.execute == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ needs.qualification.outputs.head }}
      base_sha: ${{ needs.qualification.outputs.base }}
      subject_sha: ${{ needs.qualification.outputs.merge }}
      subject_tree: ${{ needs.qualification.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

      # Conservative frozen intent: applicability is not narrowed in this source stage.
      run_rust_only: true
      run_release_proof: true
      run_msrv: true
      run_vscode: true

  printed-command:
    needs: [qualification]
    if: needs.qualification.outputs.execute == 'true'
    uses: ./.github/workflows/printed-command-paste.yml
    with:
      proof_profile: qualification
      request_id: ${{ format('{0}-{1}', github.run_id, github.run_attempt) }}
      head_sha: ${{ needs.qualification.outputs.head }}
      base_sha: ${{ needs.qualification.outputs.base }}
      subject_sha: ${{ needs.qualification.outputs.merge }}
      subject_tree: ${{ needs.qualification.outputs.tree }}
      workflow_generation: ${{ github.workflow_sha }}

  result:
    # Static `Ripr Rust Small Result` only for main/manual runs and an explicit
    # merge-ready request. Any other pull_request label event is a nonrequest
    # under a different name so the required context is never satisfied by it.
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'merge-ready') && 'Ripr Rust Small Result' || 'Merge-ready Nonrequest' }}
    needs: [admission, qualification, route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53, rust-github, rust-github-tests, docs-gate, windows-subset, python-wheel, ci-feature, printed-command]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify immutable qualification subject
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STORED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBJECT_SHA: ${{ github.sha }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_DATABASE_ID: ${{ github.event.pull_request.id }}
          GENERATION: ${{ github.workflow_sha }}
          EXPECTED_SUBJECT: ${{ needs.qualification.outputs.subject }}
          EXPECTED_IDENTITY: ${{ needs.qualification.outputs.identity }}
          EXPECTED_REQUEST_ID: ${{ needs.qualification.outputs.request_id }}
        run: |
          set -euo pipefail
          trap 'status=$?; printf "qualification_refusal status=%s\n" "$status" >&2; exit "$status"' ERR
          [ "$LABEL" = merge-ready ] || exit 0
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$EXPECTED_REQUEST_ID" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]] || { echo 'Qualification attempt substitution refused' >&2; exit 1; }
          for sha in "$HEAD_SHA" "$SUBJECT_SHA" "$GENERATION"; do [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; done
          candidate=$(jq -ceS --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" --arg merge "$SUBJECT_SHA" --arg generation "$GENERATION" "$QUALIFICATION_SUBJECT_JQ" <<< "$EXPECTED_SUBJECT")
          identity=$(printf '%s' "$candidate" | sha256sum | cut -d ' ' -f1)
          [[ "$identity" == "$EXPECTED_IDENTITY" ]] || { echo 'Qualification identity substitution refused' >&2; exit 1; }
          base=$(jq -er .base <<< "$candidate")
          tree=$(jq -er .tree <<< "$candidate")
          commit=$(gh api "repos/$REPOSITORY/git/commits/$SUBJECT_SHA")
          jq -e --arg merge "$SUBJECT_SHA" --arg base "$base" --arg head "$HEAD_SHA" --arg tree "$tree" "${NATIVE_COMMIT_JQ:?}" <<< "$commit" >/dev/null
          printf 'Qualified request `%s`, identity `%s`, subject `%s`; final_currentness_required=true.\n' "$EXPECTED_REQUEST_ID" "$EXPECTED_IDENTITY" "$candidate" >> "$GITHUB_STEP_SUMMARY"

      - name: Recheck current head and base before result publication
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STORED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SUBJECT_SHA: ${{ github.sha }}
          REPOSITORY_ID: ${{ github.event.repository.node_id }}
          PR_ID: ${{ github.event.pull_request.node_id }}
          PR_DATABASE_ID: ${{ github.event.pull_request.id }}
          GENERATION: ${{ github.workflow_sha }}
          EXPECTED_SUBJECT: ${{ needs.qualification.outputs.subject }}
          EXPECTED_IDENTITY: ${{ needs.qualification.outputs.identity }}
          EXPECTED_REQUEST_ID: ${{ needs.qualification.outputs.request_id }}
        run: |
          set -euo pipefail
          readiness_refused() { # Advisory diagnostics preserve the original status.
            local status=$? diagnostic='{"payload":"not-read"}'
            trap - ERR
            set +e
            printf 'readiness_refusal phase=%s status=%s\n' "$readiness_phase" "$status" >&2
            case "$readiness_phase" in
              subject-check|subject-final-check)
                diagnostic='{"payload":"current-repository-observation","currentness_established":false}'
                ;;
              pull-request-check)
                diagnostic=$(jq -cs --arg repo "$REPOSITORY" --arg head "$HEAD_SHA" --arg base "$STORED_BASE_SHA" --arg subject "$SUBJECT_SHA" "${READINESS_PR_DIAGNOSTIC_JQ:-halt_error(5)}" <<< "${pr-}" 2>/dev/null) || diagnostic='{"payload":"invalid-json-or-shape"}'
                ;;
              reviews-check)
                diagnostic=$(jq -cs --arg head "$HEAD_SHA" "$REVIEW_DISPOSITION_JQ${READINESS_REVIEWS_DIAGNOSTIC_JQ:-halt_error(5)}" <<< "${reviews-}" 2>/dev/null) || diagnostic='{"payload":"invalid-json-or-shape"}'
                ;;
              threads-check|threads-page-parse|threads-cursor-parse)
                diagnostic=$(jq -cs "${READINESS_THREADS_DIAGNOSTIC_JQ:-halt_error(5)}" <<< "${threads-}" 2>/dev/null) || diagnostic='{"payload":"invalid-json-or-shape"}'
                ;;
            esac
            printf 'readiness_detail=%s\n' "$diagnostic" >&2
            exit "$status"
          }
          readiness_phase='start'
          trap readiness_refused ERR
          [ "$LABEL" = merge-ready ] || exit 0
          settle_request() {
            local attempt state
            for attempt in 1 2 3; do
              readiness_phase='pull-request-fetch'
              pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER") || return
              readiness_phase='pull-request-check'
              jq -e --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" --arg merge "$SUBJECT_SHA" "${NATIVE_REQUEST_JQ:?}" <<< "$pr" >/dev/null || return
              state=$(jq -er 'if .mergeable == null then "pending" elif .mergeable == true then "ready" else "refused" end' <<< "$pr") || return
              case "$state" in
                ready) jq -e '.merge_commit_sha | type == "string" and test("^[0-9a-f]{40}$")' <<< "$pr" >/dev/null || return; return 0 ;;
                refused) echo 'Mergeability refused' >&2; return 1 ;;
                pending) [ "$attempt" = 3 ] || sleep 2 ;;
              esac
            done
            echo 'Mergeability not established within bounded refresh' >&2
            return 1
          }
          observe_current_base() {
            local frame
            frame=$(gh api graphql -f query="$NATIVE_SUBJECT_QUERY" -F number="$PR_NUMBER") || return
            jq -er --arg repo "$REPOSITORY" --arg repo_id "$REPOSITORY_ID" --arg pr_id "$PR_ID" --argjson number "$PR_NUMBER" --arg head "$HEAD_SHA" "$FINAL_CURRENTNESS_JQ" <<< "$frame"
          }
          readiness_phase='subject-refresh'
          settle_request || readiness_refused
          readiness_phase='subject-check'
          current_base_before=$(observe_current_base) || readiness_refused
          readiness_phase='reviews-fetch'
          reviews=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100")
          readiness_phase='author-parse'
          author=$(jq -r .user.login <<< "$pr")
          readiness_phase='reviews-check'
          jq -s -e --arg head "$HEAD_SHA" --arg author "$author" "$REVIEW_DISPOSITION_JQ${NATIVE_REVIEWS_JQ:?}" <<< "$reviews" >/dev/null
          cursor=null
          while :; do
            readiness_phase='threads-fetch'
            threads=$(gh api graphql -f query="query(\$number:Int!,\$cursor:String){repository(owner:\"EffortlessMetrics\",name:\"ripr-swarm\"){pullRequest(number:\$number){reviewThreads(first:100,after:\$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}" -F number="$PR_NUMBER" -F cursor="$cursor")
            readiness_phase='threads-check'
            jq -e '.errors == null and (.data.repository.pullRequest.reviewThreads.nodes | all(.isResolved == true))' <<< "$threads" >/dev/null
            readiness_phase='threads-page-parse'
            more=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage | if type == "boolean" then tostring else error("invalid pagination") end' <<< "$threads")
            [ "$more" = true ] || break
            readiness_phase='threads-cursor-parse'
            cursor=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(length > 0)' <<< "$threads")
          done
          readiness_phase='subject-final-refresh'
          settle_request || readiness_refused
          readiness_phase='subject-final-check'
          current_base_after=$(observe_current_base) || readiness_refused
          # Qualification describes Tq. Bm compatibility and merge permission are
          # a separate final judgment, even when the observed base did not move.
          {
            printf '### Immutable qualification subject\n\n'
            printf 'Request: `%s`; identity: `%s`\n\n' "$EXPECTED_REQUEST_ID" "$EXPECTED_IDENTITY"
            printf 'Observed main before/after review: `%s` / `%s`\n\n' "$current_base_before" "$current_base_after"
            printf 'final_currentness_required=true; current-main compatibility and merge permission are not asserted.\n'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Recheck initially admitted eligibility
        id: eligibility
        if: needs.admission.result == 'success' && needs.admission.outputs.status == 'admitted' && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.label.name == 'merge-ready'))
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ needs.admission.outputs.pr }}
          EXPECTED_HEAD: ${{ needs.admission.outputs.head }}
          EXPECTED_REQUEST: ${{ needs.admission.outputs.request }}
          EXPECTED_QUEUE_ENTRY: ${{ needs.admission.outputs.queue_entry }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Bind live eligibility to initial admission, never a newly adopted H.
          # This does not authenticate the caller or establish G's composition.
          current_eligibility() {
            local pr frame cursor=null more page=0
            [ "$REPOSITORY" = EffortlessMetrics/ripr-swarm ] || return 1
            [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ && "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || return 1
            [[ "$EXPECTED_REQUEST" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]] || return 1
            read_pr() {
              pr=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER") || return
              jq -e --arg repo "$REPOSITORY" --arg head "$EXPECTED_HEAD" --argjson number "$PR_NUMBER" --arg event "$EVENT_NAME" '
                .number == $number and .state == "open" and .draft == false and
                .head.sha == $head and .head.repo.full_name == $repo and
                .base.ref == "main" and .base.repo.full_name == $repo and
                ($event != "pull_request" or (.labels | type == "array" and any(.name == "merge-ready")))
              ' <<<"$pr" >/dev/null
            }
            read_pr || return
            while :; do
              page=$((page + 1)); [ "$page" -le 100 ] || return 1
              frame=$(gh api graphql -f query='query($number:Int!,$cursor:String){repository(owner:"EffortlessMetrics",name:"ripr-swarm"){pullRequest(number:$number){headRefOid reviewDecision mergeQueueEntry{id} reviewThreads(first:100,after:$cursor){nodes{isResolved}pageInfo{hasNextPage endCursor}}}}}' -F number="$PR_NUMBER" -F cursor="$cursor") || return
              jq -e --arg head "$EXPECTED_HEAD" --arg event "$EVENT_NAME" --arg entry "$EXPECTED_QUEUE_ENTRY" '
                .errors == null and (.data.repository.pullRequest |
                  has("reviewDecision") and .headRefOid == $head and
                  (.reviewDecision as $decision | [null,"APPROVED","REVIEW_REQUIRED"] | index($decision) != null) and
                  ($event != "merge_group" or ($entry != "" and .mergeQueueEntry.id == $entry)) and
                  (.reviewThreads.nodes | type == "array" and all(.isResolved == true)) and
                  (.reviewThreads.pageInfo.hasNextPage | type == "boolean"))
              ' <<<"$frame" >/dev/null || return
              more=$(jq -r '.data.repository.pullRequest.reviewThreads.pageInfo.hasNextPage' <<<"$frame") || return
              [ "$more" = true ] || break
              cursor=$(jq -er '.data.repository.pullRequest.reviewThreads.pageInfo.endCursor | select(type == "string" and length > 0)' <<<"$frame") || return
            done
            read_pr
          }
          current_eligibility
      - name: Summarize routed result
        if: always()
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          ADMISSION_STATUS: ${{ needs.admission.outputs.status }}
          ADMISSION_REASON: ${{ needs.admission.outputs.reason }}
          ADMISSION_DETAIL: ${{ needs.admission.outputs.detail }}
          ADMISSION_CUT_STATUS: ${{ needs.admission.outputs.cut_status }}
          ADMISSION_CUT_REASON: ${{ needs.admission.outputs.cut_reason }}
          ADMISSION_CUT_DETAIL: ${{ needs.admission.outputs.cut_detail }}
          ADMISSION_CLAIM: ${{ needs.admission.outputs.claim }}
          ADMISSION_ACCEPTANCE_DELTA: ${{ needs.admission.outputs.acceptance_delta }}
          ADMISSION_COMPETING_PRS: ${{ needs.admission.outputs.competing_prs }}
          ADMISSION_CHANGED_FILES: ${{ needs.admission.outputs.changed_files }}
          ADMISSION_CHANGED_LINES: ${{ needs.admission.outputs.changed_lines }}
          REF: ${{ github.ref }}
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
          QUALIFICATION_EXECUTE: ${{ needs.qualification.outputs.execute }}
          QUALIFICATION_PRIOR_RESULT: ${{ needs.qualification.outputs.prior_result }}
          WINDOWS_RESULT: ${{ needs.windows-subset.result }}
          PASTE_RESULT: ${{ needs.printed-command.result }}
          CI_RESULT: ${{ needs.ci-feature.result }}
          WHEEL_RESULT: ${{ needs.python-wheel.result }}
          TARGET: ${{ needs.route.outputs.router_target }}
          REASON: ${{ needs.route.outputs.router_reason }}
          ROUTE_RESULT: ${{ needs.route.result }}
          CX43_RESULT: ${{ needs.rust-cx43.result }}
          CPX42_RESULT: ${{ needs.rust-cpx42.result }}
          CX53_RESULT: ${{ needs.rust-cx53.result }}
          GITHUB_RESULT: ${{ needs.rust-github.result }}
          GITHUB_TESTS_RESULT: ${{ needs.rust-github-tests.result }}
          CX43_SCRATCH_STATUS: ${{ needs.rust-cx43.outputs.scratch_status }}
          CPX42_SCRATCH_STATUS: ${{ needs.rust-cpx42.outputs.scratch_status }}
          CX53_SCRATCH_STATUS: ${{ needs.rust-cx53.outputs.scratch_status }}
          CX43_SCRATCH_MESSAGE: ${{ needs.rust-cx43.outputs.scratch_message }}
          CPX42_SCRATCH_MESSAGE: ${{ needs.rust-cpx42.outputs.scratch_message }}
          CX53_SCRATCH_MESSAGE: ${{ needs.rust-cx53.outputs.scratch_message }}
          RUNNER_QUERY: ${{ needs.route.outputs.runner_query }}
          RUNNER_QUERY_EXIT_CODE: ${{ needs.route.outputs.runner_query_exit_code }}
          RUNNER_TOTAL: ${{ needs.route.outputs.runner_total }}
          CX43_ONLINE: ${{ needs.route.outputs.cx43_online }}
          CX43_IDLE_READY: ${{ needs.route.outputs.cx43_idle_ready }}
          CPX42_ONLINE: ${{ needs.route.outputs.cpx42_online }}
          CPX42_IDLE_READY: ${{ needs.route.outputs.cpx42_idle_ready }}
          CX53_ONLINE: ${{ needs.route.outputs.cx53_online }}
          CX53_IDLE_READY: ${{ needs.route.outputs.cx53_idle_ready }}
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          DOCS_DETECT_RESULT: ${{ needs.detect-docs-only.result }}
          DOCS_ONLY: ${{ needs.detect-docs-only.outputs.docs_only }}
          DOCS_GATE_RESULT: ${{ needs.docs-gate.result }}
          WORKFLOW_REF: ${{ github.ref }}
          ELIGIBILITY_RESULT: ${{ steps.eligibility.outcome }}
        run: |
          case "$EVENT_NAME:$REF" in
            push:refs/heads/main|push:refs/heads/master|workflow_dispatch:*)
              [ "$QUALIFICATION_RESULT" = skipped ] || { echo 'Legacy profile must skip PR qualification admission' >&2; exit 1; }
              for result in "$WINDOWS_RESULT" "$PASTE_RESULT" "$CI_RESULT" "$WHEEL_RESULT"; do
                [ "$result" = skipped ] || { echo 'Legacy profile must skip PR-only leaves' >&2; exit 1; }
              done
              ;;
            pull_request:*)
              [ "$LABEL_NAME" = merge-ready ] || exit 0
              [ "$QUALIFICATION_RESULT" = success ] || { echo 'Qualification admission missing/failed' >&2; exit 1; }
              if [ "$QUALIFICATION_EXECUTE" = false ]; then
                [ "$QUALIFICATION_PRIOR_RESULT" = success ] || { echo 'Prior required result failed; no implicit retry' >&2; exit 1; }
                exit 0
              fi
              [ "$QUALIFICATION_EXECUTE" = true ] || { echo 'Incomplete native request' >&2; exit 1; }
              [ "$WINDOWS_RESULT" = success ] || { echo 'Selected Windows evidence missing/failed' >&2; exit 1; }
              [ "$PASTE_RESULT" = success ] || { echo 'Selected printed-command evidence missing/failed' >&2; exit 1; }
              [ "$CI_RESULT" = success ] || { echo 'Selected CI evidence missing/failed' >&2; exit 1; }
              [ "$WHEEL_RESULT" = success ] || { echo 'Selected wheel evidence missing/failed' >&2; exit 1; }
              ;;
            merge_group:*)
              for result in "$WINDOWS_RESULT" "$PASTE_RESULT" "$CI_RESULT" "$WHEEL_RESULT"; do
                [ "$result" = skipped ] || { echo 'Queue profile must skip PR-only leaves' >&2; exit 1; }
              done
              ;;
            *) echo 'Unsupported qualification event profile' >&2; exit 1 ;;
          esac
          status=pass
          message="selected implementation job succeeded"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WORKFLOW_REF" != "refs/heads/main" ] && [ "$WORKFLOW_REF" != "refs/heads/master" ]; then
            status=fail
            message="branch/tag dispatch is diagnostic-only; PR qualification requires the merge queue or the merge-ready label"
          elif [ "$ADMISSION_CUT_STATUS" = "refused" ] && [ "$ADMISSION_STATUS" != "refused" ] && { [ "$ADMISSION_STATUS" = "admitted" ] || [ "$ADMISSION_RESULT" = "success" ]; }; then status=fail; message="hard-cut admission refused: ${ADMISSION_CUT_REASON:-unknown} — ${ADMISSION_CUT_DETAIL:-the active cut is frozen; only a packet-only #5114/#2766 control update may qualify before #1609}"
          elif [ "$ADMISSION_RESULT" != "success" ]; then status=fail; message="candidate admission result was $ADMISSION_RESULT: ${ADMISSION_REASON:-unknown} — ${ADMISSION_DETAIL:-refresh the exact PR/head evidence and retry}"
          elif [ "$ADMISSION_STATUS" != "admitted" ] && [ "$ADMISSION_STATUS" != "not_applicable" ]; then status=fail; message="candidate admission status was ${ADMISSION_STATUS:-missing}: ${ADMISSION_REASON:-unknown} — ${ADMISSION_DETAIL:-refresh the exact PR/head evidence and retry}"
          elif { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = merge_group ]; } && [ "$ELIGIBILITY_RESULT" != success ]; then status=fail; message="live eligibility no longer established for the initially admitted head/request"
          elif [ "$DOCS_DETECT_RESULT" != "success" ]; then
            status=fail
            message="docs-surface detection result was $DOCS_DETECT_RESULT"
          elif [ "$DOCS_ONLY" = "true" ] && { [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "merge_group" ]; }; then
            if [ "$DOCS_GATE_RESULT" = "success" ]; then
              message="docs-only surface; heavy lanes skipped; docs-gate passed"
            else
              status=fail
              message="docs-gate result was $DOCS_GATE_RESULT on a docs-only PR"
            fi
          elif [ "$ROUTE_RESULT" != "success" ]; then
            status=fail
            message="route job result was $ROUTE_RESULT"
          else
            case "$TARGET" in
              cx43)
                if [ "$CX43_RESULT" = "success" ]; then
                  message="CX43 job succeeded"
                elif [ "$CX43_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ] && [ "$GITHUB_TESTS_RESULT" = "success" ]; then
                  message="CX43 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CX43 job result was $CX43_RESULT (GitHub-hosted fallback $GITHUB_RESULT, sharded tests $GITHUB_TESTS_RESULT)"
                fi
                ;;
              cpx42)
                if [ "$CPX42_RESULT" = "success" ]; then
                  message="CPX42 job succeeded"
                elif [ "$CPX42_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ] && [ "$GITHUB_TESTS_RESULT" = "success" ]; then
                  message="CPX42 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CPX42 job result was $CPX42_RESULT (GitHub-hosted fallback $GITHUB_RESULT, sharded tests $GITHUB_TESTS_RESULT)"
                fi
                ;;
              cx53)
                if [ "$CX53_RESULT" = "success" ]; then
                  message="CX53 job succeeded"
                elif [ "$CX53_SCRATCH_STATUS" = "tempfail" ] && [ "$GITHUB_RESULT" = "success" ] && [ "$GITHUB_TESTS_RESULT" = "success" ]; then
                  message="CX53 disk-guard tempfailed; GitHub-hosted fallback succeeded"
                else
                  status=fail
                  message="CX53 job result was $CX53_RESULT (GitHub-hosted fallback $GITHUB_RESULT, sharded tests $GITHUB_TESTS_RESULT)"
                fi
                ;;
              github)
                if [ "$GITHUB_RESULT" != "success" ]; then status=fail; message="GitHub-hosted job result was $GITHUB_RESULT"
                elif [ "$GITHUB_TESTS_RESULT" != "success" ]; then status=fail; message="GitHub-hosted sharded tests result was $GITHUB_TESTS_RESULT"
                fi ;;
              *) status=fail; message="unknown routed target: $TARGET" ;;
            esac
          fi
          echo "### Ripr Rust Small Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          for row in "admission result:$ADMISSION_RESULT" "admission status:$ADMISSION_STATUS" "admission reason:$ADMISSION_REASON" "admission detail:$ADMISSION_DETAIL" "admission cut status:$ADMISSION_CUT_STATUS" "admission cut reason:$ADMISSION_CUT_REASON" "admission cut detail:$ADMISSION_CUT_DETAIL" "admission claim:$ADMISSION_CLAIM" "admission delta:$ADMISSION_ACCEPTANCE_DELTA" "competing PRs:$ADMISSION_COMPETING_PRS" "changed files:$ADMISSION_CHANGED_FILES" "changed lines:$ADMISSION_CHANGED_LINES" "target:$TARGET" "reason:$REASON" "docs_detect:$DOCS_DETECT_RESULT" "docs_only:$DOCS_ONLY" "docs_gate:$DOCS_GATE_RESULT" "status:$status" "message:$message" "route:$ROUTE_RESULT" "cx43:$CX43_RESULT" "cpx42:$CPX42_RESULT" "cx53:$CX53_RESULT" "github:$GITHUB_RESULT" "github tests:$GITHUB_TESTS_RESULT" "cx43 scratch:$CX43_SCRATCH_STATUS" "cpx42 scratch:$CPX42_SCRATCH_STATUS" "cx53 scratch:$CX53_SCRATCH_STATUS" "cx43 scratch message:$CX43_SCRATCH_MESSAGE" "cpx42 scratch message:$CPX42_SCRATCH_MESSAGE" "cx53 scratch message:$CX53_SCRATCH_MESSAGE" "runner query:$RUNNER_QUERY" "runner command exit code:$RUNNER_QUERY_EXIT_CODE" "visible runners:$RUNNER_TOTAL" "cx43 online:$CX43_ONLINE" "cx43 idle ready:$CX43_IDLE_READY" "cpx42 online:$CPX42_ONLINE" "cpx42 idle ready:$CPX42_IDLE_READY" "cx53 online:$CX53_ONLINE" "cx53 idle ready:$CX53_IDLE_READY"; do
            echo "- ${row%%:*}: \`${row#*:}\`" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$status" = "pass" ]
      - name: Record immutable qualification completion
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready' && needs.qualification.outputs.execute == 'true'
        env:
          QUALIFICATION_SUBJECT: ${{ needs.qualification.outputs.subject }}
          QUALIFICATION_IDENTITY: ${{ needs.qualification.outputs.identity }}
          QUALIFICATION_REQUEST: ${{ needs.qualification.outputs.request_id }}
          PRODUCER_RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          [[ "$QUALIFICATION_REQUEST" == "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" ]]
          jq -n --argjson subject "$QUALIFICATION_SUBJECT" --arg identity "$QUALIFICATION_IDENTITY" \
            --arg request "$QUALIFICATION_REQUEST" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson producers "$PRODUCER_RESULTS" \
            '{version:1,kind:"immutable-qualification-completion",subject:$subject,identity:$identity,
              request_id:$request,run_id:$run,run_attempt:$attempt,producer_results:$producers,
              final_currentness_required:true,current_main_compatibility:"not_asserted",
              cross_run_reuse:"not_qualified"}' > "$RUNNER_TEMP/qualification-completion.json"
      - name: Retain immutable qualification completion
        if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready' && needs.qualification.outputs.execute == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: qualification-completion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-completion.json
          if-no-files-found: error
          retention-days: 5
      # Re-evaluate cancellation after readiness and aggregation, including reuse.
      # The explicit status functions keep this rejection reachable after failure.
      - name: Reject workflow cancellation before final result
        if: always() && cancelled()
        run: |
          echo 'Workflow cancelled; required result cannot succeed' >&2
          exit 1
