name: Routed Rust Small
run-name: ${{ github.event_name == 'merge_group' && format('Merge queue {0}', github.event.merge_group.head_sha) || format('Manual queue proof {0}', github.sha) }}

on:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.event.merge_group.head_sha || github.sha) }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  route:
    name: Route Ripr Rust Small
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      router_target: ${{ steps.route.outputs.router_target }}
      router_reason: ${{ steps.route.outputs.router_reason }}
    steps:
      - name: Select the hosted queue route
        id: route
        shell: bash
        run: |
          set -euo pipefail
          echo 'router_target=github' >> "$GITHUB_OUTPUT"
          echo 'router_reason=queue_only_hosted' >> "$GITHUB_OUTPUT"

  detect-docs-only:
    name: Detect Docs-Only Surface
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether every changed file is docs/spec/markdown
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docs_only=false
          reason=manual_or_unclassified
          if [ "$EVENT_NAME" = merge_group ] && [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            changed="$(mktemp)"
            trap 'rm -f "$changed"' EXIT
            if git diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" > "$changed" && [ -s "$changed" ]; then
              docs_only=true
              reason=docs_only
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md|docs/*|.github/ISSUE_TEMPLATE/*) ;;
                  *) docs_only=false; reason=code_or_policy_surface; break ;;
                esac
              done < "$changed"
            else
              reason=empty_or_unavailable_diff
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf '### Queue scope\n\n- docs only: `%s`\n- reason: `%s`\n' "$docs_only" "$reason" >> "$GITHUB_STEP_SUMMARY"

  admission:
    name: Admit Queue Integration
    needs: [route, detect-docs-only]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.admit.outputs.status }}
      docs_only: ${{ needs.detect-docs-only.outputs.docs_only }}
      labels: ''
      reason: ${{ steps.admit.outputs.reason }}
      head: ${{ steps.admit.outputs.head }}
      history_sync_source: ''
      history_sync_destination_base: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bind proof to the requested queue integration
        id: admit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha || github.sha }}
          CHECKOUT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$REPOSITORY" = EffortlessMetrics/ripr-swarm ]
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$HEAD_SHA" ]
          if [ "$EVENT_NAME" = merge_group ]; then
            [ "$EVENT_ACTION" = checks_requested ]
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [ "$CHECKOUT_SHA" = "$HEAD_SHA" ]
            git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
            reason=merge_group_checks_requested
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            reason=manual_diagnostic
          else
            echo "::error::unsupported event $EVENT_NAME"
            exit 1
          fi
          echo 'status=admitted' >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

  # Retained as inert compatibility nodes while the old self-hosted route is
  # removed from the protected proof. They allocate no runner and cannot win
  # routing; the next cleanup layer removes the dead contract surface.
  rust-cx43:
    name: Retired CX43 route
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      scratch_status: ${{ steps.retired.outputs.scratch_status }}
    steps:
      - id: retired
        run: echo 'scratch_status=retired' >> "$GITHUB_OUTPUT"

  rust-cpx42:
    name: Retired CPX42 route
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      scratch_status: ${{ steps.retired.outputs.scratch_status }}
    steps:
      - id: retired
        run: echo 'scratch_status=retired' >> "$GITHUB_OUTPUT"

  rust-cx53:
    name: Retired CX53 route
    if: ${{ false }}
    runs-on: ubuntu-latest
    outputs:
      scratch_status: ${{ steps.retired.outputs.scratch_status }}
    steps:
      - id: retired
        run: echo 'scratch_status=retired' >> "$GITHUB_OUTPUT"

  rust-github:
    name: Ripr Rust Small on GitHub Hosted
    needs: [admission, route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53]
    if: >-
      !cancelled() &&
      needs.admission.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.admission.outputs.docs_only != 'true' &&
      (needs.route.outputs.router_target == 'github' ||
      (needs.route.outputs.router_target == 'cx43' && needs.rust-cx43.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cpx42' && needs.rust-cpx42.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cx53' && needs.rust-cx53.outputs.scratch_status == 'tempfail'))
    uses: ./.github/workflows/rust-gates.yml
    with:
      runner-config: '"ubuntu-latest"'
      cargo-build-jobs: "8"
      disk-guard-threshold: 0
      use-scratch: false
      test-shards: 4
      pr-labels: ${{ needs.admission.outputs.labels }}
      admission-reason: ${{ needs.admission.outputs.reason }}
      admission-head: ${{ needs.admission.outputs.head }}
      history-sync-source: ${{ needs.admission.outputs.history_sync_source }}
      history-sync-base: ${{ needs.admission.outputs.history_sync_destination_base }}
      artifact-name: ripr-rust-small-github
      job-timeout-minutes: 120
      run-advisory-reports: false
      upload-success-artifacts: false

  rust-github-tests:
    name: Ripr Rust Small tests on GitHub Hosted
    needs: [admission, route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53]
    if: >-
      !cancelled() &&
      needs.admission.result == 'success' &&
      needs.detect-docs-only.result == 'success' &&
      needs.admission.outputs.docs_only != 'true' &&
      (needs.route.outputs.router_target == 'github' ||
      (needs.route.outputs.router_target == 'cx43' && needs.rust-cx43.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cpx42' && needs.rust-cpx42.outputs.scratch_status == 'tempfail') ||
      (needs.route.outputs.router_target == 'cx53' && needs.rust-cx53.outputs.scratch_status == 'tempfail'))
    uses: ./.github/workflows/rust-test-shards.yml
    with:
      artifact-name: ripr-rust-small-github

  vscode-select:
    name: vscode surface
    needs: [admission]
    if: needs.admission.result == 'success' && github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.surface.outputs.selected }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect extension surface change
        id: surface
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          selected=false
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          git diff --no-renames --name-only -z "$BASE_SHA"..."$HEAD_SHA" > "$changed"
          while IFS= read -r -d '' path; do
            case "$path" in
              editors/vscode/*|.github/workflows/ci.yml|.github/workflows/vscode-e2e.yml|.github/workflows/routed-rust.yml) selected=true; break ;;
            esac
          done < "$changed"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"

  vscode-e2e:
    name: vscode extension e2e
    needs: [vscode-select]
    if: ${{ !cancelled() && needs.vscode-select.result == 'success' && needs.vscode-select.outputs.selected == 'true' }}
    uses: ./.github/workflows/vscode-e2e.yml

  docs-gate:
    name: Ripr Docs Gate
    needs: [admission, detect-docs-only]
    if: needs.admission.result == 'success' && github.event_name == 'merge_group' && needs.admission.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ripr-docs-gate
      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml
      - name: Doc/spec gates
        env:
          RIPR_POLICY_PREFLIGHT_RECEIPT: target/ripr/reports/policy-preflight.json
        run: |
          cargo policy preflight
          cargo xtask precommit

  result:
    name: ${{ (github.event_name != 'pull_request' || github.event.label.name == 'merge-ready') && 'Ripr Rust Small Result' || 'Merge-ready Nonrequest' }}
    needs: [admission, route, detect-docs-only, rust-cx43, rust-cpx42, rust-cx53, rust-github, rust-github-tests, docs-gate, vscode-select, vscode-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DOCS_ONLY: ${{ needs.admission.outputs.docs_only }}
      ADMISSION_RESULT: ${{ needs.admission.result }}
      ROUTE_RESULT: ${{ needs.route.result }}
      DETECT_RESULT: ${{ needs.detect-docs-only.result }}
      GITHUB_RESULT: ${{ needs.rust-github.result }}
      GITHUB_TESTS_RESULT: ${{ needs.rust-github-tests.result }}
      DOCS_RESULT: ${{ needs.docs-gate.result }}
      VSCODE_SELECT_RESULT: ${{ needs.vscode-select.result }}
      VSCODE_RESULT: ${{ needs.vscode-e2e.result }}
    steps:
      - name: Normalize the protected queue result
        shell: bash
        run: |
          set -euo pipefail
          [ "$ADMISSION_RESULT" = success ]
          [ "$ROUTE_RESULT" = success ]
          [ "$DETECT_RESULT" = success ]
          case "$VSCODE_SELECT_RESULT:$VSCODE_RESULT" in
            skipped:skipped|success:skipped|success:success) ;;
            *) echo "::error::VS Code proof did not normalize: $VSCODE_SELECT_RESULT/$VSCODE_RESULT"; exit 1 ;;
          esac
          if [ "$DOCS_ONLY" = true ]; then
            [ "$DOCS_RESULT" = success ]
            [ "$GITHUB_RESULT" = skipped ]
            [ "$GITHUB_TESTS_RESULT" = skipped ]
          else
            [ "$DOCS_RESULT" = skipped ]
            [ "$GITHUB_RESULT" = success ]
            [ "$GITHUB_TESTS_RESULT" = success ]
          fi
          printf '### Ripr Rust Small Result\n\n- admission: `%s`\n- docs only: `%s`\n- gates: `%s`\n- test shards: `%s`\n- docs gate: `%s`\n- vscode: `%s`\n' \
            "$ADMISSION_RESULT" "$DOCS_ONLY" "$GITHUB_RESULT" "$GITHUB_TESTS_RESULT" "$DOCS_RESULT" "$VSCODE_RESULT" >> "$GITHUB_STEP_SUMMARY"
