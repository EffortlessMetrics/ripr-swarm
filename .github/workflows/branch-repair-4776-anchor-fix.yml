name: Repair npm bump-version helper anchors

on:
  push:
    branches:
      - build/4776-npm-bump-version
    paths:
      - .github/workflows/branch-repair-4776-anchor-fix.yml

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.repository == 'EffortlessMetrics/ripr-swarm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: build/4776-npm-bump-version

      - name: Align multiline Rust test anchors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/branch-repair-4776.yml")
          text = path.read_text(encoding="utf-8")

          for marker in [
              "          old = '''        let result = prepare_update(",
              "          old = '''        if prepare_update(",
          ]:
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing helper marker: {marker}")
              line_end = text.find("\n", start)
              block_end = text.find("\n          '''", line_end)
              if block_end < 0:
                  raise SystemExit(f"unterminated helper block: {marker}")
              body = text[line_end + 1:block_end]
              body = "\n".join("    " + line for line in body.split("\n"))
              text = text[:line_end + 1] + body + text[block_end:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Push anchor repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/branch-repair-4776-anchor-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/branch-repair-4776.yml .github/workflows/branch-repair-4776-anchor-fix.yml
          git diff --cached --check
          git commit -m "ci(distribution): align bump-version helper anchors"
          git push origin HEAD:build/4776-npm-bump-version
