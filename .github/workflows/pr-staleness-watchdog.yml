name: PR Staleness Watchdog

# Alert-only observation of explicit merge-ready requests. Ready alone is not
# admission. Never dispatch/relabel or cancel an unchanged in-flight request.
# Unrelated metadata runs cannot stand in for a qualification run.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  # Read-only: list routed-rust.yml runs to tell an in-flight qualification
  # from a dark head. Never `actions: write`.
  actions: read

jobs:
  watchdog:
    name: Report dark admitted PR heads
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Serialize overlapping fires. Do not cancel: an in-progress sweep must
    # finish writing its summary.
    concurrency:
      group: pr-staleness-watchdog-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Report requested PR heads missing the required check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REQUIRED_CHECK: Ripr Rust Small Result
        run: |
          set -euo pipefail

          prs="$(gh api "repos/$REPOSITORY/pulls?state=open&per_page=100" --paginate --jq '.[] | select(any(.labels[]; (.name | ascii_downcase) == "merge-ready")) | [.number, .head.sha, .head.ref, (.head.repo.full_name // ""), (.draft | tostring)] | @tsv')"

          {
            echo "### PR Staleness Watchdog (alert-only)"
            echo ""
            echo "Dark = no \`$REQUIRED_CHECK\` check run and no queued or in-progress merge-ready"
            echo "routed-rust.yml run on a requested PR head SHA (#4937, #4986). In flight = the run exists"
            echo "but has not reached its result job yet; leave it alone."
            echo "This sweep never dispatches. Remedy for a dark head: refresh affected review/proof,"
            echo "then explicitly remove/add merge-ready after confirming no native request exists."
            echo "First check before re-toggling: merge conflicts (#7079). A conflicting (\`dirty\`)"
            echo "PR has no merge ref, so no pull_request run can exist for it: merge main into"
            echo "the branch first, and only then explicitly request merge-ready."
            echo ""
            echo "| PR | head | mergeable_state | disposition |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          scanned=0 dark=0 in_progress=0
          while IFS=$'\t' read -r number head_sha head_ref head_repo draft; do
            [ -n "${number:-}" ] || continue
            scanned=$((scanned + 1))
            mergeable_state="n/a"
            if [ "$draft" = "true" ]; then
              disposition="skip: draft"
            elif [ "$head_repo" != "$REPOSITORY" ]; then
              disposition="skip: fork/untrusted head (${head_repo:-deleted})"
            else
              mergeable_state="$(gh api "repos/$REPOSITORY/pulls/$number" --jq '.mergeable_state // "unknown"')"
              count="$(gh api --paginate "repos/$REPOSITORY/commits/$head_sha/check-runs?per_page=100" --jq "[.check_runs[] | select(.name == \"$REQUIRED_CHECK\")] | length" | awk '{s+=$1} END{print s+0}')"
              if [ "$count" != "0" ]; then
                disposition="covered ($count required check(s) on head)"
              else
                in_flight="$(gh api --paginate "repos/$REPOSITORY/actions/workflows/routed-rust.yml/runs?event=pull_request&head_sha=$head_sha&per_page=100" --jq "[.workflow_runs[] | select(.status != \"completed\" and .head_sha == \"$head_sha\" and (.display_title | startswith(\"Merge-ready event provenance $head_sha/\")))] | length" | awk '{s+=$1} END{print s+0}')"
                if [ "$in_flight" != "0" ]; then
                  in_progress=$((in_progress + 1))
                  disposition="in flight ($in_flight merge-ready run(s) not yet at result; do not re-toggle)"
                elif [ "$mergeable_state" = "dirty" ]; then
                  dark=$((dark + 1))
                  disposition="DARK (conflicted); merge main into \`$head_ref\`, then explicitly request merge-ready"
                  echo "::warning title=Dark conflicted PR head::PR #$number head ${head_sha:0:8} is mergeable_state=dirty, so no pull_request run can exist (no merge ref); merge main into $head_ref first, then explicitly request merge-ready."
                else
                  dark=$((dark + 1))
                  disposition="DARK; review and explicitly request merge-ready (\`$head_ref\`)"
                  echo "::warning title=Dark requested PR head::PR #$number head ${head_sha:0:8} has no $REQUIRED_CHECK check and no queued or in-progress merge-ready run (pushed after Ready, or the Ready event was dropped); refresh current readiness and explicitly request merge-ready."
                fi
              fi
            fi
            echo "| #$number | \`${head_sha:0:8}\` | \`$mergeable_state\` | $disposition |" >> "$GITHUB_STEP_SUMMARY"
          done <<<"$prs"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open PRs scanned: $scanned; in-flight qualifications: $in_progress; dark requested heads reported: $dark." >> "$GITHUB_STEP_SUMMARY"
