          if 'id = "RIPR-SPEC-0181"' not in artifact_text:
              artifacts.write_text(artifact_text + "\n\n" + artifact_entry + "\n", encoding="utf-8")

          testing = Path("docs/TESTING.md")
          testing_text = testing.read_text(encoding="utf-8").rstrip()
          testing_section = '''

          ## npm launcher contract

          The npm launcher uses a guarded Node runner rather than relying on a
          wildcard test command alone:

          ```bash
          cd packaging/npm/launcher
          npm test
          npm pack --dry-run --json --ignore-scripts
          ```

          `npm test` executes `test/run-tests.test.cjs`, which runs the Node test
          suite through the TAP reporter and fails unless the required package,
          negative, PATH-fallback, package-inventory, and POSIX signal controls
          actually execute and pass. A matching string in an unused comment is not
          sufficient. The POSIX signal controls are skipped on Windows; Windows
          descendant-process qualification remains separate.

          Repository conformance is checked with:

          ```bash
          cargo test -p xtask --locked policy::distribution::tests -- --nocapture
          cargo xtask check-release-targets
          cargo xtask check-traceability
          ```
          '''.strip()
          if "## npm launcher contract" not in testing_text:
