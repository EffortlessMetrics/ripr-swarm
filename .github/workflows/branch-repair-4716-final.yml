          '''.strip()
          if 'id = "RIPR-SPEC-0181"' not in trace_text:
              traceability.write_text(trace_text + "\n\n" + trace_entry + "\n", encoding="utf-8")

          artifacts = Path("policy/doc-artifacts.toml")
          artifact_text = artifacts.read_text(encoding="utf-8").rstrip()
          artifact_entry = '''

          [[artifact]]
          id = "RIPR-SPEC-0181"
          kind = "spec"
          path = "docs/specs/RIPR-SPEC-0181-npm-native-launcher-boundary.md"
          status = "accepted"
          owner = "product-swarm"
          standalone_reason = "Source-package and process-boundary contract for the script-free npm launcher: exact target packages, lifecycle denial, executable confinement, literal spawn semantics, non-duplicating POSIX signal handling, and dynamically admitted named controls; no registry or support-tier claim."
