name: Apply #2386 complete Bash argv encoder

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: apply-2386-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/shell-arg-escaping-2347'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exclusively claimed branch without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/shell-arg-escaping-2347
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Verify the claimed branch revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "codex/shell-arg-escaping-2347"
          test -f .github/patches/2386.py
          test -f .github/workflows/apply-2386-shell-arg.yml
      - name: Apply and cage the complete encoder repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/2386.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/src/agent/loop_commands.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq policy/process_allowlist.txt
      - name: Verify exact argv behavior and affected command surfaces
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p ripr --lib loop_commands -- --test-threads=1
          cargo test -p ripr --lib first_pr -- --test-threads=4
          cargo test -p ripr --lib pilot -- --test-threads=4
          cargo xtask check-process-policy
          cargo xtask check-file-policy
          cargo xtask check-static-language
          cargo xtask goldens check
      - name: Package the validated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validated
          cp crates/ripr/src/agent/loop_commands.rs validated/loop_commands.rs
          cp policy/process_allowlist.txt validated/process_allowlist.txt
          (cd validated && sha256sum loop_commands.rs process_allowlist.txt > SHA256SUMS)
      - name: Upload the validated files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-shell-arg-2386-${{ github.run_id }}
          path: validated/
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'codex/shell-arg-escaping-2347'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the unchanged claimed branch for the bounded write
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: codex/shell-arg-escaping-2347
          fetch-depth: 0
          persist-credentials: true
      - name: Verify that validation still names the live branch revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Download the validated files
        uses: actions/download-artifact@v8
        with:
          name: validated-shell-arg-2386-${{ github.run_id }}
          path: validated
      - name: Verify, commit, and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          (cd validated && sha256sum -c SHA256SUMS)
          cp validated/loop_commands.rs crates/ripr/src/agent/loop_commands.rs
          cp validated/process_allowlist.txt policy/process_allowlist.txt
          rm -rf validated
          git add crates/ripr/src/agent/loop_commands.rs policy/process_allowlist.txt
          git rm .github/patches/2386.py .github/workflows/apply-2386-shell-arg.yml
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/src/agent/loop_commands.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq policy/process_allowlist.txt
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/patches/2386.py
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/apply-2386-shell-arg.yml
          git diff --cached --check
          git -c user.name='RIPR release operator' \
              -c user.email='release-operator@example.invalid' \
              -c commit.gpgSign=false \
              commit -m 'fix(agent): make advisory shell argv encoding round-trip (#2347)'
          git push origin HEAD:refs/heads/codex/shell-arg-escaping-2347
