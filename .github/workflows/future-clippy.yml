name: Future Clippy (advisory)

on:
  push:
    branches: [main, master]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' }}

# Advisory future-Clippy scan.
#
# Runs the pinned Rust 1.95.0 toolchain over the workspace with the deferred
# lint trajectory turned on. Selected lint findings remain advisory warnings;
# missing or failed instrumentation fails this advisory job. The point is to
# track readiness for the planned flips recorded in `policy/clippy-lints.toml`.
#
# Triggers:
#   - push to main: tracks main-line readiness over time.
#   - pull_request with the `clippy-future` or `full-ci` label: lets
#     authors opt into the scan when they're touching code likely to
#     surface findings.
#   - workflow_dispatch: manual run.
#
# This lane intentionally does **not** activate deferred lint names in the
# main MSRV-1.95 Cargo.toml. The active table is promoted only through a
# focused lint-policy PR with receipts. The future-Clippy lane only runs
# Clippy warnings; it does not modify the workspace lint configuration.

jobs:
  future-clippy:
    name: future-clippy
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'clippy-future') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ripr-future-clippy-1.95.0-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run future Clippy (advisory)
        id: scan
        shell: bash
        run: |
          mkdir -p target
          rm -f target/future-clippy.log target/future-clippy-status.txt
          printf 'source_sha=%s\nrun_id=%s\nrun_attempt=%s\ntoolchain=1.95.0\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > target/future-clippy-status.txt
          set +e
          cargo +1.95.0 clippy --workspace --all-targets --message-format=json-render-diagnostics -- -W clippy::same_length_and_capacity -W clippy::manual_ilog2 -W clippy::needless_type_cast -W clippy::decimal_bitwise_operands -W clippy::disallowed_fields -W clippy::manual_checked_ops -W clippy::manual_take -W clippy::manual_pop_if -W clippy::duration_suboptimal_units -W clippy::unnecessary_trailing_comma 2>&1 | tee target/future-clippy.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf 'cargo_exit=%s\ntee_exit=%s\n' "${pipeline_status[0]}" "${pipeline_status[1]}" >> target/future-clippy-status.txt
          if (( pipeline_status[0] != 0 || pipeline_status[1] != 0 )); then
            echo "::error::Future Clippy instrumentation failed; see the retained native statuses and log."
            exit 1
          fi
          if ! grep -q '^{"reason":"compiler-artifact"' target/future-clippy.log || ! grep '^{"reason":' target/future-clippy.log | tail -n 1 | grep -Fxq '{"reason":"build-finished","success":true}'; then
            echo "::error::Future Clippy returned without current Cargo artifact and completion evidence."
            exit 1
          fi
          printf 'scan_completed=true\n' >> target/future-clippy-status.txt

      - name: Write step summary
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          printf '## Future Clippy (advisory)\n\nSelected lint findings remain warnings. Failed instrumentation fails this job. Scan completion does not establish that every planned lint is supported or has a configured subject.\n\nStep outcome: `%s`\n\n' "$SCAN_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f target/future-clippy-status.txt ]] && grep -Fxq "source_sha=$GITHUB_SHA" target/future-clippy-status.txt && grep -Fxq "run_id=$GITHUB_RUN_ID" target/future-clippy-status.txt && grep -Fxq "run_attempt=$GITHUB_RUN_ATTEMPT" target/future-clippy-status.txt; then
            { printf '```text\n'; cat target/future-clippy-status.txt; printf '```\n'; } >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Scan evidence unavailable; scan was not completed.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload future-clippy log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-future-clippy
          path: |
            target/future-clippy.log
            target/future-clippy-status.txt
          if-no-files-found: error
