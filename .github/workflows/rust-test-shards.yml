name: Rust Test Shards

# The hosted required test phase, split into two nextest partitions (#10507).
# `rust-gates.yml` runs every gate that needs no test run (policy, Clippy, goldens,
# fixtures, corpora, doctests, PR evidence) and, called with `test-shards: 2`,
# leaves `cargo nextest run --workspace --profile ci` to this workflow. The caller
# starts the shards alongside those gates so the required context fits inside the
# merge queue's status-check timeout (#4838); a gate failure therefore still spends
# the shard minutes (#10346 traded for latency), and the caller's result requires
# both. The self-hosted routes keep the one-command step inside rust-gates.yml.
#
# Two `--partition hash:N/2` runs together select exactly the tests the single
# unsharded command selects. `verify` is the check that makes that true rather
# than assumed: every shard must have exited zero with a fresh JUnit report naming
# a test, and the two partition lists must be pairwise disjoint and equal the
# full workspace list. A missing or cancelled shard is a failure, never a pass.
# One worker reuses one prepared workspace across the two partitions. This removes
# the duplicate workspace build without introducing an archive producer dependency;
# whole-route elapsed time and runner occupancy remain separately measured (#8194).
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Prefix for the retained per-shard and summary artifacts.
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust-test-shard:
    name: Rust tests packed workspace
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Job-level so every Cargo call in the shard (the prepare build, nextest, the
    # lists and the builds the policy tests spawn) sees one profile and none
    # rebuilds another's output. The shards only run tests; a failing test still
    # reports its panic location, which comes from the compiler and not from
    # debug info. Only backtrace frames lose their file:line here (#11566).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      # Full history, like the unsharded step: base-resolving tests refuse on a
      # shallow clone (#10344).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install CI tools
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.149

      # Separate dependency cache from the gates job; the action defaults exclude
      # workspace test binaries. Existing default-branch entries are best-effort
      # reads; a miss still builds all tests. Only the packed worker of an already-selected
      # manual main qualification may save; no ordinary push or extra warmer.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-swarm-rust-shards-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      # Hosted shard losses ("runner received a shutdown signal", exit 143, or "lost
      # communication") happened inside the test-profile compile of
      # `cargo nextest run --workspace`, which builds the `ripr` lib test and the
      # `xtask` bin test at the same time. Each rustc peaks at roughly 9-11 GB; on a
      # 4 CPU / 16 GB hosted runner (the same shape, where it reproduced as kernel
      # OOM kills) the pair starves the runner agent. Build the workspace without
      # xtask first, then add xtask, so the two never overlap. The test step below
      # still runs the full unchanged nextest command; a build failure here fails
      # the shard, and `verify` still requires every shard green. Retained samples
      # and phase timings describe the next incident without another build.
      # The split alone left 1.1-2.2 GB free at peak (#12719). The `ripr` lib test is
      # one rustc over a 1.4M-line crate: about 11 GB resident before codegen starts
      # (frontend 3.7 GB, MIR borrowck +4.3 GB, monomorphisation +1.8 GB) and 13-14
      # GB at its peak, whatever the build parallelism (local 16 GB runs with 2 jobs,
      # or with the lib test built alone first, were still ended by the kernel OOM handler). Scheduling
      # cannot lower that floor, so give the runner 8 GB of swap so a spike pages out
      # instead of starving the runner agent. This only adds memory; it relaxes no
      # check, and a swap setup failure is logged and the build still runs.
      # The image already has an active 4 GB /mnt/swapfile, so use another path:
      # fallocate on an active swap file fails with ETXTBSY.
      - name: Add swap headroom for the test build
        run: |
          swapfile=/mnt/ci-swapfile-8g
          if [ ! -d /mnt ]; then swapfile=/ci-swapfile-8g; fi
          if sudo fallocate -l 8G "$swapfile" && sudo chmod 600 "$swapfile" && sudo mkswap "$swapfile" > /dev/null && sudo swapon "$swapfile"; then
            echo "swap enabled:"; swapon --show
          else
            echo "::warning::could not enable swap; the build runs without extra headroom (#12719)"
          fi
          free -m

      - name: Build the test binaries one memory-heavy crate at a time
        timeout-minutes: 30
        env:
          CARGO_BUILD_JOBS: "3"
        run: |
          metrics=target/nextest/ci/build-metrics
          time_tool=/usr/bin/time
          mkdir -p "$metrics" || echo "::warning::build metrics directory unavailable"
          checkout_sha="$(git rev-parse HEAD)" || checkout_sha=unavailable
          printf 'repository=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\npacking=same-runner-v1\nsample_period_seconds=5\nsample_units=MiB\nsample_columns=utc used_mb available_mb swap_used_mb\nrss_scope=largest_command_or_waited_descendant_process_not_aggregate\n' "$GITHUB_REPOSITORY" "$checkout_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$metrics/context.txt" || echo "::warning::build metrics identity unavailable"
          ( while true; do free -m | awk -v timestamp="$(date -u +%FT%TZ)" '/^Mem:/{used=$3; available=$7} /^Swap:/{if (used ~ /^[0-9]+$/ && available ~ /^[0-9]+$/ && $3 ~ /^[0-9]+$/) print timestamp, used, available, $3}'; sleep 5; done ) > "$metrics/system-memory.tsv" &
          sampler=$!
          finish() {
            local native_exit=$?
            kill "$sampler" 2>/dev/null || true
            wait "$sampler" 2>/dev/null || true
            awk 'NF == 4 && $3 ~ /^[0-9]+$/ && $4 ~ /^[0-9]+$/ {
              if (!n || $3 < available) available=$3; if (!n || $4 > swap) swap=$4; n++
            } END {
              print "sample_count=" n+0
              if (n) print "measurement=sampled\nsampled_min_available_mb=" available "\nsampled_max_swap_used_mb=" swap
              else print "measurement=unavailable"
            }' "$metrics/system-memory.tsv" > "$metrics/system-summary.txt" || { echo "::warning::sampled memory summary unavailable"; printf 'measurement=unavailable\n' > "$metrics/system-summary.txt" || true; }
            cat "$metrics/system-summary.txt" || echo "::warning::sampled memory summary could not be printed"
            exit "$native_exit"
          }
          trap finish EXIT
          build_phase() {
            local phase="$1" native_exit
            shift
            local -a timer=()
            if : > "$metrics/$phase.time" && [ -x "$time_tool" ]; then
              timer=("$time_tool" -q -f 'elapsed_seconds=%e\nlargest_process_max_rss_kib=%M' -o "$metrics/$phase.time")
            fi
            if "${timer[@]}" "$@"; then native_exit=0; else native_exit=$?; fi
            if ! {
              printf 'native_exit=%s\ncommand=' "$native_exit"; printf '%q ' "$@"; printf '\n'
              awk -F= '/^elapsed_seconds=[0-9]+([.][0-9]+)?$/ {elapsed=$2; e++}
                /^largest_process_max_rss_kib=[0-9]+$/ {rss=$2; r++}
                END {if (e == 1 && r == 1 && NR == 2) print "measurement=available\nelapsed_seconds=" elapsed "\nlargest_process_max_rss_kib=" rss; else print "measurement=unavailable"}' "$metrics/$phase.time"
            } > "$metrics/$phase.txt"; then echo "::warning::build phase metrics unavailable: $phase"; printf 'native_exit=%s\nmeasurement=unavailable\n' "$native_exit" > "$metrics/$phase.txt" || true; fi
            return "$native_exit"
          }
          build_phase without-xtask cargo test --no-run --locked --workspace --exclude xtask
          build_phase workspace cargo test --no-run --locked --workspace

      # Workspace test preparation builds normal xtask for its integration
      # tests (CARGO_BIN_EXE_xtask). Reuse that exact-checkout binary for this
      # static inventory check instead of compiling a separate dev graph first.
      # Nested package-specific Cargo builds remain owned by their consumers.
      - name: Check covered-by with the prepared workspace binary
        timeout-minutes: 20
        run: target/debug/xtask check-covered-by

      # The packed producer hands the prepared normal binary to the verifier. It needs no
      # additional compilation there; the attempt suffix isolates reruns.
      - name: Retain the xtask binary for the verify job
        id: xtask-artifact
        run: |
          staging="$(mktemp -d "$RUNNER_TEMP/ripr-xtask-upload.XXXXXX")"
          stripped="$staging/xtask-stripped"
          trap 'rm -f "$stripped"' EXIT
          strip --strip-debug -o "$stripped" target/debug/xtask
          python3 tools/ci/shard-verifier-artifact.py retain \
            --binary "$stripped" --destination "$staging/payload" \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --sha "$(git rev-parse HEAD)"
          printf 'path=%s\n' "$staging/payload" >> "$GITHUB_OUTPUT"

      - name: Upload the xtask binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-xtask-${{ github.run_attempt }}
          path: ${{ steps.xtask-artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Execute two native partitions on the prepared workspace
        id: packed-partitions
        timeout-minutes: 45
        run: |
          set -euo pipefail
          evidence="$(mktemp -d "$RUNNER_TEMP/ripr-packed-shards.XXXXXX")"
          printf 'path=%s\n' "$evidence" >> "$GITHUB_OUTPUT"
          workspace_identity() {
            git rev-parse HEAD
            git status --porcelain=v1 --untracked-files=all
            git for-each-ref --format='%(refname):%(objectname)'
            git config --local --list
            git hash-object Cargo.lock .config/nextest.toml .github/workflows/rust-gates.yml .github/workflows/rust-test-shards.yml
          }
          checkout_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$checkout_status" ]; then
            echo "::error::Packed partitions require an initially clean checkout"
            exit 1
          fi
          workspace_identity > "$evidence/baseline"
          reports=(
            target/ripr/reports/discarded-matcher-cli-5713
            "target/nextest/ci/python-symlink-source-admission-cli-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
            target/ripr/reports/repair-card-usability.json
            target/ripr/reports/repair-card-usability.md
            target/ripr/reports/blind-journey-execute.json
            target/ripr/reports/blind-journey-execute.md
          )
          finish=0
          for partition in 1 2; do
            workspace_identity | cmp -s "$evidence/baseline" - || {
              echo "::error::Workspace identity changed before partition $partition"
              exit 1
            }
            stage="$evidence/shard-$partition"
            mkdir -p "$stage/nextest/ci" target/nextest/ci
            rm -f target/nextest/ci/{junit.xml,run-context.txt,shard-*.status,list-*.txt}
            partition_temp="$(mktemp -d "$RUNNER_TEMP/ripr-partition-$partition.XXXXXX")"
            partition_config="target/nextest/ci/packed-partition-$partition.toml"
            python3 - "$partition_temp" > "$partition_config" <<'PYCONF'
          import json
          import sys
          print("[env]")
          for key in ("TMPDIR", "TMP", "TEMP"):
              print(f"{key} = {{value = {json.dumps(sys.argv[1])}, relative = false, force = true}}")
          PYCONF
            for report in "${reports[@]}"; do
              if [ -e "$report" ] || [ -L "$report" ]; then
                echo "::error::Stale shard report before partition $partition: $report"
                exit 1
              fi
            done
            (
              set -euo pipefail
              checkout_sha="$(git rev-parse HEAD)"
              {
                printf 'repository=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_REPOSITORY" "$checkout_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
                printf 'profile=ci\nshard=%s/2\ncommand=cargo nextest run --workspace --profile ci --partition hash:%s/2 --config target/nextest/ci/packed-partition-%s.toml\n' "${partition}" "${partition}" "${partition}"
                cargo nextest --version
                rustc --version
                cargo --version
                printf 'input_blobs (Cargo.lock, nextest.toml, rust-gates.yml, rust-test-shards.yml):\n'
                git hash-object Cargo.lock .config/nextest.toml .github/workflows/rust-gates.yml .github/workflows/rust-test-shards.yml
              } > target/nextest/ci/run-context.txt
              # The partition lists let `verify` prove the shards are a disjoint cover.
              # Listing reuses the build step's binaries; shard 1 also lists the whole
              # workspace. The lists are taken before the run, from the same binaries
              # the run executes: taken after it, shard 4 spent 4.3 to 6.1 minutes here
              # on every run (4 to 16 seconds on the other shards), with the cause
              # hidden by the discarded stderr (#12915).
              cargo nextest list --workspace --profile ci --partition hash:${partition}/2 --color never --config "$partition_config" --message-format oneline 2> /dev/null | sort > target/nextest/ci/list-${partition}.txt
              if [ "$partition" = 1 ]; then
                cargo nextest list --workspace --profile ci --color never --config "$partition_config" --message-format oneline 2> /dev/null | sort > target/nextest/ci/list-all.txt
              fi
              set +e
              cargo nextest run --workspace --profile ci --partition hash:${partition}/2 --config "$partition_config"
              test_exit=$?
              set -e
              printf 'nextest_exit=%s\n' "$test_exit" >> target/nextest/ci/run-context.txt
              printf '%s\n' "$test_exit" > target/nextest/ci/shard-${partition}.status
              if [ "$test_exit" -eq 0 ] && ! grep -Eq '<testsuites [^>]*tests="[1-9][0-9]*"' target/nextest/ci/junit.xml; then
                echo "::error::nextest shard ${partition} succeeded without a fresh JUnit report naming at least one test"
                exit 1
              fi
              exit "$test_exit"
            ) &
            pid=$!
            if wait "$pid"; then
              :
            else
              finish=1
            fi
            for file in target/nextest/ci/{junit.xml,run-context.txt,shard-*.status,list-*.txt}; do
              if [ -f "$file" ]; then cp -- "$file" "$stage/nextest/ci/"; fi
            done
            if [ -d target/nextest/ci/build-metrics ]; then
              cp -R -- target/nextest/ci/build-metrics "$stage/nextest/ci/"
            fi
            for report in "${reports[@]}"; do
              if [ -e "$report" ]; then
                mkdir -p -- "$stage/$(dirname "${report#target/}")"
                mv -- "$report" "$stage/${report#target/}"
              fi
            done
            workspace_identity | cmp -s "$evidence/baseline" - || {
              echo "::error::Workspace identity changed during partition $partition"
              exit 1
            }
          done
          exit "$finish"

      - name: Upload partition 1 results
        if: ${{ !cancelled() && steps.packed-partitions.outputs.path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-nextest-shard-1-${{ github.run_attempt }}
          path: ${{ steps.packed-partitions.outputs.path }}/shard-1/
          if-no-files-found: error
          retention-days: 5

      - name: Upload partition 2 results
        if: ${{ !cancelled() && steps.packed-partitions.outputs.path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-nextest-shard-2-${{ github.run_attempt }}
          path: ${{ steps.packed-partitions.outputs.path }}/shard-2/
          if-no-files-found: error
          retention-days: 5

  rust-test-shards-verify:
    # Only this unprivileged consumer needs API artifact metadata. No App token,
    # writes or secrets; the caller already permits actions: read.
    permissions:
      contents: read
      actions: read
    name: Rust test shards verify
    needs: rust-test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No toolchain or cache here: the verifier is the xtask binary the packed job built
      # from this same checkout, so this job never compiles anything.
      # Both packed artifacts must match this attempt. Re-run the whole packed
      # producer and verifier together after a failure; a verifier-only rerun
      # cannot adopt older partition output.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.artifact-name }}-nextest-shard-*
          path: shards

      # Executable download is by a selected same-run artifact ID, in fresh
      # runner-temp storage. Validate canonical attempt, archive/member digests
      # and producer checkout identity before executing. No recursive scan of G.
      # Old partition receipts are not eligible in packed mode. The separately
      # selected verifier binary is still bound to the exact checkout and run.
      # `verify-test-shards` accepts the shards only as conservation of the one
      # unpartitioned run: each shard's status, run context (repository, checkout,
      # run, attempt, profile, partition, exit) and JUnit report (complete, no
      # failures, testcases equal to its partition list) must be green for the
      # shard's current attempt, and the
      # partition lists must be a disjoint cover of the workspace list. It
      # writes the combined junit.xml and run-context.txt the unpartitioned step
      # retains, so consumers of `<artifact>-nextest-<attempt>` read the same
      # files.
      - name: Check the shards are a complete, disjoint, green cover
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PREFIX: ${{ inputs.artifact-name }}
        run: |
          python3 tools/ci/shard-verifier-artifact.py launch \
            --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --sha "$(git rev-parse HEAD)" \
            --prefix "$ARTIFACT_PREFIX" --runner-temp "$RUNNER_TEMP" \
            --provenance target/nextest/ci/verifier-artifact.json \
            -- verify-test-shards \
            --dir shards \
            --artifact "$ARTIFACT_PREFIX" \
            --attempt "$GITHUB_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --shards 2 --packed \
            --out target/nextest/ci
          cat target/nextest/ci/shards-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}-nextest-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci/run-context.txt
            target/nextest/ci/shards-summary.txt
            target/nextest/ci/verifier-artifact.json
          if-no-files-found: warn
          retention-days: 5
