name: Rust Test Shards

# The hosted required test phase, split into four nextest partitions (#10507).
# `rust-gates.yml` runs every gate that needs no test run (policy, Clippy, goldens,
# fixtures, corpora, doctests, PR evidence) and, called with `test-shards: 4`,
# leaves `cargo nextest run --workspace --profile ci` to this workflow. Shards
# start only after those gates pass, so a gate failure still costs no test minutes
# (#10346). The self-hosted routes keep the one-command step inside rust-gates.yml.
#
# Four `--partition count:N/4` runs together select exactly the tests the single
# unsharded command selects. `verify` is the check that makes that true rather
# than assumed: every shard must have exited zero with a fresh JUnit report naming
# a test, and the four partition lists must be pairwise disjoint and equal the
# full workspace list. A missing or cancelled shard is a failure, never a pass.
on:
  workflow_call:
    inputs:
      artifact-name:
        description: Prefix for the retained per-shard and summary artifacts.
        required: true
        type: string

permissions:
  contents: read

jobs:
  rust-test-shard:
    name: Rust tests shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Full history, like the unsharded step: base-resolving tests refuse on a
      # shallow clone (#10344).
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - name: Install CI tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      # Separate key from the gates job's cache: only the test-binary build is
      # worth keeping from here, and one shard on main is enough to write it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-swarm-rust-shards-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}

      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      # The policy tests spawn `cargo test --no-run -p xtask` themselves; warming it
      # keeps that build off the clock, as the gates job's policy preflight does.
      - name: Warm the cargo builds the policy tests spawn
        timeout-minutes: 20
        run: cargo xtask check-covered-by

      # The verify job runs `cargo xtask verify-test-shards`. Compiling xtask there
      # cost about 2.4 minutes after the last shard finished; the warm build above
      # already produced the same binary from this checkout, so one shard hands it
      # over (stripped of debug sections) and the verifier starts at once. The
      # attempt suffix keeps a re-run from colliding with an earlier upload.
      - name: Retain the xtask binary for the verify job
        if: matrix.shard == 1
        run: |
          mkdir -p target/xtask-binary
          strip --strip-debug -o target/xtask-binary/xtask target/debug/xtask

      - name: Upload the xtask binary
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-xtask-${{ github.run_attempt }}
          path: target/xtask-binary/xtask
          if-no-files-found: error
          retention-days: 1

      - name: Required Rust tests (shard ${{ matrix.shard }} of 4)
        id: rust-test-shard
        timeout-minutes: 40
        run: |
          mkdir -p target/nextest/ci
          rm -f target/nextest/ci/junit.xml target/nextest/ci/run-context.txt target/nextest/ci/shard-*.status target/nextest/ci/list-*.txt
          checkout_sha="$(git rev-parse HEAD)"
          {
            printf 'repository=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_REPOSITORY" "$checkout_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'profile=ci\nshard=%s/4\ncommand=cargo nextest run --workspace --profile ci --partition count:%s/4\n' "${{ matrix.shard }}" "${{ matrix.shard }}"
            cargo nextest --version
            rustc --version
            cargo --version
            printf 'input_blobs (Cargo.lock, nextest.toml, rust-gates.yml, rust-test-shards.yml):\n'
            git hash-object Cargo.lock .config/nextest.toml .github/workflows/rust-gates.yml .github/workflows/rust-test-shards.yml
          } > target/nextest/ci/run-context.txt
          set +e
          cargo nextest run --workspace --profile ci --partition count:${{ matrix.shard }}/4
          test_exit=$?
          set -e
          printf 'nextest_exit=%s\n' "$test_exit" >> target/nextest/ci/run-context.txt
          printf '%s\n' "$test_exit" > target/nextest/ci/shard-${{ matrix.shard }}.status
          # The partition lists let `verify` prove the shards are a disjoint cover.
          # Listing reuses the build above; shard 1 also lists the whole workspace.
          cargo nextest list --workspace --profile ci --partition count:${{ matrix.shard }}/4 --color never --message-format oneline 2> /dev/null | sort > target/nextest/ci/list-${{ matrix.shard }}.txt
          if [ "${{ matrix.shard }}" = 1 ]; then
            cargo nextest list --workspace --profile ci --color never --message-format oneline 2> /dev/null | sort > target/nextest/ci/list-all.txt
          fi
          if [ "$test_exit" -eq 0 ] && ! grep -Eq '<testsuites [^>]*tests="[1-9][0-9]*"' target/nextest/ci/junit.xml; then
            echo "::error::nextest shard ${{ matrix.shard }} succeeded without a fresh JUnit report naming at least one test"
            exit 1
          fi
          exit "$test_exit"

      # A failed or aborted shard keeps its context and status but must not inherit
      # a stale XML; `verify` treats a missing status file as a failed shard.
      - name: Upload shard results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-nextest-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci/run-context.txt
            target/nextest/ci/shard-${{ matrix.shard }}.status
            target/nextest/ci/list-*.txt
            target/ripr/reports/discarded-matcher-cli-5713/
            target/nextest/ci/python-symlink-source-admission-cli-${{ github.run_id }}-${{ github.run_attempt }}.txt
            target/ripr/reports/repair-card-usability.json
            target/ripr/reports/repair-card-usability.md
            target/ripr/reports/blind-journey-execute.json
            target/ripr/reports/blind-journey-execute.md
          if-no-files-found: warn
          retention-days: 5

  rust-test-shards-verify:
    name: Rust test shards verify
    needs: rust-test-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # No toolchain or cache here: the verifier is the xtask binary shard 1 built
      # from this same checkout, so this job never compiles anything.
      # A partial "re-run failed jobs" uploads fresh artifacts only for the
      # re-run shards (#10605), so the download cannot be limited to the
      # current attempt: every attempt's shard artifacts come down, and
      # `verify-test-shards` reads each shard's latest attempt at or below the
      # verifying one (its run-context check binds the choice to this run,
      # checkout, and partition).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.artifact-name }}-nextest-shard-*
          path: shards

      # A partial re-run that skips shard 1 leaves the binary in an earlier attempt's
      # artifact (same commit), so take the newest one present.
      # One match extracts straight into the path; several each get a directory.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: ${{ inputs.artifact-name }}-xtask-*
          path: xtask-binary

      # `verify-test-shards` accepts the shards only as conservation of the one
      # unpartitioned run: each shard's status, run context (repository, checkout,
      # run, attempt, profile, partition, exit) and JUnit report (complete, no
      # failures, testcases equal to its partition list) must be green for the
      # shard's latest attempt at or below the verifying attempt, and the
      # partition lists must be a disjoint cover of the workspace list. It
      # writes the combined junit.xml and run-context.txt the unpartitioned step
      # retains, so consumers of `<artifact>-nextest-<attempt>` read the same
      # files; a partial re-run is disclosed as `verified_attempts` in the
      # combined context.
      - name: Check the shards are a complete, disjoint, green cover
        run: |
          xtask="$(find xtask-binary -type f -name xtask | sort -V | tail -n 1)"
          test -n "$xtask" || { echo "::error::no xtask binary artifact from shard 1"; exit 1; }
          chmod +x "$xtask"
          "$xtask" verify-test-shards \
            --dir shards \
            --artifact "${{ inputs.artifact-name }}" \
            --attempt "${{ github.run_attempt }}" \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$(git rev-parse HEAD)" \
            --run-id "$GITHUB_RUN_ID" \
            --shards 4 \
            --out target/nextest/ci
          cat target/nextest/ci/shards-summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload combined test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-nextest-${{ github.run_attempt }}
          path: |
            target/nextest/ci/junit.xml
            target/nextest/ci/run-context.txt
            target/nextest/ci/shards-summary.txt
          if-no-files-found: warn
          retention-days: 5
