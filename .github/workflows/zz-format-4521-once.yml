name: Format final native payload branch once

on:
  push:
    branches:
      - feat/4521-final-native-payload

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/4521-final-native-payload
          fetch-depth: 0

      - name: Install pinned Rust formatter
        shell: bash
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Format workspace
        shell: bash
        run: cargo +1.95.0 fmt --all

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Workspace already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "style: apply Rust 1.95 formatting"
          git push origin HEAD:feat/4521-final-native-payload
