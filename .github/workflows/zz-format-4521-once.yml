name: Finalize native payload branch once

on:
  push:
    branches:
      - feat/4521-final-native-payload

permissions:
  contents: write

concurrency:
  group: finalize-native-payload-4699
  cancel-in-progress: false

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/4521-final-native-payload
          fetch-depth: 0

      - name: Integrate main and repair qualification proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/server-archive-qualification.yml')
          text = workflow.read_text()

          loop_start = '          for directory in payload-identities/ripr-final-native-payload-*; do\n'
          direct_identity = '            identity="${directory}/payload-identity.json"\n'
          recursive_identity = '            mapfile -t identities < <(find "${directory}" -type f -name payload-identity.json -print)\n'
          if direct_identity in text:
              start = text.index(loop_start)
              end = text.index('          done\n', start) + len('          done\n')
              current = text[start:end]
              for required in (
                  direct_identity.strip(),
                  'producer="${directory}/producer-build.json"',
                  'test -f "${directory}/payload-identity.md"',
              ):
                  if required not in current:
                      raise SystemExit(f'unexpected payload assembly loop; missing {required!r}')
              new_assembly = '\n'.join([
                  '          for directory in payload-identities/ripr-final-native-payload-*; do',
                  '            test -d "${directory}"',
                  '            mapfile -t identities < <(find "${directory}" -type f -name payload-identity.json -print)',
                  '            mapfile -t markdowns < <(find "${directory}" -type f -name payload-identity.md -print)',
                  '            mapfile -t producers < <(find "${directory}" -type f -name producer-build.json -print)',
                  '            test "${#identities[@]}" -eq 1',
                  '            test "${#markdowns[@]}" -eq 1',
                  '            test "${#producers[@]}" -eq 1',
                  '            identity="${identities[0]}"',
                  '            producer="${producers[0]}"',
                  '            jq --arg identity_sha256 "$(sha256sum "${identity}" | awk \'{print $1}\')" \'. + {identity_sha256: $identity_sha256}\' "${identity}" >> payload-identities.ndjson',
                  '            jq --arg producer_build_sha256 "$(sha256sum "${producer}" | awk \'{print $1}\')" \'. + {producer_build_sha256: $producer_build_sha256}\' "${producer}" >> producer-builds.ndjson',
                  '          done',
                  '',
              ])
              text = text[:start] + new_assembly + text[end:]
          elif recursive_identity not in text:
              raise SystemExit('payload identity assembly loop not found')

          if 'toolchain: stable' in text:
              text = text.replace('toolchain: stable', 'toolchain: 1.95.0')
          if ' # stable\n' in text:
              text = text.replace(' # stable\n', ' # v1\n')
          text = text.replace(
              'Native runtime compatibility remains unqualified under issue #4489',
              'Native runtime compatibility remains unqualified under EffortlessMetrics/ripr-swarm#4489',
          )
          workflow.write_text(text)

          allowlist = Path('policy/workflow_allowlist.txt')
          policy = allowlist.read_text()
          old = '.github/workflows/server-archive-qualification.yml|82|'
          new = '.github/workflows/server-archive-qualification.yml|89|'
          if old in policy:
              policy = policy.replace(old, new, 1)
          elif new not in policy:
              raise SystemExit('qualification workflow budget entry not found')
          allowlist.write_text(policy)
          PY
          git rm -f --ignore-unmatch \
            .github/workflows/zz-format-4521-once.yml \
            .github/workflows/zz-repair-4521-once.yml \
            .github/workflows/zz-repair-4699-once.yml

      - name: Validate exact integrated tree
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 xtask check-workflows
          cargo +1.95.0 test -p xtask release_server_archive_prepares_package_before_format_validation -- --nocapture

      - name: Commit and push exact repair
        shell: bash
        run: |
          set -euo pipefail
          git add --all
          if git diff --cached --quiet; then
            echo "No finalization changes remained."
            exit 0
          fi
          git commit -m "fix(distribution): finalize native payload qualification"
          git push origin HEAD:feat/4521-final-native-payload
