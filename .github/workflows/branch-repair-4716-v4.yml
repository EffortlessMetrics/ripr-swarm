name: Stage exact npm launcher repair

on:
  push:
    branches:
      - feat/4710-npm-launcher-core
    paths:
      - .github/workflows/branch-repair-4716-v4.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4710-npm-launcher-core
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply exact repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          def replace_between(text: str, start: str, end: str, replacement: str, label: str) -> str:
              start_index = text.find(start)
              if start_index < 0:
                  raise SystemExit(f"{label}: start anchor missing")
              end_index = text.find(end, start_index)
              if end_index < 0:
                  raise SystemExit(f"{label}: end anchor missing")
              return text[:start_index] + replacement + text[end_index:]

          launcher_path = Path("packaging/npm/launcher/lib/launcher.cjs")
          launcher = launcher_path.read_text()
          launcher = replace_once(
              launcher,
              'const DISALLOWED_LIFECYCLE_SCRIPTS = ["preinstall", "install", "postinstall", "prepare"];\nconst SIGNALS_TO_FORWARD = ["SIGINT", "SIGTERM", "SIGHUP"];',
              '''const DISALLOWED_LIFECYCLE_SCRIPTS = [
            "preinstall",
            "install",
            "postinstall",
            "preprepare",
            "prepare",
            "postprepare",
          ];
          const SIGNALS_TO_FORWARD = ["SIGTERM"];
          const SIGNALS_TO_OBSERVE = ["SIGINT", "SIGHUP"];'''.replace("          ", ""),
              "launcher constants",
          )
          signal_block = '''  const signalHandlers = new Map();
          let receivedSignal = null;
          const rememberSignal = (signal) => {
            if (receivedSignal === null) {
              receivedSignal = signal;
            }
          };
          if (options.forwardSignals !== false && process.platform !== "win32") {
            for (const signal of SIGNALS_TO_FORWARD) {
              const handler = () => {
                rememberSignal(signal);
                if (!child.killed) {
                  child.kill(signal);
                }
              };
              signalHandlers.set(signal, handler);
              process.on(signal, handler);
            }
            for (const signal of SIGNALS_TO_OBSERVE) {
              const handler = () => rememberSignal(signal);
              signalHandlers.set(signal, handler);
              process.on(signal, handler);
            }
          }
          const cleanup = () => {
            for (const [signal, handler] of signalHandlers) {
              process.removeListener(signal, handler);
            }
          };

          '''.replace("          ", "")
          launcher = replace_between(
              launcher,
              "  const forwarded = new Map();\n",
              "  return new Promise((resolve, reject) => {\n",
              signal_block,
              "signal handler block",
          )
          launcher = replace_once(
              launcher,
              '''    child.once("exit", (code, signal) => {
            cleanup();
            if (signal) {
              resolve({ code: null, signal });
            } else {
              resolve({ code: typeof code === "number" ? code : 1, signal: null });
            }
          });'''.replace("          ", ""),
              '''    child.once("exit", (code, signal) => {
            cleanup();
            const effectiveSignal = signal || receivedSignal;
            if (effectiveSignal) {
              resolve({ code: null, signal: effectiveSignal });
            } else {
              resolve({ code: typeof code === "number" ? code : 1, signal: null });
            }
          });'''.replace("          ", ""),
              "effective signal projection",
          )
          launcher_path.write_text(launcher)

          package_path = Path("packaging/npm/launcher/package.json")
          package = package_path.read_text()
          package = replace_once(
              package,
              '"test": "node --test test/*.test.cjs"',
              '"test": "node test/run-tests.test.cjs"',
              "guarded package test script",
          )
          package_path.write_text(package)

          runner_path = Path("packaging/npm/launcher/test/run-tests.test.cjs")
          runner = runner_path.read_text()
          runner = replace_once(
              runner,
              '''  "npm package contents are explicit and exclude tests and build residue",
          ]);'''.replace("          ", ""),
              '''  "npm package contents are explicit and exclude tests and build residue",
            "the launcher bin remains executable in the checkout and packed package",
          ]);'''.replace("          ", ""),
              "portable required controls",
          )
          runner = replace_once(
              runner,
              '  "observes terminal SIGINT without forwarding a duplicate to the native child",',
              '  "observes terminal SIGINT and SIGHUP without forwarding duplicates to the native child",',
              "POSIX required control",
          )
          runner = replace_once(
              runner,
              '''const result = spawnSync(
            process.execPath,
            ["--test", "--test-reporter=tap", path.join(__dirname, "launcher.test.cjs")],'''.replace("          ", ""),
              '''const testFiles = [
            "exit-status.test.cjs",
            "launcher.test.cjs",
            "negative-paths.test.cjs",
            "package-mode.test.cjs",
          ].map((name) => path.join(__dirname, name));

          const result = spawnSync(
            process.execPath,
            ["--test", "--test-reporter=tap", ...testFiles],'''.replace("          ", ""),
              "explicit non-recursive test inventory",
          )
          runner_path.write_text(runner)

          test_path = Path("packaging/npm/launcher/test/launcher.test.cjs")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              'const { spawnSync } = require("node:child_process");',
              'const { spawn, spawnSync } = require("node:child_process");',
              "spawn import",
          )
          cleanup_anchor = '''function cleanup(root) {
            fs.rmSync(root, { recursive: true, force: true });
          }
          '''.replace("          ", "")
          helpers = cleanup_anchor + '''
          function delay(milliseconds) {
            return new Promise((resolve) => setTimeout(resolve, milliseconds));
          }

          async function waitForFile(filePath, timeoutMilliseconds = 5000) {
            const deadline = Date.now() + timeoutMilliseconds;
            while (Date.now() < deadline) {
              if (fs.existsSync(filePath)) {
                return fs.readFileSync(filePath, "utf8");
              }
              await delay(20);
            }
            throw new Error(`timed out waiting for ${filePath}`);
          }

          function waitForExit(child, timeoutMilliseconds = 10000) {
            return new Promise((resolve, reject) => {
              const stdout = [];
              const stderr = [];
              child.stdout.on("data", (chunk) => stdout.push(chunk));
              child.stderr.on("data", (chunk) => stderr.push(chunk));
              const timer = setTimeout(
                () => reject(new Error(`timed out waiting for launcher process ${child.pid}`)),
                timeoutMilliseconds,
              );
              child.once("error", (error) => {
                clearTimeout(timer);
                reject(error);
              });
              child.once("exit", (code, signal) => {
                clearTimeout(timer);
                resolve({
                  code,
                  signal,
                  stdout: Buffer.concat(stdout).toString("utf8"),
                  stderr: Buffer.concat(stderr).toString("utf8"),
                });
              });
            });
          }

          function signalProbe(root, signalName) {
            const script = path.join(root, `${signalName}-signal-probe.cjs`);
            fs.writeFileSync(
              script,
              `"use strict";\nconst fs = require("node:fs");\nconst signal = process.env.RIPR_SIGNAL_NAME;\nconst ready = process.env.RIPR_SIGNAL_READY;\nconst receipt = process.env.RIPR_SIGNAL_RECEIPT;\nlet count = 0;\nprocess.on(signal, () => {\n  count += 1;\n  fs.writeFileSync(receipt, JSON.stringify({ signal, count, pid: process.pid }));\n  if (count === 1) {\n    setTimeout(() => process.exit(0), 150);\n  }\n});\nfs.writeFileSync(ready, String(process.pid));\nsetInterval(() => {}, 1000);\n`,
            );
            return script;
          }

          function spawnSignalLauncher(fixture, signalName) {
            const ready = path.join(fixture.root, `${signalName}-ready.txt`);
            const receipt = path.join(fixture.root, `${signalName}-receipt.json`);
            const bin = path.join(fixture.launcherRoot, "bin", "ripr.cjs");
            const child = spawn(process.execPath, [bin, signalProbe(fixture.root, signalName)], {
              cwd: fixture.root,
              detached: true,
              env: {
                ...process.env,
                RIPR_SIGNAL_NAME: signalName,
                RIPR_SIGNAL_READY: ready,
                RIPR_SIGNAL_RECEIPT: receipt,
              },
              stdio: ["ignore", "pipe", "pipe"],
            });
            return { child, ready, receipt };
          }

          function killProcessGroup(pid, signal = "SIGKILL") {
            try {
              process.kill(-pid, signal);
            } catch (error) {
              if (error.code !== "ESRCH") {
                throw error;
              }
            }
          }

          async function assertProcessGone(pid, timeoutMilliseconds = 3000) {
            const deadline = Date.now() + timeoutMilliseconds;
            while (Date.now() < deadline) {
              try {
                process.kill(pid, 0);
              } catch (error) {
                if (error.code === "ESRCH") {
                  return;
                }
                throw error;
              }
              await delay(20);
            }
            throw new Error(`process ${pid} remained alive after launcher termination`);
          }
          '''.replace("          ", "")
          tests = replace_once(tests, cleanup_anchor, helpers, "signal helpers")

          lifecycle_test = '''test("rejects lifecycle scripts, version ranges, and dependency drift", () => {
            for (const scriptName of [
              "preinstall",
              "install",
              "postinstall",
              "preprepare",
              "prepare",
              "postprepare",
            ]) {
              const mutated = launcherManifest({
                scripts: { ...manifest.scripts, [scriptName]: "node should-not-run.cjs" },
              });
              assert.throws(() => launcher.validateLauncherManifest(mutated), {
                code: "install_script_forbidden",
              });
            }

            const ranged = launcherManifest({
              optionalDependencies: { ...manifest.optionalDependencies, [platformRow().package]: "^0.11.0" },
            });
            assert.throws(() => launcher.validateLauncherManifest(ranged), { code: "native_dependency_version_mismatch" });

            const extra = launcherManifest({
              optionalDependencies: { ...manifest.optionalDependencies, "@effortlessmetrics/ripr-extra": manifest.version },
            });
            assert.throws(() => launcher.validateLauncherManifest(extra), { code: "native_dependency_set_mismatch" });
          });

          '''.replace("          ", "")
          tests = replace_between(
              tests,
              'test("rejects lifecycle scripts, version ranges, and dependency drift", () => {\n',
              'test("detects glibc and rejects musl or unknown Linux libc", () => {\n',
              lifecycle_test,
              "lifecycle test",
          )

          signal_tests = '''test(
            "forwards direct SIGTERM to native child exactly once and re-emits signal",
            { skip: process.platform === "win32", timeout: 15000 },
            async () => {
              const fixture = nativeFixture();
              const { child, ready, receipt } = spawnSignalLauncher(fixture, "SIGTERM");
              let nativePid;
              try {
                nativePid = Number.parseInt(await waitForFile(ready), 10);
                const exitPromise = waitForExit(child);
                process.kill(child.pid, "SIGTERM");
                const exit = await exitPromise;
                await waitForFile(receipt);
                await delay(250);
                assert.deepEqual(JSON.parse(fs.readFileSync(receipt, "utf8")), {
                  signal: "SIGTERM",
                  count: 1,
                  pid: nativePid,
                });
                assert.equal(exit.signal, "SIGTERM");
                assert.equal(exit.stdout, "");
                assert.equal(exit.stderr, "");
                await assertProcessGone(nativePid);
              } finally {
                killProcessGroup(child.pid);
                cleanup(fixture.root);
              }
            },
          );

          test(
            "observes terminal SIGINT and SIGHUP without forwarding duplicates to the native child",
            { skip: process.platform === "win32", timeout: 30000 },
            async () => {
              for (const signalName of ["SIGINT", "SIGHUP"]) {
                const fixture = nativeFixture();
                const { child, ready, receipt } = spawnSignalLauncher(fixture, signalName);
                let nativePid;
                try {
                  nativePid = Number.parseInt(await waitForFile(ready), 10);
                  const exitPromise = waitForExit(child);
                  process.kill(-child.pid, signalName);
                  const exit = await exitPromise;
                  await waitForFile(receipt);
                  await delay(250);
                  assert.deepEqual(JSON.parse(fs.readFileSync(receipt, "utf8")), {
                    signal: signalName,
                    count: 1,
                    pid: nativePid,
                  });
                  assert.equal(exit.signal, signalName);
                  assert.equal(exit.stdout, "");
                  assert.equal(exit.stderr, "");
                  await assertProcessGone(nativePid);
                } finally {
                  killProcessGroup(child.pid);
                  cleanup(fixture.root);
                }
              }
            },
          );

          '''.replace("          ", "")
          signal_anchor = 'test("runs a real synthetic executable and preserves argv, cwd, env, stdout, stderr, and exit status", () => {\n'
          tests = replace_once(tests, signal_anchor, signal_tests + signal_anchor, "runtime signal tests")
          test_path.write_text(tests)

          rust_path = Path("xtask/src/policy/distribution/npm_launcher.rs")
          rust = rust_path.read_text()
          rust = replace_once(
              rust,
              'pub(super) const TEST_PATH: &str = "packaging/npm/launcher/test/launcher.test.cjs";\n',
              'pub(super) const TEST_PATH: &str = "packaging/npm/launcher/test/launcher.test.cjs";\npub(super) const TEST_RUNNER_PATH: &str = "packaging/npm/launcher/test/run-tests.test.cjs";\npub(super) const TEST_RUNNER_TEXT: &str = include_str!("../../../../packaging/npm/launcher/test/run-tests.test.cjs");\n',
              "runner constants",
          )
          rust = replace_once(
              rust,
              'const FORBIDDEN_LIFECYCLE_SCRIPTS: &[&str] = &["preinstall", "install", "postinstall", "prepare"];',
              '''const FORBIDDEN_LIFECYCLE_SCRIPTS: &[&str] = &[
              "preinstall",
              "install",
              "postinstall",
              "preprepare",
              "prepare",
              "postprepare",
          ];'''.replace("          ", ""),
              "Rust lifecycle list",
          )
          lifecycle_loop = '''    for script in FORBIDDEN_LIFECYCLE_SCRIPTS {
              if manifest.scripts.contains_key(*script) {
                  violations.push(format!(
                      "{path}: scripts.{script} is forbidden; installation cannot depend on npm lifecycle scripts"
                  ));
              }
          }
          '''.replace("          ", "")
          rust = replace_once(
              rust,
              lifecycle_loop,
              lifecycle_loop + '''    check_equal(
              path,
              "scripts.test",
              manifest
                  .scripts
                  .get("test")
                  .map(String::as_str)
                  .unwrap_or_default(),
              "node test/run-tests.test.cjs",
              violations,
          );
          '''.replace("          ", ""),
              "guarded runner contract",
          )
          signal_guard = '''        (
            "process.exitCode = signalExitCode",
            "a consumed child signal must still produce a nonzero launcher exit",
          ),
          '''.replace("          ", "")
          rust = replace_once(
              rust,
              signal_guard,
              signal_guard + '''        (
            "SIGNALS_TO_OBSERVE",
            "terminal process-group signals must be observed without duplicate forwarding",
          ),
          (
            "const effectiveSignal = signal || receivedSignal",
            "the first observed termination signal must survive a graceful child exit",
          ),
          '''.replace("          ", ""),
              "signal source guards",
          )
          static_start = rust.find("    for required_test in [\n")
          static_end = rust.find("\n}\n\nfn expected_platform", static_start)
          if static_start < 0 or static_end < 0:
              raise SystemExit("static test-token gate was not found")
          rust = rust[:static_start] + '''    validate_test_runner(
            TEST_RUNNER_PATH,
            TEST_RUNNER_TEXT,
            test_path,
            test_text,
            violations,
          );'''.replace("          ", "") + rust[static_end:]
          validator = '''
          const REQUIRED_EXECUTED_TESTS: &[&str] = &[
            "rejects lifecycle scripts, version ranges, and dependency drift",
            "rejects missing, wrong-version, wrong-target, traversal, symlink, directory, and non-executable payloads",
            "forwards direct SIGTERM to native child exactly once and re-emits signal",
            "observes terminal SIGINT and SIGHUP without forwarding duplicates to the native child",
            "source bin missing-package failure never falls back to PATH or writes stdout",
            "npm package contents are explicit and exclude tests and build residue",
          ];

          pub(super) fn validate_test_runner(
            runner_path: &str,
            runner_text: &str,
            test_path: &str,
            test_text: &str,
            violations: &mut Vec<String>,
          ) {
            for (needle, explanation) in [
              ("--test-reporter=tap", "runner must consume a machine-readable test report"),
              ("result.status !== 0", "runner must propagate Node test failure"),
              ("missing.length > 0", "runner must fail when a required named control did not pass"),
              ("SKIP|TODO", "runner must not count skipped or todo controls as passed"),
            ] {
              if !runner_text.contains(needle) {
                violations.push(format!("{runner_path}: {explanation}; missing `{needle}`"));
              }
            }
            for required_test in REQUIRED_EXECUTED_TESTS {
              if !runner_text.contains(required_test) {
                violations.push(format!(
                  "{runner_path}: required executed-control admission is missing `{required_test}`"
                ));
              }
              if !test_text.contains(required_test) {
                violations.push(format!(
                  "{test_path}: required launcher control is missing `{required_test}`"
                ));
              }
            }
          }
          '''.replace("          ", "")
          rust = replace_once(rust, "\nfn expected_platform", validator + "\nfn expected_platform", "runner validator insertion")
          rust_path.write_text(rust)

          rust_tests_path = Path("xtask/src/policy/distribution/tests.rs")
          rust_tests = rust_tests_path.read_text().replace(
              "node --test test/*.test.cjs",
              "node test/run-tests.test.cjs",
          )
          function_start = rust_tests.find("#[test]\nfn npm_launcher_source_guards_reject_removed_safety_rails()")
          if function_start < 0:
              raise SystemExit("source guard regression test was not found")
          next_test = rust_tests.find("\n#[test]\n", function_start + 1)
          function_end = len(rust_tests) if next_test < 0 else next_test + 1
          replacement_tests = '''#[test]
          fn npm_launcher_source_guards_reject_removed_safety_rails() -> Result<(), String> {
            let contract = parsed_contract(CONTRACT_TEXT)?;
            let mut violations = Vec::new();
            npm_launcher::validate_launcher_sources(
              npm_launcher::BIN_PATH,
              NPM_BIN_TEXT,
              npm_launcher::LIBRARY_PATH,
              &NPM_LIBRARY_TEXT
                .replace("shell: false", "shell: true")
                .replace("process.exitCode = signalExitCode", "process.exitCode = 0")
                .replace("SIGNALS_TO_OBSERVE", "removed-observer")
                .replace("const effectiveSignal = signal || receivedSignal", "const effectiveSignal = signal"),
              npm_launcher::TEST_PATH,
              NPM_TEST_TEXT,
              &mut violations,
            );
            assert!(violations.iter().any(|violation| violation.contains("shell interpolation")));
            assert!(violations.iter().any(|violation| violation.contains("signalExitCode")));
            assert!(violations.iter().any(|violation| violation.contains("terminal process-group signals")));
            assert!(violations.iter().any(|violation| violation.contains("first observed termination signal")));
            assert!(!contract.npm.install_scripts);
            Ok(())
          }

          #[test]
          fn npm_launcher_rejects_all_install_time_lifecycle_hooks() -> Result<(), String> {
            for script in ["preinstall", "install", "postinstall", "preprepare", "prepare", "postprepare"] {
              let anchor = "\\\"test\\\": \\\"node test/run-tests.test.cjs\\\"";
              let replacement = format!("{anchor},\\n    \\\"{script}\\\": \\\"node should-not-run.cjs\\\"");
              let mutated = NPM_MANIFEST_TEXT.replace(anchor, &replacement);
              let violations = evaluated(CONTRACT_TEXT, WORKSPACE_TEXT, CRATE_TEXT, &mutated)?;
              assert!(
                violations.iter().any(|violation| violation.contains(&format!("scripts.{script} is forbidden"))),
                "{script}: {violations:#?}"
              );
            }
            Ok(())
          }

          #[test]
          fn npm_launcher_guarded_runner_rejects_missing_controls() {
            let mut violations = Vec::new();
            npm_launcher::validate_test_runner(
              npm_launcher::TEST_RUNNER_PATH,
              &npm_launcher::TEST_RUNNER_TEXT.replace(
                "source bin missing-package failure never falls back to PATH or writes stdout",
                "removed required control",
              ),
              npm_launcher::TEST_PATH,
              NPM_TEST_TEXT,
              &mut violations,
            );
            assert!(violations.iter().any(|violation| {
              violation.contains("required executed-control admission")
                && violation.contains("source bin missing-package")
            }));
          }
          '''.replace("          ", "")
          rust_tests = rust_tests[:function_start] + replacement_tests + rust_tests[function_end:]
          rust_tests_path.write_text(rust_tests)

          index_path = Path("docs/specs/README.md")
          index_lines = index_path.read_text().splitlines()
          if not any("RIPR-SPEC-0181" in line for line in index_lines):
              anchors = [index for index, line in enumerate(index_lines) if "RIPR-SPEC-0180" in line]
              if len(anchors) != 1:
                  raise SystemExit(f"spec index: expected one 0180 anchor, found {len(anchors)}")
              index_lines.insert(
                  anchors[0] + 1,
                  "| [RIPR-SPEC-0181](RIPR-SPEC-0181-npm-native-launcher-boundary.md) | accepted | Deterministic script-free npm native launcher boundary |",
              )
              index_path.write_text("\n".join(index_lines) + "\n")

          traceability_path = Path(".ripr/traceability.toml")
          traceability = traceability_path.read_text().rstrip()
          if 'id = "RIPR-SPEC-0181"' not in traceability:
              traceability += '''

          [[behavior]]
          id = "RIPR-SPEC-0181"
          name = "npm native launcher boundary"
          spec = "docs/specs/RIPR-SPEC-0181-npm-native-launcher-boundary.md"
          tests = [
            "packaging/npm/launcher/test/run-tests.test.cjs",
            "packaging/npm/launcher/test/launcher.test.cjs",
            "packaging/npm/launcher/test/exit-status.test.cjs",
            "packaging/npm/launcher/test/negative-paths.test.cjs",
            "packaging/npm/launcher/test/package-mode.test.cjs",
            "xtask/src/policy/distribution/tests.rs"
          ]
          code = [
            "packaging/npm/launcher/package.json",
            "packaging/npm/launcher/bin/ripr.cjs",
            "packaging/npm/launcher/lib/launcher.cjs",
            "xtask/src/policy/distribution/npm_launcher.rs"
          ]
          outputs = [
            "packaging/npm/launcher/README.md",
            "docs/PYPI_NPM_DISTRIBUTION.md"
          ]
          '''.replace("          ", "")
              traceability_path.write_text(traceability + "\n")

          artifacts_path = Path("policy/doc-artifacts.toml")
          artifacts = artifacts_path.read_text().rstrip()
          if 'id = "RIPR-SPEC-0181"' not in artifacts:
              artifacts += '''

          [[artifact]]
          id = "RIPR-SPEC-0181"
          kind = "spec"
          path = "docs/specs/RIPR-SPEC-0181-npm-native-launcher-boundary.md"
          status = "accepted"
          owner = "product-swarm"
          standalone_reason = "Source-package contract for exact native package selection, lifecycle denial, executable confinement, literal spawn semantics, non-duplicating POSIX signal handling, and executed named controls; no registry or support-tier claim."
          '''.replace("          ", "")
              artifacts_path.write_text(artifacts + "\n")

          for helper in [
              ".github/workflows/branch-repair-4716-apply.yml",
              ".github/workflows/branch-repair-4716-final.yml",
              ".github/workflows/branch-repair-4716-review-v2.yml",
              ".github/workflows/branch-repair-4716-review-v3.yml",
              ".github/workflows/branch-repair-4716-v4.yml",
          ]:
              path = Path(helper)
              if path.exists():
                  path.unlink()
          PY

      - name: Validate exact repair
        shell: bash
        run: |
