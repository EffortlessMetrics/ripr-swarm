name: W7 Source Promotion Preflight a072b7

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ripr-0.11.0-w7-source-promotion-preflight-a072b7
  cancel-in-progress: false

jobs:
  preflight:
    name: exact W7/source preflight
    if: github.head_ref == 'release/0.11.0-w7-source-preflight-a072b7'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_PARENT: a072b7efe80f1a32d7b5ba7342559a114edeb12e
      SWARM_PARENT: 83217e97ec6847db41d757f57279a8b1ca433fe6
      SWARM_REF: refs/tags/ripr-release-0.11.0-83217e97ec6847db41d757f57279a8b1ca433fe6
      RESOLVED_TREE: c53a89dcace27f54fdb78df4d16037959dfa2e2a
      JOIN_HEAD: 87cc06cfb7f686248a35f93871d8794bdbe30ba1
      VERSION: 0.11.0

    steps:
      - name: Checkout exact W7 preflight producer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: EffortlessMetrics/ripr-swarm
          ref: 83217e97ec6847db41d757f57279a8b1ca433fe6
          fetch-depth: 0
          fetch-tags: true
          path: swarm
          persist-credentials: false

      - name: Checkout exact source parent
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: EffortlessMetrics/ripr
          ref: a072b7efe80f1a32d7b5ba7342559a114edeb12e
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Bind exact repositories, candidate tag, and reviewed tree object
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C swarm rev-parse HEAD)" = "$SWARM_PARENT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_PARENT"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_PARENT"
          git -C swarm merge-base --is-ancestor "$SWARM_PARENT" origin/main
          test "$(git -C swarm rev-parse "$SWARM_REF^{commit}")" = "$SWARM_PARENT"
          live_ref=$(git ls-remote --refs https://github.com/EffortlessMetrics/ripr-swarm.git "$SWARM_REF")
          test "$(printf '%s\n' "$live_ref" | wc -l)" -eq 1
          test "$(printf '%s\n' "$live_ref" | awk '{print $1}')" = "$SWARM_PARENT"

          # The reviewed tree is intentionally not in either parent. Fetch the exact
          # unmerged J object solely so its tree is present in the disposable source
          # object store; source HEAD and origin/main remain pinned to SOURCE_PARENT.
          git -C source fetch --no-tags https://github.com/EffortlessMetrics/ripr.git "$JOIN_HEAD"
          test "$(git -C source cat-file -t "$JOIN_HEAD")" = commit
          test "$(git -C source rev-parse "$JOIN_HEAD^{tree}")" = "$RESOLVED_TREE"
          test "$(git -C source cat-file -t "$RESOLVED_TREE")" = tree
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_PARENT"
          test "$(git -C source rev-parse origin/main)" = "$SOURCE_PARENT"

          mkdir -p preflight
          {
            printf 'source_parent=%s\n' "$SOURCE_PARENT"
            printf 'source_main=%s\n' "$(git -C source rev-parse origin/main)"
            printf 'swarm_parent=%s\n' "$SWARM_PARENT"
            printf 'swarm_main=%s\n' "$(git -C swarm rev-parse origin/main)"
            printf 'swarm_ref=%s\n' "$SWARM_REF"
            printf 'swarm_ref_sha=%s\n' "$(printf '%s\n' "$live_ref" | awk '{print $1}')"
            printf 'reviewed_resolved_tree=%s\n' "$RESOLVED_TREE"
            printf 'join_head=%s\n' "$JOIN_HEAD"
            git --version
            rustc -Vv
            cargo -V
          } | tee preflight/environment.txt

      - name: Generate exact-pair reviewed-tree preflight
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ripr-w7-preflight-target
        run: |
          set -euo pipefail
          # W7 deliberately forces TEMP/TMP/TMPDIR to checkout-relative `target`.
          # Because build output is isolated outside the checkout here, create the
          # ignored temp parent explicitly so the read-only producer can create
          # and remove its disposable merge repository beneath it.
          mkdir -p swarm/target
          cd swarm
          cargo xtask source-promotion preflight \
            --source-parent "$SOURCE_PARENT" \
            --swarm-parent "$SWARM_PARENT" \
            --swarm-ref "$SWARM_REF" \
            --source-repo "$GITHUB_WORKSPACE/source" \
            --swarm-repo "$GITHUB_WORKSPACE/swarm" \
            --source-main origin/main \
            --swarm-main origin/main \
            --version "$VERSION" \
            --resolved-tree "$RESOLVED_TREE" \
            --out "$GITHUB_WORKSPACE/preflight"

      - name: Validate exact identities and reviewed tree
        shell: bash
        run: |
          set -euo pipefail
          receipt=preflight/source-promotion-preflight.json
          test -s "$receipt"
          jq -e \
            --arg source "$SOURCE_PARENT" \
            --arg swarm "$SWARM_PARENT" \
            --arg swarm_ref "$SWARM_REF" \
            --arg resolved_tree "$RESOLVED_TREE" '
              .schema == "ripr.source_promotion_preflight.v1" and
              .mode == "two_parent_join" and
              .source_parent == $source and
              .source_main == $source and
              .swarm_parent == $swarm and
              .swarm_ref == $swarm_ref and
              .swarm_ref_sha == $swarm and
              .dry_merge.reviewed_resolved_tree == $resolved_tree and
              .dry_merge.reviewed_resolved_tree_verified == true
            ' "$receipt" >/dev/null
          test -z "$(git -C source status --porcelain)"
          test -z "$(git -C swarm status --porcelain)"
          sha256sum preflight/* | sort > preflight/SHA256SUMS

      - name: Upload exact reviewed preflight packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-0.11.0-w7-source-promotion-reviewed-preflight-c53a89dc
          path: preflight/
          if-no-files-found: error
          retention-days: 90
