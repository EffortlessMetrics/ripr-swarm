name: Windows Editor Hang Hunt

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Commit SHA to check out (40 hexadecimal characters)"
        required: true
        type: string
      iterations:
        description: "Trusted editor journeys per shard (1 to 8; each is capped at 15 minutes)"
        required: false
        type: string
        default: "5"

# Diagnostic for #9526: the trusted packaged editor journey intermittently runs to its
# step cap with no Mocha output. This repeats only that journey, in parallel shards and
# against a locally built server, and keeps the VS Code host logs of every iteration.
# It never creates a release, uploads a release asset, publishes a VSIX, uses a secret,
# or changes a ref, and it is not qualification evidence.
permissions:
  contents: read

jobs:
  hunt:
    name: trusted editor journey shard ${{ matrix.shard }} (${{ matrix.mode }}, ${{ matrix.profile }})
    runs-on: windows-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # The packaged rehearsal pipes `npm run test:e2e 2>&1 | Tee-Object` and runs a release
      # server; plain file redirection with a debug server did not hang in 24 iterations, so
      # the matrix covers each of those two differences.
      matrix:
        include:
          - { shard: 1, mode: redirect, profile: debug }
          - { shard: 2, mode: pipe, profile: debug }
          - { shard: 3, mode: redirect, profile: release }
          - { shard: 4, mode: pipe, profile: release }
    env:
      CARGO_TERM_COLOR: always
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      ITERATIONS: ${{ inputs.iterations }}
      PROFILE_NAME: ${{ matrix.profile }}
      RUN_MODE: ${{ matrix.mode }}

    steps:
      - name: Initialize roots before checkout
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'ripr-editor-hang-hunt'
          $logs = Join-Path $base 'hunt-logs'
          $work = Join-Path $base 'work'
          "HUNT_ROOT=$logs" >> $env:GITHUB_ENV
          "QUAL_TEMP_ROOT=$work" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path $logs, $work | Out-Null

      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize roots after checkout
        if: always()
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'ripr-editor-hang-hunt'
          New-Item -ItemType Directory -Force -Path (Join-Path $base 'hunt-logs'), (Join-Path $base 'work') | Out-Null

      - name: Verify candidate identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw 'candidate_sha must be a full 40-character commit SHA' }
          if ($env:ITERATIONS -notmatch '^[1-8]$') { throw 'iterations must be 1 to 8 (each may wait 15 minutes inside a 150-minute job)' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:CANDIDATE_SHA.ToLowerInvariant()) { throw "checkout identity mismatch: HEAD=$head candidate_sha=$env:CANDIDATE_SHA" }

      - name: Set up Rust and Node
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build the server and package the VSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The repository cargo config points compiler/linker temporaries at the checkout's
          # relative target directory, so build into it rather than an external target-dir.
          if ($env:PROFILE_NAME -eq 'release') { cargo build --locked -p ripr --release } else { cargo build --locked -p ripr }
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed with exit $LASTEXITCODE" }
          $server = Join-Path (Get-Location) "target\$($env:PROFILE_NAME)\ripr.exe"
          if (-not (Test-Path $server)) { throw "server binary missing: $server" }
          "RIPR_SERVER=$server" >> $env:GITHUB_ENV
          Push-Location editors/vscode
          try {
            npm ci; if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
            cargo xtask vscode-compile; if ($LASTEXITCODE -ne 0) { throw 'VSIX compile failed' }
            npm run package; if ($LASTEXITCODE -ne 0) { throw 'VSIX package failed' }
            $vsix = Get-ChildItem dist\*.vsix | Select-Object -First 1; if ($null -eq $vsix) { throw 'VSIX package was not produced' }
            $extract = Join-Path $env:QUAL_TEMP_ROOT 'vsix-extracted'
            New-Item -ItemType Directory -Force -Path $extract | Out-Null
            Expand-Archive -LiteralPath $vsix.FullName -DestinationPath $extract -Force
            "RIPR_EXTENSION=$(Join-Path $extract 'extension')" >> $env:GITHUB_ENV
          } finally { Pop-Location }

      - name: Repeat the trusted editor journey
        shell: pwsh
        working-directory: editors/vscode
        run: |
          $ErrorActionPreference = 'Continue'
          $cap = 256KB
          $patterns = @(
            '-----BEGIN [A-Z0-9 ]+-----[\s\S]*?-----END [A-Z0-9 ]+-----',
            '-----BEGIN [A-Z0-9 ]+-----[\s\S]*$',
            '\A[A-Za-z0-9+/=\s]*-----END [A-Z0-9 ]+-----',
            '-----END [A-Z0-9 ]+-----',
            '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{20,}\b',
            '\bgithub_pat_[A-Za-z0-9_]{20,}\b',
            'x-access-token:[^@\s]+'
          )
          function Copy-Redacted([string]$source, [string]$to) {
            try {
              $stream = [System.IO.File]::Open($source, 'Open', 'Read', 'ReadWrite,Delete')
              try {
                $take = [int][Math]::Min($stream.Length, $cap)
                $null = $stream.Seek(-$take, 'End')
                $bytes = New-Object byte[] $take
                $read = 0
                while ($read -lt $take) { $n = $stream.Read($bytes, $read, $take - $read); if ($n -le 0) { break }; $read += $n }
                if ($read -lt $take) { $bytes = $bytes[0..($read - 1)] }
              } finally { $stream.Dispose() }
              $text = [System.Text.Encoding]::UTF8.GetString($bytes)
              foreach ($pattern in $patterns) { $text = [regex]::Replace($text, $pattern, '[redacted]', 'IgnoreCase') }
              New-Item -ItemType Directory -Force -Path (Split-Path $to) | Out-Null
              [System.IO.File]::WriteAllText($to, $text)
            } catch { Write-Host "skipped ${source}: $_" }
          }
          function Save-HostLogs([string]$logs, [string]$dest) {
            if (-not (Test-Path $logs)) { return }
            foreach ($file in Get-ChildItem $logs -File -Recurse -Filter *.log) {
              Copy-Redacted $file.FullName (Join-Path $dest $file.FullName.Substring($logs.Length + 1))
            }
          }
          # The pipe script is the unit under test for the fault control below, so the real
          # iterations and the control generate it through the same function.
          function New-PipeScript([string]$command, [string]$tee, [string]$path) {
            "$command 2>&1 | Tee-Object -FilePath '$tee'; exit `$LASTEXITCODE" | Set-Content -Encoding utf8 $path
          }
          function Get-HuntExit($rows) { if (@($rows | Where-Object { $_.result -ne 0 }).Count -gt 0) { 1 } else { 0 } }
          if ($env:RUN_MODE -eq 'pipe') {
            # Fault-path control: a harmless child that writes to both streams and exits 7 must come
            # back through the generated pipe script as exit 7 with both markers teed, and must make
            # the final decision fail. Confined to its own fixture directory and process.
            $ctl = Join-Path $env:QUAL_TEMP_ROOT 'fault-control'
            New-Item -ItemType Directory -Force -Path $ctl | Out-Null
            $child = Join-Path $ctl 'child.ps1'
            "[Console]::Out.WriteLine('CONTROL-STDOUT-MARKER'); [Console]::Error.WriteLine('CONTROL-STDERR-MARKER'); exit 7" | Set-Content -Encoding utf8 $child
            $ctlScript = Join-Path $ctl 'pipe.ps1'
            $ctlTee = Join-Path $ctl 'tee.log'
            New-PipeScript "pwsh -NoProfile -File '$child'" $ctlTee $ctlScript
            $cp = Start-Process -FilePath 'pwsh' -ArgumentList '-NoProfile', '-File', $ctlScript -RedirectStandardOutput (Join-Path $ctl 'out.log') -RedirectStandardError (Join-Path $ctl 'err.log') -PassThru -NoNewWindow
            if (-not $cp.WaitForExit(120000)) { taskkill /T /F /PID $cp.Id 2>&1 | Out-Null; throw 'fault control child did not exit' }
            $cp.WaitForExit()
            $teed = Get-Content -Raw $ctlTee
            $ctlRows = @([ordered]@{ result = $cp.ExitCode })
            $ctlProof = [ordered]@{
              child_exit = $cp.ExitCode
              tee_has_stdout = $teed -match 'CONTROL-STDOUT-MARKER'
              tee_has_stderr = $teed -match 'CONTROL-STDERR-MARKER'
              final_decision = Get-HuntExit $ctlRows
            }
            $ctlProof | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-fault-control.json")
            Write-Host ($ctlProof | ConvertTo-Json -Compress)
            if ($ctlProof.child_exit -ne 7 -or -not $ctlProof.tee_has_stdout -or -not $ctlProof.tee_has_stderr -or $ctlProof.final_decision -ne 1) {
              throw 'fault control did not preserve the nonzero child outcome'
            }
          }
          $summary = @()
          for ($i = 1; $i -le [int]$env:ITERATIONS; $i++) {
            $artifactRoot = Join-Path $env:QUAL_TEMP_ROOT "trusted-editor-$i"
            $env:RIPR_TEST_EXTENSION_PATH = $env:RIPR_EXTENSION
            $env:RIPR_TEST_SERVER_PATH = $env:RIPR_SERVER
            $env:RIPR_TEST_WORKSPACE_TRUST = 'trusted'
            $env:RIPR_TEST_ARTIFACT_ROOT = $artifactRoot
            $rawDir = Join-Path $env:QUAL_TEMP_ROOT 'raw-console'
            New-Item -ItemType Directory -Force -Path $rawDir | Out-Null
            $out = Join-Path $rawDir "shard$($env:SHARD)-iter$i.log"
            $err = Join-Path $rawDir "shard$($env:SHARD)-iter$i.err.log"
            $started = Get-Date
            if ($env:RUN_MODE -eq 'pipe') {
              $inner = Join-Path $rawDir "pipe-iter$i.ps1"
              New-PipeScript 'npm run test:e2e' "$out.tee" $inner
              $p = Start-Process -FilePath 'pwsh' -ArgumentList '-NoProfile', '-File', $inner -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            } else {
              $p = Start-Process -FilePath 'npm.cmd' -ArgumentList 'run', 'test:e2e' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
            }
            $finished = $p.WaitForExit(900000)
            if ($finished) { $p.WaitForExit() }
            $hung = -not $finished
            if ($hung) {
              Write-Host "iteration $i HUNG after 15 minutes; capturing process state"
              Get-Process | Where-Object { $_.ProcessName -match 'Code|ripr|node|electron' } | Select-Object Id, ProcessName, CPU, WorkingSet64, Responding | Format-Table | Out-String | Write-Host
              Get-Process | Where-Object { $_.ProcessName -match 'Code|ripr|node|electron' } | Select-Object Id, ProcessName, CPU, WorkingSet64, Responding | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-iter$i-processes.json")
            }
            Save-HostLogs (Join-Path $artifactRoot 'vscode-test-user-data\logs') (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-iter$i-host-logs")
            Save-HostLogs (Join-Path $artifactRoot 'vscode-test-user-data\multiroot\logs') (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-iter$i-multiroot-host-logs")
            if ($hung) {
              taskkill /T /F /PID $p.Id 2>&1 | Out-Null
              Get-Process | Where-Object { $_.ProcessName -match '^(Code|ripr)$' } | Stop-Process -Force -ErrorAction SilentlyContinue
            }
            Copy-Redacted $out (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-iter$i.log")
            Copy-Redacted $err (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-iter$i.err.log")
            $exit = if ($hung) { 'hung' } else { $p.ExitCode }
            $summary += [ordered]@{ shard = $env:SHARD; iteration = $i; result = $exit; seconds = [int]((Get-Date) - $started).TotalSeconds }
            Write-Host ("shard {0} iteration {1}: {2} in {3}s" -f $env:SHARD, $i, $exit, [int]((Get-Date) - $started).TotalSeconds)
          }
          $summary | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:HUNT_ROOT "shard$($env:SHARD)-summary.json")
          if ((Get-HuntExit $summary) -ne 0) { Write-Host "iterations failed or hung: $(($summary | ConvertTo-Json -Compress))"; exit 1 }
        env:
          SHARD: ${{ matrix.shard }}

      - name: Upload hunt logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-editor-hang-hunt-${{ matrix.shard }}-${{ inputs.candidate_sha }}
          path: ${{ runner.temp }}\ripr-editor-hang-hunt\hunt-logs
          if-no-files-found: error
