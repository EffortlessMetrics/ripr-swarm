name: Windows Editor Hang Hunt
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selector:
    name: original selector test ${{ matrix.subject.name }} VS Code 1.91.0
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        subject:
          - {name: baseline, sha: a533e7fb312e1b989c99f3f022f4373cadb230eb}
          - {name: corrected, sha: 703e9c93522032e95c22187d261f971c884c2b50}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ matrix.subject.sha }}
          persist-credentials: false
      - name: Verify source
        shell: pwsh
        run: if ((git rev-parse HEAD).Trim() -ne '${{ matrix.subject.sha }}') { throw 'wrong checkout' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Install and compile
        working-directory: editors/vscode
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx tsc -p .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run selector test
        working-directory: editors/vscode
        shell: pwsh
        env:
          RIPR_TEST_GREP: a root containing glob metacharacters still selects its own files
          RIPR_TEST_REQUIRE_RAN: Document selector workspace-root glob escaping a root containing glob metacharacters still selects its own files
        run: |
          node -e 'const path = require("path"); require("@vscode/test-electron").runTests({version:"1.91.0", extensionDevelopmentPath:process.cwd(), extensionTestsPath:path.resolve("out/test/suite/index"), launchArgs:["--disable-extensions", "--disable-workspace-trust"]}).catch(e => { console.error(e); process.exitCode=1; });'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
