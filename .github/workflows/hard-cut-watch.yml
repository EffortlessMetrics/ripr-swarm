name: Explicit hard-cut audit

# Protected G admission enforces the cut before landing. This selected audit
# answers a named release/incident question; it never allocates on ordinary M.
on:
  workflow_dispatch:
    inputs:
      release_or_incident:
        description: Exact release or incident question this selected audit must answer.
        type: string
        required: true

concurrency:
  group: hard-cut-watch-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hard-cut-watch:
    name: Hard-cut main watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Require an explicit release or incident question
        env:
          AUDIT_PURPOSE: ${{ inputs.release_or_incident }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && -n "${AUDIT_PURPOSE//[[:space:]]/}" ]]
          printf 'Selected cut audit: %s\n' "$AUDIT_PURPOSE" >> "$GITHUB_STEP_SUMMARY"
      - name: Judge the landed commit against the cut packet
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          packet=policy/release-hard-cut-admission.json
          # The whole range cut..tip is judged, so a coalesced or skipped push
          # run cannot hide a violating commit. Inactive makes no API call.
          cut_sha="$(jq -r 'if .state == "active" then .observed_main.sha // "" else "" end' "$packet" 2>/dev/null || true)"
          echo '{}' > "$tmp/compare.json"
          if [[ "$cut_sha" =~ ^[0-9a-f]{40}$ ]]; then
            gh api "repos/${REPOSITORY}/compare/${cut_sha}...${HEAD_SHA}" > "$tmp/compare.json" || echo '{}' > "$tmp/compare.json"
          fi
          set +e
          python3 .github/actions/pr-candidate-admission/release_cut_admission.py \
            --watch --packet "$packet" --compare "$tmp/compare.json" | tee "$tmp/verdict.json"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Hard-cut main watch"
            echo ""
            echo "- verdict: \`$(jq -r '.status' "$tmp/verdict.json")\` (\`$(jq -r '.reason' "$tmp/verdict.json")\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::hard-cut main watch: $(jq -r '.detail' "$tmp/verdict.json" | tr -d '\r\n%')"
          fi
          exit "$rc"
