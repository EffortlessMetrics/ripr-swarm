name: Hard-cut main watch

# A push to main is judged against the hard-cut packet it carries (#5391).
# Inactive is a seconds-long no-op. While a cut is active, the PR path cannot
# stop a PR whose required check was green before the freeze, so a non-packet
# commit lands red here instead of extending the denominator silently.
# This is its own workflow, with a concurrency group per commit, because it
# used to live in routed-rust.yml where a newer push cancelled the run before
# any job started: the watch never executed on a busy main. It never gates a PR
# and starts no Rust work.

on:
  push:
    branches: [main]

concurrency:
  group: hard-cut-watch-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  hard-cut-watch:
    name: Hard-cut main watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Judge the landed commit against the cut packet
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          packet=policy/release-hard-cut-admission.json
          # The whole range cut..tip is judged, so a coalesced or skipped push
          # run cannot hide a violating commit. Inactive makes no API call.
          cut_sha="$(jq -r 'if .state == "active" then .observed_main.sha // "" else "" end' "$packet" 2>/dev/null || true)"
          echo '{}' > "$tmp/compare.json"
          if [[ "$cut_sha" =~ ^[0-9a-f]{40}$ ]]; then
            gh api "repos/${REPOSITORY}/compare/${cut_sha}...${HEAD_SHA}" > "$tmp/compare.json" || echo '{}' > "$tmp/compare.json"
          fi
          set +e
          python3 .github/actions/pr-candidate-admission/release_cut_admission.py \
            --watch --packet "$packet" --compare "$tmp/compare.json" | tee "$tmp/verdict.json"
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Hard-cut main watch"
            echo ""
            echo "- verdict: \`$(jq -r '.status' "$tmp/verdict.json")\` (\`$(jq -r '.reason' "$tmp/verdict.json")\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            echo "::error::hard-cut main watch: $(jq -r '.detail' "$tmp/verdict.json" | tr -d '\r\n%')"
          fi
          exit "$rc"
