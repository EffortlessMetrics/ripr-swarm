name: PR 3527 Repair Formatter

on:
  push:
    branches:
      - codex/rust-cfg-test-conjunct-order

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/rust-cfg-test-conjunct-order
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Update regression and format
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/ripr/src/analysis/test_grip_evidence/tests.rs")
          text = path.read_text(encoding="utf-8")
          marker = "fn given_call_presence_when_same_file_unit_shadow_calls_wrapper_name_then_activation_stays_unknown()"
          start = text.index(marker)
          next_test = text.find("\n#[test]\n", start + len(marker))
          end = len(text) if next_test == -1 else next_test
          block = text[start:end]
          old = "#[cfg(test)]"
          count = block.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one cfg(test) in regression block, found {count}")
          block = block.replace(old, '#[cfg(all(feature = "slow", test))]', 1)
          path.write_text(text[:start] + block + text[end:], encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected=(
            crates/ripr/src/analysis/test_grip_evidence/related_tests/context.rs
            crates/ripr/src/analysis/test_grip_evidence/tests.rs
          )
          if [[ "${changed[*]}" != "${expected[*]}" ]]; then
            printf 'unexpected formatter surface:\n%s\n' "${changed[*]}" >&2
            exit 1
          fi
      - name: Commit bounded repair
        shell: bash
        run: |
          git config user.name EffortlessSteven
          git config user.email git@effortlesssteven.com
          git add crates/ripr/src/analysis/test_grip_evidence/related_tests/context.rs \
                  crates/ripr/src/analysis/test_grip_evidence/tests.rs
          git commit -m "test(analysis): bind cfg-all shadow regression"
          git push origin "HEAD:${GITHUB_REF_NAME}"
