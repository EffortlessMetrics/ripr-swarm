name: Repair Perl static-limit spec

on:
  push:
    branches:
      - fix/perl-static-limit-taxonomy

permissions:
  contents: write

concurrency:
  group: repair-perl-static-limit-spec-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/perl-static-limit-taxonomy
          fetch-depth: 0

      - name: Select repository toolchain
        run: rustup show active-toolchain

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perl-static-limit-spec

      - name: Align accepted specification with executable corpus
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/specs/RIPR-SPEC-0108-evidence-promotion-honesty-meta-gate.md")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          case_ids = (
              "perl_moose_accessor_indirection",
              "perl_monkeypatch_symbol_table",
              "perl_dynamic_require_eval_dispatch",
          )

          for case_id in case_ids:
              replacements = 0
              for index, line in enumerate(lines):
                  if case_id in line and "must_emit_limitation: dynamic_dispatch" in line:
                      lines[index] = line.replace(
                          "must_emit_limitation: dynamic_dispatch",
                          "must_emit_limitation: metaprogramming",
                      )
                      replacements += 1
              if replacements != 2:
                  raise SystemExit(
                      f"expected two accepted-spec rows for {case_id}, found {replacements}"
                  )

          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Verify spec and corpus contracts
        run: |
          cargo xtask check-spec-format
          cargo xtask check-evidence-promotion-honesty
          git diff --check

      - name: Commit reviewed repair without delivery residue
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git rm .github/workflows/repair-perl-static-limit-spec.yml
          git add docs/specs/RIPR-SPEC-0108-evidence-promotion-honesty-meta-gate.md
          git commit -m "docs(spec): align Perl static-limit receipts"
          git push origin HEAD:fix/perl-static-limit-taxonomy
