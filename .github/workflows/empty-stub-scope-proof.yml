name: Empty stub scope candidate (non-shipping)
run-name: Empty stub scope at 79d2e550
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/empty-stub-scope-proof.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: empty-stub-scope-proof
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: 79d2e55079e03dd1d3ac7e149270e04893f9b003
      CANDIDATE_BRANCH: codex/8547-empty-stub-scope
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 79d2e55079e03dd1d3ac7e149270e04893f9b003
          path: build
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 79d2e55079e03dd1d3ac7e149270e04893f9b003
          path: subject
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 006537679c4dfa1bb27f7df243dd6220da2772a2
          path: driver
          sparse-checkout: .github/workflows/empty-stub-scope-proof.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-swarm-rust-small-${{ runner.os }}
          save-if: 'false'
      - name: Materialize the immutable reviewed scripts and exact instrument repair
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/empty-stub-scope-proof"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE/scripts"
          test "$(git -C driver rev-parse HEAD)" = 006537679c4dfa1bb27f7df243dd6220da2772a2
          test "$(git -C driver hash-object .github/workflows/empty-stub-scope-proof.yml)" = 54400d3fba719e13fa0eca4989c8c6ec445603e6
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          lines = Path('driver/.github/workflows/empty-stub-scope-proof.yml').read_text().splitlines(True)
          names = [
              ('bind', 'Bind inputs and inspect retained baseline'),
              ('prepare', 'Prepare only the four-file candidate'),
              ('test', 'Focused positive and wrong-implementation proof'),
              ('measure', 'Measure real candidate CLI and preserve output contracts'),
              ('publish', 'Publish only the qualified candidate branch'),
          ]
          root = Path(os.environ['EVIDENCE']) / 'scripts'
          for short, name in names:
              starts = [i for i, line in enumerate(lines) if line.rstrip() == '      - name: ' + name]
              assert len(starts) == 1, name
              start = next(i for i in range(starts[0] + 1, len(lines)) if lines[i].rstrip() == '        run: |') + 1
              end = start
              while end < len(lines) and (not lines[end].strip() or lines[end].startswith('          ')):
                  end += 1
              script = ''.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
              if short == 'prepare':
                  wrong = '.filter(|path| production_file_set.contains(path))\n    .collect::<BTreeSet<_>>();'
                  right = '.filter(|path| production_file_set.contains(path))\n        .collect::<BTreeSet<_>>();'
                  assert script.count(wrong) == 1, 'exact failed anchor no longer present'
                  script = script.replace(wrong, right, 1)
              path = root / (short + '.sh')
              path.write_text(script)
              print(short, hashlib.sha256(script.encode()).hexdigest())
          PY
          for file in "$EVIDENCE"/scripts/*.sh; do bash -n "$file"; done
      - name: Bind inputs and inspect retained baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/scripts/bind.sh"
      - name: Prepare only the four-file candidate
        working-directory: build
        run: bash "$EVIDENCE/scripts/prepare.sh"
      - name: Focused positive and wrong-implementation proof
        working-directory: build
        run: bash "$EVIDENCE/scripts/test.sh"
      - name: Measure real candidate CLI and preserve output contracts
        working-directory: build
        run: bash "$EVIDENCE/scripts/measure.sh"
      - name: Publish only the qualified candidate branch
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/scripts/publish.sh"
      - name: Retain bounded native proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: empty-stub-scope-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/empty-stub-scope-proof/scripts/*
            ${{ runner.temp }}/empty-stub-scope-proof/*.txt
            ${{ runner.temp }}/empty-stub-scope-proof/*.json
            ${{ runner.temp }}/empty-stub-scope-proof/*.sha
            ${{ runner.temp }}/empty-stub-scope-proof/*.tree
            ${{ runner.temp }}/empty-stub-scope-proof/*.patch
            ${{ runner.temp }}/empty-stub-scope-proof/*.diff
            ${{ runner.temp }}/empty-stub-scope-proof/*.command
            ${{ runner.temp }}/empty-stub-scope-proof/*.stdout
            ${{ runner.temp }}/empty-stub-scope-proof/*.stderr
          if-no-files-found: error
          retention-days: 14
