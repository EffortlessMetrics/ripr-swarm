# SOURCE-ONLY WORKFLOW (policy/source-only-workflows.toml).
# Origin: EffortlessMetrics/ripr `.github/workflows/source-promotion-composition.yml`
# at 4bfb2ea14d (landed in EffortlessMetrics/ripr#1903; Nov 21 hosted canary
# receipts retained in EffortlessMetrics/ripr#1893: runs 44912512043,
# 44912789397, 44896760529, 44896738643).
#
# Produces public ripr's trusted required context `Source Promotion Composition`.
# Default-branch-defined, read-only pull_request_target gate: the workflow
# definition, composition script, and staged-packet verifier come strictly from
# the trusted default-branch commit (`github.sha`); candidate PR code is never
# checked out or executed and no secrets are exposed.
#
# Do NOT add any extra condition after the repository guard in the job-level
# `if:`: GitHub treats a skipped required job as Success (#1893). In
# EffortlessMetrics/ripr the guard is unconditionally true for every PR.
#
# December 2, 2026 pull_request_target policy: GitHub blocks pull_request_target
# by default in public repositories unless an owner-configured Actions event
# policy explicitly allows the specific workflow file
# (`.github/workflows/source-only-promotion-composition.yml` after Option A
# fast-forward; `.github/workflows/source-promotion-composition.yml` before).
#
# Phase 1 (this file): dispatch-only, so landing it in swarm registers the
# workflow without starting Actions (#4842). Phase 2, after the workflow is
# disabled in ripr-swarm, restores the source trigger recorded in the ledger:
#   pull_request_target (opened, synchronize, reopened, edited; branches: [main]).
name: Source Promotion Composition

on:
  workflow_dispatch:
    inputs:
      rehearse_in_swarm:
        description: "Run the trusted composition script and real-Git controls on this repository's dispatched ref as a pre-promotion rehearsal (source-only workflow; see policy/source-only-workflows.toml)"
        type: boolean
        default: false

concurrency:
  group: source-promotion-composition-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  composition-check:
    name: Source Promotion Composition
    if: (github.repository == 'EffortlessMetrics/ripr' || (github.event_name == 'workflow_dispatch' && inputs.rehearse_in_swarm))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted default-branch authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: false

      - name: Rehearse trusted composition script and controls (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          test -f .github/scripts/source-promotion-composition.sh
          bash -n .github/scripts/source-promotion-composition.sh
          python3 -m unittest xtask.tests.source_promotion_composition

      - name: Refetch live PR metadata and classify promotion candidate
        id: live
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREV_PR_BODY: ${{ github.event.changes.body.from }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
          live_base=$(jq -er '.base.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr_json")
          live_head=$(jq -er '.head.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<< "$pr_json")
          live_head_ref=$(jq -er '.head.ref | select(type == "string" and length > 0 and test("^[^\\r\\n]+$"))' <<< "$pr_json")
          live_body_file="$RUNNER_TEMP/live-pr-body.txt"
          jq -r '.body // ""' <<< "$pr_json" > "$live_body_file"
          test "$live_base" = "$EVENT_BASE_SHA" || { echo "source-promotion composition rejected: live PR base moved past event base" >&2; exit 1; }
          test "$live_head" = "$EVENT_HEAD_SHA" || { echo "source-promotion composition rejected: live PR head moved past event head" >&2; exit 1; }
          live_preview=""
          if git fetch --no-tags origin "refs/pull/${PR_NUMBER}/merge" >/dev/null 2>&1; then
            live_preview=$(git --no-replace-objects rev-parse 'FETCH_HEAD^{commit}' 2>/dev/null || true)
          fi
          is_promotion=false
          live_body=$(tr -d '\r' < "$live_body_file")
          prev_body=${PREV_PR_BODY//$'\r'/}
          if [[ "$live_head_ref" == promote/0.11.0-* ]] || [[ "$live_body" == *'<!-- source-promotion: true -->'* ]] || [[ "$live_body" == *'<!-- source-promotion-control:'* ]] || [[ "$prev_body" == *'<!-- source-promotion: true -->'* ]] || [[ "$prev_body" == *'<!-- source-promotion-control:'* ]]; then
            is_promotion=true
          fi
          {
            echo "base_sha=$live_base"
            echo "head_sha=$live_head"
            echo "head_ref=$live_head_ref"
            echo "merge_sha=$live_preview"
            echo "body_file=$live_body_file"
            echo "is_promotion=$is_promotion"
          } >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain for promotion verification
        if: github.event_name != 'workflow_dispatch' && steps.live.outputs.is_promotion == 'true'
        uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - name: Build trusted staged verifier from default-branch checkout
        id: build-verifier
        if: github.event_name != 'workflow_dispatch' && steps.live.outputs.is_promotion == 'true'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          target_dir="$RUNNER_TEMP/ripr-staged-verifier-target"
          CARGO_TARGET_DIR="$target_dir" cargo build --locked -p xtask --bin xtask
          verifier="$target_dir/debug/xtask"
          test -x "$verifier"
          echo "bin=$verifier" >> "$GITHUB_OUTPUT"

      - name: Verify promotion merge composition from trusted base script
        id: verify
        if: github.event_name != 'workflow_dispatch'
        env:
          PR_BODY_FILE: ${{ steps.live.outputs.body_file }}
          PREV_PR_BODY: ${{ github.event.changes.body.from }}
          HEAD_REF: ${{ steps.live.outputs.head_ref }}
          BASE_SHA: ${{ steps.live.outputs.base_sha }}
          HEAD_SHA: ${{ steps.live.outputs.head_sha }}
          MERGE_SHA: ${{ steps.live.outputs.merge_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WORKFLOW_SOURCE_SHA: ${{ github.sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          EVENT_NAME: ${{ github.event_name }}
          REQUIRE_TRUSTED_EVENT: "1"
          REQUIRE_STAGED_PACKET: ${{ steps.live.outputs.is_promotion == 'true' && '1' || '0' }}
          STAGED_VERIFIER_BIN: ${{ steps.build-verifier.outputs.bin }}
          TOKEN_PERMISSIONS: "contents:read,pull-requests:read"
          COMPOSITION_RECEIPT_OUT: ${{ runner.temp }}/source-promotion-composition-receipt.json
        run: |
          set -euo pipefail
          PR_BODY=$(cat "$PR_BODY_FILE")
          export PR_BODY
          bash .github/scripts/source-promotion-composition.sh
          if test -f "$COMPOSITION_RECEIPT_OUT"; then
            {
              echo "## Source Promotion Composition Gate (#1893)"
              echo ""
              echo '```json'
              cat "$COMPOSITION_RECEIPT_OUT"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload trusted composition receipt
        if: always() && github.event_name != 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-promotion-composition-receipt-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/source-promotion-composition-receipt.json
          if-no-files-found: ignore
