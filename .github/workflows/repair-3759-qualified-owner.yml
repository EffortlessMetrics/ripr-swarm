name: Repair 3759 qualified owner binding

on:
  push:
    branches:
      - fix/1714-match-arm-pattern-identity

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/1714-match-arm-pattern-identity
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and apply bounded repair
        shell: bash
        run: |
          set -euo pipefail
          expected_parent=acece4e8f064ccb0cbcfca09325a41c7e5272263
          workflow=.github/workflows/repair-3759-qualified-owner.yml

          actual_parent="$(git rev-parse HEAD^)"
          changed="$(git diff --name-only "$expected_parent"..HEAD)"
          printf 'repair head=%s parent=%s changed=%s\n' "$(git rev-parse HEAD)" "$actual_parent" "$changed"
          test "$actual_parent" = "$expected_parent"
          test "$changed" = "$workflow"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main

          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/ripr/src/analysis/classify/reveal.rs")
          text = path.read_text(encoding="utf-8")

          owner_start = text.index("fn owner_call_literals(text: &str, owner: &str) -> Vec<String> {")
          owner_end = text.index("\n/// Returns `(matched, has_token_match)`.", owner_start)
          owner_block = text[owner_start:owner_end]

          anchor = "        let inside_string = spans\n"
          if owner_block.count(anchor) != 1:
              raise SystemExit(f"inside-string owner anchor count: {owner_block.count(anchor)}")
          owner_block = owner_block.replace(
              anchor,
              "        let preceded_by_qualifier = text[..absolute]\n"
              "            .chars()\n"
              "            .rev()\n"
              "            .find(|ch| !ch.is_whitespace())\n"
              "            .is_some_and(|ch| matches!(ch, ':' | '.'));\n"
              + anchor,
              1,
          )

          anchor = "        if preceded_by_identifier || inside_string {\n"
          if owner_block.count(anchor) != 1:
              raise SystemExit(f"owner rejection anchor count: {owner_block.count(anchor)}")
          owner_block = owner_block.replace(
              anchor,
              "        if preceded_by_identifier || preceded_by_qualifier || inside_string {\n",
              1,
          )
          text = text[:owner_start] + owner_block + text[owner_end:]

          anchor = "            || !match_arm_literals.is_empty()\n"
          if text.count(anchor) != 1:
              raise SystemExit(f"literal confirmation anchor count: {text.count(anchor)}")
          text = text.replace(
              anchor,
              anchor
              + "                && !import_defeats_owner\n"
              + "                && !cross_package_defeats_owner\n",
              1,
          )

          function = "    fn owner_call_literal_scope_rejects_longer_callee_names() {\n"
          function_start = text.index(function)
          insertion_at = text.index("        assert_eq!(\n", function_start)
          controls = (
              "        assert!(\n"
              "            owner_call_literals(\"assert_eq!(other::route(\\\"sensor\\\"), 1);\", \"route\")\n"
              "                .is_empty()\n"
              "        );\n"
              "        assert!(\n"
              "            owner_call_literals(\"assert_eq!(other :: route(\\\"sensor\\\"), 1);\", \"route\")\n"
              "                .is_empty()\n"
              "        );\n"
              "        assert!(\n"
              "            owner_call_literals(\"assert_eq!(router.route(\\\"sensor\\\"), 1);\", \"route\")\n"
              "                .is_empty()\n"
              "        );\n"
              "        assert!(\n"
              "            owner_call_literals(\"assert_eq!(router . route(\\\"sensor\\\"), 1);\", \"route\")\n"
              "                .is_empty()\n"
              "        );\n"
          )
          text = text[:insertion_at] + controls + text[insertion_at:]

          anchor = (
              "    // Diagnostic text (#1714): a pattern literal appearing only as assertion\n"
              "    // message text is not an owner-supplied input.\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"ambiguity-test insertion anchor count: {text.count(anchor)}")
          ambiguity_test = '''    // A same-name foreign import or package-local definition makes the
    // bare owner call ambiguous. Literal overlap may associate the oracle,
    // but it cannot clear observation_unverified under either defeat.
    #[test]
    fn match_arm_literal_confirmation_respects_owner_ambiguity_gates() {
        let aligned = oracle(
            "assert_eq!(route(\"sensor\"), \"sensor-v2\");",
            OracleKind::ExactValue,
            OracleStrength::Strong,
        );
        let empty = Vec::<String>::new();
        let pattern_literals = vec!["sensor".to_string()];
        let family = ProbeFamily::MatchArm;
        let context = RevealMatchContext {
            probe_tokens: &empty,
            effect_literals: &empty,
            match_arm_variants: &empty,
            match_arm_literals: &pattern_literals,
            error_construction_variant: None,
            family: &family,
            wrapper_seam: false,
            owner_callee: Some("route"),
        };

        for (import_defeats_owner, cross_package_defeats_owner) in
            [(true, false), (false, true), (true, true)]
        {
            let (_, has_token) = assertion_matches_probe_detail_with_literals(
                &context,
                &aligned,
                2,
                import_defeats_owner,
                cross_package_defeats_owner,
            );
            assert!(
                !has_token,
                "ambiguous owner binding unexpectedly confirmed: import={import_defeats_owner} cross_package={cross_package_defeats_owner}"
            );
        }

        let (_, has_token) =
            assertion_matches_probe_detail_with_literals(&context, &aligned, 2, false, false);
        assert!(has_token, "unambiguous bare owner call must still confirm");
    }

'''
          text = text.replace(anchor, ambiguity_test + anchor, 1)

          path.write_text(text, encoding="utf-8")
          PY

          cargo fmt --all
          cargo test -p ripr owner_call_literal_scope_rejects_longer_callee_names
          cargo test -p ripr match_arm_literal_confirmation_respects_owner_ambiguity_gates
          cargo test -p ripr --test match_arm_pattern_identity

          git rm "$workflow"
          git add crates/ripr/src/analysis/classify/reveal.rs
          git diff --check --cached
          git commit -m "fix(rust): reject ambiguous match-arm owner calls"
          git push origin HEAD:fix/1714-match-arm-pattern-identity
