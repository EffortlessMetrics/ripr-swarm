name: Windows Advisory Shards

# Manual sharded form of the Windows workspace test (#9272). The single-job
# lane in windows-advisory.yml needs a 75-minute step cap for one
# `cargo test --workspace`; this splits the same tests with nextest's
# deterministic partitioning so each shard is a separate, shorter job and a
# failing test names its shard. It is advisory evidence only: it does not
# replace the required Linux gates and is not wired to pull_request events.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional exact commit to test instead of the dispatched ref's head (40 hexadecimal characters; release candidate, #2769)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-shard:
    name: windows-shard-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 80
    env:
      # Half the default build and test parallelism (#12338): 0 wedges in 80
      # shard-jobs at this setting vs 12 in 152 (7.9%) at the default.
      CARGO_BUILD_JOBS: "2"
      # Tests that need a real NTFS deny ACL (#9688). Git for Windows bash enables
      # SeBackupPrivilege and SeRestorePrivilege and every child inherits them,
      # which bypass an icacls (AD) deny, so they run in the pwsh step below.
      ACL_TESTS: test(/denies_creation|denying_subdirectories|real_unreadable_subtree/)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Elapsed-time base for the remaining-time watchdog (#12338). Written to
      # GITHUB_ENV so checkout cannot wipe it.
      - name: Record job start
        shell: bash
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # Full history, like the Linux test lanes: base-resolving tests refuse
      # on a shallow clone (#10344).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0

      - name: Install CI tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-windows-advisory-1.95-${{ runner.os }}
          save-if: false

      - name: Prepare locked owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml

      - name: Prepare locked JSON owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml

      - name: Prepare locked proptest profile dependencies
        run: cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      # The policy tests spawn `cargo test --no-run -p xtask` themselves. That
      # invocation unifies features differently from `nextest --workspace`, so on a
      # cold runner it rebuilds about six minutes of dependencies inside a test
      # (and the 6-minute kill fires). Running the same spawns here warms them.
      #
      # `check-covered-by` alone is not enough (#12035): `check-file-policy`,
      # which `policy_checker_facade_runs_current_repo_checks` runs, issues
      # combined `cargo test --no-run` builds, one per package set (`-p xtask`
      # and `-p ripr`, #12245), that `check-covered-by` never makes. Measured
      # on windows-latest after `check-covered-by` had run twice, before the
      # per-package split: first `check-file-policy` 745 s, second 175 s, and
      # the facade test 140 s once warm. Left cold, that first build ran
      # inside the test and hit its 300 s child cap.
      - name: Warm the cargo builds the policy tests spawn
        timeout-minutes: 45
        shell: bash
        run: |
          cargo xtask check-covered-by
          cargo xtask check-file-policy

      # Nested-build tests (#10847). nextest runs every test in its own process,
      # so the build memoized in a OnceLock (`candidate_binary` in
      # xtask/tests/common/ripr_help.rs, `ripr_fixture_binary` in
      # xtask/src/reports/fixtures.rs) is paid once per test, not once per run.
      # On a cold runner the first of those `cargo build -p ripr` calls compiles
      # the whole crate (the guide contract uses `--jobs 1`) while every other
      # such test, and the policy tests' own cargo spawns, block on the target
      # directory lock until the 360 s kill fires (run 41258971406: 10 TIMEOUT
      # rows, all nested cargo). Building the same default-feature ripr here,
      # before the clock starts on any test, leaves each spawn a no-op build.
      - name: Warm the ripr build the nested-cargo tests spawn
        timeout-minutes: 25
        shell: bash
        run: cargo build -p ripr --locked

      # File redirect, not `| tee`: see windows-advisory.yml. The shard's real
      # cargo status is recorded so a failed test still fails the job, and the log
      # is uploaded even when it does. The log is also streamed to the step output
      # as nextest writes it (`tail -F`, which also waits for the file; stopped after
      # the status is recorded), and the Summarize and Upload steps run under `always()`.
      # A 44-minute watchdog is not enough when warmup has already spent most of the
      # 80-minute job cap: shard 3 of runs 39854834481 and 41359717895 outlived the
      # watchdog, the 55-minute step cap, and was cancelled at 1h20m with no log
      # (#12338). The watchdog now takes min(44 min, time left before the job cap
      # minus an 8-minute summarize/upload reserve) and writes a heartbeat of the
      # latest SLOW/TIMEOUT/FAIL rows so a hang names an in-flight test before the
      # runner tears the job down. The MSYS PID of the background job is not a
      # native PID. Only a PID read from /proc/<pid>/winpid reaches taskkill; with
      # no mapping the watchdog records that and kills the MSYS job only.
      #
      # Two nextest runs per shard, `-p xtask` then `--workspace --exclude xtask`
      # (#12245). A build that selects `ripr` in test mode and an xtask-only build
      # leave Cargo's fingerprints in different states, so each alternation
      # recompiles the `xtask` binary (about 83 s) and some dependencies. One
      # workspace run left the facade test's own `cargo test -p xtask` spawns to
      # pay that inside the capped test. Running `-p xtask` first keeps those
      # spawns in the state nextest built. The workspace run goes last because
      # the real-ACL step below builds `--workspace` and timed out at 20 minutes
      # when `-p xtask` was last (run 41448247627). Each run is partitioned by
      # `count:$shard/4`, so the four shards still cover every test once.
      - name: Run workspace tests (shard ${{ matrix.shard }} of 4)
        timeout-minutes: 55
        shell: bash
        env:
          # Below the 360 s nextest terminate (.config/nextest.toml), so a stalled
          # child tool build fails with its own captured stderr instead of an
          # anonymous TIMEOUT row (#12035).
          RIPR_TOOL_BUILD_TIMEOUT_SECS: "300"
        run: |
          mkdir -p target
          shard=${{ matrix.shard }}
          : "${JOB_CAP_SECS:=4800}" "${UPLOAD_RESERVE_SECS:=480}" "${WATCHDOG_POLLS:=264}" "${POLL_SECS:=10}"
          start=${JOB_START:-$(date +%s)}; remain=$((JOB_CAP_SECS - ($(date +%s) - start) - UPLOAD_RESERVE_SECS)); [ "$remain" -ge "$POLL_SECS" ] || remain=$POLL_SECS; polls=$(( (remain + POLL_SECS - 1) / POLL_SECS )); [ "$polls" -le "$WATCHDOG_POLLS" ] || polls=$WATCHDOG_POLLS
          deadline=$(( $(date +%s) + polls * POLL_SECS ))
          bash -c 'rc=0; for pkg in "-p xtask" "--workspace --exclude xtask"; do cargo nextest run --profile windows-advisory $pkg --no-fail-fast --test-threads 2 --partition count:$0/4 -E "not $ACL_TESTS" || rc=$?; done; exit $rc' "$shard" > target/shard-$shard.log 2>&1 &
          nextest_pid=$!
          tail -n +1 -F target/shard-$shard.log &
          tail_pid=$!
          winpid=$(cat "/proc/$nextest_pid/winpid" 2> /dev/null | tr -cd 0-9 || true)
          (
            set +e
            for i in $(seq 1 "$polls"); do
              sleep "$POLL_SECS"
              kill -0 "$nextest_pid" 2> /dev/null || exit 0
              { echo "heartbeat poll=$i/$polls"; sed -E 's/\x1b\[[0-9;]*m//g' target/shard-$shard.log 2>/dev/null | grep -aE "SLOW|TIMEOUT|FAIL" | tail -5; } | tee target/shard-$shard.heartbeat
              # Wall-clock bound: the heartbeat pipeline and slow process spawns make a poll
              # take longer than POLL_SECS, so the count alone would fire late.
              [ "$(date +%s)" -lt "$deadline" ] || break
            done
            if [ -z "$winpid" ]; then
              echo "fired unmapped msys_pid=$nextest_pid; no native PID, no taskkill" > target/shard-$shard.watchdog
              kill -9 "$nextest_pid" > /dev/null 2>&1
            else
              echo "fired winpid=$winpid" > target/shard-$shard.watchdog
              powershell -NoProfile -Command "\$root = $winpid; \$all = Get-CimInstance Win32_Process; \$keep = @(\$root); do { \$new = \$all | Where-Object { \$keep -contains \$_.ParentProcessId -and \$keep -notcontains \$_.ProcessId }; \$keep += \$new.ProcessId } while (\$new); \$all | Where-Object { \$keep -contains \$_.ProcessId } | Select-Object ProcessId,ParentProcessId,Name,CommandLine | Format-List" > target/shard-$shard.processes 2>&1
              taskkill //F //T //PID "$winpid" > /dev/null 2>&1
            fi
          ) &
          watchdog_pid=$!
          set +e
          wait "$nextest_pid"; status=$?
          wait "$watchdog_pid"
          if [ -f target/shard-$shard.watchdog ]; then status=124; fi
          printf '%s\n' "$status" > target/shard-$shard.status
          sleep 5; kill "$tail_pid" > /dev/null 2>&1
          exit "$status"

      # pwsh starts with both privileges disabled and its children inherit that,
      # so the deny is enforced and the tests establish their precondition. A
      # filter that matches nothing makes nextest exit nonzero.
      # Two runs, the same package selections as the shard step above and in the
      # reverse order (#12659). One `--workspace` run unifies features differently
      # from `--workspace --exclude xtask` and rebuilt the workspace for 17 of this
      # step's 20 minutes (run 41458879302), then timed out (run 41508421254). The
      # workspace-minus-xtask run goes first because the shard step ended on it.
      # The ripr tests matching ACL_TESTS and the xtask ones are both non-empty on
      # Windows, so neither run is an empty filter.
      - name: Run the real-ACL tests outside bash (shard 1 only)
        # Skipped once the watchdog fired: the remaining job time is the summarize and
        # upload reserve, which this 20-minute step would otherwise spend (#12338).
        if: ${{ !cancelled() && matrix.shard == 1 && hashFiles('target/shard-1.watchdog') == '' }}
        shell: pwsh
        # A step timeout fails only this step, so the Summarize and Upload steps
        # still run; a stall under the 80-minute job cap would cancel them and
        # lose acl.log.
        timeout-minutes: 20
        run: |
          cargo nextest run --profile windows-advisory --workspace --exclude xtask --no-fail-fast -E $env:ACL_TESTS *> target/acl.log
          $code = $LASTEXITCODE
          # A failed spawn leaves $LASTEXITCODE null, which would exit 0.
          if ($null -eq $code) { $code = 1 }
          cargo nextest run --profile windows-advisory -p xtask --no-fail-fast -E $env:ACL_TESTS *>> target/acl.log
          $code2 = $LASTEXITCODE
          if ($null -eq $code2) { $code2 = 1 }
          if ($code -eq 0) { $code = $code2 }
          Set-Content target/acl.status $code
          Get-Content target/acl.log
          exit $code

      # nextest colors its status rows; strip the escapes for the filter only, the
      # uploaded log stays raw.
      - name: Summarize failures
        if: ${{ always() }}
        timeout-minutes: 3
        shell: bash
        run: |
          { echo "### Shard ${{ matrix.shard }} of 4"; echo "cargo nextest exit status: $(cat target/shard-${{ matrix.shard }}.status 2>/dev/null || echo missing)"; echo "heartbeat: $(tr '\n' ' | ' < target/shard-${{ matrix.shard }}.heartbeat 2>/dev/null || echo missing)"; echo; echo '```'; sed -E 's/\x1b\[[0-9;]*m//g' target/shard-${{ matrix.shard }}.log 2>/dev/null | grep -aE "^\s*(FAIL|SIGABRT|SIGSEGV|TIMEOUT|LEAK)|Summary" | sort -u | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # The real-ACL step (shard 1 only) is reported on its own so an ACL-only failure still names its rows.
          [ ! -f target/acl.status ] || { echo "### Real-ACL tests (pwsh, shard 1)"; echo "cargo nextest exit status: $(cat target/acl.status)"; echo; echo '```'; sed -E 's/\x1b\[[0-9;]*m//g' target/acl.log | grep -aE "^\s*(FAIL|SIGABRT|SIGSEGV|TIMEOUT|LEAK)|Summary" | sort -u | head -20; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload shard logs
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shard-${{ matrix.shard }}
          path: |
            target/shard-${{ matrix.shard }}.log
            target/shard-${{ matrix.shard }}.status
            target/shard-${{ matrix.shard }}.watchdog
            target/shard-${{ matrix.shard }}.processes
            target/shard-${{ matrix.shard }}.heartbeat
            target/acl.log
            target/acl.status
          if-no-files-found: warn
          retention-days: 7

  windows-doctests:
    name: windows-doctests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-windows-advisory-1.95-${{ runner.os }}
          save-if: false

      - name: Run workspace doctests
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p target; set +e; cargo test --workspace --doc --no-fail-fast > target/windows-doctests.log 2>&1; status=$?; printf '%s\n' "$status" > target/windows-doctests.status; cat target/windows-doctests.log; exit "$status"

      - name: Upload doctest logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-doctests
          path: |
            target/windows-doctests.log
            target/windows-doctests.status
          if-no-files-found: warn
          retention-days: 7
