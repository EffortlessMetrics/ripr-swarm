name: Windows Advisory Shards

# Manual sharded form of the Windows workspace test (#9272). The single-job
# lane in windows-advisory.yml needs a 75-minute step cap for one
# `cargo test --workspace`; this splits the same tests with nextest's
# deterministic partitioning so each shard is a separate, shorter job and a
# failing test names its shard. It is advisory evidence only: it does not
# replace the required Linux gates and is not wired to pull_request events.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-shard:
    name: windows-shard-${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0

      - name: Install CI tools
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-windows-advisory-1.95-${{ runner.os }}
          save-if: false

      - name: Prepare locked owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml

      - name: Prepare locked JSON owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml

      - name: Probe inner cargo build vs nextest build
        timeout-minutes: 40
        shell: bash
        run: |
          set +e
          cargo nextest run --profile windows-advisory --workspace --no-run 2>&1 | tail -3
          echo "=== inner enumeration (as the test wrapper runs it)"
          time (cargo test --no-run -p xtask --locked --offline 2>&1 | grep -aE "Compiling|Finished|error|Blocking|Locking" | head -40)
          echo "=== run the two hanging tests alone, 6 min kill"
          cargo nextest run --profile windows-advisory --workspace --no-capture -E 'test(test_covered_by_production_wrapper_enumerates_through_cargo) | test(policy_checker_facade_runs_current_repo_checks)' 2>&1 | tail -60
          exit 0

  windows-doctests:
    name: windows-doctests
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ripr-windows-advisory-1.95-${{ runner.os }}
          save-if: false

      - name: Run workspace doctests
        timeout-minutes: 30
        shell: bash
        run: |
          mkdir -p target; set +e; cargo test --workspace --doc --no-fail-fast > target/windows-doctests.log 2>&1; status=$?; printf '%s\n' "$status" > target/windows-doctests.status; cat target/windows-doctests.log; exit "$status"

      - name: Upload doctest logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-doctests
          path: |
            target/windows-doctests.log
            target/windows-doctests.status
          if-no-files-found: warn
          retention-days: 7
