name: Implement npm bump-version integration v2

on:
  push:
    branches:
      - build/4776-npm-bump-version
    paths:
      - .github/workflows/branch-implement-4776-v2.yml

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.repository == 'EffortlessMetrics/ripr-swarm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: build/4776-npm-bump-version

      - name: Extend the atomic version transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          distribution = Path("xtask/src/policy/distribution/mod.rs")
          text = distribution.read_text(encoding="utf-8")
          parse_anchor = '''pub(crate) fn parse_distribution_contract(
              path: &str,
              text: &str,
          ) -> Result<DistributionContract, String> {
              contract::parse_distribution_contract(path, text)
          }
          '''
          validator = '''
          pub(crate) fn validate_npm_launcher_manifest(
              path: &str,
              text: &str,
              workspace_version: &str,
              contract: &DistributionContract,
          ) -> Result<(), String> {
              let mut violations = Vec::new();
              npm_launcher::validate_launcher(
                  path,
                  text,
                  workspace_version,
                  contract,
                  &mut violations,
              );
              if violations.is_empty() {
                  Ok(())
              } else {
                  Err(violations.join("\\n"))
              }
          }
          '''
          if "pub(crate) fn validate_npm_launcher_manifest(" not in text:
              if text.count(parse_anchor) != 1:
                  raise SystemExit("distribution parser anchor drifted")
              text = text.replace(parse_anchor, parse_anchor + validator, 1)
              distribution.write_text(text, encoding="utf-8")

          version = Path("xtask/src/version.rs")
          text = version.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label} anchor count={count}")
              text = text.replace(old, new, 1)

          replace_once(
              'const EXTENSION_LOCKFILE: &str = "editors/vscode/package-lock.json";\n',
              'const EXTENSION_LOCKFILE: &str = "editors/vscode/package-lock.json";\nconst NPM_LAUNCHER_MANIFEST: &str = "packaging/npm/launcher/package.json";\n',
              "launcher constant",
          )

          replace_once(
              '''    let lockfile = read_file(EXTENSION_LOCKFILE)?;
              let update = prepare_update(&workspace, &extension, &lockfile, version)?;
          ''',
              '''    let lockfile = read_file(EXTENSION_LOCKFILE)?;
              let launcher = read_file(NPM_LAUNCHER_MANIFEST)?;
              let contract = crate::policy::distribution::load_distribution_contract()?;
              let update = prepare_release_update(
                  &workspace,
                  &extension,
                  &lockfile,
                  &launcher,
                  version,
                  &contract,
              )?;
          ''',
              "bump preparation",
          )

          replace_once(
              '''        Path::new(EXTENSION_LOCKFILE),
              ];
              let originals = [&workspace, &extension, &lockfile];
              let updated = [&update.workspace, &update.extension, &update.lockfile];
          ''',
              '''        Path::new(EXTENSION_LOCKFILE),
                  Path::new(NPM_LAUNCHER_MANIFEST),
              ];
              let originals = [&workspace, &extension, &lockfile, &launcher];
              let updated = [
                  &update.base.workspace,
                  &update.base.extension,
                  &update.base.lockfile,
                  &update.launcher,
              ];
          ''',
              "transaction paths",
          )

          replace_once(
              '''    if let Err(error) = cargo_metadata_validation() {
                  let rollback = restore_files(&paths, &originals);
                  return Err(format!(
                      "version bump was rolled back because Cargo validation failed: {error}{rollback}"
                  ));
              }

              println!(
                  "updated release version {} -> {} in {WORKSPACE_MANIFEST}, {EXTENSION_MANIFEST}, and {EXTENSION_LOCKFILE}",
                  update.old_version, version
              );
          ''',
              '''    if let Err(error) = validate_release_tree(version, &contract) {
                  let rollback = restore_files(&paths, &originals);
                  return Err(format!(
                      "version bump was rolled back because release validation failed: {error}{rollback}"
                  ));
              }

              println!(
                  "updated release version {} -> {} in {WORKSPACE_MANIFEST}, {EXTENSION_MANIFEST}, {EXTENSION_LOCKFILE}, and {NPM_LAUNCHER_MANIFEST}",
                  update.base.old_version, version
              );
          ''',
              "post-write validation",
          )

          struct_anchor = '''struct VersionUpdate {
              old_version: String,
              workspace: String,
              extension: String,
              lockfile: String,
          }

          fn prepare_update(
          '''
          release_struct = '''struct VersionUpdate {
              old_version: String,
              workspace: String,
              extension: String,
              lockfile: String,
          }

          #[derive(Debug, PartialEq, Eq)]
          struct ReleaseVersionUpdate {
              base: VersionUpdate,
              launcher: String,
          }

          fn prepare_release_update(
              workspace: &str,
              extension: &str,
              lockfile: &str,
              launcher: &str,
              new_version: &str,
              contract: &crate::policy::distribution::DistributionContract,
          ) -> Result<ReleaseVersionUpdate, String> {
              let current_workspace = section_version(workspace, "workspace.package")?;
              crate::policy::distribution::validate_npm_launcher_manifest(
                  NPM_LAUNCHER_MANIFEST,
                  launcher,
                  &current_workspace,
                  contract,
              )?;
              let base = prepare_update(workspace, extension, lockfile, new_version)?;
              let updated_launcher = replace_npm_launcher_versions(
                  launcher,
                  &base.old_version,
                  new_version,
                  contract,
              )?;
              crate::policy::distribution::validate_npm_launcher_manifest(
                  NPM_LAUNCHER_MANIFEST,
                  &updated_launcher,
                  new_version,
                  contract,
              )?;
              Ok(ReleaseVersionUpdate {
                  base,
                  launcher: updated_launcher,
              })
          }

          fn prepare_update(
          '''
          replace_once(struct_anchor, release_struct, "release update struct")

          helper_anchor = '''fn verify_updated_json(
          '''
          helpers = '''fn replace_npm_launcher_versions(
              text: &str,
              old_version: &str,
              new_version: &str,
              contract: &crate::policy::distribution::DistributionContract,
          ) -> Result<String, String> {
              let mut updated =
                  replace_json_version_lines(text, old_version, new_version, 1)?;
              for target in &contract.target {
                  updated = replace_named_json_string(
                      &updated,
                      NPM_LAUNCHER_MANIFEST,
                      &target.npm_package,
                      old_version,
                      new_version,
                  )?;
              }
              Ok(updated)
          }

          fn replace_named_json_string(
              text: &str,
              path: &str,
              field: &str,
              old_value: &str,
              new_value: &str,
          ) -> Result<String, String> {
              let quoted_field = format!("\\\"{field}\\\"");
              let mut output = String::with_capacity(text.len() + new_value.len());
              let mut replaced = 0;
              for line in text.split_inclusive('\\n') {
                  let Some(colon) = line.find(':') else {
                      output.push_str(line);
                      continue;
                  };
                  if line[..colon].trim() != quoted_field {
                      output.push_str(line);
                      continue;
                  }
                  let value_start = line[colon + 1..]
                      .find('\\\"')
                      .map(|offset| colon + 1 + offset + 1)
                      .ok_or_else(|| format!("{path}: {field} has no quoted value"))?;
                  let value_end = line[value_start..]
                      .find('\\\"')
                      .map(|offset| value_start + offset)
                      .ok_or_else(|| format!("{path}: {field} has no closing quote"))?;
                  if &line[value_start..value_end] != old_value {
                      return Err(format!(
                          "{path}: expected {field} version {old_value:?}, found {:?}",
                          &line[value_start..value_end]
                      ));
                  }
                  output.push_str(&line[..value_start]);
                  output.push_str(new_value);
                  output.push_str(&line[value_end..]);
                  replaced += 1;
              }
              if replaced != 1 {
                  return Err(format!(
                      "{path}: expected one {field} string field, replaced {replaced}"
                  ));
              }
              Ok(output)
          }

          '''
          if "fn replace_npm_launcher_versions(" not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit("launcher helper anchor drifted")
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          read_anchor = '''fn read_file(path: &str) -> Result<String, String> {
          '''
          validation = '''fn validate_release_tree(
              expected: &str,
              contract: &crate::policy::distribution::DistributionContract,
          ) -> Result<(), String> {
              cargo_metadata_validation()?;
              let workspace = read_file(WORKSPACE_MANIFEST)?;
              let extension = read_file(EXTENSION_MANIFEST)?;
              let lockfile = read_file(EXTENSION_LOCKFILE)?;
              let launcher = read_file(NPM_LAUNCHER_MANIFEST)?;
              let workspace_version = section_version(&workspace, "workspace.package")?;
              if workspace_version != expected {
                  return Err(format!(
                      "{WORKSPACE_MANIFEST} did not update to {expected}; got {workspace_version}"
                  ));
              }
              verify_updated_json(&extension, EXTENSION_MANIFEST, expected, 1)?;
              verify_updated_lockfile(&lockfile, expected)?;
              crate::policy::distribution::validate_npm_launcher_manifest(
                  NPM_LAUNCHER_MANIFEST,
                  &launcher,
                  expected,
                  contract,
              )
          }

          '''
          if "fn validate_release_tree(" not in text:
              if text.count(read_anchor) != 1:
                  raise SystemExit("release validation anchor drifted")
              text = text.replace(read_anchor, validation + read_anchor, 1)

          fixture_anchor = '''            fs::create_dir_all(root.join("editors/vscode")).map_err(|error| error.to_string())?;
          '''
          fixture_insert = '''            fs::create_dir_all(root.join("editors/vscode")).map_err(|error| error.to_string())?;
                  fs::create_dir_all(root.join("packaging/npm/launcher"))
                      .map_err(|error| error.to_string())?;
                  fs::create_dir_all(root.join("policy")).map_err(|error| error.to_string())?;
                  fs::write(
                      root.join("policy/distribution.toml"),
                      include_str!("../../policy/distribution.toml"),
                  )
                  .map_err(|error| error.to_string())?;
                  let launcher = include_str!("../../packaging/npm/launcher/package.json")
                      .replace("\\\"0.11.0\\\"", "\\\"0.10.0\\\"");
                  fs::write(root.join(NPM_LAUNCHER_MANIFEST), launcher)
                      .map_err(|error| error.to_string())?;
          '''
          replace_once(fixture_anchor, fixture_insert, "fixture setup")

          fixture_read_anchor = '''            let lockfile = fs::read_to_string(root.join(EXTENSION_LOCKFILE))
                      .map_err(|error| error.to_string())?;
                  if !workspace.contains("version = \\\"0.11.0\\\"")
                      || !extension.contains("\\\"version\\\": \\\"0.11.0\\\"")
                      || lockfile.matches("\\\"version\\\": \\\"0.11.0\\\"").count() != 2
                  {
          '''
          fixture_read_new = '''            let lockfile = fs::read_to_string(root.join(EXTENSION_LOCKFILE))
                      .map_err(|error| error.to_string())?;
                  let launcher = fs::read_to_string(root.join(NPM_LAUNCHER_MANIFEST))
                      .map_err(|error| error.to_string())?;
                  if !workspace.contains("version = \\\"0.11.0\\\"")
                      || !extension.contains("\\\"version\\\": \\\"0.11.0\\\"")
                      || lockfile.matches("\\\"version\\\": \\\"0.11.0\\\"").count() != 2
                      || launcher.matches("\\\"0.11.0\\\"").count() != 6
                  {
          '''
          replace_once(fixture_read_anchor, fixture_read_new, "fixture assertions")

          extra_tests = '''

          #[cfg(test)]
          mod npm_launcher_version_tests {
              use super::{
                  NPM_LAUNCHER_MANIFEST, prepare_release_update,
                  replace_npm_launcher_versions,
              };

              const CONTRACT: &str = include_str!("../../policy/distribution.toml");
              const LAUNCHER: &str = include_str!("../../packaging/npm/launcher/package.json");

              fn contract() -> Result<crate::policy::distribution::DistributionContract, String> {
                  crate::policy::distribution::parse_distribution_contract(
                      "policy/distribution.toml",
                      CONTRACT,
                  )
              }

              fn launcher(version: &str) -> String {
                  LAUNCHER.replace("\\\"0.11.0\\\"", &format!("\\\"{version}\\\""))
              }

              #[test]
              fn updates_launcher_root_and_all_exact_payload_versions() -> Result<(), String> {
                  let contract = contract()?;
                  let original = launcher("0.10.0");
                  let updated = replace_npm_launcher_versions(
                      &original,
                      "0.10.0",
                      "0.11.0",
                      &contract,
                  )?;
                  if updated.matches("\\\"0.11.0\\\"").count() != 6
                      || updated.contains("\\\"0.10.0\\\"")
                      || !updated.contains("\\\"access\\\": \\\"public\\\"")
                      || !updated.contains("\\\"node\\\": \\\">=20\\\"")
                  {
                      return Err("launcher version update changed an unrelated field".to_string());
                  }
                  crate::policy::distribution::validate_npm_launcher_manifest(
                      NPM_LAUNCHER_MANIFEST,
                      &updated,
                      "0.11.0",
                      &contract,
                  )
              }

              #[test]
              fn rejects_launcher_version_range_before_writing() -> Result<(), String> {
                  let contract = contract()?;
                  let launcher = launcher("0.10.0").replacen(
                      "\\\"@effortlessmetrics/ripr-darwin-arm64\\\": \\\"0.10.0\\\"",
                      "\\\"@effortlessmetrics/ripr-darwin-arm64\\\": \\\"^0.10.0\\\"",
                      1,
                  );
                  let error = prepare_release_update(
                      "[workspace.package]\\nversion = \\\"0.10.0\\\"\\n",
                      "{\\\"version\\\":\\\"0.10.0\\\"}",
                      "{\\\"version\\\":\\\"0.10.0\\\",\\\"packages\\\":{\\\"\\\":{\\\"version\\\":\\\"0.10.0\\\"}}}",
                      &launcher,
                      "0.11.0",
                      &contract,
                  )
                  .err()
                  .ok_or_else(|| "launcher dependency range was accepted".to_string())?;
                  if !error.contains("optionalDependencies must equal the five exact-version native packages") {
                      return Err(format!("unexpected launcher drift error: {error}"));
                  }
                  Ok(())
              }
          }
          '''
          if "mod npm_launcher_version_tests" not in text:
              text = text.rstrip() + extra_tests + "\n"

          version.write_text(text, encoding="utf-8")
          PY

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and test the transaction
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p xtask --locked version:: -- --nocapture
          cargo xtask check-release-targets

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtask/src/version.rs xtask/src/policy/distribution/mod.rs
          git diff --cached --check
          git commit -m "build(distribution): bump npm launcher versions atomically (#4776)"
          git push origin HEAD:build/4776-npm-bump-version
