name: Prove hosted queue reconciliation with current main

on:
  push:
    branches: [codex/4838-hosted-main-reconcile-20261112]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout rehearsal history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: codex/4838-hosted-main-reconcile-20261112
          fetch-depth: 0
          persist-credentials: true

      - name: Construct exact two-parent reconciliation
        id: construct
        shell: bash
        env:
          HOSTED_SOURCE: 50d9bb94921b0f4f7b3d840093a596eed7059852
          EXPECTED_MAIN: c5d50a38ba94799d6da3954fef004839fae5489c
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HOSTED_SOURCE" HEAD
          git fetch --no-tags origin main
          actual_main="$(git rev-parse FETCH_HEAD)"
          [ "$actual_main" = "$EXPECTED_MAIN" ] || {
            echo "::error::protected main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }

          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git config merge.conflictstyle diff3
          git checkout --detach "$HOSTED_SOURCE"
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_status=$?
          set -e
          [ "$merge_status" -ne 0 ] || {
            echo "::error::expected the reviewed four-file conflict set"
            git merge --abort
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          choices = {
              '.github/actions/pr-candidate-admission/review_disposition.py': 'ours',
              '.github/workflows/routed-rust.yml': 'ours',
              'tools/repo-policy/tests/review_disposition_admission.rs': 'ours',
              'xtask/tests/rust_gate_workflow_contract.rs': 'theirs',
          }
          actual = [line for line in subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines() if line]
          if actual != list(choices):
              raise SystemExit(f'conflict set changed: expected={list(choices)!r} actual={actual!r}')

          def resolve_diff3(text: str, side: str) -> str:
              lines = text.splitlines(keepends=True)
              out: list[str] = []
              index = 0
              conflicts = 0
              while index < len(lines):
                  if not lines[index].startswith('<<<<<<< '):
                      out.append(lines[index])
                      index += 1
                      continue
                  conflicts += 1
                  index += 1
                  ours: list[str] = []
                  while index < len(lines) and not lines[index].startswith('||||||| '):
                      ours.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise SystemExit('missing diff3 base marker')
                  index += 1
                  while index < len(lines) and not lines[index].startswith('======='):
                      index += 1
                  if index >= len(lines):
                      raise SystemExit('missing conflict separator')
                  index += 1
                  theirs: list[str] = []
                  while index < len(lines) and not lines[index].startswith('>>>>>>> '):
                      theirs.append(lines[index])
                      index += 1
                  if index >= len(lines):
                      raise SystemExit('missing conflict end marker')
                  index += 1
                  out.extend(ours if side == 'ours' else theirs)
              if conflicts == 0:
                  raise SystemExit('expected at least one conflict marker')
              resolved = ''.join(out)
              if any(marker in resolved for marker in ('<<<<<<< ', '||||||| ', '=======', '>>>>>>> ')):
                  raise SystemExit('conflict marker remained after resolution')
              return resolved

          for relative, side in choices.items():
              path = Path(relative)
              path.write_text(resolve_diff3(path.read_text(encoding='utf-8'), side), encoding='utf-8')
          PY

          git add \
            .github/actions/pr-candidate-admission/review_disposition.py \
            .github/workflows/routed-rust.yml \
            tools/repo-policy/tests/review_disposition_admission.rs \
            xtask/tests/rust_gate_workflow_contract.rs
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Review-disposition self-test
        id: parser
        continue-on-error: true
        run: python3 -I .github/actions/pr-candidate-admission/review_disposition.py --self-test

      - name: Normalize and check formatting
        id: format
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Repository policy test surface
        id: repo_policy
        continue-on-error: true
        run: cargo test --locked -p repo-policy --all-targets

      - name: Affected xtask workflow contracts
        id: xtask_contracts
        continue-on-error: true
        run: cargo test --locked -p xtask --test rust_gate_workflow_contract --test routed_queue_resolution

      - name: Actual workflow checker
        id: workflow_checker
        continue-on-error: true
        run: cargo run --locked -p repo-policy -- check-workflows

      - name: Final tree hygiene
        id: hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test ! -e .github/workflows/reconcile-hosted-queue-main-20261112.yml
          test ! -e .ci/staged/4838-current-main-conflicts-c5d50a38.txt
          test ! -e .ci/staged/4838-conflicts-c5d50a38

      - name: Publish independently passing reconciliation
        id: publish
        if: >-
          steps.construct.outcome == 'success' &&
          steps.parser.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.repo_policy.outcome == 'success' &&
          steps.xtask_contracts.outcome == 'success' &&
          steps.workflow_checker.outcome == 'success' &&
          steps.hygiene.outcome == 'success'
        shell: bash
        env:
          TARGET_REF: refs/heads/codex/4838-hosted-main-reconciled-c5d50a38
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'ci: reconcile hosted queue carrier with current main (#14200)'
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          parents="$(git show -s --format=%P HEAD)"
          echo "RECONCILED_COMMIT=$commit"
          echo "RECONCILED_TREE=$tree"
          echo "RECONCILED_PARENTS=$parents"
          [ "$parents" = "50d9bb94921b0f4f7b3d840093a596eed7059852 c5d50a38ba94799d6da3954fef004839fae5489c" ]

          set +e
          push_output="$(git push origin "HEAD:$TARGET_REF" 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          if [ "$push_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$push_output" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
            echo "Expected workflow-permission refusal after object upload; retain exact commit identity above."
            exit 0
          fi
          exit "$push_status"

      - name: Refuse incomplete reconciliation proof
        if: >-
          always() &&
          (steps.construct.outcome != 'success' ||
           steps.parser.outcome != 'success' ||
           steps.format.outcome != 'success' ||
           steps.repo_policy.outcome != 'success' ||
           steps.xtask_contracts.outcome != 'success' ||
           steps.workflow_checker.outcome != 'success' ||
           steps.hygiene.outcome != 'success')
        shell: bash
        run: |
          echo "construct=${{ steps.construct.outcome }}"
          echo "parser=${{ steps.parser.outcome }}"
          echo "format=${{ steps.format.outcome }}"
          echo "repo_policy=${{ steps.repo_policy.outcome }}"
          echo "xtask_contracts=${{ steps.xtask_contracts.outcome }}"
          echo "workflow_checker=${{ steps.workflow_checker.outcome }}"
          echo "hygiene=${{ steps.hygiene.outcome }}"
          exit 1
