name: Prove hosted queue reconciliation with current main

on:
  push:
    branches: [codex/4838-hosted-main-reconcile-20261112]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout rehearsal history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: codex/4838-hosted-main-reconcile-20261112
          fetch-depth: 0
          persist-credentials: true

      - name: Construct exact two-parent reconciliation
        id: construct
        shell: bash
        env:
          HOSTED_SOURCE: 50d9bb94921b0f4f7b3d840093a596eed7059852
          EXPECTED_MAIN: a4fc05e4c0cb57b204fb78f32bc86e8ef2a5a298
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HOSTED_SOURCE" HEAD
          git fetch --no-tags origin main
          actual_main="$(git rev-parse FETCH_HEAD)"
          [ "$actual_main" = "$EXPECTED_MAIN" ] || {
            echo "::error::protected main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }

          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git checkout --detach "$HOSTED_SOURCE"
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_status=$?
          set -e
          [ "$merge_status" -ne 0 ] || {
            echo "::error::expected the reviewed four-file conflict set"
            git merge --abort
            exit 1
          }

          expected_conflicts="$(cat <<'EOF'
.github/actions/pr-candidate-admission/review_disposition.py
.github/workflows/routed-rust.yml
tools/repo-policy/tests/review_disposition_admission.rs
xtask/tests/rust_gate_workflow_contract.rs
EOF
)"
          actual_conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          [ "$actual_conflicts" = "$expected_conflicts" ] || {
            echo "::error::conflict set changed"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected_conflicts" "$actual_conflicts"
            exit 1
          }

          # These four files form one hosted-only authority generation and its
          # exact tests. Hunk-level resolution admitted non-conflicting pieces of
          # the retired transitional caller and produced a mixed generation.
          # Preserve each complete hosted file, then prove that generation on the
          # full current-main tree.
          while IFS= read -r path; do
            git checkout --ours -- "$path"
            resolved="$(git hash-object --no-filters "$path")"
            expected="$(git rev-parse "$HOSTED_SOURCE:$path")"
            [ "$resolved" = "$expected" ] || {
              echo "::error::$path is not the reviewed hosted blob"
              exit 1
            }
            git add "$path"
          done <<< "$expected_conflicts"
          test -z "$(git diff --name-only --diff-filter=U)"

      - name: Review-disposition self-test
        id: parser
        continue-on-error: true
        run: python3 -I .github/actions/pr-candidate-admission/review_disposition.py --self-test

      - name: Check formatting
        id: format
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: Repository-policy qualification
        id: repo_policy
        continue-on-error: true
        run: >-
          cargo test --locked -p repo-policy
          --test review_disposition_admission
          --test hosted_queue_route
          --test queue_intake
          --test merge_group_subject
          --test queue_composition_acceptance
          --test ci_leaf_contract
          --test printed_command_admission
          --test python_wheel_workflow
          --test rust_gates_admission
          --test rust_gates_admission_replay

      - name: Xtask workflow qualification
        id: xtask_contracts
        continue-on-error: true
        run: >-
          cargo test --locked -p xtask
          --test rust_gate_workflow_contract
          --test routed_queue_resolution
          --test routed_dispatch_result
          --test main_health_sentinel_contract
          --test windows_subset_admission_contract
          --test windows_subset_evidence

      - name: Actual workflow checker
        id: workflow_checker
        continue-on-error: true
        run: cargo run --locked -p repo-policy -- check-workflows

      - name: Final tree hygiene
        id: hygiene
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --cached --check
          git diff --quiet
          test ! -e .github/workflows/reconcile-hosted-queue-main-20261112.yml
          test ! -e .ci/staged/4838-current-main-conflicts-c5d50a38.txt
          test ! -e .ci/staged/4838-conflicts-c5d50a38

      - name: Publish independently passing reconciliation
        id: publish
        if: >-
          steps.construct.outcome == 'success' &&
          steps.parser.outcome == 'success' &&
          steps.format.outcome == 'success' &&
          steps.repo_policy.outcome == 'success' &&
          steps.xtask_contracts.outcome == 'success' &&
          steps.workflow_checker.outcome == 'success' &&
          steps.hygiene.outcome == 'success'
        shell: bash
        env:
          TARGET_REF: refs/heads/codex/4838-hosted-main-reconciled-a4fc05e4
        run: |
          set -euo pipefail
          git commit -m 'ci: reconcile hosted queue carrier with current main (#14200)'
          commit="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          parents="$(git show -s --format=%P HEAD)"
          echo "RECONCILED_COMMIT=$commit"
          echo "RECONCILED_TREE=$tree"
          echo "RECONCILED_PARENTS=$parents"
          {
            echo '### Hosted queue reconciliation'
            echo
            echo "- commit: \`$commit\`"
            echo "- tree: \`$tree\`"
            echo "- parents: \`$parents\`"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$parents" = "50d9bb94921b0f4f7b3d840093a596eed7059852 a4fc05e4c0cb57b204fb78f32bc86e8ef2a5a298" ]

          set +e
          push_output="$(git push origin "HEAD:$TARGET_REF" 2>&1)"
          push_status=$?
          set -e
          printf '%s\n' "$push_output"
          if [ "$push_status" -eq 0 ]; then
            exit 0
          fi
          if printf '%s' "$push_output" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
            echo "Expected workflow-permission refusal after object upload; retain exact commit identity above."
            exit 0
          fi
          exit "$push_status"

      - name: Refuse incomplete reconciliation proof
        if: >-
          always() &&
          (steps.construct.outcome != 'success' ||
           steps.parser.outcome != 'success' ||
           steps.format.outcome != 'success' ||
           steps.repo_policy.outcome != 'success' ||
           steps.xtask_contracts.outcome != 'success' ||
           steps.workflow_checker.outcome != 'success' ||
           steps.hygiene.outcome != 'success')
        shell: bash
        run: |
          echo "construct=${{ steps.construct.outcome }}"
          echo "parser=${{ steps.parser.outcome }}"
          echo "format=${{ steps.format.outcome }}"
          echo "repo_policy=${{ steps.repo_policy.outcome }}"
          echo "xtask_contracts=${{ steps.xtask_contracts.outcome }}"
          echo "workflow_checker=${{ steps.workflow_checker.outcome }}"
          echo "hygiene=${{ steps.hygiene.outcome }}"
          exit 1
