name: Diagnose hosted queue carrier conflicts with current main

on:
  push:
    branches: [codex/4838-hosted-main-reconcile-20261112]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact rehearsal branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: codex/4838-hosted-main-reconcile-20261112
          fetch-depth: 0
          persist-credentials: false

      - name: Reproduce and print bounded diff3 conflicts
        shell: bash
        env:
          HOSTED_SOURCE: 50d9bb94921b0f4f7b3d840093a596eed7059852
          EXPECTED_MAIN: 17076506afc35dfc91b0329e9de8b9391dd02cdb
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HOSTED_SOURCE" HEAD || {
            echo "::error::rehearsal no longer contains the tested hosted source $HOSTED_SOURCE"
            exit 1
          }
          git fetch --no-tags origin main
          actual_main="$(git rev-parse FETCH_HEAD)"
          [ "$actual_main" = "$EXPECTED_MAIN" ] || {
            echo "::error::protected main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }
          git config merge.conflictstyle diff3
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          status=$?
          set -e
          [ "$status" -ne 0 ] || {
            echo "::error::merge unexpectedly became conflict-free; use a proof-and-publish transaction"
            git merge --abort
            exit 1
          }
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              '.github/workflows/main-health-sentinel.yml',
              '.github/workflows/rust-gates.yml',
              'changelog.d/12973-current-main-retirement.md',
              'docs/CI.md',
              'docs/RELEASE_TRANSACTION.md',
              'policy/ci-lane-whitelist.toml',
              'tools/repo-policy/src/queue_workflow.rs',
              'tools/repo-policy/tests/merge_group_subject.rs',
              'tools/repo-policy/tests/review_disposition_admission.rs',
              'xtask/tests/main_health_sentinel_contract.rs',
              'xtask/tests/routed_queue_resolution.rs',
          }
          raw = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          )
          actual = {line for line in raw.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  'conflict set changed: ' + ', '.join(sorted(actual ^ expected))
              )

          for relative in sorted(actual):
              path = Path(relative)
              lines = path.read_text(encoding='utf-8').splitlines()
              marker_indexes = [
                  index for index, line in enumerate(lines)
                  if line.startswith(('<<<<<<< ', '||||||| ', '=======', '>>>>>>> '))
              ]
              print(f'::group::{relative} ({len(marker_indexes)} markers)')
              covered: set[int] = set()
              for marker in marker_indexes:
                  start = max(0, marker - 10)
                  end = min(len(lines), marker + 11)
                  for index in range(start, end):
                      if index in covered:
                          continue
                      covered.add(index)
                      print(f'{index + 1:5}: {lines[index]}')
                  print('-----')
              print('::endgroup::')
          PY
          git merge --abort
