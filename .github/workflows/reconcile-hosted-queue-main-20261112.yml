name: Split hosted queue reconciliation conflicts

on:
  push:
    branches: [codex/4838-hosted-main-reconcile-20261112]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact rehearsal branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: codex/4838-hosted-main-reconcile-20261112
          fetch-depth: 0
          persist-credentials: true

      - name: Split pinned diff3 conflicts into line-addressable files
        shell: bash
        env:
          HOSTED_SOURCE: 50d9bb94921b0f4f7b3d840093a596eed7059852
          EXPECTED_MAIN: c5d50a38ba94799d6da3954fef004839fae5489c
          OUT_DIR: .ci/staged/4838-conflicts-c5d50a38
        run: |
          set -euo pipefail
          if [ -f "$OUT_DIR/04-rust_gate_workflow_contract.rs.txt" ]; then
            echo "Pinned split conflict diagnostics already materialized."
            exit 0
          fi

          git merge-base --is-ancestor "$HOSTED_SOURCE" HEAD || {
            echo "::error::rehearsal no longer contains tested hosted source $HOSTED_SOURCE"
            exit 1
          }
          git fetch --no-tags origin main
          actual_main="$(git rev-parse FETCH_HEAD)"
          [ "$actual_main" = "$EXPECTED_MAIN" ] || {
            echo "::error::protected main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }

          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git config merge.conflictstyle diff3
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_status=$?
          set -e
          [ "$merge_status" -ne 0 ] || {
            echo "::error::merge unexpectedly became conflict-free"
            git merge --abort
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          items = [
              ('.github/actions/pr-candidate-admission/review_disposition.py', '01-review_disposition.py.txt'),
              ('.github/workflows/routed-rust.yml', '02-routed-rust.yml.txt'),
              ('tools/repo-policy/tests/review_disposition_admission.rs', '03-review_disposition_admission.rs.txt'),
              ('xtask/tests/rust_gate_workflow_contract.rs', '04-rust_gate_workflow_contract.rs.txt'),
          ]
          actual = [line for line in subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines() if line]
          expected = [item[0] for item in items]
          if actual != expected:
              raise SystemExit(f'conflict set changed: expected={expected!r} actual={actual!r}')
          out = Path(os.environ['OUT_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          header = (
              'schema=hosted-main-conflict-file.v1\n'
              f'hosted_source={os.environ["HOSTED_SOURCE"]}\n'
              f'expected_main={os.environ["EXPECTED_MAIN"]}\n\n'
          )
          for relative, filename in items:
              body = Path(relative).read_text(encoding='utf-8')
              (out / filename).write_text(
                  header + f'path={relative}\n\n' + body,
                  encoding='utf-8',
              )
          PY

          git merge --abort
          git add "$OUT_DIR"
          git commit -m 'docs(ci): split hosted queue conflict diagnostics (#14200)'
          git push origin HEAD:refs/heads/codex/4838-hosted-main-reconcile-20261112
