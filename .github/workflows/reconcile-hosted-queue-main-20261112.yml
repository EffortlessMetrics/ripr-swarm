name: Inspect hosted queue reconciliation conflict

on:
  push:
    branches: [codex/4838-hosted-main-reconcile-20261112]

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout rehearsal history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: codex/4838-hosted-main-reconcile-20261112
          fetch-depth: 0
          persist-credentials: false

      - name: Inspect exact current-main conflict
        shell: bash
        env:
          HOSTED_SOURCE: 50d9bb94921b0f4f7b3d840093a596eed7059852
          EXPECTED_MAIN: d729765b7b58522be5a46c9076588eb86a7769ef
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$HOSTED_SOURCE" HEAD
          git fetch --no-tags origin main
          actual_main="$(git rev-parse FETCH_HEAD)"
          [ "$actual_main" = "$EXPECTED_MAIN" ] || {
            echo "::error::protected main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }

          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git checkout --detach "$HOSTED_SOURCE"
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_status=$?
          set -e
          [ "$merge_status" -ne 0 ] || {
            echo "::error::expected a conflict set"
            git merge --abort
            exit 1
          }

          expected_conflicts=$'.github/actions/pr-candidate-admission/review_disposition.py\n.github/workflows/routed-rust.yml\npolicy/workflow_allowlist.txt\ntools/repo-policy/tests/review_disposition_admission.rs\nxtask/tests/rust_gate_workflow_contract.rs'
          actual_conflicts="$(git diff --name-only --diff-filter=U | LC_ALL=C sort)"
          [ "$actual_conflicts" = "$expected_conflicts" ] || {
            echo "::error::conflict set changed"
            printf 'expected:\n%s\nactual:\n%s\n' "$expected_conflicts" "$actual_conflicts"
            exit 1
          }

          python3 - <<'PY'
          from pathlib import Path

          path = Path('policy/workflow_allowlist.txt')
          lines = path.read_text(encoding='utf-8').splitlines()
          starts = [i for i, line in enumerate(lines) if line.startswith('<<<<<<< ')]
          if not starts:
              raise SystemExit('no conflict markers found')
          for block, start in enumerate(starts, 1):
              end = next(
                  (i for i in range(start + 1, len(lines)) if lines[i].startswith('>>>>>>> ')),
                  None,
              )
              if end is None:
                  raise SystemExit(f'unclosed conflict at line {start + 1}')
              lo = max(0, start - 3)
              hi = min(len(lines), end + 4)
              print(f'--- conflict block {block}: lines {lo + 1}-{hi} ---')
              for index in range(lo, hi):
                  print(f'{index + 1:04d}: {lines[index]}')
          PY

          echo "::error::diagnostic run intentionally stops after printing the reviewed conflict surface"
          exit 1
