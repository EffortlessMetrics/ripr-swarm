name: Materialize hosted queue reconciliation conflicts

on:
  push:
    branches: [codex/4838-hosted-main-reconcile-20261112]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact rehearsal branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: codex/4838-hosted-main-reconcile-20261112
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize pinned diff3 conflicts
        shell: bash
        env:
          HOSTED_SOURCE: 50d9bb94921b0f4f7b3d840093a596eed7059852
          EXPECTED_MAIN: c5d50a38ba94799d6da3954fef004839fae5489c
          DIAGNOSTIC: .ci/staged/4838-current-main-conflicts-c5d50a38.txt
        run: |
          set -euo pipefail
          if [ -f "$DIAGNOSTIC" ]; then
            grep -Fq "expected_main=$EXPECTED_MAIN" "$DIAGNOSTIC" || {
              echo "::error::existing diagnostic is for another main generation"
              exit 1
            }
            echo "Pinned conflict diagnostic already materialized."
            exit 0
          fi

          git merge-base --is-ancestor "$HOSTED_SOURCE" HEAD || {
            echo "::error::rehearsal no longer contains tested hosted source $HOSTED_SOURCE"
            exit 1
          }
          git fetch --no-tags origin main
          actual_main="$(git rev-parse FETCH_HEAD)"
          [ "$actual_main" = "$EXPECTED_MAIN" ] || {
            echo "::error::protected main moved: expected $EXPECTED_MAIN, got $actual_main"
            exit 1
          }

          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git config merge.conflictstyle diff3
          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          merge_status=$?
          set -e
          [ "$merge_status" -ne 0 ] || {
            echo "::error::merge unexpectedly became conflict-free"
            git merge --abort
            exit 1
          }

          python3 - <<'PY' > /tmp/4838-conflicts.txt
          from pathlib import Path
          import os
          import subprocess

          expected = [
              '.github/actions/pr-candidate-admission/review_disposition.py',
              '.github/workflows/routed-rust.yml',
              'tools/repo-policy/tests/review_disposition_admission.rs',
              'xtask/tests/rust_gate_workflow_contract.rs',
          ]
          actual = [line for line in subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True
          ).splitlines() if line]
          if actual != expected:
              raise SystemExit(
                  f'conflict set changed: expected={expected!r} actual={actual!r}'
              )

          print('schema=hosted-main-conflict-diagnostic.v1')
          print(f'hosted_source={os.environ["HOSTED_SOURCE"]}')
          print(f'expected_main={os.environ["EXPECTED_MAIN"]}')
          print(f'rehearsal_head={subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()}')
          print(f'merge_base={subprocess.check_output(["git", "merge-base", os.environ["HOSTED_SOURCE"], os.environ["EXPECTED_MAIN"]], text=True).strip()}')
          print('conflict_count=4')
          print()
          for relative in expected:
              text = Path(relative).read_text(encoding='utf-8')
              print(f'===== BEGIN FILE {relative} =====')
              print(text, end='' if text.endswith('\n') else '\n')
              print(f'===== END FILE {relative} =====')
              print()
          print('===== BEGIN COMBINED DIFF =====')
          print(subprocess.check_output(
              ['git', 'diff', '--cc', '--', *expected], text=True
          ), end='')
          print('===== END COMBINED DIFF =====')
          PY

          git merge --abort
          mkdir -p "$(dirname "$DIAGNOSTIC")"
          cp /tmp/4838-conflicts.txt "$DIAGNOSTIC"
          git add "$DIAGNOSTIC"
          git commit -m 'docs(ci): capture hosted queue current-main conflicts (#14200)'
          git push origin HEAD:refs/heads/codex/4838-hosted-main-reconcile-20261112
