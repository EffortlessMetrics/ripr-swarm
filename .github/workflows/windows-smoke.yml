name: Windows Workspace Smoke (advisory)

on:
  pull_request:
    paths:
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'xtask/**'
      - 'fixtures/**'
      - '.github/workflows/windows-smoke.yml'
  push:
    branches:
      - main
    paths:
      - '.cargo/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'xtask/**'
      - 'fixtures/**'
      - '.github/workflows/windows-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-workspace-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  workspace-tests:
    name: Windows workspace tests (advisory)
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the candidate tree
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.95.0
      - name: Run the workspace test denominator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test --workspace --no-fail-fast 2>&1 | Tee-Object -FilePath windows-workspace-test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            exit $code
          }
      - name: Retain the Windows failure transcript
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-workspace-test-${{ github.run_id }}
          path: windows-workspace-test.log
          if-no-files-found: warn
          retention-days: 7
