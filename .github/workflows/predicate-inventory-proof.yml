name: Predicate inventory proof (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/predicate-inventory-proof.yml]
permissions:
  contents: write
concurrency:
  group: ripr-11358-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASIS: a7431a52d9a00e6a256be5ee2038ed1b5519f588
      PATCH_BLOB: 5dfe0c02506a4b7155eee2a0c070942485afaaa1
      DESTINATION: codex/11358-complete-stub-inventory-reuse
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a7431a52d9a00e6a256be5ee2038ed1b5519f588
          path: build
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a7431a52d9a00e6a256be5ee2038ed1b5519f588
          path: subject
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6fc993ba833456aaf788c06e8f1c65ca673bb494
          path: driver
          sparse-checkout: .github/workflows/predicate-inventory-proof.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'true'
      - name: Materialize pinned scripts and exact regression ordering repair
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/predicate-reuse-evidence"
          mkdir -p "$EVIDENCE/scripts"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          test "$(git -C driver rev-parse HEAD)" = 6fc993ba833456aaf788c06e8f1c65ca673bb494
          test "$(git -C driver hash-object .github/workflows/predicate-inventory-proof.yml)" = c8f0d8d50854420fdb44953a3d3914b42ce75849
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          lines=Path('driver/.github/workflows/predicate-inventory-proof.yml').read_text().splitlines(True)
          names=[('bind','Bind source, storage and exact patch'),('baseline','Compile the unchanged baseline and freeze its CLI'),('prepare','Prepare only the reviewed six-file candidate'),('red','Execute the intended wrong-implementation control'),('green','Execute focused restored source and existing consumer controls'),('publish','Publish only the native-tested candidate branch'),('measure','Measure separate-process advice and actual root-human repeats'),('policy','Applicable policy and target compilation')]
          for short,name in names:
              matches=[i for i,line in enumerate(lines) if line.rstrip()=='      - name: '+name]
              assert len(matches)==1,name
              start=next(i for i in range(matches[0]+1,len(lines)) if lines[i].rstrip()=='        run: |')+1
              end=start
              while end<len(lines) and (not lines[end].strip() or lines[end].startswith('          ')): end+=1
              script=''.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
              if short=='prepare':
                  anchor='cargo +1.95.0 fmt --all\n'
                  assert script.count(anchor)==1
                  repair="""python3 - <<'FIX'
          from pathlib import Path
          p=Path('crates/ripr/src/analysis/file_guidance_inventory_tests.rs')
          s=p.read_text()
          old='    entry_path(&fixture.0, &cold, FILE)?;\\n    let (memory, builds, evaluated)'
          new='    let (memory, builds, evaluated)'
          assert s.count(old)==1
          s=s.replace(old,new,1)
          old='    forget(&cold, FILE);\\n    let (disk, builds, evaluated)'
          new='    entry_path(&fixture.0, &cold, FILE)?;\\n'+old
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          FIX
          """
                  script=script.replace(anchor,repair+anchor,1)
              path=Path(os.environ['EVIDENCE'])/'scripts'/(short+'.sh');path.write_text(script)
              print(short,hashlib.sha256(script.encode()).hexdigest())
          PY
          for script in "$EVIDENCE"/scripts/*.sh; do bash -n "$script"; done
      - name: Bind source, storage and exact patch
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/scripts/bind.sh"
      - name: Compile the unchanged baseline and freeze its CLI
        working-directory: build
        run: bash "$EVIDENCE/scripts/baseline.sh"
      - name: Prepare only the reviewed six-file candidate
        working-directory: build
        run: bash "$EVIDENCE/scripts/prepare.sh"
      - name: Execute the intended wrong-implementation control
        working-directory: build
        run: bash "$EVIDENCE/scripts/red.sh"
      - name: Execute focused restored source and existing consumer controls
        working-directory: build
        run: bash "$EVIDENCE/scripts/green.sh"
      - name: Publish only the native-tested candidate branch
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/scripts/publish.sh"
      - name: Retain focused proof before longer measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-reuse-focused-${{ github.run_attempt }}
          path: ${{ runner.temp }}/predicate-reuse-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Measure separate-process advice and actual root-human repeats
        working-directory: build
        run: bash "$EVIDENCE/scripts/measure.sh"
      - name: Applicable policy and target compilation
        working-directory: build
        run: bash "$EVIDENCE/scripts/policy.sh"
      - name: Retain all terminal statuses and bounded raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-reuse-complete-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/predicate-reuse-evidence/
            build/target/ripr/reports/check-fast*
            build/target/ripr/reports/precommit*
          if-no-files-found: error
          retention-days: 14
