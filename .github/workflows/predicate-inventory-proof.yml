name: Predicate inventory proof (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/predicate-inventory-proof.yml]
permissions:
  contents: write
  actions: read
concurrency:
  group: ripr-11358-proof
  cancel-in-progress: true
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BASIS: a7431a52d9a00e6a256be5ee2038ed1b5519f588
      PATCH_BLOB: 5dfe0c02506a4b7155eee2a0c070942485afaaa1
      REPAIR_BLOB: 6962cbe687cd27de0a6ca72259b1024126bc62d0
      DESTINATION: codex/11358-complete-stub-inventory-reuse
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a7431a52d9a00e6a256be5ee2038ed1b5519f588
          path: build
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: a7431a52d9a00e6a256be5ee2038ed1b5519f588
          path: subject
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'true'
      - name: Materialize unchanged retained scripts and repaired config stimulus
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/predicate-reuse-evidence"
          mkdir -p "$EVIDENCE/scripts"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13064840504/zip" > "$RUNNER_TEMP/predecessor-proof.zip"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$REPAIR_BLOB" > "$EVIDENCE/source-repair-blob.json"
          python3 - <<'PY'
          import base64, hashlib, json, os, zipfile
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); archive=Path(os.environ['RUNNER_TEMP'])/'predecessor-proof.zip'
          assert hashlib.sha256(archive.read_bytes()).hexdigest()=='a220e3f2cedf4bd3e0199ad8a03e5bcda311190e06830c28fa0c2c5c05d72b99'
          b=json.loads((e/'source-repair-blob.json').read_text())
          assert b['sha']==os.environ['REPAIR_BLOB'] and b['encoding']=='base64'
          (e/'source-repair.py').write_bytes(base64.b64decode(b['content']))
          with zipfile.ZipFile(archive) as z:
              for short in ['bind','baseline','prepare','red','green','publish','measure','policy']:
                  script=z.read('_temp/predicate-reuse-evidence/scripts/'+short+'.sh')
                  (e/'scripts'/(short+'.sh')).write_bytes(script)
                  print(short,hashlib.sha256(script).hexdigest())
          PY
          test "$(git hash-object "$EVIDENCE/source-repair.py")" = "$REPAIR_BLOB"
          python3 -m py_compile "$EVIDENCE/source-repair.py"
          for script in "$EVIDENCE"/scripts/*.sh; do bash -n "$script"; done
      - name: Bind source, storage and exact patch
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/scripts/bind.sh"
      - name: Compile the unchanged baseline and freeze its CLI
        working-directory: build
        run: bash "$EVIDENCE/scripts/baseline.sh"
      - name: Prepare only the reviewed six-file candidate
        working-directory: build
        run: bash "$EVIDENCE/scripts/prepare.sh"
      - name: Execute the intended wrong-implementation control
        working-directory: build
        run: bash "$EVIDENCE/scripts/red.sh"
      - name: Execute focused restored source and existing consumer controls
        working-directory: build
        run: bash "$EVIDENCE/scripts/green.sh"
      - name: Publish only the native-tested candidate branch
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$EVIDENCE/scripts/publish.sh"
      - name: Retain focused proof before longer measurement
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-reuse-focused-${{ github.run_attempt }}
          path: ${{ runner.temp }}/predicate-reuse-evidence/
          if-no-files-found: error
          retention-days: 14
      - name: Measure separate-process advice and actual root-human repeats
        working-directory: build
        run: bash "$EVIDENCE/scripts/measure.sh"
      - name: Applicable policy and target compilation
        working-directory: build
        run: bash "$EVIDENCE/scripts/policy.sh"
      - name: Retain all terminal statuses and bounded raw evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: predicate-reuse-complete-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/predicate-reuse-evidence/
            build/target/ripr/reports/check-fast*
            build/target/ripr/reports/precommit*
            build/target/ripr/reports/worktree-doctor*
          if-no-files-found: error
          retention-days: 14
