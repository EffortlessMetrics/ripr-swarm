name: Apply Exact Record-Field Repair

on:
  push:
    branches: [fix/record-field-declaration-1453]

permissions:
  contents: write

jobs:
  apply:
    name: Apply exact test-contract repair
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/record-field-declaration-1453
          fetch-depth: 2

      - name: Verify parent and apply one exact patch
        shell: bash
        env:
          EXPECTED_PARENT: d4aaa119e715ef24832b44f42e37b0d246e29fc6
          EXPECTED_SOURCE_BLOB: 163922dca4525b7b8813cbf28fe30dd3f10c0463
          EXPECTED_REPAIRED_BLOB: b403c2d82ca8737488fa758fb51a2bad24c2ae65
          PATCH_B64: 
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/repair-apply.yml'
          source_path='crates/ripr/src/analysis/language/rust.rs'
          test "$(git hash-object -- "$source_path")" = "$EXPECTED_SOURCE_BLOB"
          printf '%s' "$PATCH_B64" | base64 --decode > "$RUNNER_TEMP/record-field-repair.patch"
          git apply --check "$RUNNER_TEMP/record-field-repair.patch"
          git apply "$RUNNER_TEMP/record-field-repair.patch"
          rm -- .github/workflows/repair-apply.yml .github/workflows/repair-source-export.yml
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '.github/workflows/repair-apply.yml' '.github/workflows/repair-source-export.yml' 'crates/ripr/src/analysis/language/rust.rs' | sort)"
          test "$(git hash-object -- "$source_path")" = "$EXPECTED_REPAIRED_BLOB"

      - name: Commit bounded repair and remove repair workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- crates/ripr/src/analysis/language/rust.rs .github/workflows/repair-apply.yml .github/workflows/repair-source-export.yml
          git commit -m 'test(rust): align ownerless field integration contract'
          git push origin HEAD:fix/record-field-declaration-1453
