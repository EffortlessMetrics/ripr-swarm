name: W4 Source Promotion Preflight

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ripr-0.11.0-w4-source-promotion-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: exact W4/source preflight
    if: github.head_ref == 'release-qualification/0.11.0-w4-preflight-control'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_PARENT: __SOURCE_PARENT_AFTER_1532_MERGE__
      SWARM_PARENT: 544a34a4b0f6fc9d2bcacb6453bc502ca059dad3
      EXPECTED_MERGE_BASE: 36909460db013ed3a3238ee8b2fc3ccda1135c15
      VERSION: 0.11.0

    steps:
      - name: Refuse unresolved source placeholder
        shell: bash
        run: |
          set -euo pipefail
          case "$SOURCE_PARENT" in
            __*) exit 1 ;;
          esac
          test "${#SOURCE_PARENT}" = 40

      - name: Checkout exact W4 producer
        uses: actions/checkout@v6
        with:
          repository: EffortlessMetrics/ripr-swarm
          ref: 544a34a4b0f6fc9d2bcacb6453bc502ca059dad3
          fetch-depth: 0
          path: swarm
          persist-credentials: false

      - name: Checkout exact source parent
        uses: actions/checkout@v6
        with:
          repository: EffortlessMetrics/ripr
          ref: ${{ env.SOURCE_PARENT }}
          fetch-depth: 0
          path: source
          persist-credentials: false

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Bind exact repositories and immutable local ref
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C swarm rev-parse HEAD)" = "$SWARM_PARENT"
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_PARENT"
          git -C swarm update-ref "refs/ripr/release-${VERSION}-${SWARM_PARENT}" "$SWARM_PARENT"
          test "$(git -C swarm rev-parse "refs/ripr/release-${VERSION}-${SWARM_PARENT}^{commit}")" = "$SWARM_PARENT"
          mkdir -p preflight
          {
            printf 'source_parent=%s\n' "$SOURCE_PARENT"
            printf 'swarm_parent=%s\n' "$SWARM_PARENT"
            printf 'swarm_ref=%s\n' "refs/ripr/release-${VERSION}-${SWARM_PARENT}"
            git --version
            rustc -Vv
            cargo -V
          } | tee preflight/environment.txt

      - name: Generate exact-pair read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          cd swarm
          cargo xtask source-promotion preflight \
            --source-parent "$SOURCE_PARENT" \
            --swarm-parent "$SWARM_PARENT" \
            --swarm-ref "refs/ripr/release-${VERSION}-${SWARM_PARENT}" \
            --source-repo "$GITHUB_WORKSPACE/source" \
            --swarm-repo "$GITHUB_WORKSPACE/swarm" \
            --source-main "$SOURCE_PARENT" \
            --swarm-main "$SWARM_PARENT" \
            --version "$VERSION" \
            --out "$GITHUB_WORKSPACE/preflight"

      - name: Validate exact identities and unresolved-tree boundary
        shell: bash
        run: |
          set -euo pipefail
          receipt=preflight/source-promotion-preflight.json
          test -s "$receipt"
          jq -e \
            --arg source "$SOURCE_PARENT" \
            --arg swarm "$SWARM_PARENT" \
            --arg base "$EXPECTED_MERGE_BASE" '
              .schema == "ripr.source_promotion_preflight.v1" and
              .mode == "two_parent_join" and
              .source_parent == $source and
              .source_main == $source and
              .swarm_parent == $swarm and
              .swarm_main == $swarm and
              .swarm_ref_sha == $swarm and
              .merge_base == $base and
              .dry_merge.reviewed_resolved_tree == null and
              .dry_merge.reviewed_resolved_tree_verified == false
            ' "$receipt" >/dev/null
          sha256sum preflight/* | sort > preflight/SHA256SUMS

      - name: Upload exact preflight packet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-0.11.0-w4-source-promotion-preflight
          path: preflight/
          if-no-files-found: error
          retention-days: 90
