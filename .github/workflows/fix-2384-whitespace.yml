name: Fix #2384 exact Git stdout parsing

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: fix-2384-whitespace-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/validated-cli-fixture-head-2383'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the claimed branch without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/validated-cli-fixture-head-2383
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the reviewed branch revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "fix/validated-cli-fixture-head-2383"
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Apply the exact parser and regression changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/ripr/tests/cli_smoke.rs')
          text = path.read_text(encoding='utf-8')

          old_candidate = 'let candidate = String::from_utf8_lossy(stdout).trim().to_string();'
          new_candidate = '''let candidate = String::from_utf8_lossy(strip_optional_git_line_ending(stdout))
              .to_string();'''
          if text.count(old_candidate) != 1:
              raise SystemExit(f'candidate parser: expected one match, found {text.count(old_candidate)}')
          text = text.replace(old_candidate, new_candidate, 1)

          helper_anchor = '''fn bounded_command_text(bytes: &[u8]) -> String {
              String::from_utf8_lossy(bytes).chars().take(512).collect()
          }
          '''
          helper_replacement = '''fn bounded_command_text(bytes: &[u8]) -> String {
              String::from_utf8_lossy(bytes).chars().take(512).collect()
          }

          fn strip_optional_git_line_ending(bytes: &[u8]) -> &[u8] {
              bytes
                  .strip_suffix(b"\\r\\n")
                  .or_else(|| bytes.strip_suffix(b"\\n"))
                  .unwrap_or(bytes)
          }
          '''
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'helper anchor: expected one match, found {text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper_replacement, 1)

          test_anchor = '''#[test]
          fn fixture_repository_head_does_not_replace_malformed_success_output_with_fallback()
          -> Result<(), String> {
              let fallback = "0123456789abcdef0123456789abcdef01234567";
              let result = select_fixture_repository_head(true, b"HEAD\\n", b"", Some(fallback));
              let Err(error) = result else {
                  return Err("successful but symbolic git output used the Actions fallback".to_string());
              };
              if !error.contains("non-concrete repository HEAD `HEAD`") {
                  return Err(format!("unexpected non-concrete HEAD error: {error}"));
              }
              Ok(())
          }
          '''
          added_tests = test_anchor + '''

          #[test]
          fn fixture_repository_head_accepts_only_an_optional_git_line_ending() -> Result<(), String> {
              let commit = "0123456789abcdef0123456789abcdef01234567";
              for stdout in [commit.to_string(), format!("{commit}\\n"), format!("{commit}\\r\\n")] {
                  let actual = select_fixture_repository_head(true, stdout.as_bytes(), b"", None)?;
                  if actual != commit {
                      return Err(format!("optional line ending changed commit identity: {actual}"));
                  }
              }
              Ok(())
          }

          #[test]
          fn fixture_repository_head_rejects_whitespace_padded_success_output() -> Result<(), String> {
              let commit = "0123456789abcdef0123456789abcdef01234567";
              for stdout in [format!(" {commit}\\n"), format!("{commit} \\n"), format!("{commit}\\n\\n")] {
                  let result = select_fixture_repository_head(true, stdout.as_bytes(), b"", None);
                  if result.is_ok() {
                      return Err(format!("whitespace-padded commit became authority: {stdout:?}"));
                  }
              }
              Ok(())
          }
          '''
          if text.count(test_anchor) != 1:
              raise SystemExit(f'test anchor: expected one match, found {text.count(test_anchor)}')
          text = text.replace(test_anchor, added_tests, 1)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/ripr/tests/cli_smoke.rs"
      - name: Verify the parser and affected fixture corpus
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p ripr --test cli_smoke fixture_repository_head -- --test-threads=1
          cargo test -p ripr --test cli_smoke editor_agent_loop_fixture_outputs_match_expected -- --exact --test-threads=1
      - name: Package the validated Rust source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validated
          cp crates/ripr/tests/cli_smoke.rs validated/cli_smoke.rs
          (cd validated && sha256sum cli_smoke.rs > SHA256SUMS)
      - name: Upload the validated source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-cli-whitespace-${{ github.run_id }}
          path: validated/
          if-no-files-found: error
          retention-days: 1

  commit:
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/validated-cli-fixture-head-2383'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the unchanged claimed branch for the bounded write
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/validated-cli-fixture-head-2383
          fetch-depth: 0
          persist-credentials: true
      - name: Verify that validation still names the live branch revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Download the validated source
        uses: actions/download-artifact@v8
        with:
          name: validated-cli-whitespace-${{ github.run_id }}
          path: validated
      - name: Verify, commit, and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          (cd validated && sha256sum -c SHA256SUMS)
          cp validated/cli_smoke.rs crates/ripr/tests/cli_smoke.rs
          rm -rf validated
          git add crates/ripr/tests/cli_smoke.rs
          git rm .github/workflows/fix-2384-whitespace.yml
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/tests/cli_smoke.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/fix-2384-whitespace.yml
          git diff --cached --check
          git -c user.name='RIPR release operator' \
              -c user.email='release-operator@example.invalid' \
              -c commit.gpgSign=false \
              commit -m 'test(cli): reject whitespace-padded fixture commit IDs (#2383)'
          git push origin HEAD:refs/heads/fix/validated-cli-fixture-head-2383
