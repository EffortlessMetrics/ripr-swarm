name: Compile and format issue 3294 draft

on:
  push:
    branches:
      - control/3294-compile

permissions:
  contents: read

concurrency:
  group: compile-3294-draft
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 6a15d4125bf12e16c7fe58d7e8e448805ce88f6e
          fetch-depth: 1
          persist-credentials: false

      - name: Install governed Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Apply local draft patch
        shell: bash
        env:
          PATCH_GZ_B64: 
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > /tmp/3294.patch
          git apply --index /tmp/3294.patch

      - name: Format draft
        shell: bash
        run: cargo fmt --all

      - name: Check library compile
        shell: bash
        run: cargo check -p ripr --lib

      - name: Run focused resolver tests
        shell: bash
        run: cargo test -p ripr --lib binding_predicate -- --nocapture

      - name: Export formatted patch
        if: always()
        shell: bash
        run: git diff --binary HEAD > /tmp/3294-formatted.patch

      - name: Upload formatted draft patch
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: issue-3294-formatted-draft
          path: /tmp/3294-formatted.patch
          if-no-files-found: error
          retention-days: 1
