name: Build exact 3281 candidate

on:
  push:
    branches:
      - control/3281-candidate-builder

permissions:
  contents: write

concurrency:
  group: build-exact-3281-candidate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact C2 control builder
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Build, prove, and publish the exact C2 candidate
        shell: bash
        run: bash tools/review-control/3281/run.sh

      - name: Retain the C2 candidate packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ripr-3281-candidate-proof
          path: target/review-control/3281
          if-no-files-found: warn
          retention-days: 30
