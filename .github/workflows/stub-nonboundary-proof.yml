name: Nonpredicate stub proof (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/stub-nonboundary-proof.yml]
permissions:
  contents: write
concurrency:
  group: ripr-8547-nonpredicate-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BASIS: 6341e3e0408eb7be0083c71bd5df9f2bf1adffdb
      TEST_BLOB: c9a8e9319fbf9253f2b24c69d8f53a43da13571e
      DESTINATION: codex/8547-nonboundary-stub-lookup
      EXPECTED_DESTINATION: d8ba02c0cdd0b5920ec9ca99e25a7b1638d736f7
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6341e3e0408eb7be0083c71bd5df9f2bf1adffdb
          path: build
          fetch-depth: 64
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 6341e3e0408eb7be0083c71bd5df9f2bf1adffdb
          path: subject
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'true'
      - name: Bind source and prepare bounded evidence driver
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/nonpredicate-evidence"
          mkdir -p "$EVIDENCE"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          echo "SUBJECT_ROOT=$(realpath ../subject)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$BASIS"
          test -z "$(git status --porcelain)"
          test "$(git hash-object crates/ripr/src/app/test_stub.rs)" = 8ababd473a4cc8596f8ee97c5b0a1797e53a0cb3
          git switch -c proof/8547-nonpredicate
          git fetch --no-tags origin main:refs/remotes/origin/main "$DESTINATION:refs/remotes/origin/$DESTINATION"
          test "$(git rev-parse "origin/$DESTINATION")" = "$EXPECTED_DESTINATION"
          git merge-base --is-ancestor "$EXPECTED_DESTINATION" HEAD
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/$TEST_BLOB" > "$EVIDENCE/test-blob.json"
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          blob=json.loads((e/'test-blob.json').read_text())
          assert blob['sha']==os.environ['TEST_BLOB'] and blob['encoding']=='base64'
          (e/'test_stub_inventory_tests.rs').write_bytes(base64.b64decode(blob['content']))
          PY
          test "$(git hash-object "$EVIDENCE/test_stub_inventory_tests.rs")" = "$TEST_BLOB"
          {
            printf 'controller=%s\nbasis=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$BASIS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD^{tree} origin/main
            rustc +1.95.0 -Vv
            uname -a
            nproc
            free -h
            df -h .
          } > "$EVIDENCE/identity.txt"
          cat > "$RUNNER_TEMP/8547-run.sh" <<'SH'
          run() {
            local name="$1"; shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"
            set +e
            timeout --signal=TERM --kill-after=30s 1200s "$@" > "$EVIDENCE/$name.stdout" 2> "$EVIDENCE/$name.stderr"
            local code=$?
            set -e
            echo "$name exit=$code" | tee -a "$EVIDENCE/status.txt"
            tail -n 15 "$EVIDENCE/$name.stdout"
            if [ "$code" != 0 ]; then tail -n 60 "$EVIDENCE/$name.stderr"; return "$code"; fi
          }
          SH
          cat > "$RUNNER_TEMP/8547-measure.py" <<'PY'
          import hashlib, json, os, signal, subprocess, sys, time
          from pathlib import Path
          e=Path(os.environ['EVIDENCE'])
          subject=Path(os.environ['SUBJECT_ROOT'])
          label,binary=sys.argv[1:]
          binary=str(Path(binary).resolve())
          digest=hashlib.sha256(Path(binary).read_bytes()).hexdigest()
          tiny=Path(os.environ['RUNNER_TEMP'])/'nonpredicate-fixture'
          if not tiny.exists():
              (tiny/'src').mkdir(parents=True)
              (tiny/'Cargo.toml').write_text('[package]\nname="nonpredicate_fixture"\nversion="0.1.0"\nedition="2024"\n[workspace]\n')
              (tiny/'src/lib.rs').write_text('pub fn amount(value: u32) -> u32 {\n    value + 1\n}\n')
              (tiny/'change.patch').write_text('diff --git a/src/lib.rs b/src/lib.rs\n--- a/src/lib.rs\n+++ b/src/lib.rs\n@@ -2 +2 @@\n-    value + 2\n+    value + 1\n')
          scopes=[('nonpredicate',tiny,tiny/'change.patch'),('boundary',subject/'fixtures/boundary_gap/input',subject/'fixtures/boundary_gap/diff.patch'),('repository',subject,subject/'crates/ripr/examples/sample/example.diff')]
          rows=[]
          for scope,root,diff in scopes:
              cache=Path(os.environ['RUNNER_TEMP'])/'nonpredicate-caches'/label/scope
              cache.mkdir(parents=True,exist_ok=False)
              for fmt in ['json','human-full','human','human']:
                  repeat=sum(r['scope']==scope and r['format']==fmt for r in rows)
                  name=f'{label}-{scope}-{fmt}-{repeat}'
                  argv=[binary,'check','--root',str(root),'--diff',str(diff),'--format',fmt]
                  cap=120 if label=='baseline' and scope=='repository' and fmt=='human' else 30
                  started=time.perf_counter(); stopped=False
                  with (e/(name+'.stdout')).open('wb') as out,(e/(name+'.stderr')).open('wb') as err:
                      p=subprocess.Popen(argv,cwd=subject,env=dict(os.environ,RIPR_CACHE_DIR=str(cache),RIPR_REPO_EXPOSURE_LATENCY_TRACE='1'),stdout=out,stderr=err,start_new_session=True)
                      try: code=p.wait(timeout=cap)
                      except subprocess.TimeoutExpired:
                          stopped=True; os.killpg(p.pid,signal.SIGTERM)
                          try: code=p.wait(timeout=3)
                          except subprocess.TimeoutExpired:
                              os.killpg(p.pid,signal.SIGKILL); code=p.wait()
                  data=(e/(name+'.stdout')).read_bytes()
                  row=dict(label=label,scope=scope,format=fmt,repeat=repeat,argv=argv,binary_sha256=digest,elapsed_seconds=time.perf_counter()-started,exit_code=code,external_stop=stopped,external_cap_seconds=cap,stdout_bytes=len(data),cache_condition='fresh per binary/scope; json then human-full then human twice',os_page_cache='uncontrolled')
                  rows.append(row); (e/(label+'-measurements.json')).write_text(json.dumps(rows,indent=2)+'\n')
                  print(json.dumps(row),flush=True)
                  if scope!='repository' or fmt!='human':
                      assert code==0 and not stopped and data, name
                  if fmt=='json':
                      d=json.loads(data)
                      assert d['findings'] and d['analysis_outcome']['analysis_complete'] is True, name
                      assert not d['analysis_outcome']['outcome']['limitations'], name
          PY
      - name: Establish base owner and freeze baseline CLI
        working-directory: build
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/8547-run.sh"
          run base-format cargo +1.95.0 fmt --all --check
          run base-owner-check cargo +1.95.0 check --locked -p ripr --lib
          run base-cli-build cargo +1.95.0 build --locked -p ripr --bin ripr
          cp target/debug/ripr "$RUNNER_TEMP/baseline-ripr"
          sha256sum "$RUNNER_TEMP/baseline-ripr" > "$EVIDENCE/baseline-binary.sha256"
          python3 "$RUNNER_TEMP/8547-measure.py" baseline "$RUNNER_TEMP/baseline-ripr"
      - name: Establish discriminating pre-repair failure
        working-directory: build
        run: |
          set -euo pipefail
          cp "$EVIDENCE/test_stub_inventory_tests.rs" crates/ripr/src/app/test_stub_inventory_tests.rs
          printf '\n#[cfg(all(test, feature = "lang-rust"))]\n#[path = "test_stub_inventory_tests.rs"]\nmod inventory_lookup_tests;\n' >> crates/ripr/src/app/test_stub.rs
          cargo +1.95.0 fmt --all
          set +e
          timeout --signal=TERM --kill-after=30s 1200s cargo +1.95.0 test --locked -p ripr --lib app::test_stub::inventory_lookup_tests::nonboundary_route_skips_inventory_but_explicit_command_keeps_disclosure -- --exact --nocapture > "$EVIDENCE/red.stdout" 2> "$EVIDENCE/red.stderr"
          code=$?
          set -e
          echo "red exit=$code" | tee -a "$EVIDENCE/status.txt"
          cat "$EVIDENCE/red.stdout"
          test "$code" = 101
          grep -F '1 failed' "$EVIDENCE/red.stdout"
          grep -F 'non-predicate guidance unexpectedly loaded the full inventory' "$EVIDENCE/red.stderr"
          ! grep -q '^error\[' "$EVIDENCE/red.stderr"
      - name: Apply only the nonpredicate lookup guard and bind candidate
        working-directory: build
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/ripr/src/app/test_stub.rs'); s=p.read_text()
          old='    // #10683: `agent stub` refuses a weak-oracle boundary seam (an existing\n    // test already reaches it); never advertise a stub command it will refuse.\n    if resolution.weak_oracle_guidance.is_none() {'
          new='    // #10683: `agent stub` refuses a weak-oracle boundary seam (an existing\n    // test already reaches it); never advertise a stub command it will refuse.\n    // #8547: the guidance producer only accepts PredicateBoundary. The\n    // --kind resolver above selects that same mapped seam kind, so other\n    // families cannot gain this pointer from a full-workspace inventory.\n    // Keep the explicit stub command\'s lookup: it also discloses grip class.\n    if resolution.weak_oracle_guidance.is_none()\n        && analysis::seam_kind_for_probe_family(kind) == Some(SeamKind::PredicateBoundary)\n    {'
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          Path('changelog.d/8547-nonpredicate-stub-guidance.md').write_text('<!-- section: Fixed -->\n- Default-human Rust check guidance no longer builds a full-workspace evidence inventory solely to ask for predicate-only advice on a non-predicate stub route. Predicate advice, explicit stub class disclosure, analysis scope and verdicts are unchanged (#8547).\n')
          PY
          cargo +1.95.0 fmt --all
          git diff --check
          git add crates/ripr/src/app/test_stub.rs crates/ripr/src/app/test_stub_inventory_tests.rs changelog.d/8547-nonpredicate-stub-guidance.md
          test -z "$(git diff --name-only)"
          test "$(git diff --cached --name-only | wc -l)" = 3
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'perf(check): skip impossible nonpredicate stub guidance lookup (#8547)'
          git rev-parse HEAD > "$EVIDENCE/candidate.sha"
          git rev-parse HEAD^{tree} > "$EVIDENCE/candidate.tree"
          git diff --binary "$BASIS" HEAD > "$EVIDENCE/candidate.patch"
      - name: Execute focused candidate proof and build the CLI
        working-directory: build
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/8547-run.sh"
          run candidate-stub-tests cargo +1.95.0 test --locked -p ripr --lib app::test_stub -- --nocapture
          run candidate-task-first-tests cargo +1.95.0 test --locked -p ripr --lib app::task_first -- --nocapture
          run candidate-cli-build cargo +1.95.0 build --locked -p ripr --bin ripr
          sha256sum target/debug/ripr > "$EVIDENCE/candidate-binary.sha256"
          python3 "$RUNNER_TEMP/8547-measure.py" candidate target/debug/ripr
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          e=Path(os.environ['EVIDENCE']); comparisons=[]
          for scope in ['nonpredicate','boundary','repository']:
              for fmt,repeat in [('json',0),('human-full',0),('human',1)]:
                  b=e/f'baseline-{scope}-{fmt}-{repeat}.stdout'; c=e/f'candidate-{scope}-{fmt}-{repeat}.stdout'
                  if fmt=='json':
                      left=json.loads(b.read_text()); right=json.loads(c.read_text())
                      assert left==right, f'{scope} JSON changed'
                      comparisons.append(dict(scope=scope,format=fmt,result='identical parsed JSON'))
                  elif b.read_bytes() and c.read_bytes():
                      assert b.read_bytes()==c.read_bytes(), f'{scope} {fmt} changed'
                      comparisons.append(dict(scope=scope,format=fmt,result='byte-identical'))
                  else:
                      comparisons.append(dict(scope=scope,format=fmt,result='not established: incomplete command'))
          (e/'comparisons.json').write_text(json.dumps(comparisons,indent=2)+'\n')
          print(json.dumps(comparisons,indent=2))
          PY
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$(cat "$EVIDENCE/candidate.sha")"
          git -C ../subject diff --exit-code
      - name: Check applicable policy without requesting merge CI
        working-directory: build
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/8547-run.sh"
          git diff --name-only origin/main...HEAD > "$EVIDENCE/changed-paths.txt"
          test "$(git merge-base origin/main HEAD)" = "$BASIS"
          test "$(wc -l < "$EVIDENCE/changed-paths.txt")" = 3
          run candidate-check-fast cargo +1.95.0 run --locked -p xtask -- check-fast
          run candidate-changelog cargo +1.95.0 run --locked -p xtask -- check-changelog-fragments
          run candidate-precommit cargo +1.95.0 run --locked -p xtask -- precommit
          git diff --exit-code
      - name: Publish the tested source branch with a normal fast-forward push
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(cat "$EVIDENCE/candidate.sha")"
          remote="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DESTINATION" --jq .object.sha)"
          test "$remote" = "$EXPECTED_DESTINATION"
          test -z "$(git status --porcelain)"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$DESTINATION"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DESTINATION" --jq .object.sha)" = "$(git rev-parse HEAD)"
          echo 'candidate published; no PR readiness, merge-ready label or merge requested' >> "$EVIDENCE/status.txt"
      - name: Retain source and native evidence, never binaries or caches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nonpredicate-stub-proof-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nonpredicate-evidence/
            build/target/ripr/reports/check-fast*
            build/target/ripr/reports/precommit*
          if-no-files-found: error
          retention-days: 14
