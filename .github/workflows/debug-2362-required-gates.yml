name: Debug 2362 Required Gates

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  actions: read
  contents: read

concurrency:
  group: debug-2362-required-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'debug/2362-required-gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Retain original failed job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p target/debug-2362
          gh run view 30063628429 --repo EffortlessMetrics/ripr-swarm --log-failed > target/debug-2362/original-failed.log 2>&1 || true

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        id: fmt
        continue-on-error: true
        run: cargo fmt --check

      - name: cargo check workspace all targets
        id: check
        continue-on-error: true
        run: cargo check --workspace --all-targets

      - name: cargo clippy workspace all targets
        id: clippy
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test workspace
        id: test
        continue-on-error: true
        run: cargo test --workspace

      - name: cargo xtask precommit
        id: precommit
        continue-on-error: true
        run: cargo xtask precommit

      - name: evidence-promotion honesty
        id: honesty
        continue-on-error: true
        run: cargo xtask check-evidence-promotion-honesty

      - name: dependency policy
        id: dependencies
        continue-on-error: true
        run: cargo xtask check-dependencies

      - name: process policy
        id: process
        continue-on-error: true
        run: cargo xtask check-process-policy

      - name: network policy
        id: network
        continue-on-error: true
        run: cargo xtask check-network-policy

      - name: golden outputs
        id: goldens
        continue-on-error: true
        run: cargo xtask goldens check

      - name: fixture suite
        id: fixtures
        continue-on-error: true
        run: cargo xtask fixtures

      - name: Write exact outcomes
        if: always()
        env:
          FMT: ${{ steps.fmt.outcome }}
          CHECK: ${{ steps.check.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          TEST: ${{ steps.test.outcome }}
          PRECOMMIT: ${{ steps.precommit.outcome }}
          HONESTY: ${{ steps.honesty.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PROCESS: ${{ steps.process.outcome }}
          NETWORK: ${{ steps.network.outcome }}
          GOLDENS: ${{ steps.goldens.outcome }}
          FIXTURES: ${{ steps.fixtures.outcome }}
        run: |
          mkdir -p target/debug-2362
          printf '%-18s %s\n' \
            fmt "$FMT" \
            check "$CHECK" \
            clippy "$CLIPPY" \
            test "$TEST" \
            precommit "$PRECOMMIT" \
            honesty "$HONESTY" \
            dependencies "$DEPENDENCIES" \
            process "$PROCESS" \
            network "$NETWORK" \
            goldens "$GOLDENS" \
            fixtures "$FIXTURES" \
            | tee target/debug-2362/outcomes.txt

      - name: Upload diagnosis
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-2362-required-gates
          path: target/debug-2362/
          if-no-files-found: error

      - name: Fail when a required command failed
        if: always()
        run: |
          awk '$2 != "success" { failed = 1 } END { exit failed }' target/debug-2362/outcomes.txt
