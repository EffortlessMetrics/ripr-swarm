name: One-shot distribution docs repair

on:
  push:
    branches:
      - docs/pypi-npm-distribution-4487
    paths:
      - .github/workflows/one-shot-distribution-docs-repair.yml

permissions:
  contents: write

concurrency:
  group: one-shot-distribution-docs-repair
  cancel-in-progress: false

jobs:
  repair:
    if: ${{ github.repository == 'EffortlessMetrics/ripr-swarm' && github.ref == 'refs/heads/docs/pypi-npm-distribution-4487' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5
        with:
          fetch-depth: 0
          ref: docs/pypi-npm-distribution-4487

      - name: Apply the bounded documentation repair
        shell: python
        run: |
          from pathlib import Path

          documentation = Path("docs/DOCUMENTATION.md")
          text = documentation.read_text(encoding="utf-8")
          how_to = "- [Publishing](PUBLISHING.md)\n"
          how_to_entry = (
              "- [Claim package registries](how-to/claim-package-registries.md) - maintainer "
              "setup for npm organization ownership, PyPI pending publishers, protected source "
              "environments, and first-publication ordering\n"
          )
          explanation = "- [Roadmap](ROADMAP.md)\n"
          explanation_entry = (
              "- [PyPI and npm distribution plan](PYPI_NPM_DISTRIBUTION.md) - proposed adapter "
              "architecture, package identities, qualification boundaries, and source-owned "
              "publication path\n"
          )
          if how_to_entry not in text:
              if text.count(how_to) != 1:
                  raise SystemExit("unexpected Publishing index shape")
              text = text.replace(how_to, how_to + how_to_entry, 1)
          if explanation_entry not in text:
              if text.count(explanation) != 1:
                  raise SystemExit("unexpected Roadmap index shape")
              text = text.replace(explanation, explanation + explanation_entry, 1)
          documentation.write_text(text, encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          entry = (
              "- Documented the proposed `ripr-rs` PyPI distribution and\n"
              "  `@effortlessmetrics/ripr` npm launcher/native package family, including\n"
              "  the development-in-swarm/source-owned-publication boundary, maintainer\n"
              "  registry setup, package bootstrap ordering, and explicit non-claims. This is\n"
              "  planning and review guidance; it does not claim that either package family is\n"
              "  built, published, reserved, or installable\n"
              "  ([#4487](https://github.com/EffortlessMetrics/ripr-swarm/issues/4487),\n"
              "  [#4496](https://github.com/EffortlessMetrics/ripr-swarm/pull/4496)).\n\n"
          )
          marker = "### Docs\n\n"
          if entry not in text:
              if text.count(marker) < 1:
                  raise SystemExit("missing Unreleased Docs section")
              text = text.replace(marker, marker + entry, 1)
          changelog.write_text(text, encoding="utf-8")

          Path(".github/workflows/one-shot-distribution-docs-repair.yml").unlink()

      - name: Commit the repaired documentation and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/DOCUMENTATION.md .github/workflows/one-shot-distribution-docs-repair.yml
          git diff --cached --check
          git commit -m "docs(distribution): register plan and operator guide"
          git push origin HEAD:docs/pypi-npm-distribution-4487
