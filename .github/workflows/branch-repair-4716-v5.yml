name: Retry exact npm launcher repair

on:
  push:
    branches:
      - feat/4710-npm-launcher-core
    paths:
      - .github/workflows/branch-repair-4716-v5.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4710-npm-launcher-core
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Extract and repair helper
        shell: bash
        run: |
          set -euo pipefail
          ruby -ryaml -e '
            doc = YAML.load_file(ARGV[0])
            steps = doc.fetch("jobs").fetch("repair").fetch("steps")
            {
              "Apply exact repair" => "/tmp/apply.sh",
              "Validate exact repair" => "/tmp/validate.sh",
              "Commit exact repair" => "/tmp/commit.sh",
            }.each do |name, path|
              step = steps.find { |candidate| candidate["name"] == name }
              abort("missing helper step: #{name}") unless step && step["run"]
              File.write(path, step.fetch("run"))
            end
          ' .github/workflows/branch-repair-4716-v4.yml
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('/tmp/apply.sh')
          text = path.read_text()
          pattern = re.compile(
              r'''          launcher = replace_once\(\n'''
              r'''              launcher,\n'''
              r'''              \'\'\'    child\.once\(\\"exit\\", \(code, signal\) => \{.*?'''
              r'''              \\"effective signal projection\\",\n'''
              r'''          \)\n''',
              re.S,
          )
          replacement = '''          callback = ''' + "'''" + '''    child.once("exit", (code, signal) => {
            cleanup();
            const effectiveSignal = signal || receivedSignal;
            if (effectiveSignal) {
              resolve({ code: null, signal: effectiveSignal });
            } else {
              resolve({ code: typeof code === "number" ? code : 1, signal: null });
            }
          });''' + "'''" + '''
          launcher = replace_between(
              launcher,
              '    child.once("exit", (code, signal) => {\\n',
              '  });\\n}\\n\\nfunction signalExitCode',
              callback,
              "effective signal projection",
          )
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'effective-signal helper block replacement count={count}')
          path.write_text(text)
          PY
          grep -n -A18 -B2 'callback =' /tmp/apply.sh

      - name: Apply and validate exact repair
        shell: bash
        run: |
          set -euo pipefail
          bash /tmp/apply.sh
          rm -f .github/workflows/branch-repair-4716-v5.yml
          bash /tmp/validate.sh
          bash /tmp/commit.sh
