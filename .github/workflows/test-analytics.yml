name: Test Analytics

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]

permissions:
  contents: read

# Only a `merge-ready` labeled request shares this group, so a re-applied label
# supersedes the older run for the same PR. Every other pull_request event
# (opened, synchronize, reopened, other labels) gets a unique group: its jobs
# are skipped and it can neither cancel nor replace a pending merge-ready run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'merge-ready')) && github.run_id || 'run' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready') }}

jobs:
  rust-tests:
    name: rust-tests-junit
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    # #7142: main run 41429803780 reached 26525/26527 before the 40-minute cap;
    # reserve bounded finalization for doctests, JUnit upload and terminal evidence.
    timeout-minutes: 50
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # #10794 / #9646: the default shallow PR checkout has no base branch,
          # so base-resolution tests (cli_progress, cli_smoke pr-evidence) fail
          # and nextest aborts before ~30% of the suite runs.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          shared-key: ripr-test-analytics-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest

      - name: Prepare locked owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml

      - name: Prepare locked JSON owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml

      - name: Prepare locked proptest profile dependencies
        run: cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      - name: Run Rust tests with JUnit output
        id: rust-tests
        timeout-minutes: 44
        env:
          # The suite binary is built --all-features; keep the fixture corpus's
          # default-feature build out of that target/debug/ripr (#11602).
          RIPR_FIXTURE_BINARY_ISOLATE: "1"
        run: |
          mkdir -p target/nextest/ci
          rm -f target/nextest/ci/junit.xml target/nextest/ci/run-context.txt target/test-analytics-nextest.log
          checkout_sha="$(git rev-parse HEAD)"
          {
            printf 'repository=%s\ncheckout_sha=%s\nrun_id=%s\nrun_attempt=%s\n' "$GITHUB_REPOSITORY" "$checkout_sha" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'profile=ci\ncommand=cargo nextest run --workspace --all-features --profile ci\n'
            cargo nextest --version
            rustc --version
            cargo --version
            printf 'input_blobs (Cargo.lock, nextest.toml, test-analytics.yml):\n'
            git hash-object Cargo.lock .config/nextest.toml .github/workflows/test-analytics.yml
          } > target/nextest/ci/run-context.txt
          set +e
          cargo nextest run --workspace --all-features --profile ci 2>&1 | tee target/test-analytics-nextest.log
          test_exit=${PIPESTATUS[0]}
          set -e
          printf 'nextest_exit=%s\n' "$test_exit" >> target/nextest/ci/run-context.txt
          if [ "$test_exit" -eq 0 ] && ! grep -Eq '<testsuites [^>]*tests="[1-9][0-9]*"' target/nextest/ci/junit.xml; then
            echo "::error::nextest succeeded without a fresh JUnit report naming at least one test"
            exit 1
          fi
          exit "$test_exit"

      - name: Run doc tests
        if: success()
        run: cargo test --workspace --doc

      - name: Write bounded nextest terminal evidence
        if: always() && steps.rust-tests.outcome != 'skipped'
        run: |
          {
            echo "### Test Analytics nextest"
            echo "step outcome: ${{ steps.rust-tests.outcome }}"
            echo "nextest_exit: $(grep -E '^nextest_exit=' target/nextest/ci/run-context.txt 2>/dev/null || echo missing)"
            echo
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' target/test-analytics-nextest.log 2>/dev/null | grep -aE '^\s*(Summary|SLOW|TIMEOUT|FAIL)|starting [0-9]+ tests|\sPASS .* \([0-9]+/[0-9]+\)' | tail -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify retained JUnit report
        if: always() && steps.rust-tests.outcome != 'skipped'
        run: |
          if [ "${{ steps.rust-tests.outcome }}" != "success" ]; then
            echo "::error::nextest step outcome=${{ steps.rust-tests.outcome }}; Test Analytics run is incomplete"
            exit 1
          fi
          if [ ! -f target/nextest/ci/junit.xml ] || ! grep -Eq '<testsuites [^>]*tests="[1-9][0-9]*"' target/nextest/ci/junit.xml; then
            echo "::error::Test Analytics finished without a nonempty parseable JUnit report"
            exit 1
          fi

      - name: Upload JUnit test results
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-junit
          path: target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 5

      - name: Upload Test Analytics diagnostics
        if: always() && steps.rust-tests.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-analytics-diagnostics
          path: |
            target/nextest/ci/run-context.txt
            target/test-analytics-nextest.log
          if-no-files-found: warn
          retention-days: 5

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && env.CODECOV_TOKEN != '' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: target/nextest/ci/junit.xml
          report_type: test_results
          token: ${{ env.CODECOV_TOKEN }}

      - name: Explain skipped Codecov test-results upload
        if: ${{ !cancelled() && (env.CODECOV_TOKEN == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) }}
        run: echo "Skipping Codecov test-results upload because CODECOV_TOKEN is unavailable for this run."
