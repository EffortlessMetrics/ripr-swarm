name: Repair npm launcher review findings

on:
  push:
    branches:
      - feat/4710-npm-launcher-core
    paths:
      - .github/workflows/branch-repair-4716-review.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4710-npm-launcher-core
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95.0
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Apply reviewed repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          launcher_path = Path("packaging/npm/launcher/lib/launcher.cjs")
          launcher = launcher_path.read_text()
          launcher = replace_once(
              launcher,
              'const DISALLOWED_LIFECYCLE_SCRIPTS = ["preinstall", "install", "postinstall", "prepare"];',
              'const DISALLOWED_LIFECYCLE_SCRIPTS = ["preinstall", "install", "postinstall", "preprepare", "prepare", "postprepare"];',
              "launcher lifecycle list",
          )
          launcher = replace_once(
              launcher,
              'const SIGNALS_TO_FORWARD = ["SIGINT", "SIGTERM", "SIGHUP"];\n',
              '',
              "launcher signal constant",
          )
          launcher = replace_once(
              launcher,
              '''  const forwarded = new Map();
          if (options.forwardSignals !== false && process.platform !== "win32") {
            for (const signal of SIGNALS_TO_FORWARD) {
              const handler = () => {
                if (!child.killed) {
                  child.kill(signal);
                }
              };
              forwarded.set(signal, handler);
              process.on(signal, handler);
            }
          }
          const cleanup = () => {
            for (const [signal, handler] of forwarded) {
              process.removeListener(signal, handler);
            }
          };

          ''',
              '',
              "manual signal forwarding block",
          )
          if launcher.count('      cleanup();\n') != 2:
              raise SystemExit("launcher cleanup calls: expected two anchors")
          launcher = launcher.replace('      cleanup();\n', '')
          launcher = replace_once(
              launcher,
              '    forwardSignals: options.forwardSignals,\n',
              '',
              "launch forwarding option",
          )
          launcher_path.write_text(launcher)

          test_path = Path("packaging/npm/launcher/test/launcher.test.cjs")
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              '''  const withInstall = launcherManifest({ scripts: { ...manifest.scripts, install: "curl example.invalid" } });
          assert.throws(() => launcher.validateLauncherManifest(withInstall), { code: "install_script_forbidden" });

          ''',
              '''  for (const scriptName of ["preinstall", "install", "postinstall", "preprepare", "prepare", "postprepare"]) {
            const withLifecycleHook = launcherManifest({
              scripts: { ...manifest.scripts, [scriptName]: "node should-not-run.cjs" },
            });
            assert.throws(() => launcher.validateLauncherManifest(withLifecycleHook), {
              code: "install_script_forbidden",
            });
          }

          ''',
              "Node lifecycle controls",
          )
          tests = replace_once(
              tests,
              'test("launch sets a nonzero exit code before forwarding a child signal", async () => {',
              'test("launch sets a nonzero exit code before re-raising a child signal", async () => {',
              "signal test title",
          )
          signal_test = '''
          test(
            "projects a real child signal through the wrapper and terminates the child",
            { skip: process.platform === "win32" },
            () => {
              const fixture = nativeFixture();
              const script = path.join(fixture.root, "signal-probe.cjs");
              fs.writeFileSync(script, 'process.kill(process.pid, "SIGTERM");\\n');
              const bin = path.join(fixture.launcherRoot, "bin", "ripr.cjs");
              const result = spawnSync(process.execPath, [bin, script], {
                cwd: fixture.root,
                env: process.env,
                encoding: "utf8",
              });
              try {
                assert.equal(result.status, null, result.stderr);
                assert.equal(result.signal, "SIGTERM");
                assert.equal(result.stdout, "");
                assert.equal(result.stderr, "");
              } finally {
                cleanup(fixture.root);
              }
            },
          );

          '''
          tests = replace_once(
              tests,
              'test("runs a real synthetic executable and preserves argv, cwd, env, stdout, stderr, and exit status", () => {',
              signal_test + 'test("runs a real synthetic executable and preserves argv, cwd, env, stdout, stderr, and exit status", () => {',
              "runtime signal proof insertion",
          )
          test_path.write_text(tests)

          package_path = Path("packaging/npm/launcher/package.json")
          package = package_path.read_text()
          package = replace_once(
              package,
              '"test": "node --test test/*.test.cjs"',
              '"test": "node --test --test-reporter=tap test/*.test.cjs"',
              "npm test command",
          )
          package_path.write_text(package)

          workflow_path = Path(".github/workflows/npm-launcher.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              '''      - name: Test launcher
                run: npm test

          ''',
              '''      - name: Test launcher and require every named control
                shell: bash
                run: |
                  set -euo pipefail
                  report="${RUNNER_TEMP}/npm-launcher.tap"
                  npm test | tee "${report}"
                  node - "${report}" <<'NODE'
                  const fs = require("node:fs");
                  const report = fs.readFileSync(process.argv[2], "utf8");
                  const required = [
                    "validates the exact five-target contract",
                    "rejects lifecycle scripts, version ranges, and dependency drift",
                    "detects glibc and rejects musl or unknown Linux libc",
                    "resolves an exact native package and confines its executable",
                    "rejects missing, wrong-version, wrong-target, traversal, symlink, directory, and non-executable payloads",
                    "spawns an absolute executable with literal argv, inherited stdio, cwd, env, and no shell",
                    "maps child signals to a nonzero conventional exit code",
                    "launch sets a nonzero exit code before re-raising a child signal",
                    "projects a real child signal through the wrapper and terminates the child",
                    "runs a real synthetic executable and preserves argv, cwd, env, stdout, stderr, and exit status",
                    "source bin missing-package failure never falls back to PATH or writes stdout",
                    "npm package contents are explicit and exclude tests and build residue",
                  ];
                  const escape = (value) => value.replace(/[.*+?^${}()|[\\]\\]/g, "\\$&");
                  for (const name of required) {
                    if (!new RegExp(`^ok \\d+ - ${escape(name)}$`, "m").test(report)) {
                      throw new Error(`required launcher control did not execute and pass: ${name}`);
                    }
                  }
                  for (const [label, expected] of [["tests", required.length], ["pass", required.length], ["fail", 0], ["skipped", 0]]) {
                    const match = report.match(new RegExp(`^# ${label} (\\d+)$`, "m"));
                    if (!match || Number(match[1]) !== expected) {
                      throw new Error(`unexpected TAP ${label} count: expected ${expected}, report was\\n${report}`);
                    }
                  }
                  NODE

          ''',
              "npm workflow executed-control gate",
          )
          workflow_path.write_text(workflow)

          policy_path = Path("xtask/src/policy/distribution/npm_launcher.rs")
          policy = policy_path.read_text()
          policy = replace_once(
              policy,
              'const FORBIDDEN_LIFECYCLE_SCRIPTS: &[&str] = &["preinstall", "install", "postinstall", "prepare"];',
              '''const FORBIDDEN_LIFECYCLE_SCRIPTS: &[&str] = &[
              "preinstall",
              "install",
              "postinstall",
              "preprepare",
              "prepare",
              "postprepare",
          ];''',
              "Rust lifecycle list",
          )
          policy = replace_once(
              policy,
              '''    for script in FORBIDDEN_LIFECYCLE_SCRIPTS {
                  if manifest.scripts.contains_key(*script) {
                      violations.push(format!(
                          "{path}: scripts.{script} is forbidden; installation cannot depend on npm lifecycle scripts"
                      ));
                  }
              }

          ''',
              '''    for script in FORBIDDEN_LIFECYCLE_SCRIPTS {
                  if manifest.scripts.contains_key(*script) {
                      violations.push(format!(
                          "{path}: scripts.{script} is forbidden; installation cannot depend on npm lifecycle scripts"
                      ));
                  }
              }
              check_equal(
                  path,
                  "scripts.test",
                  manifest
                      .scripts
                      .get("test")
                      .map(String::as_str)
                      .unwrap_or_default(),
                  "node --test --test-reporter=tap test/*.test.cjs",
                  violations,
              );

          ''',
              "Rust test-script contract",
          )
          policy = replace_once(policy, '    test_path: &str,\n    test_text: &str,', '    _test_path: &str,\n    _test_text: &str,', "unused static-test inputs")
          required_loop = '''    for required_test in [
              "native_dependency_version_mismatch",
              "native_executable_symlink",
              "native_executable_not_executable",
              "PATH-FALLBACK",
              "RIPR_UNKNOWN_SIGNAL",
              "npm package contents are explicit",
          ] {
              if !test_text.contains(required_test) {
                  violations.push(format!(
                      "{test_path}: launcher negative proof is missing `{required_test}`"
                  ));
              }
          }
          '''
          policy = replace_once(policy, required_loop, '', "static test-token gate")
          policy = replace_once(
              policy,
              '''    for forbidden in ["curl ", "wget ", "https.get", "execSync(", "shell: true"] {
                  for (path, text) in [(bin_path, bin_text), (library_path, library_text)] {
                      if text.contains(forbidden) {
                          violations.push(format!(
                              "{path}: launcher cannot download, shell out, or enable shell interpolation; found `{forbidden}`"
                          ));
                      }
                  }
              }
          ''',
              '''    for forbidden in ["curl ", "wget ", "https.get", "execSync(", "shell: true"] {
                  for (path, text) in [(bin_path, bin_text), (library_path, library_text)] {
                      if text.contains(forbidden) {
                          violations.push(format!(
                              "{path}: launcher cannot download, shell out, or enable shell interpolation; found `{forbidden}`"
                          ));
                      }
                  }
              }
              for forbidden in ["SIGNALS_TO_FORWARD", "process.on(signal"] {
                  if library_text.contains(forbidden) {
                      violations.push(format!(
                          "{library_path}: launcher must not manually forward terminal signals and deliver them twice; found `{forbidden}`"
                      ));
                  }
              }
          ''',
              "duplicate signal-forwarding guard",
          )
          policy_path.write_text(policy)

          rust_tests_path = Path("xtask/src/policy/distribution/tests.rs")
          rust_tests = rust_tests_path.read_text()
          rust_tests = rust_tests.replace(
              '\\"test\\": \\"node --test test/*.test.cjs\\"',
              '\\"test\\": \\"node --test --test-reporter=tap test/*.test.cjs\\"',
          )
          old_source_test = '''#[test]
          fn npm_launcher_source_guards_reject_removed_safety_rails() -> Result<(), String> {
              let contract = parsed_contract(CONTRACT_TEXT)?;
              let mut violations = Vec::new();
              npm_launcher::validate_launcher_sources(
                  npm_launcher::BIN_PATH,
                  NPM_BIN_TEXT,
                  npm_launcher::LIBRARY_PATH,
                  &NPM_LIBRARY_TEXT
                      .replace("shell: false", "shell: true")
                      .replace("process.exitCode = signalExitCode", "process.exitCode = 0"),
                  npm_launcher::TEST_PATH,
                  &NPM_TEST_TEXT
                      .replace("PATH-FALLBACK", "removed-control")
                      .replace("RIPR_UNKNOWN_SIGNAL", "removed-signal-control"),
                  &mut violations,
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("shell interpolation"))
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("PATH-FALLBACK"))
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("signalExitCode"))
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("RIPR_UNKNOWN_SIGNAL"))
              );
              assert!(!contract.npm.install_scripts);
              Ok(())
          }
          '''
          new_source_test = '''#[test]
          fn npm_launcher_source_guards_reject_removed_safety_rails() -> Result<(), String> {
              let contract = parsed_contract(CONTRACT_TEXT)?;
              let mutated_library = format!(
                  "{}\\nconst SIGNALS_TO_FORWARD: &[&str] = &[];\\n",
                  NPM_LIBRARY_TEXT
                      .replace("shell: false", "shell: true")
                      .replace("process.exitCode = signalExitCode", "process.exitCode = 0")
              );
              let mut violations = Vec::new();
              npm_launcher::validate_launcher_sources(
                  npm_launcher::BIN_PATH,
                  NPM_BIN_TEXT,
                  npm_launcher::LIBRARY_PATH,
                  &mutated_library,
                  npm_launcher::TEST_PATH,
                  NPM_TEST_TEXT,
                  &mut violations,
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("shell interpolation"))
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("signalExitCode"))
              );
              assert!(
                  violations
                      .iter()
                      .any(|violation| violation.contains("deliver them twice"))
              );
              assert!(!contract.npm.install_scripts);
              Ok(())
          }
          '''
          rust_tests = replace_once(rust_tests, old_source_test, new_source_test, "Rust source-guard test")
          rust_tests_path.write_text(rust_tests)

          Path(".github/workflows/branch-repair-4716-review.yml").unlink()
          PY

      - name: Validate repaired launcher
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix packaging/npm/launcher test
          npm --prefix packaging/npm/launcher pack --dry-run --json --ignore-scripts >/dev/null
          cargo fmt --all -- --check
          git diff --check

      - name: Commit repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Steven Zimmerman, CPA"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add -A
          git commit -m "fix(npm): close signal and lifecycle review gaps"
          git push origin HEAD:feat/4710-npm-launcher-core
