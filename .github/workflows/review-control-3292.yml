name: Review control 3292

on:
  push:
    branches:
      - control/3292-review-repair

permissions:
  contents: write

concurrency:
  group: review-control-3292
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the control builder exactly
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.95.0

      - name: Build, prove, and publish the exact review repair
        shell: bash
        run: bash tools/review-control/3292/run.sh

      - name: Retain the review-repair receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ripr-3292-source-currentness-review-repair
          path: target/review-control/3292
          if-no-files-found: warn
          retention-days: 30
