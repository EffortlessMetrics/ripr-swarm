name: Apply and verify Perl static-limit taxonomy

on:
  push:
    branches:
      - fix/perl-static-limit-taxonomy

permissions:
  contents: write

concurrency:
  group: perl-static-limit-taxonomy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/perl-static-limit-taxonomy
          fetch-depth: 0

      - name: Select repository toolchain
        run: rustup show active-toolchain

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: perl-static-limit-taxonomy

      - name: Apply candidate patch
        run: |
          git apply --check .github/patches/perl-static-limit-taxonomy.patch
          git apply --index .github/patches/perl-static-limit-taxonomy.patch

      - name: Format candidate
        run: |
          cargo fmt --all
          git add crates/ripr/src/analysis/language/perl fixtures/evidence-promotion-honesty-corpus
          cargo fmt --all -- --check

      - name: Run focused mapping tests
        run: cargo test -p ripr perl_static_limit --locked

      - name: Run Perl adapter tests
        run: cargo test -p ripr analysis::language::perl --locked

      - name: Verify evidence-promotion honesty corpus
        run: cargo xtask check-evidence-promotion-honesty

      - name: Run focused Clippy
        run: cargo clippy -p ripr --all-targets --locked -- -D warnings

      - name: Check patch hygiene
        run: |
          git diff --check
          git diff --cached --check

      - name: Commit verified candidate
        run: |
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add crates/ripr/src/analysis/language/perl fixtures/evidence-promotion-honesty-corpus
          git commit -m "fix(perl): preserve static-limit taxonomy"
          git push origin HEAD:fix/perl-static-limit-taxonomy
