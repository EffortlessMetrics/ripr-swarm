name: Repair PR 4699 review findings v2

on:
  push:
    branches:
      - feat/4521-final-native-payload
    paths:
      - .github/workflows/zz-repair-4699-v2.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'EffortlessMetrics/ripr-swarm'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4521-final-native-payload
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Execute repaired review script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path(".github/workflows/zz-repair-4699-review.yml")
          text = workflow_path.read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n          git rm -f .github/workflows/zz-repair-4699-review.yml"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not extract original review-repair script")
          script = text[start + len(start_marker) : end]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in script.splitlines()
          )
          old = '''    segment = text[start : start + span]
              count = segment.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one nearby replacement for {marker!r}, found {count}: {old!r}"
                  )
              return text[:start] + segment.replace(old, new, 1) + text[start + span :]
          '''.replace("          ", "")
          new = '''    segment = text[start : start + span]
              index = segment.find(old)
              if index < 0:
                  raise SystemExit(
                      f"missing nearby replacement for {marker!r}: {old!r}"
                  )
              segment = segment[:index] + new + segment[index + len(old) :]
              return text[:start] + segment + text[start + span :]
          '''.replace("          ", "")
          if script.count(old) != 1:
              raise SystemExit(f"replace_near implementation anchor count={script.count(old)}")
          script = script.replace(old, new, 1)
          exec(compile(script, "zz-repair-4699-review.yml", "exec"), {"__name__": "__main__"})
          PY

      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 test -p xtask server_archive_qualification_workflow_is_sha_bound_and_credential_free -- --nocapture
          cargo +1.95.0 test -p xtask server_archive_terminal_job_name_filter_accepts_direct_and_reusable_names -- --nocapture
          cargo +1.95.0 xtask check-workflows
          cargo +1.95.0 xtask check-release-targets
          git diff --check

      - name: Export validated workflow repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .repair-output
          cp .github/workflows/server-archive-qualification.yml \
            .repair-output/server-archive-qualification.yml
          git checkout -- .github/workflows/server-archive-qualification.yml
          git diff --check

      - name: Commit validated non-workflow repairs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/4521-final-native-payload
          test "$(git rev-parse origin/feat/4521-final-native-payload)" = "${GITHUB_SHA}"
          git config user.name "Steven Zimmerman, CPA"
          git config user.email "15812269+EffortlessSteven@users.noreply.github.com"
          git add .repair-output/server-archive-qualification.yml policy/workflow_allowlist.txt xtask/src/tests.rs
          git commit -m "fix(distribution): prepare terminal qualification repair"
          git push origin HEAD:feat/4521-final-native-payload
