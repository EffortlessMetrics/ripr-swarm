name: Mutation Spot Check

# Real-mutant corpus refresh (#12901). Clones the pinned checkouts in
# benchmarks/mutation_spot_check/corpus.json, mutates them with cargo-mutants
# 27.1.0 and joins the outcomes to ripr's static verdicts through
# `cargo xtask mutation-spot-check --run-mutants`. This is the one place
# third-party crate build scripts and tests run, so it runs on a hosted runner
# with read-only permissions and no secrets. Advisory: it never fails on
# agreement numbers and never writes the default branch. The receipt is an
# artifact; promote it through a reviewed PR (benchmarks/mutation_spot_check/README.md).

on:
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated corpus names to run (default: all)"
        required: false
        default: ""
  schedule:
    - cron: "23 4 * * 0"

permissions:
  contents: read

concurrency:
  group: mutation-spot-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CARGO_TERM_COLOR: never
      REPOS_FILTER: ${{ github.event.inputs.repos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked --version 27.1.0

      - name: Build ripr
        run: cargo build --release -p ripr --bin ripr

      # Checkouts live outside target/ so rust-cache never saves them, and each
      # is pinned to its manifest revision (detached HEAD, no credentials).
      - name: Clone the pinned corpus
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/spot-check-corpus"
          REPOS_FILTER="${REPOS_FILTER// /}"
          mkdir -p "$corpus"
          : > "$RUNNER_TEMP/repo-args"
          jq -r '.repos[] | [.name, .url, .rev] | @tsv' benchmarks/mutation_spot_check/corpus.json |
          while IFS=$'\t' read -r name url rev; do
            if [ -n "$REPOS_FILTER" ] && ! printf ',%s,' "$REPOS_FILTER" | grep -q ",$name,"; then continue; fi
            git init -q "$corpus/$name"
            git -C "$corpus/$name" remote add origin "$url"
            git -C "$corpus/$name" fetch -q --depth 1 origin "$rev"
            git -C "$corpus/$name" checkout -q FETCH_HEAD
            printf '%s\n' "--repo" "$name=$corpus/$name" >> "$RUNNER_TEMP/repo-args"
            jq -r --arg n "$name" '.repos[] | select(.name == $n) | (.mutants_args // [])[] | "--mutants-arg\n\($n)=\(.)"' benchmarks/mutation_spot_check/corpus.json >> "$RUNNER_TEMP/repo-args"
          done
          test -s "$RUNNER_TEMP/repo-args"

      - name: Run the spot check
        run: |
          set -euo pipefail
          mapfile -t args < "$RUNNER_TEMP/repo-args"
          cargo xtask mutation-spot-check "${args[@]}" --run-mutants --jobs 3 --ripr target/release/ripr

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f target/ripr/reports/mutation-spot-check.md ]; then cat target/ripr/reports/mutation-spot-check.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-spot-check
          path: target/ripr/reports/mutation-spot-check.*
          if-no-files-found: warn
