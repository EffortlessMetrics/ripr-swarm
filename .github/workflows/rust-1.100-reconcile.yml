name: Stage merged Rust 1.100 shard workflow

on:
  push:
    branches:
      - build/rust-1.100-upgrade
    paths:
      - .github/workflows/rust-1.100-reconcile.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: rust-1.100-reconcile
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the exact migration head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: build/rust-1.100-upgrade
          fetch-depth: 0
          persist-credentials: true

      - name: Stage current-main shard proof with Rust 1.100
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
          BRANCH: build/rust-1.100-upgrade
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/rust-test-shards.yml \
            > .rust-1.100-rust-test-shards.yml

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.rust-1.100-rust-test-shards.yml')
          text = path.read_text(encoding='utf-8')
          old = '''      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # 1.95
        with:
          toolchain: 1.95.0
'''
          new = '''      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one Rust 1.95 shard toolchain block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          grep -Fq 'toolchain: 1.100.0' .rust-1.100-rust-test-shards.yml
          grep -Fq 'cargo nextest list --workspace --profile ci --partition hash:${{ matrix.shard }}/4' .rust-1.100-rust-test-shards.yml
          grep -Fq 'hidden by the discarded stderr (#12915)' .rust-1.100-rust-test-shards.yml
          git diff --no-index --check /dev/null .rust-1.100-rust-test-shards.yml
          git add .rust-1.100-rust-test-shards.yml
          git commit -m "ci: stage merged Rust 1.100 shard workflow"
          git push \
            --force-with-lease="refs/heads/$BRANCH:$EXPECTED_HEAD" \
            origin "HEAD:refs/heads/$BRANCH"
