name: Finalize #2347 complete Bash argv encoder

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: read

concurrency:
  group: finalize-2347-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/advisory-command-bash-argv-2347'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out the exclusively claimed branch without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/advisory-command-bash-argv-2347
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Import reviewed call-site routing and build the final candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin codex/shell-arg-escaping-2347
          old="$(git rev-parse FETCH_HEAD)"
          for file in \
            CHANGELOG.md \
            crates/ripr/src/output/first_pr.rs \
            crates/ripr/src/output/pilot/commands.rs \
            fixtures/first_successful_pr/python-preview-gap/expected/start-here.json \
            fixtures/first_successful_pr/python-preview-gap/expected/start-here.md
          do
            git show "${old}:${file}" > "${file}"
          done
          python3 .github/patches/2347.py
          python3 .github/patches/2347-expectations.py
          for file in \
            fixtures/first_successful_pr/typescript-preview-gap/expected/start-here.json \
            fixtures/first_successful_pr/typescript-preview-gap/expected/start-here.md
          do
            git show "origin/main:${file}" > "${file}"
          done
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          rm \
            .github/patches/2347.py \
            .github/patches/2347-expectations.py \
            .github/workflows/validate-2347-bash-argv.yml
      - name: Verify the full acceptance denominator
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test -p ripr --lib loop_commands -- --test-threads=1
          cargo test -p ripr --lib first_pr -- --test-threads=4
          cargo test -p ripr --lib pilot -- --test-threads=4
          cargo test -p ripr --lib
          cargo xtask goldens check
          cargo xtask check-process-policy
          cargo xtask check-file-policy
          cargo xtask check-static-language
      - name: Package the exact validated implementation tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validated-tree
          cat > validated-tree/FILES <<'FILES'
          CHANGELOG.md
          crates/ripr/src/agent/loop_commands.rs
          crates/ripr/src/app/agent_status.rs
          crates/ripr/src/lsp/tests.rs
          crates/ripr/src/output/first_pr.rs
          crates/ripr/src/output/pilot/commands.rs
          crates/ripr/src/output/receipt_write.rs
          fixtures/boundary_gap/expected/llm-work-loop/path-with-spaces/review-summary.json
          fixtures/first_successful_pr/boundary-gap/expected/start-here.json
          fixtures/first_successful_pr/boundary-gap/expected/start-here.md
          fixtures/first_successful_pr/output-contract-gap/expected/start-here.json
          fixtures/first_successful_pr/output-contract-gap/expected/start-here.md
          fixtures/first_successful_pr/python-preview-gap/expected/start-here.json
          fixtures/first_successful_pr/python-preview-gap/expected/start-here.md
          policy/process_allowlist.txt
          FILES
          while IFS= read -r file
          do
            mkdir -p "validated-tree/$(dirname "$file")"
            cp "$file" "validated-tree/$file"
          done < validated-tree/FILES
          (
            cd validated-tree
            while IFS= read -r file
            do
              sha256sum "$file"
            done < FILES > SHA256SUMS
          )
          git diff --binary origin/main -- > validated-tree/candidate.patch
          git diff --stat origin/main -- > validated-tree/diff-stat.txt
      - name: Upload the validated implementation tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-final-2347-${{ github.run_id }}
          path: validated-tree/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 2

  commit:
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/advisory-command-bash-argv-2347'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the unchanged claimed branch for the bounded write
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/advisory-command-bash-argv-2347
          fetch-depth: 0
          persist-credentials: true
      - name: Verify that the validated revision is still live
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "fix/advisory-command-bash-argv-2347"
      - name: Download the validated implementation tree
        uses: actions/download-artifact@v8
        with:
          name: validated-final-2347-${{ github.run_id }}
          path: validated-tree
      - name: Verify, copy, cage, and commit the clean result
        shell: bash
        run: |
          set -euo pipefail
          (
            cd validated-tree
            sha256sum -c SHA256SUMS
          )
          while IFS= read -r file
          do
            mkdir -p "$(dirname "$file")"
            cp "validated-tree/$file" "$file"
          done < validated-tree/FILES
          rm -rf validated-tree
          git add \
            CHANGELOG.md \
            crates/ripr/src/agent/loop_commands.rs \
            crates/ripr/src/app/agent_status.rs \
            crates/ripr/src/lsp/tests.rs \
            crates/ripr/src/output/first_pr.rs \
            crates/ripr/src/output/pilot/commands.rs \
            crates/ripr/src/output/receipt_write.rs \
            fixtures/boundary_gap/expected/llm-work-loop/path-with-spaces/review-summary.json \
            fixtures/first_successful_pr/boundary-gap/expected/start-here.json \
            fixtures/first_successful_pr/boundary-gap/expected/start-here.md \
            fixtures/first_successful_pr/output-contract-gap/expected/start-here.json \
            fixtures/first_successful_pr/output-contract-gap/expected/start-here.md \
            fixtures/first_successful_pr/python-preview-gap/expected/start-here.json \
            fixtures/first_successful_pr/python-preview-gap/expected/start-here.md \
            policy/process_allowlist.txt
          git rm \
            .github/patches/2347.py \
            .github/patches/2347-expectations.py \
            .github/workflows/validate-2347-bash-argv.yml
          git diff --cached --check
          git diff --cached --name-only | sort > actual-files.txt
          cat > expected-files.txt <<'FILES'
          .github/patches/2347-expectations.py
          .github/patches/2347.py
          .github/workflows/validate-2347-bash-argv.yml
          CHANGELOG.md
          crates/ripr/src/agent/loop_commands.rs
          crates/ripr/src/app/agent_status.rs
          crates/ripr/src/lsp/tests.rs
          crates/ripr/src/output/first_pr.rs
          crates/ripr/src/output/pilot/commands.rs
          crates/ripr/src/output/receipt_write.rs
          fixtures/boundary_gap/expected/llm-work-loop/path-with-spaces/review-summary.json
          fixtures/first_successful_pr/boundary-gap/expected/start-here.json
          fixtures/first_successful_pr/boundary-gap/expected/start-here.md
          fixtures/first_successful_pr/output-contract-gap/expected/start-here.json
          fixtures/first_successful_pr/output-contract-gap/expected/start-here.md
          fixtures/first_successful_pr/python-preview-gap/expected/start-here.json
          fixtures/first_successful_pr/python-preview-gap/expected/start-here.md
          policy/process_allowlist.txt
          FILES
          sort -o expected-files.txt expected-files.txt
          diff -u expected-files.txt actual-files.txt
          rm actual-files.txt expected-files.txt
          git -c user.name='EffortlessSteven' \
              -c user.email='git@effortlesssteven.com' \
              -c commit.gpgSign=false \
              commit -m 'security(agent): make advisory command argv round-trip through Bash (#2347)'
          git push origin HEAD:refs/heads/fix/advisory-command-bash-argv-2347
