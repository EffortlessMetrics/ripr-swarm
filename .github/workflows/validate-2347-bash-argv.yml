name: Validate #2347 complete Bash argv encoder

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: validate-2347-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/advisory-command-bash-argv-2347'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Check out the exclusively claimed branch without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/advisory-command-bash-argv-2347
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Import the already-reviewed call-site routing from obsolete PR #2386
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin codex/shell-arg-escaping-2347
          old="$(git rev-parse FETCH_HEAD)"
          for file in \
            CHANGELOG.md \
            crates/ripr/src/output/first_pr.rs \
            crates/ripr/src/output/pilot/commands.rs \
            fixtures/first_successful_pr/python-preview-gap/expected/start-here.json \
            fixtures/first_successful_pr/python-preview-gap/expected/start-here.md
          do
            git show "${old}:${file}" > "${file}"
          done
      - name: Apply the total encoder and align pinned receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/2347.py
          python3 .github/patches/2347-expectations.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          rm \
            .github/patches/2347.py \
            .github/patches/2347-expectations.py \
            .github/workflows/validate-2347-bash-argv.yml
      - name: All-target Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee 01-clippy.log
      - name: Encoder and real Bash proofs
        id: loop
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo test -p ripr --lib loop_commands -- --test-threads=1 2>&1 | tee 02-loop.log
      - name: First-PR projections
        id: first_pr
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo test -p ripr --lib first_pr -- --test-threads=4 2>&1 | tee 03-first-pr.log
      - name: Pilot projections
        id: pilot
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo test -p ripr --lib pilot -- --test-threads=4 2>&1 | tee 04-pilot.log
      - name: Full library expectation inventory
        id: library
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo test -p ripr --lib 2>&1 | tee 05-library.log
      - name: Golden contract
        id: goldens
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo xtask goldens check 2>&1 | tee 06-goldens.log
      - name: Process policy
        id: process
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo xtask check-process-policy 2>&1 | tee 07-process.log
      - name: File policy
        id: files
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo xtask check-file-policy 2>&1 | tee 08-files.log
      - name: Static language
        id: static
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo xtask check-static-language 2>&1 | tee 09-static.log
      - name: Retain the exact candidate patch and outcome matrix
        if: always()
        shell: bash
        env:
          CLIPPY: ${{ steps.clippy.outcome }}
          LOOP: ${{ steps.loop.outcome }}
          FIRST_PR: ${{ steps.first_pr.outcome }}
          PILOT: ${{ steps.pilot.outcome }}
          LIBRARY: ${{ steps.library.outcome }}
          GOLDENS: ${{ steps.goldens.outcome }}
          PROCESS: ${{ steps.process.outcome }}
          FILES: ${{ steps.files.outcome }}
          STATIC: ${{ steps.static.outcome }}
        run: |
          set -euo pipefail
          mkdir -p validation-2347
          git diff --binary origin/main -- > validation-2347/candidate.patch
          git diff --stat origin/main -- > validation-2347/diff-stat.txt
          printf '%s\n' \
            "clippy=${CLIPPY}" \
            "loop=${LOOP}" \
            "first_pr=${FIRST_PR}" \
            "pilot=${PILOT}" \
            "library=${LIBRARY}" \
            "goldens=${GOLDENS}" \
            "process=${PROCESS}" \
            "files=${FILES}" \
            "static=${STATIC}" \
            > validation-2347/outcomes.txt
          cp ./*.log validation-2347/ 2>/dev/null || true
      - name: Upload validation packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validate-2347-${{ github.run_id }}
          path: validation-2347/
          if-no-files-found: error
          retention-days: 2
      - name: Fail until every acceptance surface is green
        if: always()
        shell: bash
        env:
          CLIPPY: ${{ steps.clippy.outcome }}
          LOOP: ${{ steps.loop.outcome }}
          FIRST_PR: ${{ steps.first_pr.outcome }}
          PILOT: ${{ steps.pilot.outcome }}
          LIBRARY: ${{ steps.library.outcome }}
          GOLDENS: ${{ steps.goldens.outcome }}
          PROCESS: ${{ steps.process.outcome }}
          FILES: ${{ steps.files.outcome }}
          STATIC: ${{ steps.static.outcome }}
        run: |
          for outcome in "$CLIPPY" "$LOOP" "$FIRST_PR" "$PILOT" "$LIBRARY" "$GOLDENS" "$PROCESS" "$FILES" "$STATIC"
          do
            test "$outcome" = success || exit 1
          done
