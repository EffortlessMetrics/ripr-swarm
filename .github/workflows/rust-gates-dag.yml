# Inactive #8197/#8198 integration. No development, dispatch or queue subscriber.
# Production routing still calls rust-gates.yml. This route must be qualified
# within the standing cap before any separate activation decision.
name: Staged Rust producer DAG
on:
  workflow_call:
    inputs:
      head-sha:
        type: string
        required: true
      base-sha:
        type: string
        required: true
      subject-sha:
        type: string
        required: true
      subject-tree:
        type: string
        required: true
      subject-json:
        type: string
        required: true
      subject-identity:
        type: string
        required: true
      workflow-generation:
        type: string
        required: true
      request-id:
        type: string
        required: true
      constituent-pr-number:
        type: string
        required: true
      constituent-pr-node-id:
        type: string
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    env:
      CARGO_BUILD_JOBS: '4'
      RIPR_DAG_SUBJECT: ${{ inputs.subject-json }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.subject-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.base-sha }}
          path: controller
          persist-credentials: false
      - uses: ./controller/.github/actions/verify-merge-group-subject
        with:
          head-sha: ${{ inputs.head-sha }}
          base-sha: ${{ inputs.base-sha }}
          subject-sha: ${{ inputs.subject-sha }}
          subject-tree: ${{ inputs.subject-tree }}
          workflow-generation: ${{ inputs.workflow-generation }}
          request-id: ${{ inputs.request-id }}
          expected-subject-json: ${{ inputs.subject-json }}
          expected-subject-identity: ${{ inputs.subject-identity }}
          require-caller-receipt: 'true'
          constituent-pr-number: ${{ inputs.constituent-pr-number }}
          constituent-pr-node-id: ${{ inputs.constituent-pr-node-id }}
          constituent-head-sha: ${{ inputs.head-sha }}
      - name: Refuse self-policy changes before compiling candidate code
        env:
          BASE: ${{ inputs.base-sha }}
        run: git diff --exit-code "$BASE" HEAD -- xtask tools/repo-policy .github .cargo .config policy Cargo.toml Cargo.lock rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Compile trusted base controller in private state
        working-directory: controller
        run: |
          mkdir -p target
          cargo build --locked -p xtask --bin xtask --target-dir "$RUNNER_TEMP/rust-dag-controller-target"
      - name: Admit complete plan
        id: plan
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rust-dag-controller-target/debug/xtask" product-gate-dag plan plan.json > matrix.json
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rust-dag-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: plan.json
          if-no-files-found: error
          retention-days: 5
  execute:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/rust-gates-dag-branch.yml
    with:
      branch: ${{ matrix.branch }}
      runner-config: '"ubuntu-latest"'
      use-scratch: false
      test-shards: 1
      artifact-name: rust-dag-${{ matrix.branch }}-${{ github.run_id }}-${{ github.run_attempt }}
      proof-profile: qualification
      head-sha: ${{ inputs.head-sha }}
      base-sha: ${{ inputs.base-sha }}
      subject-sha: ${{ inputs.subject-sha }}
      subject-tree: ${{ inputs.subject-tree }}
      subject-json: ${{ inputs.subject-json }}
      subject-identity: ${{ inputs.subject-identity }}
      workflow-generation: ${{ inputs.workflow-generation }}
      request-id: ${{ inputs.request-id }}
      constituent-pr-number: ${{ inputs.constituent-pr-number }}
      constituent-pr-node-id: ${{ inputs.constituent-pr-node-id }}
      constituent-head-sha: ${{ inputs.head-sha }}
  result:
    if: always()
    needs: [plan, execute]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '4'
      RIPR_DAG_SUBJECT: ${{ inputs.subject-json }}
    steps:
      - name: Refuse failed or incomplete native jobs
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          EXECUTION_RESULT: ${{ needs.execute.result }}
        run: test "$PLAN_RESULT" = success && test "$EXECUTION_RESULT" = success
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.subject-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse self-policy changes before compiling finalizer
        env:
          BASE: ${{ inputs.base-sha }}
        run: git diff --exit-code "$BASE" HEAD -- xtask tools/repo-policy .github .cargo .config policy Cargo.toml Cargo.lock rust-toolchain.toml
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.base-sha }}
          path: controller
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - name: Compile trusted base finalizer in private state
        working-directory: controller
        run: |
          mkdir -p target
          cargo build --locked -p xtask --bin xtask --target-dir "$RUNNER_TEMP/rust-dag-controller-target"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: rust-dag-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .dag
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rust-dag-result-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: results
      - name: Reconcile every exact-subject obligation
        run: '"$RUNNER_TEMP/rust-dag-controller-target/debug/xtask" product-gate-dag finalize .dag/plan.json results'
