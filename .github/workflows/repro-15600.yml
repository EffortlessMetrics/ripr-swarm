name: repro-15600
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: repro-15600
      - name: Full lib suite, in-process, 4 threads
        run: |
          set -uo pipefail
          cargo test -p ripr --lib -- --test-threads=4 > lib.log 2>&1
          status=$?
          echo "lib_exit=$status"
          grep -n "switch_literal_return_controls" lib.log | head -5 || true
          echo "--- DIAG ---"
          grep -n "DIAG" lib.log | head -5 || true
          grep -n "test result:" lib.log | tail -3 || true
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-15600-lib-log
          path: lib.log
          retention-days: 7
