name: repro-15600
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: repro-15600
      - name: Install nextest
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/0.9.121/linux | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest --version
      - name: Three nextest passes of the lib suite
        run: |
          set -uo pipefail
          for pass in 1 2 3; do
            cargo nextest run -p ripr --lib --no-fail-fast > "pass-$pass.log" 2>&1
            echo "pass=$pass exit=$?"
            grep -n "switch_literal_return_controls" "pass-$pass.log" | head -3 || true
            grep -n "DIAG" "pass-$pass.log" | head -3 || true
            grep -n "Summary" "pass-$pass.log" | tail -1 || true
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-15600-nextest-logs
          path: pass-*.log
          retention-days: 7
