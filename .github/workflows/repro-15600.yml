name: repro-15600
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: repro-15600
      - name: Build the lib test binary
        run: |
          set -euo pipefail
          cargo test -p ripr --lib switch_literal_return_controls --no-run 2>&1 | tee build.log
          bin=$(grep -o 'target/debug/deps/ripr-[a-f0-9]*' build.log | tail -1)
          echo "BIN=$bin" >> "$GITHUB_ENV"
      - name: Run the test 100 times, 8 at a time
        run: |
          set -uo pipefail
          pass=0; fail=0
          run_one() {
            if "$BIN" analysis::language::typescript::tests::infection_tests::switch_literal_return_controls --exact --test-threads=1 > "run-$1.log" 2>&1; then
              echo pass
            else
              echo fail
            fi
          }
          export -f run_one
          export BIN
          seq 1 100 | xargs -P 8 -I{} bash -c 'run_one {}' > results.txt
          pass=$(grep -c '^pass$' results.txt || true)
          fail=$(grep -c '^fail$' results.txt || true)
          echo "runs=100 pass=$pass fail=$fail"
          echo "--- DIAG lines ---"
          grep -h "DIAG" run-*.log | head -40 || true
          echo "--- failing run ids ---"
          for f in run-*.log; do grep -q "DIAG" "$f" && echo "$f"; done | head -20
          [ "$fail" -eq 0 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-15600-logs
          path: |
            run-*.log
            results.txt
            build.log
          retention-days: 7
