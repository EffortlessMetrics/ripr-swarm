name: repro-15600
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: repro-15600
      - name: Prepare locked owner-return fixture dependencies
        run: |
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml
      - name: Install nextest
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/0.9.121/linux | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest --version
      - name: Three shard-2 passes
        run: |
          set +e
          set -uo pipefail
          for pass in 1 2 3; do
            cargo nextest run --workspace --profile ci --partition hash:2/2 --no-fail-fast > "pass-$pass.log" 2>&1
            status=$?
            echo "pass=$pass exit=$status"
            grep -a "switch_literal_return_controls" "pass-$pass.log" | head -3
            grep -a "DIAG" "pass-$pass.log" | head -3
            grep -a "Summary" "pass-$pass.log" | tail -1
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repro-15600-shard-logs
          path: pass-*.log
          retention-days: 7
