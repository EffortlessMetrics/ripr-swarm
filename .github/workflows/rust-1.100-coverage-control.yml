name: Diagnose Rust 1.100 coverage generation

on:
  push:
    branches:
      - build/rust-1.100-upgrade
    paths:
      - .github/workflows/rust-1.100-coverage-control.yml

permissions:
  contents: read

concurrency:
  group: rust-1.100-coverage-control
  cancel-in-progress: false

jobs:
  direct-control:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: 7fa784bc6e4c7dd4f502cbe71471b73303c489c3
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview

      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov

      - name: Record control environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/ripr/reports/coverage-control
          {
            rustc -vV
            cargo -vV
            cargo llvm-cov --version
            echo '--- memory ---'
            free -h
            echo '--- filesystem ---'
            df -h . target 2>/dev/null || df -h .
            echo '--- limits ---'
            ulimit -a
          } | tee target/ripr/reports/coverage-control/environment.txt

      - name: Prepare exact coverage command
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml
          cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml
          cargo llvm-cov clean --workspace
          cargo build -p ripr

      - name: Run direct coverage control
        id: direct
        continue-on-error: true
        env:
          CARGO_PROFILE_TEST_STRIP: debuginfo
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/ripr/reports/coverage-control
          /usr/bin/time -v cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            2>&1 | tee target/ripr/reports/coverage-control/direct.log
          status=${PIPESTATUS[0]}
          printf '%s\n' "$status" > target/ripr/reports/coverage-control/exit-status.txt
          exit "$status"

      - name: Record terminal resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "direct_outcome=${{ steps.direct.outcome }}"
            echo "lcov_exists=$([ -s lcov.info ] && echo yes || echo no)"
            echo '--- memory ---'
            free -h
            echo '--- filesystem ---'
            df -h . target 2>/dev/null || df -h .
          } | tee target/ripr/reports/coverage-control/terminal.txt

      - name: Upload direct coverage control
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-1.100-coverage-control
          path: |
            target/ripr/reports/coverage-control
            lcov.info
          if-no-files-found: warn
          retention-days: 5

      - name: Require direct control success
        if: steps.direct.outcome != 'success'
        run: exit 1
