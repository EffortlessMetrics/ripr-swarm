name: Internal apply spec-age correction

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'internal/3455-apply-semantic-correction'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout child branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove temporal spec validity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path("xtask/src/main.rs")
          main = main_path.read_text(encoding="utf-8")
          start_marker = "        // #2708: flag proposed specs older than 90 days without review.\n"
          end_marker = "        for heading in required_spec_headings() {\n"
          if main.count(start_marker) != 1:
              raise SystemExit(f"expected one temporal spec-age block, found {main.count(start_marker)}")
          start = main.index(start_marker)
          end = main.index(end_marker, start)
          main = main[:start] + main[end:]
          if "has been `proposed` for {days} days without review" in main:
              raise SystemExit("temporal spec-age diagnostic remains after edit")
          main_path.write_text(main, encoding="utf-8")

          allowlist_path = Path("policy/process_allowlist.txt")
          allowlist = allowlist_path.read_text(encoding="utf-8")
          age_rows = (
              "xtask/src/main.rs|Command::new|9|repository-gates|#2343/#3435: diff-aware gate reads changed files; proposed-spec age validation performs one bounded git log lookup, and its test fixtures create temporary Git repositories with pinned commit timestamps.\n"
              "xtask/src/main.rs|use std::process::Command|1|spec-age-policy-tests|#3435: proposed-spec age tests import Command only for isolated temporary Git repository setup.\n"
          )
          gate_row = (
              "xtask/src/main.rs|Command::new|1|gate-runner|#2343: diff-aware gate runner reads changed files via git diff\n"
          )
          if allowlist.count(age_rows) != 1:
              raise SystemExit("expected one proposed-spec process-policy allowance pair")
          allowlist_path.write_text(allowlist.replace(age_rows, gate_row, 1), encoding="utf-8")

          Path(".github/workflows/internal-3455-apply.yml").unlink()
          PY

      - name: Verify focused correction
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo xtask check-spec-format
          cargo xtask check-process-policy
          git diff --check

      - name: Commit verified result
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git commit -m "fix(specs): remove temporal validity from spec format (#3455)"
          git push origin "HEAD:${HEAD_BRANCH}"

# default-base retarget trigger
