name: Repair PR 4699 review findings once

on:
  push:
    branches:
      - feat/4521-final-native-payload

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4521-final-native-payload
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # v1
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Repair reusable qualification receipt boundaries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          def joined(*lines: str) -> str:
              return "\n".join(lines)

          workflow_repository_expr = "$" + "{{ job.workflow_repository }}"
          workflow_sha_expr = "$" + "{{ job.workflow_sha }}"
          github_sha_expr = "$" + "{{ github.sha }}"

          workflow = Path(".github/workflows/server-archive-qualification.yml")
          replace_once(
              workflow,
              "            archive_sha256 = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()\n            cargo_lock_sha256 =",
              "            archive_sha256 = (Get-FileHash -Algorithm SHA256 $archivePath).Hash.ToLowerInvariant()\n            archive_readback_verified = $true\n            cargo_lock_sha256 =",
          )
          replace_once(
              workflow,
              "execution: {selected: 5, executed: 5, failed: 0, not_run: 0}, build_identities:",
              "execution: {selected: 5, executed: 5, failed: 0, not_run: 0}, archive_readback_verified: true, build_identities:",
          )
          old_instrument = joined(
              '      - name: Fetch receipt instrument without credentials',
              '        shell: bash',
              '        run: |',
              '          set -euo pipefail',
              '          git init "${GITHUB_WORKSPACE}"',
              '          git -C "${GITHUB_WORKSPACE}" remote add origin "https://github.com/EffortlessMetrics/ripr-swarm.git"',
              '          git -C "${GITHUB_WORKSPACE}" -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${GITHUB_SHA}"',
              '          git -C "${GITHUB_WORKSPACE}" checkout --detach FETCH_HEAD',
          )
          new_instrument = joined(
              '      - name: Fetch receipt instrument without credentials',
              '        shell: bash',
              '        env:',
              f'          RECEIPT_INSTRUMENT_REPOSITORY: {workflow_repository_expr}',
              f'          RECEIPT_INSTRUMENT_SHA: {workflow_sha_expr}',
              '        run: |',
              '          set -euo pipefail',
              '          test "${RECEIPT_INSTRUMENT_REPOSITORY}" = "EffortlessMetrics/ripr-swarm"',
              '          [[ "${RECEIPT_INSTRUMENT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]',
              '          git init "${GITHUB_WORKSPACE}"',
              '          git -C "${GITHUB_WORKSPACE}" remote add origin "https://github.com/EffortlessMetrics/ripr-swarm.git"',
              '          git -C "${GITHUB_WORKSPACE}" -c credential.helper= -c http.extraheader= fetch --no-tags --depth=1 origin "${RECEIPT_INSTRUMENT_SHA}"',
              '          git -C "${GITHUB_WORKSPACE}" checkout --detach FETCH_HEAD',
          )
          replace_once(workflow, old_instrument, new_instrument)
          replace_once(
              workflow,
              "conclusion=\"$(jq -r --arg name \"build and qualify ${target}\" '[.jobs[] | select(.name == $name)] | if length == 1 then .[0].conclusion // \"unknown\" elif length == 0 then \"missing\" else \"duplicate\" end' \"${response}\")\"",
              "conclusion=\"$(jq -r --arg suffix \"build and qualify ${target}\" '[.jobs[] | select(.name == $suffix or (.name | endswith(\" / \" + $suffix)))] | if length == 1 then .[0].conclusion // \"unknown\" elif length == 0 then \"missing\" else \"duplicate\" end' \"${response}\")\"",
          )

          tests = Path("xtask/src/tests.rs")
          marker_anchor = joined(
              '            "--arg repository \\"${REPOSITORY}\\"",',
              '            "release_assets_created: false",',
              '',
          )
          marker_insert = marker_anchor + joined(
              '            "archive_readback_verified = $true",',
              '            "archive_readback_verified: true",',
              f'            "RECEIPT_INSTRUMENT_REPOSITORY: {workflow_repository_expr}",',
              f'            "RECEIPT_INSTRUMENT_SHA: {workflow_sha_expr}",',
              '            "endswith(\\" / \\" + $suffix)",',
              '',
          )
          replace_once(tests, marker_anchor, marker_insert)

          negative_anchor = joined(
              '        (',
              '            "token credential",',
              '            workflow.replacen("ruleset_mode", "GH_TOKEN", 1),',
              '        ),',
              '',
          )
          negative_insert = joined(
              '        (',
              '            "caller SHA receipt instrument",',
              '            workflow.replacen(',
              f'                "RECEIPT_INSTRUMENT_SHA: {workflow_sha_expr}",',
              f'                "RECEIPT_INSTRUMENT_SHA: {github_sha_expr}",',
              '                1,',
              '            ),',
              '        ),',
              '        (',
              '            "exact-only matrix job lookup",',
              '            workflow.replacen(',
              '                "select(.name == $suffix or (.name | endswith(\\" / \\" + $suffix)))",',
              '                "select(.name == $suffix)",',
              '                1,',
              '            ),',
              '        ),',
              '        (',
              '            "implicit archive readback",',
              '            workflow.replacen(',
              '                "archive_readback_verified: true",',
              '                "archive_shape_verified: true",',
              '                1,',
              '            ),',
              '        ),',
              '        (',
              '            "token credential",',
              '            workflow.replacen("ruleset_mode", "GH_TOKEN", 1),',
              '        ),',
              '',
          )
          replace_once(tests, negative_anchor, negative_insert)

          new_test = r'''
          #[test]
          fn server_archive_terminal_job_name_filter_accepts_direct_and_reusable_names(
          ) -> Result<(), String> {
              let repo_root = Path::new(env!("CARGO_MANIFEST_DIR"))
                  .parent()
                  .ok_or_else(|| "xtask manifest should have a repository parent".to_string())?;
              let workflow = fs::read_to_string(
                  repo_root.join(".github/workflows/server-archive-qualification.yml"),
              )
              .map_err(|error| format!("failed to read qualification workflow: {error}"))?;
              let marker = r#"conclusion="$(jq -r --arg suffix "build and qualify ${target}" '"#;
              let filter_start = workflow
                  .find(marker)
                  .map(|offset| offset + marker.len())
                  .ok_or_else(|| "terminal job-name jq marker is missing".to_string())?;
              let terminator = r#"' "${response}")""#;
              let filter_end = workflow[filter_start..]
                  .find(terminator)
                  .ok_or_else(|| "terminal job-name jq terminator is missing".to_string())?;
              let filter = workflow[filter_start..filter_start + filter_end].trim();
              let root = temp_dir("server-terminal-job-names");
              let fixture = root.join("workflow-jobs.json");
              let suffix = "build and qualify x86_64-unknown-linux-gnu";
              let run = |names: &[&str]| -> Result<String, String> {
                  let jobs = names
                      .iter()
                      .map(|name| serde_json::json!({"name": name, "conclusion": "success"}))
                      .collect::<Vec<_>>();
                  fs::write(
                      &fixture,
                      serde_json::to_vec(&serde_json::json!({"jobs": jobs}))
                          .map_err(|error| format!("serialize workflow-jobs fixture: {error}"))?,
                  )
                  .map_err(|error| format!("write {}: {error}", fixture.display()))?;
                  let output = std::process::Command::new("jq")
                      .args(["-r", "--arg", "suffix", suffix, filter])
                      .arg(&fixture)
                      .output()
                      .map_err(|error| format!("run terminal job-name jq filter: {error}"))?;
                  if !output.status.success() {
                      return Err(format!(
                          "terminal job-name jq filter failed: {}",
                          String::from_utf8_lossy(&output.stderr)
                      ));
                  }
                  String::from_utf8(output.stdout)
                      .map(|value| value.trim().to_string())
                      .map_err(|error| format!("terminal job-name jq output was not UTF-8: {error}"))
              };

              let rehearse = format!("rehearse / {suffix}");
              let qualify = format!("qualify / {suffix}");
              assert_eq!(run(&[suffix])?, "success");
              assert_eq!(run(&[&rehearse])?, "success");
              assert_eq!(run(&[&qualify])?, "success");
              assert_eq!(run(&[])?, "missing");
              assert_eq!(run(&[suffix, &rehearse])?, "duplicate");
              ignore_remove_dir_all(&root);
              Ok(())
          }

          '''
          replace_once(
              tests,
              "#[test]\nfn server_archive_ruleset_shape_fixtures_are_strict_and_discriminating()",
              new_test + "#[test]\nfn server_archive_ruleset_shape_fixtures_are_strict_and_discriminating()",
          )
          PY
          git rm -f .github/workflows/zz-repair-4699-review.yml

      - name: Validate focused repair
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all
          cargo +1.95.0 fmt --all --check
          cargo +1.95.0 test -p xtask server_archive_qualification_workflow_is_sha_bound_and_credential_free -- --nocapture
          cargo +1.95.0 test -p xtask server_archive_terminal_job_name_filter_accepts_direct_and_reusable_names -- --nocapture
          cargo +1.95.0 xtask check-workflows
          cargo +1.95.0 xtask check-release-targets
          git diff --check

      - name: Commit and push repaired candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(distribution): harden reusable terminal qualification"
          git push origin HEAD:feat/4521-final-native-payload
