name: "Apply #2383 validated CLI fixture patch"

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: apply-2383-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/validated-cli-fixture-head-2383'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exclusively claimed branch without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/validated-cli-fixture-head-2383
          fetch-depth: 0
          persist-credentials: false
      - name: Install the repository toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt
      - name: Verify the claimed revision and temporary-only branch delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "fix/validated-cli-fixture-head-2383"
          mapfile -t changed < <(git diff --name-only origin/main...HEAD)
          printf 'temporary branch files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 2
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/patches/2383.patch
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/apply-cli-head-2383.yml
      - name: Apply the exact reviewed Rust transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/2383.patch
          git status --short
      - name: Format the patched Rust source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
      - name: Enforce diff hygiene and the one-file cage
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          mapfile -t changed < <(git diff --name-only)
          printf 'working-tree files:\n%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/ripr/tests/cli_smoke.rs"
      - name: Prove concrete repository-head selection
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ripr --test cli_smoke fixture_repository_head -- --test-threads=1
      - name: Prove the editor-agent loop and adjacent artifact contracts
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p ripr --test cli_smoke editor_agent_loop_fixture_outputs_match_expected -- --exact --test-threads=1
          cargo test -p ripr --test cli_smoke agent_verify -- --test-threads=4
          cargo test -p ripr --test cli_smoke agent_receipt -- --test-threads=4
      - name: Package the validated Rust file with its digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .validated
          cp crates/ripr/tests/cli_smoke.rs .validated/cli_smoke.rs
          (cd .validated && sha256sum cli_smoke.rs > SHA256SUMS)
      - name: Upload the validated source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validated-cli-head-2383-${{ github.run_id }}
          path: .validated/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  commit:
    needs: validate
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/validated-cli-fixture-head-2383'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the same claimed branch for the bounded write
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/validated-cli-fixture-head-2383
          fetch-depth: 0
          persist-credentials: true
      - name: Verify that the branch did not move during validation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          test "$(git branch --show-current)" = "fix/validated-cli-fixture-head-2383"
      - name: Download the validated source artifact
        uses: actions/download-artifact@v8
        with:
          name: validated-cli-head-2383-${{ github.run_id }}
          path: .validated
      - name: Verify and commit only the validated test repair
        shell: bash
        run: |
          set -euo pipefail
          (cd .validated && sha256sum -c SHA256SUMS)
          cp .validated/cli_smoke.rs crates/ripr/tests/cli_smoke.rs
          rm -rf .validated
          git add crates/ripr/tests/cli_smoke.rs
          git rm .github/patches/2383.patch .github/workflows/apply-cli-head-2383.yml
          mapfile -t changed < <(git diff --cached --name-only)
          test "${#changed[@]}" -eq 3
          printf '%s\n' "${changed[@]}" | grep -Fxq crates/ripr/tests/cli_smoke.rs
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/patches/2383.patch
          printf '%s\n' "${changed[@]}" | grep -Fxq .github/workflows/apply-cli-head-2383.yml
          git diff --cached --check
          git -c user.name='RIPR release operator' \
              -c user.email='release-operator@example.invalid' \
              -c commit.gpgSign=false \
              commit -m 'test(cli): require concrete fixture repository HEADs (#2383)'
          git push origin HEAD:refs/heads/fix/validated-cli-fixture-head-2383
