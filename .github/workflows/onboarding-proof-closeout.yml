name: Onboarding repair closeout (non-shipping)
run-name: Onboarding formatting, lint and rejection controls
on:
  push:
    branches: [codex/onboarding-focused-proof-10993-10994]
    paths: [.github/workflows/onboarding-proof-closeout.yml]
permissions:
  contents: read
concurrency:
  group: onboarding-repair-closeout-${{ github.ref }}
  cancel-in-progress: false
jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - owner: python
            subject: f5dc763a3b993e5b71ebe04173d6feeeb467d817
            predecessor: 635ced5612915ebef3ad1d0e68064af8d235a3b2
            package: ripr
            filter: analysis::language::python::fact_store
            witness: concurrent_stores_cannot_overspend_the_shared_budget
            production: crates/ripr/src/analysis/language/python/fact_store.rs
          - owner: xtask
            subject: 0fa8f926d10d2592510ecce994f8cea7464ba5f4
            predecessor: 417a25357388a7b25494b69fc5ba937f584aec74
            package: xtask
            filter: assistant_loop_health
            witness: assistant_loop_health_stays_in_the_production_fixture_contract_gate
            production: xtask/src/fixture_contracts/report_validators.rs
    name: ${{ matrix.owner }} repair and rejection control
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
      SUBJECT: ${{ matrix.subject }}
      PREDECESSOR: ${{ matrix.predecessor }}
      OWNER: ${{ matrix.owner }}
      PACKAGE: ${{ matrix.package }}
      FILTER: ${{ matrix.filter }}
      WITNESS: ${{ matrix.witness }}
      PRODUCTION: ${{ matrix.production }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.subject }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Bind identity and unchanged production
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/onboarding-closeout"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test "$(git rev-parse HEAD^)" = "$PREDECESSOR"
          test -z "$(git status --porcelain)"
          git diff --exit-code "$PREDECESSOR" "$SUBJECT" -- "$PRODUCTION" Cargo.toml Cargo.lock rust-toolchain.toml
          git diff "$PREDECESSOR" "$SUBJECT" > "$EVIDENCE/repair.patch"
          {
            printf 'controller=%s\nsubject=%s\npredecessor=%s\nrun=%s\n' "$GITHUB_SHA" "$SUBJECT" "$PREDECESSOR" "$GITHUB_RUN_ID"
            git rev-parse HEAD^{tree}
            git rev-parse "HEAD:$PRODUCTION"
            rustc +1.95.0 -Vv
            cargo +1.95.0 -Vv
            nproc
            free -h
          } > "$EVIDENCE/identity.txt"
      - name: Pinned formatting
        run: |
          set -euo pipefail
          cargo +1.95.0 fmt --all -- --check > "$EVIDENCE/format.stdout" 2> "$EVIDENCE/format.stderr"
          echo 'format_exit=0' >> "$EVIDENCE/status.txt"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          shared-key: ripr-swarm-rust-small-${{ runner.os }}
          save-if: 'false'
      - name: Exact repaired-head positive checks
        id: positive
        run: |
          set -euo pipefail
          run() {
            local name="$1"; shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"
            set +e
            timeout --signal=TERM --kill-after=30s 1500s "$@" > "$EVIDENCE/$name.stdout" 2> "$EVIDENCE/$name.stderr"
            local code=$?
            set -e
            echo "$name exit=$code" | tee -a "$EVIDENCE/status.txt"
            if [ "$code" -ne 0 ]; then tail -n 100 "$EVIDENCE/$name.stdout" "$EVIDENCE/$name.stderr"; return "$code"; fi
          }
          run clippy cargo +1.95.0 clippy --locked -p "$PACKAGE" --all-targets -- -D warnings
          if [ "$OWNER" = python ]; then
            run positive cargo +1.95.0 test --locked -p ripr --lib "$FILTER" -- --nocapture
          else
            run positive cargo +1.95.0 test --locked -p xtask "$FILTER" -- --nocapture
            run production-gate cargo +1.95.0 run --locked -p xtask -- check-fixture-contracts
          fi
          grep -E "test .*${WITNESS} \.\.\. ok" "$EVIDENCE/positive.stdout"
          grep 'test result:' "$EVIDENCE/positive.stdout"
          git diff --exit-code
      - name: Wrong implementation must fail for the intended assertion
        run: |
          set -euo pipefail
          if [ "$OWNER" = python ]; then
            file=crates/ripr/src/analysis/language/python/fact_store.rs
            expected='exactly three equal-size entries fit the shared budget'
          else
            file=xtask/src/fixture_contracts/mod.rs
            expected='production gate accepted a malformed corpus'
          fi
          trap 'git restore --source="$SUBJECT" -- "$file"' EXIT
          python3 - <<'PY'
          import os
          from pathlib import Path
          if os.environ['OWNER'] == 'python':
              path = Path('crates/ripr/src/analysis/language/python/fact_store.rs')
              old, new = 'remaining.checked_sub(approx_bytes)', 'remaining.checked_sub(approx_bytes).map(|_| remaining)'
          else:
              path = Path('xtask/src/fixture_contracts/mod.rs')
              old, new = '    validate_assistant_loop_health_fixture_corpus(&mut violations)?;\n', ''
          text = path.read_text()
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
          git diff > "$EVIDENCE/wrong-implementation.patch"
          test_args=(-p "$PACKAGE")
          if [ "$OWNER" = python ]; then test_args+=(--lib); fi
          set +e
          timeout --signal=TERM --kill-after=30s 1500s cargo +1.95.0 test --locked "${test_args[@]}" "$WITNESS" -- --nocapture > "$EVIDENCE/negative.stdout" 2> "$EVIDENCE/negative.stderr"
          code=$?
          set -e
          echo "negative exit=$code" | tee -a "$EVIDENCE/status.txt"
          test "$code" = 101
          grep -F "$expected" "$EVIDENCE/negative.stdout" "$EVIDENCE/negative.stderr"
          grep -E 'test result: FAILED\. 0 passed; 1 failed;' "$EVIDENCE/negative.stdout"
          git restore --source="$SUBJECT" -- "$file"
          git diff --exit-code
          timeout --signal=TERM --kill-after=30s 1500s cargo +1.95.0 test --locked "${test_args[@]}" "$WITNESS" -- --nocapture > "$EVIDENCE/restored.stdout" 2> "$EVIDENCE/restored.stderr"
          grep -E "test .*${WITNESS} \.\.\. ok" "$EVIDENCE/restored.stdout"
          echo 'restored exit=0' >> "$EVIDENCE/status.txt"
          git diff --exit-code
      - name: Retain native proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: onboarding-closeout-${{ matrix.owner }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/onboarding-closeout
          if-no-files-found: error
          retention-days: 14
