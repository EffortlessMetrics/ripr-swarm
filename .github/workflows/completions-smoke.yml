name: Completions Smoke

# Loads every `ripr completions` script in the shell it targets (#7438): bash
# (`bash -n` and sourcing), zsh (`zsh -n`) and fish (`fish --no-execute`) on a
# hosted Ubuntu runner. The test lives in crates/ripr/tests/completions_command.rs;
# RIPR_REQUIRE_COMPLETION_SHELLS makes a missing shell fail the job instead of
# skipping it, so the lane cannot pass without checking all three.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: completions-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  completions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.95.0

      - name: Install zsh and fish
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh fish

      - name: Load each completion script in its shell
        env:
          RIPR_REQUIRE_COMPLETION_SHELLS: "1"
        run: cargo test --locked -p ripr --test completions_command
