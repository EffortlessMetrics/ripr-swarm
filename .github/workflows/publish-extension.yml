name: Publish VSCode Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.11.0"
        required: true
      source_sha:
        description: "Full 40-hex SOURCE_RELEASE_HEAD the release tag v<version> peels to; the run must be dispatched at it"
        required: true
      manifest_sha256:
        description: "Raw-byte SHA-256 of ripr-server-manifest-v<version>.json from the release transaction receipt"
        required: true
      publish_vs_marketplace:
        description: "Publish to VS Marketplace"
        required: false
        default: "false"
      publish_open_vsx:
        description: "Publish to Open VSX"
        required: false
        default: "false"
  # No tag trigger and no default-on marketplace: each channel is dispatched
  # explicitly per docs/RELEASE_TRANSACTION.md (#1646 owns the full topology).
  # One VSIX per release: the first dispatch builds it and attaches it to the
  # GitHub Release; later dispatches (the other channel) reuse those exact bytes.

permissions:
  contents: write

jobs:
  admit-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one marketplace channel
        env:
          PUBLISH_VS_MARKETPLACE: ${{ github.event.inputs.publish_vs_marketplace }}
          PUBLISH_OPEN_VSX: ${{ github.event.inputs.publish_open_vsx }}
        run: |
          # Fail closed: one dispatch authorizes exactly one channel, so neither
          # "no channel" (a Release write with no marketplace) nor "both" passes.
          case "$PUBLISH_VS_MARKETPLACE/$PUBLISH_OPEN_VSX" in
            true/false | false/true) ;;
            *)
              echo "::error::Set exactly one of publish_vs_marketplace or publish_open_vsx to true (got $PUBLISH_VS_MARKETPLACE/$PUBLISH_OPEN_VSX)"
              exit 1
              ;;
          esac

      - name: Require a release version and receipted digests
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          MANIFEST_SHA256: ${{ github.event.inputs.manifest_sha256 }}
        run: |
          if ! [[ "${RAW_VERSION#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version must be a release version such as 0.11.0 (got $RAW_VERSION)"
            exit 1
          fi
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::source_sha must be 40 lowercase hex and manifest_sha256 64 lowercase hex"
            exit 1
          fi

      - name: Bind the dispatch to the receipted candidate
        env:
          RAW_VERSION: ${{ github.event.inputs.version }}
          SOURCE_SHA: ${{ github.event.inputs.source_sha }}
          RUN_SHA: ${{ github.sha }}
        run: |
          # The candidate is the receipted SOURCE_RELEASE_HEAD, not whatever ref
          # was dispatched: the run commit must equal it and the release tag must
          # peel to it (a lightweight tag resolves to the commit directly).
          [ "$RUN_SHA" = "$SOURCE_SHA" ] \
            || { echo "::error::dispatched at $RUN_SHA but source_sha is $SOURCE_SHA"; exit 1; }
          repo="https://github.com/${GITHUB_REPOSITORY}.git"
          tag="v${RAW_VERSION#v}"
          tag_commit="$(git ls-remote "$repo" "refs/tags/${tag}^{}" | cut -f1)"
          [ -n "$tag_commit" ] || tag_commit="$(git ls-remote "$repo" "refs/tags/${tag}" | cut -f1)"
          [ "$tag_commit" = "$SOURCE_SHA" ] \
            || { echo "::error::tag $tag resolves to '${tag_commit}', not source_sha $SOURCE_SHA"; exit 1; }

  verify-server-assets:
    # Anchors the editor's admitted manifest digest to the receipted value and
    # proves every archive the manifest names is published with the digest the
    # manifest claims, before any VSIX is built or published.
    needs: admit-dispatch
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.version }}
      MANIFEST_SHA256: ${{ github.event.inputs.manifest_sha256 }}
    steps:
      - name: Fetch the server manifest
        run: |
          version="${RAW_VERSION#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          manifest="ripr-server-manifest-v${version}.json"
          mkdir -p server
          for attempt in $(seq 1 90); do
            curl -fsSL -o "server/$manifest" "$base/$manifest" && exit 0
            echo "Waiting for $base/$manifest (attempt $attempt/90)"
            sleep 20
          done
          echo "::error::server manifest was not available: $base/$manifest"
          exit 1

      - name: Verify the manifest against the receipted digest
        run: |
          version="${RAW_VERSION#v}"
          file="server/ripr-server-manifest-v${version}.json"
          actual="$(sha256sum "$file" | cut -d' ' -f1)"
          [ "$actual" = "$MANIFEST_SHA256" ] \
            || { echo "::error::manifest SHA-256 $actual does not match the receipted $MANIFEST_SHA256"; exit 1; }
          jq -e --arg v "$version" '.version == $v and (.assets | length) > 0' "$file" >/dev/null

      - name: Verify every archive the manifest names
        run: |
          version="${RAW_VERSION#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          jq -r '.assets | to_entries[] | [.key, .value.url, .value.sha256] | @tsv' \
            "server/ripr-server-manifest-v${version}.json" \
            | while IFS=$'\t' read -r target url sha; do
                case "$url" in
                  "$base"/*) ;;
                  *) echo "::error::asset $target url $url is outside $base"; exit 1 ;;
                esac
                curl -fsSL -o server/asset "$url"
                got="$(sha256sum server/asset | cut -d' ' -f1)"
                [ "$got" = "$sha" ] \
                  || { echo "::error::asset $target digest $got does not match manifest $sha"; exit 1; }
                echo "verified $target"
              done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-server-manifest
          path: server/ripr-server-manifest-v*.json

  package:
    needs: verify-server-assets
    runs-on: ubuntu-latest
    outputs:
      vsix_sha256: ${{ steps.digest.outputs.sha256 }}
    defaults:
      run:
        working-directory: editors/vscode
    env:
      RAW_VERSION: ${{ github.event.inputs.version }}
      MANIFEST_SHA256: ${{ github.event.inputs.manifest_sha256 }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Require package.json version to equal the release version
        run: |
          version="${RAW_VERSION#v}"
          jq -e --arg v "$version" '.version == $v' package.json >/dev/null \
            || { echo "::error::package.json version does not equal $version"; exit 1; }

      - name: Reuse the VSIX already attached to the release
        id: existing
        run: |
          # One VSIX per release: the other channel's dispatch promotes the
          # bytes the first dispatch attached instead of rebuilding them.
          version="${RAW_VERSION#v}"
          mkdir -p dist
          if gh release view "v${version}" --json assets --jq '.assets[].name' \
              | grep -Fxq "ripr-${version}.vsix"; then
            gh release download "v${version}" --pattern "ripr-${version}.vsix" --dir dist
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm ci --ignore-scripts

      - name: Download the verified server manifest
        if: ${{ steps.existing.outputs.found != 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ripr-server-manifest
          path: ${{ github.workspace }}/server

      - name: Bind the receipted manifest digest into the editor descriptor
        if: ${{ steps.existing.outputs.found != 'true' }}
        working-directory: .
        run: |
          version="${RAW_VERSION#v}"
          cargo xtask release-bind-server-descriptor \
            --version "$version" \
            --manifest "server/ripr-server-manifest-v${version}.json" \
            --manifest-sha256 "$MANIFEST_SHA256"

      - name: Compile
        if: ${{ steps.existing.outputs.found != 'true' }}
        run: npm run compile

      - name: Package and verify VSIX
        if: ${{ steps.existing.outputs.found != 'true' }}
        # Same inventory bounds and license-notice checks CI applies.
        run: npm run package

      - name: Verify the VSIX
        run: |
          version="${RAW_VERSION#v}"
          vsix="dist/ripr-${version}.vsix"
          cargo xtask vscode-verify-vsix -- "$vsix"
          # The admitted descriptor in the VSIX must carry the receipted digest.
          unzip -p "$vsix" extension/out/src/serverDescriptor.js | grep -Fq "$MANIFEST_SHA256" \
            || { echo "::error::VSIX does not embed the receipted manifest digest"; exit 1; }

      - name: Record VSIX digest
        id: digest
        run: |
          version="${RAW_VERSION#v}"
          sha="$(sha256sum "dist/ripr-${version}.vsix" | cut -d' ' -f1)"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "VSIX sha256 $sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ripr-vsix
          path: editors/vscode/dist/*.vsix

  attach-release-asset:
    # The Release tag comes from the version input. This runs before the
    # marketplace publishes so the first channel's VSIX becomes the one every
    # later channel reuses.
    needs: [admit-dispatch, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ripr-vsix
          path: dist

      - name: Attach VSIX to GitHub Release
        run: |
          # The GitHub Release has exactly one creator (the release transaction).
          # Attach to it only; never create it or replace an existing asset, so
          # a second channel dispatch keeps the first attached VSIX.
          set -euo pipefail
          release_tag="v${RAW_VERSION#v}"
          existing="$(gh release view "$release_tag" --json assets --jq '.assets[].name')"
          for vsix in dist/*.vsix; do
            name="$(basename "$vsix")"
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              echo "$name is already attached to $release_tag; leaving it in place"
            else
              gh release upload "$release_tag" "$vsix"
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through env, not template expansion, so the input is data; its
          # format is checked in admit-dispatch.
          RAW_VERSION: ${{ github.event.inputs.version }}

  publish-vs-marketplace:
    needs: [package, attach-release-asset]
    if: ${{ github.event.inputs.publish_vs_marketplace == 'true' }}
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.version }}
      EXPECTED_VSIX_SHA256: ${{ needs.package.outputs.vsix_sha256 }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.source_sha }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install the lockfile-pinned vsce
        working-directory: editors/vscode
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ripr-vsix
          path: dist

      - name: Require the VSIX that was verified in package
        run: |
          version="${RAW_VERSION#v}"
          echo "${EXPECTED_VSIX_SHA256}  dist/ripr-${version}.vsix" | sha256sum -c -

      - name: Require VSCE_PAT
        if: ${{ env.VSCE_PAT == '' }}
        run: |
          echo "::error::VSCE_PAT is not configured; VS Code Marketplace publish cannot run."
          exit 1

      - name: Publish to VS Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: |
          version="${RAW_VERSION#v}"
          vsix_file="$PWD/dist/ripr-${version}.vsix"
          vsce="$PWD/editors/vscode/node_modules/.bin/vsce"
          PUBLISHED_VERSION="$(
            "$vsce" show EffortlessMetrics.ripr --json 2>/dev/null \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['versions'][0]['version'])" \
              2>/dev/null || echo ""
          )"
          if [ "$PUBLISHED_VERSION" = "$version" ]; then
            echo "::warning::VS Code Marketplace already has version $version; skipping publish."
            exit 0
          fi
          "$vsce" publish --packagePath "$vsix_file" --pat "$VSCE_PAT"

  publish-open-vsx:
    needs: [package, attach-release-asset]
    if: ${{ github.event.inputs.publish_open_vsx == 'true' }}
    runs-on: ubuntu-latest
    env:
      RAW_VERSION: ${{ github.event.inputs.version }}
      EXPECTED_VSIX_SHA256: ${{ needs.package.outputs.vsix_sha256 }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ripr-vsix
          path: dist

      - name: Require the VSIX that was verified in package
        run: |
          version="${RAW_VERSION#v}"
          echo "${EXPECTED_VSIX_SHA256}  dist/ripr-${version}.vsix" | sha256sum -c -

      - name: Require OVSX_PAT
        if: ${{ env.OVSX_PAT == '' }}
        run: |
          echo "::error::OVSX_PAT is not configured; Open VSX publish cannot run."
          exit 1

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: |
          version="${RAW_VERSION#v}"
          # Exact pin: a floating `npx -y ovsx` would run unreviewed npm code
          # in a job holding OVSX_PAT.
          npx --yes ovsx@1.2.0 publish "dist/ripr-${version}.vsix" -p "$OVSX_PAT" --skip-duplicate
