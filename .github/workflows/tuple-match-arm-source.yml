name: tuple-match-arm/source-candidate

# Temporary evidence-only materialization for ripr#1714 / PR #3767.
# This workflow writes no repository source and is removed before qualification.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: tuple-match-arm-source-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    name: materialize guarded classifier candidate
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'test/1714-tuple-bool-match-arm'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.95

      - name: Run the retained red witness and require generated source
        shell: bash
        run: |
          set -euo pipefail
          report=target/ripr/reports/tuple-match-arm
          mkdir -p "$report"
          set +e
          cargo test -p ripr --test match_arm_tuple_identity \
            exact_tuple_input_and_result_certify_the_same_match_arm \
            -- --exact --nocapture > "$report/generator.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" > "$report/test.exit.txt"
          test "$code" -ne 0
          test -s "$report/reveal.rs"
          grep -F 'owner_call_bool_tuples(&assertion.text, owner).contains(&pattern)' \
            "$report/reveal.rs"

      - name: Upload generated candidate for review
        uses: actions/upload-artifact@v7
        with:
          name: tuple-match-arm-source-${{ github.event.pull_request.head.sha }}
          path: target/ripr/reports/tuple-match-arm
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
