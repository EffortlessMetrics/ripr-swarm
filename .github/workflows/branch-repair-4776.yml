name: Build npm bump-version integration

on:
  push:
    branches:
      - build/4776-npm-bump-version
    paths:
      - .github/workflows/branch-repair-4776.yml

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.repository == 'EffortlessMetrics/ripr-swarm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: build/4776-npm-bump-version

      - name: Extend the atomic version transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          distribution = Path("xtask/src/policy/distribution/mod.rs")
          text = distribution.read_text(encoding="utf-8")
          anchor = '''pub(crate) fn parse_distribution_contract(
              path: &str,
              text: &str,
          ) -> Result<DistributionContract, String> {
              contract::parse_distribution_contract(path, text)
          }
          '''
          wrapper = '''
          pub(crate) fn validate_npm_launcher_manifest(
              path: &str,
              text: &str,
              workspace_version: &str,
              contract: &DistributionContract,
          ) -> Result<(), String> {
              let mut violations = Vec::new();
              npm_launcher::validate_launcher(
                  path,
                  text,
                  workspace_version,
                  contract,
                  &mut violations,
              );
              if violations.is_empty() {
                  Ok(())
              } else {
                  Err(violations.join("\\n"))
              }
          }
          '''
          if "pub(crate) fn validate_npm_launcher_manifest(" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit("distribution contract parser anchor drifted")
              text = text.replace(anchor, anchor + wrapper, 1)
              distribution.write_text(text, encoding="utf-8")

          version = Path("xtask/src/version.rs")
          text = version.read_text(encoding="utf-8")

          replacements = [
              (
                  'const EXTENSION_LOCKFILE: &str = "editors/vscode/package-lock.json";\n',
                  'const EXTENSION_LOCKFILE: &str = "editors/vscode/package-lock.json";\nconst NPM_LAUNCHER_MANIFEST: &str = "packaging/npm/launcher/package.json";\n',
              ),
              (
                  '''    let lockfile = read_file(EXTENSION_LOCKFILE)?;
              let update = prepare_update(&workspace, &extension, &lockfile, version)?;
          ''',
                  '''    let lockfile = read_file(EXTENSION_LOCKFILE)?;
              let launcher = read_file(NPM_LAUNCHER_MANIFEST)?;
              let contract = crate::policy::distribution::load_distribution_contract()?;
              let update = prepare_update(
                  &workspace,
                  &extension,
                  &lockfile,
                  &launcher,
                  version,
                  &contract,
              )?;
          ''',
              ),
              (
                  '''        Path::new(EXTENSION_LOCKFILE),
              ];
              let originals = [&workspace, &extension, &lockfile];
              let updated = [&update.workspace, &update.extension, &update.lockfile];
          ''',
                  '''        Path::new(EXTENSION_LOCKFILE),
                  Path::new(NPM_LAUNCHER_MANIFEST),
              ];
              let originals = [&workspace, &extension, &lockfile, &launcher];
              let updated = [
                  &update.workspace,
                  &update.extension,
                  &update.lockfile,
                  &update.launcher,
              ];
          ''',
              ),
              (
                  '''    if let Err(error) = cargo_metadata_validation() {
                  let rollback = restore_files(&paths, &originals);
                  return Err(format!(
                      "version bump was rolled back because Cargo validation failed: {error}{rollback}"
                  ));
              }

              println!(
                  "updated release version {} -> {} in {WORKSPACE_MANIFEST}, {EXTENSION_MANIFEST}, and {EXTENSION_LOCKFILE}",
                  update.old_version, version
              );
          ''',
                  '''    if let Err(error) = validate_release_tree(version, &contract) {
                  let rollback = restore_files(&paths, &originals);
                  return Err(format!(
                      "version bump was rolled back because release validation failed: {error}{rollback}"
                  ));
              }

              println!(
                  "updated release version {} -> {} in {WORKSPACE_MANIFEST}, {EXTENSION_MANIFEST}, {EXTENSION_LOCKFILE}, and {NPM_LAUNCHER_MANIFEST}",
                  update.old_version, version
              );
          ''',
              ),
              (
                  '''    lockfile: String,
          }

          fn prepare_update(
              workspace: &str,
              extension: &str,
              lockfile: &str,
              new_version: &str,
          ) -> Result<VersionUpdate, String> {
          ''',
                  '''    lockfile: String,
              launcher: String,
          }

          fn prepare_update(
              workspace: &str,
              extension: &str,
              lockfile: &str,
              launcher: &str,
              new_version: &str,
              contract: &crate::policy::distribution::DistributionContract,
          ) -> Result<VersionUpdate, String> {
          ''',
              ),
              (
                  '''    let current_lockfile = lockfile_versions(lockfile)?;

              if current_extension != current_workspace || current_lockfile != current_workspace {
          ''',
                  '''    let current_lockfile = lockfile_versions(lockfile)?;
              crate::policy::distribution::validate_npm_launcher_manifest(
                  NPM_LAUNCHER_MANIFEST,
                  launcher,
                  &current_workspace,
                  contract,
              )?;

              if current_extension != current_workspace || current_lockfile != current_workspace {
          ''',
              ),
              (
                  '''    let updated_lockfile =
                  replace_json_version_lines(lockfile, &current_workspace, new_version, 2)?;

              verify_updated_json(&updated_extension, EXTENSION_MANIFEST, new_version, 1)?;
              verify_updated_lockfile(&updated_lockfile, new_version)?;

              Ok(VersionUpdate {
                  old_version: current_workspace,
                  workspace: updated_workspace,
                  extension: updated_extension,
                  lockfile: updated_lockfile,
              })
          }
          ''',
                  '''    let updated_lockfile =
                  replace_json_version_lines(lockfile, &current_workspace, new_version, 2)?;
              let updated_launcher = replace_npm_launcher_versions(
                  launcher,
                  &current_workspace,
                  new_version,
                  contract,
              )?;

              verify_updated_json(&updated_extension, EXTENSION_MANIFEST, new_version, 1)?;
              verify_updated_lockfile(&updated_lockfile, new_version)?;
              crate::policy::distribution::validate_npm_launcher_manifest(
                  NPM_LAUNCHER_MANIFEST,
                  &updated_launcher,
                  new_version,
                  contract,
              )?;

              Ok(VersionUpdate {
                  old_version: current_workspace,
                  workspace: updated_workspace,
                  extension: updated_extension,
                  lockfile: updated_lockfile,
                  launcher: updated_launcher,
              })
          }
          ''',
              ),
          ]

          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"version.rs anchor drifted: {old[:80]!r} count={text.count(old)}")
              text = text.replace(old, new, 1)

          helper_anchor = '''fn verify_updated_json(
          '''
          helpers = '''fn replace_npm_launcher_versions(
              text: &str,
              old_version: &str,
              new_version: &str,
              contract: &crate::policy::distribution::DistributionContract,
          ) -> Result<String, String> {
              let mut updated =
                  replace_json_version_lines(text, old_version, new_version, 1)?;
              for target in &contract.target {
                  updated = replace_json_string_field(
                      &updated,
                      NPM_LAUNCHER_MANIFEST,
                      &target.npm_package,
                      old_version,
                      new_version,
                  )?;
              }
              Ok(updated)
          }

          fn replace_json_string_field(
              text: &str,
              path: &str,
              field: &str,
              old_value: &str,
              new_value: &str,
          ) -> Result<String, String> {
              let quoted_field = format!("\\\"{field}\\\"");
              let mut output = String::with_capacity(text.len() + new_value.len());
              let mut replaced = 0;
              for line in text.split_inclusive('\\n') {
                  let Some(colon) = line.find(':') else {
                      output.push_str(line);
                      continue;
                  };
                  if line[..colon].trim() != quoted_field {
                      output.push_str(line);
                      continue;
                  }
                  let value_start = line[colon + 1..]
                      .find('\\\"')
                      .map(|offset| colon + 1 + offset + 1)
                      .ok_or_else(|| format!("{path}: {field} has no quoted value"))?;
                  let value_end = line[value_start..]
                      .find('\\\"')
                      .map(|offset| value_start + offset)
                      .ok_or_else(|| format!("{path}: {field} has no closing quote"))?;
                  if &line[value_start..value_end] != old_value {
                      return Err(format!(
                          "{path}: expected {field} version {old_value:?}, found {:?}",
                          &line[value_start..value_end]
                      ));
                  }
                  output.push_str(&line[..value_start]);
                  output.push_str(new_value);
                  output.push_str(&line[value_end..]);
                  replaced += 1;
              }
              if replaced != 1 {
                  return Err(format!(
                      "{path}: expected one {field} string field, replaced {replaced}"
                  ));
              }
              Ok(output)
          }

          '''
          if "fn replace_npm_launcher_versions(" not in text:
              if text.count(helper_anchor) != 1:
                  raise SystemExit("version helper insertion anchor drifted")
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          validation_anchor = '''fn read_file(path: &str) -> Result<String, String> {
          '''
          validation = '''fn validate_release_tree(
              expected: &str,
              contract: &crate::policy::distribution::DistributionContract,
          ) -> Result<(), String> {
              cargo_metadata_validation()?;
              let workspace = read_file(WORKSPACE_MANIFEST)?;
              let extension = read_file(EXTENSION_MANIFEST)?;
              let lockfile = read_file(EXTENSION_LOCKFILE)?;
              let launcher = read_file(NPM_LAUNCHER_MANIFEST)?;
              let workspace_version = section_version(&workspace, "workspace.package")?;
              if workspace_version != expected {
                  return Err(format!(
                      "{WORKSPACE_MANIFEST} did not update to {expected}; got {workspace_version}"
                  ));
              }
              verify_updated_json(&extension, EXTENSION_MANIFEST, expected, 1)?;
              verify_updated_lockfile(&lockfile, expected)?;
              crate::policy::distribution::validate_npm_launcher_manifest(
                  NPM_LAUNCHER_MANIFEST,
                  &launcher,
                  expected,
                  contract,
              )
          }

          '''
          if "fn validate_release_tree(" not in text:
              if text.count(validation_anchor) != 1:
                  raise SystemExit("version validation insertion anchor drifted")
              text = text.replace(validation_anchor, validation + validation_anchor, 1)

          # Test imports and fixtures.
          old_import = '''        EXTENSION_LOCKFILE, EXTENSION_MANIFEST, WORKSPACE_MANIFEST, bump_version,
                  cargo_metadata_validation, format_write_failure, json_root_version, lockfile_versions,
                  prepare_update, replace_json_version_lines, replace_section_version, restore_files,
                  section_version, validate_version_input, verify_updated_json, verify_updated_lockfile,
          '''
          new_import = '''        EXTENSION_LOCKFILE, EXTENSION_MANIFEST, NPM_LAUNCHER_MANIFEST,
                  WORKSPACE_MANIFEST, bump_version, cargo_metadata_validation, format_write_failure,
                  json_root_version, lockfile_versions, prepare_update,
                  replace_json_version_lines, replace_npm_launcher_versions, replace_section_version,
                  restore_files, section_version, validate_version_input, verify_updated_json,
                  verify_updated_lockfile,
          '''
          if new_import not in text:
              if text.count(old_import) != 1:
                  raise SystemExit("version test import anchor drifted")
              text = text.replace(old_import, new_import, 1)

          tests_anchor = '''    use std::path::Path;

              #[test]
          '''
          test_helpers = '''    use std::path::Path;

              const DISTRIBUTION_CONTRACT_TEXT: &str = include_str!("../../policy/distribution.toml");
              const NPM_LAUNCHER_MANIFEST_TEXT: &str =
                  include_str!("../../packaging/npm/launcher/package.json");

              fn test_contract() -> Result<crate::policy::distribution::DistributionContract, String> {
                  crate::policy::distribution::parse_distribution_contract(
                      "policy/distribution.toml",
                      DISTRIBUTION_CONTRACT_TEXT,
                  )
              }

              fn launcher_manifest(version: &str) -> Result<String, String> {
                  let current = json_root_version(NPM_LAUNCHER_MANIFEST_TEXT, NPM_LAUNCHER_MANIFEST)?;
                  Ok(NPM_LAUNCHER_MANIFEST_TEXT.replace(
                      &format!("\\\"{current}\\\""),
                      &format!("\\\"{version}\\\""),
                  ))
              }

              #[test]
          '''
          if "const DISTRIBUTION_CONTRACT_TEXT" not in text:
              if text.count(tests_anchor) != 1:
                  raise SystemExit("version test helper anchor drifted")
              text = text.replace(tests_anchor, test_helpers, 1)

          # Update prepare_update call sites in the existing tests.
          old = '''        let update = prepare_update(workspace, extension, lockfile, "0.11.0")?;
          '''
          new = '''        let launcher = launcher_manifest("0.10.0")?;
                  let contract = test_contract()?;
                  let update = prepare_update(
                      workspace,
                      extension,
                      lockfile,
                      &launcher,
                      "0.11.0",
                      &contract,
                  )?;
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("primary prepare_update test anchor drifted")
              text = text.replace(old, new, 1)

          old = '''        let result = prepare_update(
                  "[workspace.package]\\nversion = \\\"0.10.0\\\"\\n",
                  "{\\\"version\\\":\\\"0.9.0\\\"}",
                  "{\\\"version\\\":\\\"0.10.0\\\",\\\"packages\\\":{\\\"\\\":{\\\"version\\\":\\\"0.10.0\\\"}}}",
                  "0.11.0",
              );
          '''
          new = '''        let launcher = launcher_manifest("0.10.0")?;
                  let contract = test_contract()?;
                  let result = prepare_update(
                      "[workspace.package]\\nversion = \\\"0.10.0\\\"\\n",
                      "{\\\"version\\\":\\\"0.9.0\\\"}",
                      "{\\\"version\\\":\\\"0.10.0\\\",\\\"packages\\\":{\\\"\\\":{\\\"version\\\":\\\"0.10.0\\\"}}}",
                      &launcher,
                      "0.11.0",
                      &contract,
                  );
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("drift prepare_update test anchor drifted")
              text = text.replace(old, new, 1)

          old = '''        if prepare_update(
                  "[workspace.package]\\nversion = \\\"0.10.0\\\"\\n",
                  "{\\\"version\\\":\\\"0.10.0\\\"}",
                  "{\\\"version\\\":\\\"0.10.0\\\",\\\"packages\\\":{\\\"\\\":{\\\"version\\\":\\\"0.10.0\\\"}}}",
                  "0.10.0",
              )
          '''
          new = '''        let launcher = launcher_manifest("0.10.0")?;
                  let contract = test_contract()?;
                  if prepare_update(
                      "[workspace.package]\\nversion = \\\"0.10.0\\\"\\n",
                      "{\\\"version\\\":\\\"0.10.0\\\"}",
                      "{\\\"version\\\":\\\"0.10.0\\\",\\\"packages\\\":{\\\"\\\":{\\\"version\\\":\\\"0.10.0\\\"}}}",
                      &launcher,
                      "0.10.0",
                      &contract,
                  )
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("same-version prepare_update test anchor drifted")
              text = text.replace(old, new, 1)

          # Extend the primary assertions to cover the launcher transaction.
          old = '''            || update.lockfile.matches("\\\"version\\\": \\\"0.11.0\\\"").count() != 2
                  {
          '''
          new = '''            || update.lockfile.matches("\\\"version\\\": \\\"0.11.0\\\"").count() != 2
                      || update.launcher.matches("\\\"0.11.0\\\"").count() != 6
                  {
          '''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("primary version assertion anchor drifted")
              text = text.replace(old, new, 1)

          # Extend the end-to-end fixture with the policy and launcher files.
          fixture_anchor = '''            fs::create_dir_all(root.join("editors/vscode")).map_err(|error| error.to_string())?;
          '''
          fixture_insert = '''            fs::create_dir_all(root.join("editors/vscode")).map_err(|error| error.to_string())?;
                  fs::create_dir_all(root.join("packaging/npm/launcher"))
                      .map_err(|error| error.to_string())?;
                  fs::create_dir_all(root.join("policy")).map_err(|error| error.to_string())?;
                  fs::write(
                      root.join("policy/distribution.toml"),
                      DISTRIBUTION_CONTRACT_TEXT,
                  )
                  .map_err(|error| error.to_string())?;
                  fs::write(
                      root.join(NPM_LAUNCHER_MANIFEST),
                      launcher_manifest("0.10.0")?,
                  )
                  .map_err(|error| error.to_string())?;
          '''
          if fixture_insert not in text:
              if text.count(fixture_anchor) != 1:
                  raise SystemExit("version fixture directory anchor drifted")
              text = text.replace(fixture_anchor, fixture_insert, 1)

          fixture_read_anchor = '''            let lockfile = fs::read_to_string(root.join(EXTENSION_LOCKFILE))
                      .map_err(|error| error.to_string())?;
                  if !workspace.contains("version = \\\"0.11.0\\\"")
                      || !extension.contains("\\\"version\\\": \\\"0.11.0\\\"")
                      || lockfile.matches("\\\"version\\\": \\\"0.11.0\\\"").count() != 2
                  {
          '''
          fixture_read_new = '''            let lockfile = fs::read_to_string(root.join(EXTENSION_LOCKFILE))
                      .map_err(|error| error.to_string())?;
                  let launcher = fs::read_to_string(root.join(NPM_LAUNCHER_MANIFEST))
                      .map_err(|error| error.to_string())?;
                  if !workspace.contains("version = \\\"0.11.0\\\"")
                      || !extension.contains("\\\"version\\\": \\\"0.11.0\\\"")
                      || lockfile.matches("\\\"version\\\": \\\"0.11.0\\\"").count() != 2
                      || launcher.matches("\\\"0.11.0\\\"").count() != 6
                  {
          '''
          if fixture_read_new not in text:
              if text.count(fixture_read_anchor) != 1:
                  raise SystemExit("version fixture assertion anchor drifted")
              text = text.replace(fixture_read_anchor, fixture_read_new, 1)

          # Add focused launcher drift and preservation tests before the input validation test.
          new_tests_anchor = '''    #[test]
              fn rejects_invalid_version_inputs() -> Result<(), String> {
          '''
          new_tests = '''    #[test]
              fn updates_all_launcher_versions_without_reformatting_other_fields() -> Result<(), String> {
                  let contract = test_contract()?;
                  let launcher = launcher_manifest("0.10.0")?;
                  let updated = replace_npm_launcher_versions(
                      &launcher,
                      "0.10.0",
                      "0.11.0",
                      &contract,
                  )?;
                  if updated.matches("\\\"0.11.0\\\"").count() != 6
                      || updated.contains("\\\"0.10.0\\\"")
                      || !updated.contains("\\\"description\\\": \\\"Install the native ripr static mutation-exposure analyzer through npm.\\\"")
                      || !updated.contains("\\\"access\\\": \\\"public\\\"")
                  {
                      return Err("launcher version update changed the wrong fields".to_string());
                  }
                  Ok(())
              }

              #[test]
              fn rejects_launcher_dependency_drift_before_any_write() -> Result<(), String> {
                  let contract = test_contract()?;
                  let launcher = launcher_manifest("0.10.0")?.replacen(
                      "\\\"@effortlessmetrics/ripr-darwin-arm64\\\": \\\"0.10.0\\\"",
                      "\\\"@effortlessmetrics/ripr-darwin-arm64\\\": \\\"^0.10.0\\\"",
                      1,
                  );
                  let error = prepare_update(
                      "[workspace.package]\\nversion = \\\"0.10.0\\\"\\n",
                      "{\\\"version\\\":\\\"0.10.0\\\"}",
                      "{\\\"version\\\":\\\"0.10.0\\\",\\\"packages\\\":{\\\"\\\":{\\\"version\\\":\\\"0.10.0\\\"}}}",
                      &launcher,
                      "0.11.0",
                      &contract,
                  )
                  .err()
                  .ok_or_else(|| "launcher dependency range was accepted".to_string())?;
                  if !error.contains("optionalDependencies must equal the five exact-version native packages") {
                      return Err(format!("unexpected launcher drift error: {error}"));
                  }
                  Ok(())
              }

              #[test]
              fn rejects_invalid_version_inputs() -> Result<(), String> {
          '''
          if "fn updates_all_launcher_versions_without_reformatting_other_fields" not in text:
              if text.count(new_tests_anchor) != 1:
                  raise SystemExit("new launcher test anchor drifted")
              text = text.replace(new_tests_anchor, new_tests, 1)

          version.write_text(text, encoding="utf-8")
          PY

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Format and test the focused transaction
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo test -p xtask --locked version::tests -- --nocapture
          cargo xtask check-release-targets

      - name: Commit the implementation and remove the helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/branch-repair-4776.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xtask/src/version.rs xtask/src/policy/distribution/mod.rs .github/workflows/branch-repair-4776.yml
          git diff --cached --check
          git commit -m "build(distribution): bump npm launcher versions atomically (#4776)"
          git push origin HEAD:build/4776-npm-bump-version
