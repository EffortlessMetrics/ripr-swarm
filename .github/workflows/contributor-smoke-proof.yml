name: Contributor smoke proof (non-shipping)
on:
  push:
    branches: [codex/8547-stub-tail-proof]
    paths: [.github/workflows/contributor-smoke-proof.yml]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: contributor-smoke-proof
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUBJECT: c69d2f84de80b1b9c0f2fb33f25507f0f5d201c3
      BASIS: 7bfb58428e20c47b0b73303c7971f0ec3edff9a5
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: c69d2f84de80b1b9c0f2fb33f25507f0f5d201c3
          path: build
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: build -> target
          shared-key: ripr-8547-focused
          save-if: 'true'
      - name: Bind current PR and independently resolve its change set
        working-directory: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export EVIDENCE="$RUNNER_TEMP/contributor-smoke-policy"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          test "$(git rev-parse HEAD)" = "$SUBJECT"
          test -z "$(git status --porcelain)"
          gh api repos/$GITHUB_REPOSITORY/pulls/11280 > "$EVIDENCE/pr.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE'])
          pr=json.loads((p/'pr.json').read_text())
          assert pr['head']['sha']==os.environ['SUBJECT']
          assert pr['base']['ref']=='main' and pr['state']=='open' and pr['draft'] is True
          (p/'pr-body.json').write_text(json.dumps({'body':pr['body']})+'\n')
          PY
          git fetch --no-tags --depth=64 origin main:refs/remotes/origin/main
          test "$(git merge-base origin/main HEAD)" = "$BASIS"
          git diff --name-only origin/main...HEAD > "$EVIDENCE/changed-paths.txt"
          printf '%s\n' CONTRIBUTING.md changelog.d/8547-bounded-contributor-smoke.md > "$EVIDENCE/expected-paths.txt"
          diff -u "$EVIDENCE/expected-paths.txt" "$EVIDENCE/changed-paths.txt"
          {
            printf 'controller=%s\nsubject=%s\nbasis=%s\nrun=%s\nattempt=%s\n' "$GITHUB_SHA" "$SUBJECT" "$BASIS" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            git rev-parse HEAD^{tree} origin/main
            rustc +1.95.0 -Vv
            df -h .
          } > "$EVIDENCE/identity.txt"
      - name: Execute PR-shape and applicable local policy
        working-directory: build
        run: |
          set -euo pipefail
          run() {
            name="$1"; shift
            printf '%q ' "$@" > "$EVIDENCE/$name.command"
            set +e
            timeout --signal=TERM --kill-after=30s 1200s "$@" > "$EVIDENCE/$name.stdout" 2> "$EVIDENCE/$name.stderr"
            code=$?
            set -e
            echo "$name exit=$code" | tee -a "$EVIDENCE/status.txt"
            tail -n 40 "$EVIDENCE/$name.stdout"
            if [ "$code" != 0 ]; then tail -n 80 "$EVIDENCE/$name.stderr"; return "$code"; fi
          }
          run pr-shape cargo +1.95.0 run --locked -p xtask -- check-pr-shape --body-file "$EVIDENCE/pr-body.json"
          run worktree-doctor cargo +1.95.0 run --locked -p xtask -- worktree doctor
          run check-fast cargo +1.95.0 run --locked -p xtask -- check-fast
          run precommit cargo +1.95.0 run --locked -p xtask -- precommit
          git diff --check
          git diff --exit-code
          test "$(git rev-parse HEAD)" = "$SUBJECT"
      - name: Retain exact reports and statuses
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: contributor-smoke-policy-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/contributor-smoke-policy/*
            build/target/ripr/reports/check-fast*
            build/target/ripr/reports/precommit*
            build/target/ripr/reports/pr-shape*
          if-no-files-found: error
          retention-days: 14
