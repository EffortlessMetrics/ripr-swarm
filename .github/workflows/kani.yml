name: Kani (bounded model checking)

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# The existing scheduled/manual advisory route serializes each ref without
# cancelling an in-flight verifier or changing the retired PR event perimeter.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-run
  cancel-in-progress: false

# Kani lane (RIPR-SPEC-0371): bounded model checking of pure cores.
#
# "Lighter, later, tighter" (docs/CI.md): this is not a required check and
# runs only nightly and on explicit dispatch; the PR/label subscription is
# retired. Kani compiles each owning library for verification, so a run is
# minutes, not seconds.
#
# The pass/fail contract lives in `cargo xtask kani`, not in shell: a missing
# tool, a missing verdict, an unreachable `cover!` or zero harnesses fails the
# job. Nothing passes by absence.

jobs:
  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: ripr-kani-0.68.0-${{ runner.os }}
          cache-directories: ~/.kani
          cache-bin: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install pinned kani-verifier
        run: |
          # `cargo kani setup` downloads the release bundle from GitHub; a
          # transient 5xx there must not skip the harness run. Bounded retry,
          # same pinned version; a persistent failure still fails the step.
          delays=(5 15 30)
          for attempt in 1 2 3 4; do
            if cargo install --locked kani-verifier --version 0.68.0 && cargo kani setup; then
              exit 0
            fi
            if [ "$attempt" -le "${#delays[@]}" ]; then
              d="${delays[$((attempt - 1))]}"
              echo "::warning::kani install/setup attempt $attempt failed; retrying in ${d}s"
              sleep "$d"
            fi
          done
          echo "::error::kani install/setup failed after 4 attempts"
          exit 1

      - name: Build maintained native evidence frontdoors
        env:
          CARGO_BUILD_JOBS: "1"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: >-
          cargo build --locked -p xtask --no-default-features
          --features formal-runner --bin formal-kani --bin formal-assurance

      - name: Capture registered currentness pilot
        timeout-minutes: 5
        run: >-
          timeout --kill-after=5s 180s target/debug/formal-kani
          --package ripr-contract
          --harness domain::probe::kani_proofs::currentness_action_and_base_side_are_disjoint
          --default-unwind 32
          --claim-registry .ripr/formal-claims.json
          --registered-claim ripr.currentness.candidate-action
          --timeout-secs 120 --harness-timeout-secs 60

      - name: Bind the exact registered evidence directory
        id: registered
        shell: python
        run: |
          import json
          import os
          from pathlib import Path, PurePosixPath

          reports = Path("target/ripr/reports")
          encoded = (reports / "kani.json").read_bytes()
          report = json.loads(encoded)
          execution = report["execution"]
          claim = "ripr.currentness.candidate-action"
          assert report["inventory"]["expected_claim_ids"] == [claim]
          assert len(report["results"]) == 1
          row = report["results"][0]
          assert row["claim_id"] == claim and row["status"] == "ESTABLISHED"
          assert row["native_verdict"] == "verified" and row["current"] is True
          assert execution["source_current"] and execution["lane_success"]
          assert execution["github_run_id"] == os.environ["GITHUB_RUN_ID"]
          assert execution["github_run_attempt"] == os.environ["GITHUB_RUN_ATTEMPT"]
          assert execution["github_job"] == os.environ["GITHUB_JOB"]
          group = f"{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          relative = PurePosixPath(execution["artifact_directory"])
          assert not relative.is_absolute() and len(relative.parts) == 3
          assert relative.parts[:2] == ("kani-evidence", group)
          assert all(c in "0123456789-" for c in relative.parts[2])
          directory = reports.joinpath(*relative.parts)
          assert (directory / "kani.json").read_bytes() == encoded
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifacts={directory.as_posix()}\n")

      - name: Project the registered pilot from retained bytes
        timeout-minutes: 5
        env:
          RIPR_NATIVE_ARTIFACTS: ${{ steps.registered.outputs.artifacts }}
        run: |
          timeout --kill-after=5s 180s target/debug/formal-assurance --root . \
            --run "$RIPR_NATIVE_ARTIFACTS/kani.json" --artifacts "$RIPR_NATIVE_ARTIFACTS" \
            --format json > "$RIPR_NATIVE_ARTIFACTS/assurance.json"
          timeout --kill-after=5s 180s target/debug/formal-assurance --root . \
            --run "$RIPR_NATIVE_ARTIFACTS/kani.json" --artifacts "$RIPR_NATIVE_ARTIFACTS" \
            --format markdown > "$RIPR_NATIVE_ARTIFACTS/assurance.md"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          directory = Path(os.environ["RIPR_NATIVE_ARTIFACTS"])
          board = json.loads((directory / "assurance.json").read_bytes())
          rows = [row for row in board["claims"] if row["claim_id"] == "ripr.currentness.candidate-action"]
          assert len(rows) == 1 and rows[0]["status"] == "ESTABLISHED"
          assert rows[0]["provenance"] == "local_retained_bytes_checked_not_authenticated"
          PY

      - name: Run existing broad Kani harness lane
        run: cargo xtask kani

      # Exact run/attempt directory: never upload a cached previous report.
      - name: Upload Kani evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ripr-kani
          path: target/ripr/reports/kani-evidence/${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error

          retention-days: 14
