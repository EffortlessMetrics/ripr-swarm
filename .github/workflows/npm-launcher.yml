name: npm Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    name: script-free launcher contract / Node ${{ matrix.node-version }}
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 24]
    defaults:
      run:
        working-directory: packaging/npm/launcher
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node-version }}

      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591 # 1.95.0
        if: matrix.node-version == 20

      - name: Build native binary for installed MCP check
        if: matrix.node-version == 20
        working-directory: .
        run: cargo build --locked -p ripr --bin ripr

      - name: Test launcher
        if: matrix.node-version != 20
        run: npm test

      - name: Test launcher with installed MCP check
        if: matrix.node-version == 20
        env:
          RIPR_PACKAGE_TEST_BINARY: ${{ github.workspace }}/target/debug/ripr
          RIPR_REQUIRE_INSTALLED_MCP: "1"
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run --json --ignore-scripts
