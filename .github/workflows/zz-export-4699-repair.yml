name: Export final-payload workflow repair once

on:
  push:
    branches:
      - feat/4521-final-native-payload

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/4521-final-native-payload
          fetch-depth: 0

      - name: Prepare reviewed qualification workflow repair
        shell: python
        run: |
          from pathlib import Path

          source = Path('.github/workflows/server-archive-qualification.yml')
          text = source.read_text(encoding='utf-8')

          text = text.replace(
              'uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable',
              'uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # v1',
          )
          text = text.replace('toolchain: stable', 'toolchain: 1.95.0')
          text = text.replace(
              'Native runtime compatibility remains unqualified under issue #4489',
              'Native runtime compatibility remains unqualified under EffortlessMetrics/ripr-swarm#4489',
          )

          loop_start = '          for directory in payload-identities/ripr-final-native-payload-*; do\n'
          direct_identity = '            identity="${directory}/payload-identity.json"\n'
          recursive_identity = '            mapfile -t identities < <(find "${directory}" -type f -name payload-identity.json -print)\n'
          if direct_identity in text:
              start = text.index(loop_start)
              end = text.index('          done\n', start) + len('          done\n')
              replacement = '''          for directory in payload-identities/ripr-final-native-payload-*; do
            test -d "${directory}"
            mapfile -t identities < <(find "${directory}" -type f -name payload-identity.json -print)
            mapfile -t markdowns < <(find "${directory}" -type f -name payload-identity.md -print)
            mapfile -t producers < <(find "${directory}" -type f -name producer-build.json -print)
            test "${#identities[@]}" -eq 1
            test "${#markdowns[@]}" -eq 1
            test "${#producers[@]}" -eq 1
            identity="${identities[0]}"
            producer="${producers[0]}"
            jq --arg identity_sha256 "$(sha256sum "${identity}" | awk '{print $1}')" '. + {identity_sha256: $identity_sha256}' "${identity}" >> payload-identities.ndjson
            jq --arg producer_build_sha256 "$(sha256sum "${producer}" | awk '{print $1}')" '. + {producer_build_sha256: $producer_build_sha256}' "${producer}" >> producer-builds.ndjson
          done
'''
              text = text[:start] + replacement + text[end:]
          elif recursive_identity not in text:
              raise SystemExit('payload identity aggregation loop not found')

          export = Path('.repair-export/server-archive-qualification.yml')
          export.parent.mkdir(parents=True, exist_ok=True)
          export.write_text(text, encoding='utf-8')

      - name: Commit repaired bytes under a non-workflow path
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .repair-export/server-archive-qualification.yml
          git commit -m "ci(distribution): retain repaired qualification workflow bytes"
          git push origin HEAD:feat/4521-final-native-payload
