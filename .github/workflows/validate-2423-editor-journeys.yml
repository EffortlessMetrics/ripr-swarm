name: Validate #2423 editor journeys

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: read

concurrency:
  group: validate-2423-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/editor-two-journey-qualification-2423'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out the exclusively claimed branch without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/editor-two-journey-qualification-2423
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: 1.95.0
          components: rustfmt,clippy
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Apply the corrected two-journey implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/2423.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          rm .github/patches/2423.py .github/workflows/validate-2423-editor-journeys.yml
      - name: TypeScript compile
        id: compile
        continue-on-error: true
        working-directory: editors/vscode
        shell: bash
        run: set -o pipefail; npm run compile 2>&1 | tee ../../01-compile.log
      - name: VSIX package
        id: package
        continue-on-error: true
        working-directory: editors/vscode
        shell: bash
        run: set -o pipefail; npm run package 2>&1 | tee ../../02-package.log
      - name: Rust and xtask Clippy
        id: clippy
        continue-on-error: true
        shell: bash
        run: set -o pipefail; cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee 03-clippy.log
      - name: Install Xvfb
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Real extension-host two-journey proof
        id: e2e
        continue-on-error: true
        shell: bash
        run: set -o pipefail; xvfb-run -a cargo xtask vscode-test-e2e 2>&1 | tee 04-e2e.log
      - name: File and workflow policy without temporary machinery
        id: policy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo xtask check-file-policy
            cargo xtask check-workflows
            cargo xtask check-static-language
          } 2>&1 | tee 05-policy.log
      - name: Retain exact patch, logs, and outcome matrix
        if: always()
        shell: bash
        env:
          COMPILE: ${{ steps.compile.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          POLICY: ${{ steps.policy.outcome }}
        run: |
          set -euo pipefail
          mkdir -p validation-2423
          git diff --binary origin/main -- > validation-2423/candidate.patch
          git diff --stat origin/main -- > validation-2423/diff-stat.txt
          printf '%s\n' \
            "compile=${COMPILE}" \
            "package=${PACKAGE}" \
            "clippy=${CLIPPY}" \
            "e2e=${E2E}" \
            "policy=${POLICY}" \
            > validation-2423/outcomes.txt
          cp ./*.log validation-2423/ 2>/dev/null || true
      - name: Upload validation packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: validate-2423-${{ github.run_id }}
          path: validation-2423/
          if-no-files-found: error
          retention-days: 2
      - name: Fail until both journeys and every bounded gate are green
        if: always()
        shell: bash
        env:
          COMPILE: ${{ steps.compile.outcome }}
          PACKAGE: ${{ steps.package.outcome }}
          CLIPPY: ${{ steps.clippy.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          POLICY: ${{ steps.policy.outcome }}
        run: |
          for outcome in "$COMPILE" "$PACKAGE" "$CLIPPY" "$E2E" "$POLICY"
          do
            test "$outcome" = success || exit 1
          done
