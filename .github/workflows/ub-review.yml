name: ub-review

# Generated by `ub-review enable`. MiniMax reviews each PR with specialist
# lanes, selects relevant PR-specific proof, runs it safely, and posts one
# review plus a CI gate result. See docs/QUICKSTART.md and docs/ADOPTION_MODES.md.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  # Unselected labels get unique groups and cannot cancel the active review.
  group: ub-review-${{ github.event.pull_request.number || github.ref }}-${{ !github.event.pull_request.draft && github.event.action == 'labeled' && github.event.label.name == 'merge-ready' && 'intent' || github.run_id }}
  cancel-in-progress: true

jobs:
  ub-review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      # The cargo-test sensor exercises real LLVM profile diagnostics. Prepare
      # rustc's matching tools; the pinned action only installs a minimal Rust
      # profile and its core sensor bundle does not include llvm-tools-preview.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # v1
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      # Cache the ub-review source build so subsequent runs skip the ~12 min
      # cargo recompile. Keyed on the action SHA so a new pin invalidates.
      # Cuts repeat runs from ~14 min to ~2-3 min (ub-review #728).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> target/ub-review-build"
          key: ub-review-8d45f2cace407b1b0117cffe30e32bf6267d5182

      # Sensors resolve the locked anyhow fixture offline. Prepare the runner's
      # default Cargo home, also used by the action's sanitized sensor process.
      - name: Prepare locked owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml

      - name: Prepare locked JSON owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_json_real_literal/input/Cargo.toml

      - name: Prepare locked proptest profile dependencies
        run: cargo fetch --locked --manifest-path crates/ripr/tests/fixtures/proptest_singleton/input/Cargo.toml

      - name: ub-review
        env:
          CARGO_TARGET_DIR: target/ub-review-build
        uses: EffortlessMetrics/ub-review@8d45f2cace407b1b0117cffe30e32bf6267d5182
        with:
          # review-mode hides the internal mode/fail-on-gate/review_forward
          # knobs. advisory = comment only; gate = recommended CI gate;
          # strict = + reporter verdict can block.
          review-mode: advisory
          # The label is an explicit operator request. The pinned action maps
          # labeled events to a non-posting catch-all unless its supported
          # manual pass is selected; GitHub event metadata remains unchanged.
          run-pass: manual
          provider-policy: minimax-only
          minimax-api-key: ${{ secrets.MINIMAX_API_KEY }}
          github-token: ${{ github.token }}
          config: .ub-review.toml
          root: .
          base: origin/${{ github.base_ref }}
          head: HEAD
          # The pull_request event checks out a synthetic merge commit; the
          # action's revision admission refuses to relabel a two-parent
          # checkout as a candidate head without this metadata.
          pr-head-sha: ${{ github.event.pull_request.head.sha }}
          out: target/ub-review
          posting: review
          # Receipt discovery must use the same name as the upload below.
          prior-resolved-candidates-artifact: ub-review-${{ github.event.pull_request.number || github.run_id }}
          # The pinned action defaults to the bun-ub preset, whose
          # artifact-verifier sensor runs
          # `python scripts/verify-bun-review-artifacts.py --self-test`.
          # That script is not in this repository, so the sensor exits 2
          # and shows up as missing evidence (#4121). Skipping it marks the
          # Bun-only verifier not applicable. It is not a pass, and the
          # other planned sensors stay in the review.
          except-tools: artifact-verifier

      - name: Verify advisory receipt reporter
        if: always()
        continue-on-error: true
        run: cargo test --locked -p xtask --example ub_review_evidence_report

      - name: Report advisory evidence dimensions
        if: always()
        continue-on-error: true
        run: |
          cargo run --locked -p xtask --example ub_review_evidence_report -- target/ub-review || {
            status=$?
            printf '%s\n' '## UB Review advisory evidence' '' 'MISSING EVIDENCE: consumer reporter did not complete; inspect this step log. No report pass is established.' >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          }

      - name: Upload ub-review artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ub-review-${{ github.event.pull_request.number || github.run_id }}
          path: target/ub-review
          if-no-files-found: warn
          retention-days: 7
