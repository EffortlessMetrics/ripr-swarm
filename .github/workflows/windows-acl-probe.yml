name: Windows ACL Probe

# Throwaway diagnostic for #9688: does an icacls (AD) deny get enforced once
# SeRestorePrivilege and SeBackupPrivilege are disabled in the process token?
on:
  push:
    branches: [claude/project-thread-gyt3zf]
    paths: [.github/workflows/windows-acl-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Probe
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @"
          using System; using System.Runtime.InteropServices;
          public class P {
            [StructLayout(LayoutKind.Sequential, Pack=1)] public struct TP { public int Count; public long Luid; public int Attr; }
            [DllImport("advapi32.dll", SetLastError=true)] public static extern bool OpenProcessToken(IntPtr h, int a, out IntPtr t);
            [DllImport("advapi32.dll", SetLastError=true)] public static extern bool LookupPrivilegeValue(string s, string n, out long l);
            [DllImport("advapi32.dll", SetLastError=true)] public static extern bool AdjustTokenPrivileges(IntPtr t, bool d, ref TP n, int l, IntPtr p, IntPtr r);
            public static string Disable(string name) {
              IntPtr t; OpenProcessToken(System.Diagnostics.Process.GetCurrentProcess().Handle, 0x28, out t);
              long luid; LookupPrivilegeValue(null, name, out luid);
              TP tp = new TP { Count = 1, Luid = luid, Attr = 0 };
              bool ok = AdjustTokenPrivileges(t, false, ref tp, 0, IntPtr.Zero, IntPtr.Zero);
              return name + " ok=" + ok + " err=" + Marshal.GetLastWin32Error();
            }
          }
          "@
          function Try-Deny($label) {
            $d = Join-Path $env:RUNNER_TEMP ("acl-" + [guid]::NewGuid())
            New-Item -ItemType Directory -Path $d | Out-Null
            icacls $d /deny "$($env:USERNAME):(AD)" | Out-Null
            $sub = Join-Path $d "child"
            try { [IO.Directory]::CreateDirectory($sub) | Out-Null; "$label : CreateDirectory SUCCEEDED (deny not enforced)" }
            catch { "$label : CreateDirectory DENIED ($($_.Exception.GetType().Name))" }
            cmd /c "mkdir `"$d\cmdchild`" 2>&1" | ForEach-Object { "$label : cmd mkdir -> $_" }
            if (Test-Path "$d\cmdchild") { "$label : cmd mkdir SUCCEEDED" } else { "$label : cmd mkdir DENIED" }
          }
          "== whoami /priv"; whoami /priv | Select-String "Restore|Backup|TakeOwn"
          "== baseline"; Try-Deny "baseline"
          "== disable"; [P]::Disable("SeRestorePrivilege"); [P]::Disable("SeBackupPrivilege")
          whoami /priv | Select-String "Restore|Backup"
          "== after disable (this process)"; Try-Deny "disabled"
          "== child process of the disabled process"
          pwsh -NoProfile -Command "whoami /priv | Select-String 'Restore|Backup'"

      - name: Probe from bash (Git for Windows)
        shell: bash
        run: |
          echo "== whoami /priv (bash)"; whoami /priv | grep -E "Restore|Backup|TakeOwn"
          d="$RUNNER_TEMP/acl-bash-$$"; mkdir -p "$d"
          icacls "$(cygpath -w "$d")" /deny "$USERNAME:(AD)" > /dev/null
          if cmd //c "mkdir \"$(cygpath -w "$d")\\cmdchild\"" > /dev/null 2>&1; then echo "bash : cmd mkdir SUCCEEDED (deny not enforced)"; else echo "bash : cmd mkdir DENIED"; fi
          echo "== pwsh child of bash"
          pwsh -NoProfile -Command "whoami /priv | Select-String 'Restore|Backup'; try { [IO.Directory]::CreateDirectory('$(cygpath -w "$d")\netchild') | Out-Null; 'pwsh-from-bash : SUCCEEDED (deny not enforced)' } catch { 'pwsh-from-bash : DENIED' }"
