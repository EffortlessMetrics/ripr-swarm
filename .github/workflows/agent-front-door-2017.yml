name: Verify issue 2017 front door

on:
  push:
    branches:
      - agent/2017-init-badge-workflow
    paths:
      - .github/agent/front-door-2017.py
      - .github/workflows/agent-front-door-2017.yml

permissions:
  contents: write

concurrency:
  group: agent-front-door-2017
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/agent/2017-init-badge-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out patch branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: agent/2017-init-badge-workflow
          fetch-depth: 0

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default 1.95.0

      - name: Apply front-door alignment
        run: python3 .github/agent/front-door-2017.py

      - name: Format and verify behavior
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test -p ripr --all-targets init_
          cargo test -p ripr --lib help
          cargo clippy -p ripr --all-targets -- -D warnings

      - name: Verify documentation surfaces
        run: |
          cargo xtask check-doc-index
          git diff --check

      - name: Commit verified front-door alignment
        run: |
          rm .github/agent/front-door-2017.py
          rm .github/workflows/agent-front-door-2017.yml
          rmdir .github/agent 2>/dev/null || true
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add -A
          git diff --cached --check
          test -n "$(git status --short)"
          git commit -m "docs(init): align help and configuration with badge workflow"
          git push origin HEAD:agent/2017-init-badge-workflow
