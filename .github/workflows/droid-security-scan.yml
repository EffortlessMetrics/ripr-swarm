name: Droid Security Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: droid-security-scan-${{ github.repository }}
  cancel-in-progress: false

# Job-level permissions below grant the writes; nothing is inherited.
permissions:
  contents: read

jobs:
  droid-security-scan:
    # GitHub-hosted only: the repository no longer operates the em-ci-review
    # self-hosted group, and a job pinned to it queues for 24h and is cancelled
    # every week (#14641). Matches the hosted posture of security.yml.
    runs-on: ubuntu-latest
    # 45 min is about 1.7x the 26.4 min the scan took on a hosted runner
    # (run 43558949264), so a slow week does not truncate a real scan.
    timeout-minutes: 45

    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}

    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 1

      - name: Configure MiniMax BYOK for Factory Droid
        shell: bash
        run: |
          mkdir -p "$HOME/.factory"
          cat > "$HOME/.factory/settings.json" <<'JSON'
          {
            "customModels": [
              {
                "displayName": "MiniMax-M3",
                "model": "MiniMax-M3",
                "baseUrl": "https://api.minimax.io/anthropic",
                "apiKey": "${MINIMAX_API_KEY}",
                "provider": "anthropic",
                "maxOutputTokens": 64000
              }
            ]
          }
          JSON

      - name: Ensure GitHub CLI for Droid Action
        shell: bash
        run: |
          set -euo pipefail
          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi
          gh_archive="gh_2.82.1_linux_amd64.tar.gz"
          gh_sha256="afada88676dfccea384e6cc28ae990b3e31bbc55f9d75c4697f902c757fa462b"
          gh_url="https://github.com/cli/cli/releases/download/v2.82.1/${gh_archive}"
          gh_root="${RUNNER_TEMP:-/tmp}/gh-cli-2.82.1-${GITHUB_RUN_ID:-manual}"
          mkdir -p "$gh_root"
          curl -fsSL "$gh_url" -o "$gh_root/$gh_archive"
          printf '%s  %s\n' "$gh_sha256" "$gh_root/$gh_archive" > "$gh_root/gh.sha256"
          sha256sum -c "$gh_root/gh.sha256"
          tar -xzf "$gh_root/$gh_archive" -C "$gh_root"
          echo "$gh_root/gh_2.82.1_linux_amd64/bin" >> "$GITHUB_PATH"
          "$gh_root/gh_2.82.1_linux_amd64/bin/gh" --version

      - name: Run Droid scheduled security scan
        uses: EffortlessMetrics/droid-action-safe@7c1377ccbacddc95560d1570547a5baa51de01ec # based on Factory-AI/droid-action v5; raw debug artifact upload disabled
        env:
          ANTHROPIC_AUTH_TOKEN: ""
          ANTHROPIC_BASE_URL: ""
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          # Use the job's own GITHUB_TOKEN: it carries exactly the permissions
          # declared at job level and dies with the job. The action's OIDC token
          # path is intentionally not granted (id-token: write stays dropped
          # under #2498), so the token override is the supported setup route.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_debug_artifacts: false
          security_scan_schedule: true
          security_scan_days: 7
          security_model: "custom:MiniMax-M3-0"
          security_severity_threshold: medium
          security_block_on_critical: true
          security_block_on_high: false
          show_full_output: false
