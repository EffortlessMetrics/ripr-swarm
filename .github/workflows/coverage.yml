name: Coverage

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]

permissions:
  contents: read

# Only a `merge-ready` labeled request shares this group, so a re-applied label
# supersedes the older run for the same PR. Every other pull_request event
# (opened, synchronize, reopened, other labels) gets a unique group: its jobs
# are skipped and it can neither cancel nor replace a pending merge-ready run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name == 'merge-ready')) && github.run_id || 'run' }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready') }}

jobs:
  coverage:
    name: rust-coverage
    if: (github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'merge-ready') && (github.event.action == 'labeled' && github.event.label.name == 'merge-ready'))) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'coverage') || contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview

      - uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check diagnostic capture controls
        run: cargo test -p repo-policy --lib coverage_diagnostics

      - name: Pre-build failure diagnostic adapter
        run: cargo build -p repo-policy

      - name: Prepare locked owner-return fixture dependencies
        run: cargo fetch --locked --manifest-path fixtures/owner_return_pin_fallible_literal/input/Cargo.toml

      - name: Clean coverage state
        run: cargo llvm-cov clean --workspace

      # Binary-spawning tests resolve a pre-built target/debug/ripr and never
      # spawn a nested build; the llvm-cov layout does not populate the default
      # target dir, so build it plainly first (#3764).
      - name: Pre-build spawned binaries
        run: cargo build -p ripr

      - name: Generate coverage
        id: generate-coverage
        run: cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Retain bounded failed-profile diagnostics
        if: ${{ failure() && steps.generate-coverage.outcome == 'failure' }}
        run: target/debug/repo-policy capture-coverage-failure

      - name: Upload failed-profile diagnostics
        if: ${{ always() && steps.generate-coverage.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-failure-diagnostics
          path: target/ripr/reports/coverage-diagnostics
          if-no-files-found: warn
          retention-days: 5

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 5

      - name: Upload coverage to Codecov
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: codecov/codecov-action@v6
        with:
          files: lcov.info
          flags: rust
          name: rust-workspace
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Explain skipped Codecov upload
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: echo "Skipping Codecov upload for fork pull requests because repository secrets are unavailable."
