name: Repair VS Code candidate-current fixture

on:
  push:
    branches:
      - fix/vscode-candidate-current-e2e

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Apply bounded fixture repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("editors/vscode/test/suite/extension.test.ts")
          text = path.read_text(encoding="utf-8")
          old = """        repairability: 'repairable',
                  static_limit_kind: 'missing_import_graph',"""
          new = """        repairability: 'repairable',
                  source_currentness: 'candidate_current',
                  static_limit_kind: 'missing_import_graph',"""

          if new in text:
              raise SystemExit("candidate-current fixture field is already present")
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one bounded fixture match, found {count}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Remove repair workflow and commit source-only result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/repair-vscode-candidate-current.yml
          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add editors/vscode/test/suite/extension.test.ts .github/workflows/repair-vscode-candidate-current.yml
          git diff --cached --check
          git commit -m "fix(vscode): mark preview gap fixture candidate-current"
          git push origin "HEAD:${GITHUB_REF_NAME}"
