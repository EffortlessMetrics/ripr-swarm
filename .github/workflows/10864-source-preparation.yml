name: RIPR 10864 temporary source preparation
on:
  push:
    branches: [agents/10864-guidance-preparation]
    paths: [.github/workflows/10864-source-preparation.yml]
permissions:
  contents: read
concurrency:
  group: ripr-10864-source-preparation
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'EffortlessMetrics/ripr-swarm' && github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a561a2777b614091cc5fa4e13464645e31e42b20
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          components: rustfmt
      - name: Execute exact reviewed preparation block
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = '64e484313b35b19bd7cc9a4bc09b76d91727ad48'
          request = urllib.request.Request(
              'https://api.github.com/repos/EffortlessMetrics/ripr-swarm/git/blobs/' + sha,
              headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as response:
              document=json.load(response)
          data=base64.b64decode(document['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          text=data.decode()
          block=text.split("          python - <<'PY_PREP'\n",1)[1].split('\n          PY_PREP',1)[0]
          assert all(not line or line.startswith('          ') for line in block.splitlines())
          code='\n'.join(line[10:] if line else '' for line in block.splitlines())
          exec(compile(code,'reviewed-10864-preparation','exec'), {'__name__':'__main__'})
          PY
      - name: Retain exact source preparation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-10864-source-preparation-${{ github.run_id }}
          path: ${{ runner.temp }}/ripr-10864-preparation/
          retention-days: 7
          if-no-files-found: warn
  focused-proof:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.head }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.head }}
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@035fceb3c12fb0c6a9461b52775e16473133e591
        with:
          components: rustfmt, clippy
      - name: Run exact reviewed focused proof block
        env:
          GH_TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/ripr-10864-target
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, urllib.request
          sha = '64e484313b35b19bd7cc9a4bc09b76d91727ad48'
          request = urllib.request.Request(
              'https://api.github.com/repos/EffortlessMetrics/ripr-swarm/git/blobs/' + sha,
              headers={'Authorization':'Bearer '+os.environ.pop('GH_TOKEN'), 'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=45) as response:
              document=json.load(response)
          data=base64.b64decode(document['content'])
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
          text=data.decode()
          block=text.split("          python - <<'PY_PROOF'\n",1)[1].split('\n          PY_PROOF',1)[0]
          assert all(not line or line.startswith('          ') for line in block.splitlines())
          code='\n'.join(line[10:] if line else '' for line in block.splitlines())
          exec(compile(code,'reviewed-10864-proof','exec'), {'__name__':'__main__'})
          PY
      - name: Retain native command identities and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ripr-10864-focused-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ripr-10864-proof/
          retention-days: 7
          if-no-files-found: warn
