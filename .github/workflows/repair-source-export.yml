name: Repair Source Export

on:
  push:
    branches: [fix/record-field-declaration-1453]

permissions:
  contents: read

jobs:
  export:
    name: Export exact repair source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build bounded source receipt
        shell: bash
        run: |
          set -euo pipefail
          source_path='crates/ripr/src/analysis/language/rust.rs'
          export_root="$RUNNER_TEMP/repair-source-export"
          mkdir -p "$export_root/source"
          cp -- "$source_path" "$export_root/source/rust.rs"
          source_blob="$(git hash-object -- "$source_path")"
          source_sha256="$(sha256sum "$source_path" | awk '{print $1}')"
          source_bytes="$(wc -c < "$source_path" | tr -d ' ')"
          printf '{\n  "schema": "ripr.repair_source_export.v1",\n  "commit": "%s",\n  "source_path": "%s",\n  "git_blob": "%s",\n  "sha256": "%s",\n  "bytes": %s\n}\n' \
            "$GITHUB_SHA" "$source_path" "$source_blob" "$source_sha256" "$source_bytes" \
            > "$export_root/receipt.json"
          test "$source_blob" = '163922dca4525b7b8813cbf28fe30dd3f10c0463'
          test "$source_bytes" -lt 300000
          find "$export_root" -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload bounded source export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: repair-source-export
          path: ${{ runner.temp }}/repair-source-export
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
