name: Outcome Page

# Nightly outcome page (#12903): rebuilds the pinned 68-diff repair-start set (24 Rust, 22 Python, 22 TypeScript)
# against a fresh release `ripr`, writes one dated receipt, and renders one page
# with the repair-start rate, first-useful-result time, agent fix success and
# the false-actionable rate, with trend and the bar for each. The lane fails
# when the repair-start count falls more than the stated tolerance below the
# floor in benchmarks/repair_start/bars.json, or when the instrument breaks.
# Receipts accumulate as the `outcome-receipts` artifact (the default branch
# cannot be written by a nightly job); the previous run's receipts feed the trend.

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: outcome-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  outcome:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true

      - name: Build ripr
        run: cargo build --release -p ripr --bin ripr

      # Both downloads are inputs to the trend and to the agent/precision rows.
      # A missing artifact leaves the row "not measured" on the page; it never
      # reads as a pass.
      - name: Fetch previous receipts
        run: |
          mkdir -p target/ripr/outcome-history
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=outcome-receipts&per_page=20" --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")][0].workflow_run.id // empty' || true)
          if [ -n "$run_id" ]; then gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name outcome-receipts --dir target/ripr/outcome-history || echo "::warning::previous receipts unavailable"; fi

      - name: Fetch the latest scoreboard report
        run: |
          mkdir -p target/ripr/dx-input
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow dx-scoreboard.yml --branch main --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$run_id" ]; then gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name dx-scoreboard --dir target/ripr/dx-input || echo "::warning::scoreboard report unavailable"; fi

      - name: Measure repair start and render the outcome page
        run: |
          dx=""
          if [ -f target/ripr/dx-input/dx-scoreboard.json ]; then dx="--dx-scoreboard target/ripr/dx-input/dx-scoreboard.json"; fi
          cargo xtask repair-start-page --ripr target/release/ripr --date "$(date -u +%F)" --receipts target/ripr/outcome-history $dx --gate

      - name: Publish the page to the job summary
        if: always()
        run: |
          if [ -f target/ripr/reports/outcome-page.md ]; then cat target/ripr/reports/outcome-page.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload outcome page
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcome-page
          path: target/ripr/reports/outcome-page.*
          if-no-files-found: warn

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: outcome-receipts
          path: target/ripr/outcome-history/repair-start-*.json
          if-no-files-found: warn
