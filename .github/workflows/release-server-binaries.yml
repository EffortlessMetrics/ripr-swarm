# Swarm builds release-shaped assets for inspection. Public release authority
# belongs to EffortlessMetrics/ripr; this workflow cannot publish assets.
name: Rehearse ripr Server Binaries (read-only)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Archive version matching the selected commit, for example 0.11.0"
        required: true
        type: string
      candidate_ref:
        description: "Optional refs/tags/ripr-release-<version>-<commit sha> that resolves to the selected commit; empty while no candidate tag exists"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  rehearse:
    # Qualification fetches the dispatch commit by exact SHA, builds all five
    # targets, verifies checksums, and retains the asset family and SHA-bound
    # promotion handoff as short-lived Actions artifacts.
    uses: ./.github/workflows/server-archive-qualification.yml
    with:
      candidate_sha: ${{ github.sha }}
      candidate_ref: ${{ inputs.candidate_ref }}
      version: ${{ inputs.version }}
