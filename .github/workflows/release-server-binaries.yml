name: Release ripr Server Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 0.2.0 or v0.2.0"
        required: true
      publish:
        description: "Publish assembled assets to a GitHub Release"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-ripr-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            executable: ripr.exe
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            executable: ripr
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            executable: ripr
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            executable: ripr
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            executable: ripr
            archive: tar.gz

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build ripr
        run: cargo build -p ripr --release --target ${{ matrix.target }}

      - name: Package server archive
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: cargo xtask release-server-archive --version "$RELEASE_VERSION" --target "${{ matrix.target }}" --executable "${{ matrix.executable }}" --archive "${{ matrix.archive }}"

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-${{ matrix.target }}
          path: dist/*
          retention-days: 7

  manifest:
    name: assemble release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8
        with:
          pattern: ripr-server-*
          path: dist
          merge-multiple: true

      - name: Generate manifest and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: cargo xtask release-server-manifest --version "$RELEASE_VERSION" --repository "$RELEASE_REPOSITORY"

      - name: Upload assembled release assets
        uses: actions/upload-artifact@v7
        with:
          name: ripr-server-release-assets
          path: dist/*
          retention-days: 7

  publish:
    name: publish GitHub Release assets
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8
        with:
          name: ripr-server-release-assets
          path: dist

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: cargo xtask release-upload-assets --version "$RELEASE_VERSION"
