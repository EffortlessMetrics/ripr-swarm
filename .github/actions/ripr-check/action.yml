name: 'ripr check'
description: 'Run ripr static mutation-exposure analysis on a PR diff (advisory; installs a checksum-verified prebuilt ripr)'
author: 'EffortlessMetrics'

inputs:
  version:
    description: >-
      ripr release to install. The prebuilt archive is checked against its
      published SHA-256; where none exists the action falls back to
      `cargo install ripr --version <version> --locked`.
    required: false
    default: '0.10.0'
  mode:
    description: 'Analysis mode: draft, deep, or ready'
    required: false
    default: 'draft'
  format:
    description: 'Output format: human, json, or sarif'
    required: false
    default: 'human'
  base:
    description: >-
      Base ref for the diff. Empty (default) uses the pull request base branch
      on pull_request events and ripr's own default-branch detection elsewhere.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # Inputs reach the shell through env, never through `${{ }}` inside
    # `run:`, so an input value cannot inject shell syntax.
    - name: Install ripr
      shell: bash
      env:
        RIPR_INPUT_VERSION: ${{ inputs.version }}
      run: |
        version="$RIPR_INPUT_VERSION"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must look like 0.10.0, got '$version'"; exit 1
        fi
        if command -v ripr >/dev/null 2>&1 && [ "$(ripr --version | awk 'NR == 1 { print $2 }')" = "$version" ]; then
          echo "ripr $version is already on PATH"; exit 0
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          *) target="" ;;
        esac
        asset="ripr-server-v$version-$target.tar.gz"
        url="https://github.com/EffortlessMetrics/ripr/releases/download/v$version/$asset"
        mkdir -p "$RUNNER_TEMP/ripr-bin" && cd "$RUNNER_TEMP"
        if [ -n "$target" ] && curl -fsSL --retry 3 -O "$url" && curl -fsSL --retry 3 -O "$url.sha256"; then
          expected="$(awk 'NR == 1 { print $1 }' "$asset.sha256")"
          actual="$( { sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"; } | awk '{ print $1 }')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::$asset does not match its published SHA-256 (expected ${expected:-nothing}, got $actual)"; exit 1
          fi
          tar -xzf "$asset" -C ripr-bin
          echo "$RUNNER_TEMP/ripr-bin" >> "$GITHUB_PATH"
        else
          why="no prebuilt ripr $version for $RUNNER_OS-$RUNNER_ARCH"; [ -z "$target" ] || why="downloading $url failed"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::Cannot install ripr: $why, and this runner has no cargo to build it. Add a Rust toolchain step before this action, or use a runner with a prebuilt archive."; exit 1
          fi
          echo "::notice::$why; building it with cargo install"
          cargo install ripr --version "$version" --locked
        fi

    # A pull_request checkout often lacks the base branch (single-branch or
    # shallow clone). Fetch just that branch so the diff has a base; deeper
    # history is the checkout step's `fetch-depth: 0`, which ripr names when
    # it is still missing.
    - name: Run ripr check
      shell: bash
      env:
        RIPR_INPUT_BASE: ${{ inputs.base }}
        RIPR_INPUT_MODE: ${{ inputs.mode }}
        RIPR_INPUT_FORMAT: ${{ inputs.format }}
      run: |
        base="$RIPR_INPUT_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          branch="$GITHUB_BASE_REF"
          if ! git rev-parse --verify --quiet "origin/$branch^{commit}" >/dev/null; then
            git fetch --no-tags --quiet origin "+refs/heads/$branch:refs/remotes/origin/$branch" \
              || echo "::warning::could not fetch the pull request base branch '$branch'; ripr will report the missing base"
          fi
          base="origin/$branch"
        fi
        set -- --root . --mode "$RIPR_INPUT_MODE" --format "$RIPR_INPUT_FORMAT"
        [ -z "$base" ] || set -- "$@" --base "$base"
        ripr check "$@"

branding:
  icon: 'shield'
  color: 'blue'
