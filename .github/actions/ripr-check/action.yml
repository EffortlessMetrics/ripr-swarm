name: 'ripr check'
description: 'Run ripr static mutation-exposure analysis on a PR diff (advisory; installs a checksum-verified prebuilt ripr)'
author: 'EffortlessMetrics'

inputs:
  version:
    description: >-
      ripr release to install. The prebuilt archive is checked against its
      published SHA-256 (a missing or mismatched checksum, or a bad archive,
      fails the step); only where no prebuilt archive exists for the runner,
      or it cannot be downloaded, does the action fall back to
      `cargo install ripr --version <version> --locked`.
    required: false
    default: '0.10.0'
  mode:
    description: 'Analysis mode: draft, deep, or ready'
    required: false
    default: 'draft'
  format:
    description: 'Output format: any ripr check format, for example human, json, sarif, or github (file annotations)'
    required: false
    default: 'human'
  base:
    description: >-
      Base ref for the diff. Empty (default) uses the pull request base branch
      on pull_request events and ripr's own default-branch detection elsewhere.
    required: false
    default: ''
  cache:
    description: >-
      'true' (default) restores and saves ripr's analysis cache with
      actions/cache, so later pushes re-analyze only changed files. 'false'
      skips the cache step, as does `install-only`.
    required: false
    default: 'true'
  install-only:
    description: >-
      'true' installs the pinned ripr onto PATH and skips `ripr check`, for a
      workflow (such as the one `ripr init --ci github` writes) that runs its
      own ripr commands after the install.
    required: false
    default: 'false'

outputs:
  exit-code:
    description: >-
      The `ripr check` exit code: 0 completed (findings are advisory), 2 could
      not complete, 3 declined. A nonzero code also fails the step.
    value: ${{ steps.check.outputs.exit-code }}
  report:
    description: >-
      Path of the file holding the report in the requested format (for example
      a SARIF file to pass to an upload step).
    value: ${{ steps.check.outputs.report }}

runs:
  using: 'composite'
  steps:
    # Inputs reach the shell through env, never through `${{ }}` inside
    # `run:`, so an input value cannot inject shell syntax.
    - name: Install ripr
      shell: bash
      env:
        RIPR_INPUT_VERSION: ${{ inputs.version }}
      run: |
        version="$RIPR_INPUT_VERSION"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must look like 0.10.0, got '$version'"; exit 1
        fi
        if command -v ripr >/dev/null 2>&1 && [ "$(ripr --version | awk 'NR == 1 { print $2 }')" = "$version" ]; then
          echo "ripr $version is already on PATH"; exit 0
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) target=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
          macOS-X64) target=x86_64-apple-darwin ;;
          macOS-ARM64) target=aarch64-apple-darwin ;;
          Windows-X64) target=x86_64-pc-windows-msvc ;;
          Windows-ARM64) echo "::error::Unsupported runner Windows-ARM64: ripr $version publishes no prebuilt Windows ARM64 build, and this installer does not run the x64 build under emulation. Use a Windows x64 runner."; exit 1 ;;
          *) target="" ;;
        esac
        case "$target" in
          *-windows-*) ext=zip exe=ripr.exe ;;
          *) ext=tar.gz exe=ripr ;;
        esac
        asset="ripr-server-v$version-$target.$ext"
        url="https://github.com/EffortlessMetrics/ripr/releases/download/v$version/$asset"
        mkdir -p "$RUNNER_TEMP/ripr-bin" && cd "$RUNNER_TEMP"
        ripr=ripr
        if [ -n "$target" ] && curl -fsSL --retry 3 -O "$url"; then
          # The release asset exists: from here every failure is final. A missing or
          # mismatched checksum, a bad archive or a wrong payload never falls back to
          # cargo or to a ripr already on PATH.
          curl -fsSL --retry 3 -O "$url.sha256" || { echo "::error::$asset has no downloadable SHA-256 ($url.sha256); refusing to install it unverified"; exit 1; }
          expected="$(awk 'NR == 1 { print $1 }' "$asset.sha256")"
          actual="$( { sha256sum "$asset" 2>/dev/null || shasum -a 256 "$asset"; } | awk '{ print $1 }')"
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::$asset does not match its published SHA-256 (expected ${expected:-nothing}, got $actual)"; exit 1
          fi
          if [ "$ext" = zip ]; then
            # Git for Windows' bash ships GNU tar (no zip support) and no unzip, so use the
            # bsdtar that Windows itself ships, by absolute path so nothing on PATH can stand in.
            ziptool="${SYSTEMROOT:-${SystemRoot:-}}/System32/tar.exe"
            [ -x "$ziptool" ] || { echo "::error::Cannot extract $asset: Windows tar not found at $ziptool"; exit 1; }
            entries="$("$ziptool" -tf "$asset" | tr -d '\r' | sed 's#^\./##' | LC_ALL=C sort)" || { echo "::error::$asset is not a readable zip archive"; exit 1; }
            if [ -z "$entries" ] || grep -Eq '[/\\:]|^\.\.?$|^$' <<< "$entries"; then
              echo "::error::$asset lists an entry outside a flat archive root (nested, absolute, traversal or empty name)"; exit 1
            fi
            [ -z "$(printf '%s\n' "$entries" | tr 'A-Z' 'a-z' | sed 's/[. ]*$//' | LC_ALL=C sort | uniq -d)" ] || { echo "::error::$asset lists a duplicate entry"; exit 1; }
            grep -Fqx -- "$exe" <<< "$entries" || { echo "::error::$asset does not contain $exe at its root"; exit 1; }
            "$ziptool" -xf "$asset" -C ripr-bin || { echo "::error::$asset could not be extracted"; exit 1; }
          else
            tar -xzf "$asset" -C ripr-bin || { echo "::error::$asset could not be extracted"; exit 1; }
          fi
          if [ ! -f "$RUNNER_TEMP/ripr-bin/$exe" ] || [ -L "$RUNNER_TEMP/ripr-bin/$exe" ]; then
            echo "::error::$asset did not extract a regular file named $exe"; exit 1
          fi
          ripr="$RUNNER_TEMP/ripr-bin/$exe"
          echo "$RUNNER_TEMP/ripr-bin" >> "$GITHUB_PATH"
          echo "::notice title=ripr install::version $version, target $target, archive $asset, sha256 $actual, executable $ripr"
        else
          why="no prebuilt ripr $version for $RUNNER_OS-$RUNNER_ARCH"; [ -z "$target" ] || why="downloading $url failed"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::Cannot install ripr: $why, and this runner has no cargo to build it. Add a Rust toolchain step before this action, or use a runner with a prebuilt archive."; exit 1
          fi
          echo "::notice::$why; building it with cargo install"
          cargo install ripr --version "$version" --locked
        fi
        reported="$("$ripr" --version)"; echo "$reported"
        case "$reported" in "ripr $version" | "ripr $version "*) ;; *) echo "::error::the installed ripr reports \"$reported\", not ripr $version"; exit 1 ;; esac

    # ripr's analysis cache lives in the runner's temp directory, outside the
    # checkout. Entries are keyed on file contents, configuration and the ripr
    # version by ripr itself, so a restored entry that no longer matches is a
    # miss, never stale evidence. Pinned to a commit SHA like the generated workflow's.
    - name: Restore ripr analysis cache
      if: inputs.cache == 'true' && inputs.install-only != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ripr-cache
        key: ripr-check-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: ripr-check-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}-

    # A pull_request checkout often lacks the base branch, and actions/checkout's
    # default `fetch-depth: 1` has no merge base with it. Fetch just that branch
    # and deepen both sides in doubling steps until they meet (then fetch the
    # rest), so the default checkout works. The report goes to the job log, a
    # file (output `report`) and the job summary; a run that could not complete
    # fails the step with an error annotation that names why.
    - name: Run ripr check
      id: check
      if: inputs.install-only != 'true'
      shell: bash
      env:
        RIPR_INPUT_BASE: ${{ inputs.base }}
        RIPR_INPUT_MODE: ${{ inputs.mode }}
        RIPR_INPUT_FORMAT: ${{ inputs.format }}
        RIPR_CACHE_DIR: ${{ runner.temp }}/ripr-cache
      run: |
        base="$RIPR_INPUT_BASE"
        if [ -z "$base" ] && [ -n "${GITHUB_BASE_REF:-}" ]; then
          branch="$GITHUB_BASE_REF"; base="origin/$branch"
          refspec="+refs/heads/$branch:refs/remotes/origin/$branch"
          shallow="$(git rev-parse --is-shallow-repository 2>/dev/null || echo false)"
          if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            depth=(); [ "$shallow" != true ] || depth=(--depth=50)
            git fetch --no-tags --quiet "${depth[@]}" origin "$refspec" \
              || echo "::warning::could not fetch the pull request base branch '$branch'; ripr will report the missing base"
          fi
          step=50
          while [ "$shallow" = true ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null \
            && ! git merge-base HEAD "$base" >/dev/null 2>&1; do
            if [ "$step" -gt 1600 ]; then
              git fetch --no-tags --quiet --unshallow origin "$refspec" || echo "::warning::could not fetch the full history; ripr will name the repair"
              break
            fi
            git fetch --no-tags --quiet --deepen="$step" origin "$refspec" || { echo "::warning::could not deepen the shallow checkout; ripr will name the repair"; break; }
            step=$((step * 2))
          done
        fi
        case "$RIPR_INPUT_FORMAT" in json | json-compact) ext=json ;; sarif | sarif-compact) ext=sarif ;; *) ext=txt ;; esac
        out="$(mktemp -d "$RUNNER_TEMP/ripr-check.XXXXXX")"; report="$out/report.$ext"; errors="$out/stderr.txt"
        set -- --root . --mode "$RIPR_INPUT_MODE" --format "$RIPR_INPUT_FORMAT"
        [ -z "$base" ] || set -- "$@" --base "$base"
        status=0; ripr check "$@" >"$report" 2>"$errors" || status=$?
        # Replayed text could quote a `::command::` line from source; only the
        # github format's report is meant to emit workflow commands. Both files
        # go to stdout, one stream, so nothing lands outside the guard; each
        # marker starts its own line even after text with no final newline.
        token="ripr-$RANDOM$RANDOM$RANDOM"
        [ "$RIPR_INPUT_FORMAT" != github ] || cat "$report"
        printf '\n::stop-commands::%s\n' "$token"
        [ "$RIPR_INPUT_FORMAT" = github ] || cat "$report"
        cat "$errors"; printf '\n::%s::\n' "$token"
        [ -z "${GITHUB_OUTPUT:-}" ] || printf 'exit-code=%s\nreport=%s\n' "$status" "$report" >> "$GITHUB_OUTPUT"
        case "$status" in
          0) meaning="" ;; 2) meaning="ripr could not complete the analysis (usage, configuration or operational error)" ;;
          3) meaning="ripr declined the request" ;;
          *) meaning="ripr stopped before finishing" ;;
        esac
        reason="$(awk 'NF && n < 3 { print; n++ }' "$errors")"
        [ -n "$reason" ] || reason="$(awk 'NF && n < 3 { print; n++ }' "$report")"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ripr check"
            if [ "$status" -eq 0 ]; then
              echo "Completed: \`ripr check $*\`. Findings are advisory and never fail this step."
            else
              echo "**Exit $status: $meaning.** Exit codes: https://github.com/EffortlessMetrics/ripr/blob/main/docs/EXIT_CODES.md"
              printf '\n````text\n%s\n````\n' "$reason"
            fi
            if [ "$ext" = txt ] && [ -s "$report" ]; then
              printf '\n````text\n%s\n````\n' "$(awk '{ n += length($0) + 1; if (n > 60000) exit; print }' "$report")"
              [ "$(wc -c < "$report")" -le 60000 ] || echo "(cut at 60 KB; the full report is in the job log)"
            elif [ -s "$report" ]; then
              echo "The $RIPR_INPUT_FORMAT report is the step output \`report\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$status" -ne 0 ]; then
          message="$meaning. ${reason:-See the job log.}"; message="${message//%/%25}"; message="${message//$'\r'/}"
          echo "::error title=ripr check exited $status::${message//$'\n'/%0A}"
        fi
        exit "$status"

branding:
  icon: 'shield'
  color: 'blue'
