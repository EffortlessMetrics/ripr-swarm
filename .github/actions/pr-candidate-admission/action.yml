name: 'PR candidate admission'
description: 'Refuse expensive qualification for stale, competing, oversized, or hard-cut-unadmitted candidates (#2022, #4987, #5391)'
author: 'EffortlessMetrics'

inputs:
  token:
    description: 'Read-only GitHub token used to inspect the current PR and open candidate set'
    required: false
    default: ''
  repository:
    description: 'Repository in owner/name form'
    required: false
    default: ''
  pr-number:
    description: 'Pull request number; empty for non-PR workflow invocations'
    required: false
    default: ''
  expected-head:
    description: 'Exact full candidate head from the admission event'
    required: false
    default: ''
  docs-only:
    description: 'Whether the independently classified candidate is docs-only'
    required: false
    default: 'false'
  max-changed-files:
    description: 'Maximum changed files admitted to ordinary non-docs qualification'
    required: false
    default: '160'
  max-changed-lines:
    description: 'Maximum additions plus deletions admitted to ordinary non-docs qualification'
    required: false
    default: '3000'
  mode:
    description: 'admit or self-test'
    required: false
    default: 'admit'

outputs:
  status:
    description: 'admitted, not_applicable, self_test_pass, or refused'
    value: ${{ steps.admit.outputs.status }}
  reason:
    description: 'Stable candidate-admission reason token'
    value: ${{ steps.admit.outputs.reason }}
  claim:
    description: 'Normalized governing claim identity'
    value: ${{ steps.admit.outputs.claim }}
  acceptance_delta:
    description: 'Normalized acceptance delta'
    value: ${{ steps.admit.outputs.acceptance_delta }}
  competing_prs:
    description: 'Comma-separated trusted competing PR numbers'
    value: ${{ steps.admit.outputs.competing_prs }}
  changed_files:
    description: 'GitHub changed-files count for the current PR'
    value: ${{ steps.admit.outputs.changed_files }}
  changed_lines:
    description: 'GitHub additions plus deletions for the current PR'
    value: ${{ steps.admit.outputs.changed_lines }}
  cut_status:
    description: 'Hard-cut admission status'
    value: ${{ steps.admit.outputs.cut_status }}
  cut_reason:
    description: 'Stable hard-cut admission reason token'
    value: ${{ steps.admit.outputs.cut_reason }}

runs:
  using: 'composite'
  steps:
    - name: Evaluate candidate and hard-cut admission
      id: admit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ADMISSION_REPOSITORY: ${{ inputs.repository }}
        ADMISSION_PR_NUMBER: ${{ inputs.pr-number }}
        ADMISSION_EXPECTED_HEAD: ${{ inputs.expected-head }}
        ADMISSION_DOCS_ONLY: ${{ inputs.docs-only }}
        ADMISSION_MAX_CHANGED_FILES: ${{ inputs.max-changed-files }}
        ADMISSION_MAX_CHANGED_LINES: ${{ inputs.max-changed-lines }}
        ADMISSION_MODE: ${{ inputs.mode }}
      run: |
        set -euo pipefail
        action_root="${GITHUB_ACTION_PATH}"
        packet="${GITHUB_WORKSPACE}/docs/release-candidates/0.11.0-hard-cut-admission.json"
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        current="$tmp/current.json"
        open_prs="$tmp/open-prs.json"
        base_commit="$tmp/base-commit.json"
        result="$tmp/result.json"
        cut_result="$tmp/cut-result.json"

        python3 "$action_root/candidate_admission.py" --self-test
        python3 "$action_root/release_cut_admission.py" --self-test

        if [ "${ADMISSION_MODE:-admit}" != "admit" ]; then
          printf '%s\n' '{"status":"self_test_pass","reason":"candidate_and_cut_controls_passed","claim":"","acceptance_delta":"","competing_prs":[],"changed_files":0,"changed_lines":0,"max_changed_files":160,"max_changed_lines":3000}' > "$result"
          printf '%s\n' '{"status":"admitted","reason":"cut_self_test_pass"}' > "$cut_result"
        elif [ -z "${ADMISSION_PR_NUMBER:-}" ]; then
          printf '%s\n' '{"status":"not_applicable","reason":"non_pull_request_invocation","claim":"","acceptance_delta":"","competing_prs":[],"changed_files":0,"changed_lines":0,"max_changed_files":160,"max_changed_lines":3000}' > "$result"
          printf '%s\n' '{"status":"admitted","reason":"cut_non_pull_request_invocation"}' > "$cut_result"
        else
          [ -n "${GH_TOKEN:-}" ] || { echo '::error::candidate admission requires a read-only GitHub token'; exit 1; }
          [ -n "${ADMISSION_REPOSITORY:-}" ] || { echo '::error::candidate admission requires owner/name repository identity'; exit 1; }
          gh api "repos/${ADMISSION_REPOSITORY}/pulls/${ADMISSION_PR_NUMBER}" > "$current"
          gh api --paginate "repos/${ADMISSION_REPOSITORY}/pulls?state=open&per_page=100" | jq -s 'add' > "$open_prs"
          base_sha="$(jq -r '.base.sha // empty' "$current")"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::candidate admission received no exact base SHA'; exit 1; }
          gh api "repos/${ADMISSION_REPOSITORY}/git/commits/${base_sha}" > "$base_commit"

          docs_flag=()
          [ "${ADMISSION_DOCS_ONLY:-false}" = "true" ] && docs_flag=(--docs-only)
          set +e
          python3 "$action_root/candidate_admission.py" \
            --current "$current" \
            --open-prs "$open_prs" \
            --expected-head "${ADMISSION_EXPECTED_HEAD:-}" \
            --max-changed-files "${ADMISSION_MAX_CHANGED_FILES}" \
            --max-changed-lines "${ADMISSION_MAX_CHANGED_LINES}" \
            "${docs_flag[@]}" > "$result"
          python3 "$action_root/release_cut_admission.py" \
            --packet "$packet" \
            --current "$current" \
            --base-commit "$base_commit" \
            --expected-head "${ADMISSION_EXPECTED_HEAD:-}" > "$cut_result"
          set -e
        fi

        status="$(jq -r '.status' "$result")"
        reason="$(jq -r '.reason' "$result")"
        claim="$(jq -r '.claim' "$result")"
        acceptance_delta="$(jq -r '.acceptance_delta' "$result")"
        competing_prs="$(jq -r '.competing_prs | map(tostring) | join(",")' "$result")"
        changed_files="$(jq -r '.changed_files' "$result")"
        changed_lines="$(jq -r '.changed_lines' "$result")"
        max_files="$(jq -r '.max_changed_files' "$result")"
        max_lines="$(jq -r '.max_changed_lines' "$result")"
        cut_status="$(jq -r '.status' "$cut_result")"
        cut_reason="$(jq -r '.reason' "$cut_result")"
        {
          echo "status=$status"
          echo "reason=$reason"
          echo "claim=$claim"
          echo "acceptance_delta=$acceptance_delta"
          echo "competing_prs=$competing_prs"
          echo "changed_files=$changed_files"
          echo "changed_lines=$changed_lines"
          echo "cut_status=$cut_status"
          echo "cut_reason=$cut_reason"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### PR candidate admission"
          echo ""
          echo "- status: \`$status\`"
          echo "- reason: \`$reason\`"
          echo "- hard-cut status: \`$cut_status\`"
          echo "- hard-cut reason: \`$cut_reason\`"
          echo "- claim: \`$claim\`"
          echo "- acceptance delta: \`$acceptance_delta\`"
          echo "- competing PRs: \`${competing_prs:-none}\`"
          echo "- scope: \`$changed_files files / $changed_lines changed lines\`"
          echo "- ordinary limit: \`$max_files files / $max_lines changed lines\`"
        } >> "$GITHUB_STEP_SUMMARY"

        if [ "$status" = "refused" ]; then
          case "$reason" in
            competing_candidate)
              echo "::error::candidate admission refused ($reason): reconcile trusted competing PRs ${competing_prs:-unknown} and record the accepted winner/losing disposition before qualification" ;;
            qualification_scope_oversized)
              echo "::error::candidate admission refused ($reason): split or recompose the candidate before ordinary qualification ($changed_files files, $changed_lines changed lines)" ;;
            claim_identity_missing)
              echo "::error::candidate admission refused ($reason): complete Governing issue or accepted claim and Acceptance delta in the PR body" ;;
            *)
              echo "::error::candidate admission refused ($reason); refresh the exact PR/head evidence and retry the explicit admission event" ;;
          esac
          exit 1
        fi
        if [ "$cut_status" = "refused" ]; then
          echo "::error::hard-cut admission refused ($cut_reason): reconcile the exact #5114/#2766 packet, current main, and PR head before qualification"
          exit 1
        fi
